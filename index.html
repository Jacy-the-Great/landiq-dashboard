// ── PIPEDRIVE: REVENUE & ARR ─────────────────────────────────────────────────
function renderPdRevenue(sc) {
  const range    = pdGetRange();
  const rangeMonths = pdRangeMonths(range);
  const today    = new Date();
  const MRR_TARGET = TARGET_ARR / 12;

  // All won deals — pipeline-toggle aware
  const wonDeals = (_pdSalesPipeline
    ? _pd_deals.filter(d => d['Deal - Pipeline'] === _pdSalesPipeline)
    : _pd_deals
  ).filter(d => d['Deal - Status'] === 'Won');

  // ── BOOKED ARR ───────────────────────────────────────────────────────────────
  // Sum of all-time won deal values = total contracted revenue
  const totalBooked  = wonDeals.reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0);

  // ── ACTIVE GROSS REVENUE (real sum of contract values for still-active customers) ─
  const activePaid   = _pd_people.filter(p => {
    if (p['Person - Customer Type'] !== 'Paid Subscription') return false;
    const rem = p['Person - Date Access Removed'];
    if (!rem) return true;
    const d = pdParseDate(rem); return pdValidDate(d) && d > today;
  });
  const avgDealVal   = wonDeals.length ? totalBooked / wonDeals.length : 0;

  // Real gross: add up the actual won-deal value of every organisation that still
  // has at least one active paying person. Linked by organisation name (normalised).
  const normOrg = s => (s || '').trim().toLowerCase();
  const activeOrgSet = new Set(activePaid.map(p => normOrg(p['Person - Organisation'])).filter(Boolean));
  // Resolve a deal's organisation (fall back to its person's org if the deal org is blank)
  const personOrgByName = {};
  _pd_people.forEach(p => { const n = normOrg(p['Person - Name']); if (n) personOrgByName[n] = normOrg(p['Person - Organisation']); });
  const dealOrg = d => normOrg(d['Deal - Organisation']) || personOrgByName[normOrg(d['Deal - Person'])] || '';
  // Count each active org's contract value once (use its largest won deal to avoid
  // double-counting multiple seats/people booked under separate line items).
  const wonByOrg = {};
  wonDeals.forEach(d => {
    const o = dealOrg(d); if (!o || !activeOrgSet.has(o)) return;
    const v = parseFloat(d['Deal - Value']) || 0;
    wonByOrg[o] = Math.max(wonByOrg[o] || 0, v);
  });
  const realActiveGross = Object.values(wonByOrg).reduce((s, v) => s + v, 0);
  const matchedActiveOrgs = Object.keys(wonByOrg).length;
  const estActiveARR = realActiveGross > 0 ? realActiveGross : null;
  const estActiveMRR = estActiveARR ? estActiveARR / 12 : null;

  // ── NEW ARR BY MONTH ──────────────────────────────────────────────────────────
  const newARRByMonth = {};
  const newDealsCountByMonth = {};
  wonDeals.forEach(d => {
    const dt = pdParseDate(d['Deal - Won time']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    newARRByMonth[k]        = (newARRByMonth[k] || 0) + (parseFloat(d['Deal - Value']) || 0);
    newDealsCountByMonth[k] = (newDealsCountByMonth[k] || 0) + 1;
  });

  // ── CUMULATIVE ARR ────────────────────────────────────────────────────────────
  // Running sum across all months (sorted), using all-time won deals
  const allMonthsSorted = Object.keys(newARRByMonth).sort();
  let cumulative = 0;
  const cumulARR = {};
  allMonthsSorted.forEach(m => { cumulative += newARRByMonth[m]; cumulARR[m] = cumulative; });

  // ── MOM GROWTH (range-filtered months) ───────────────────────────────────────
  const mrrVals  = rangeMonths.map(m => newARRByMonth[m] ? newARRByMonth[m] / 12 : 0);
  const lastMRR  = mrrVals.filter(v => v > 0).slice(-1)[0] || 0;
  const prevMRR  = mrrVals.filter(v => v > 0).slice(-2)[0] || 0;
  const mrrMoM   = prevMRR ? pct(lastMRR - prevMRR, prevMRR) : null;

  // ── ACV & DEAL SIZES ─────────────────────────────────────────────────────────
  const rangeWon = wonDeals.filter(d => pdInRange(d['Deal - Won time'], range));
  const rangeARR = rangeWon.reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0);
  const rangeACV = rangeWon.length ? rangeARR / rangeWon.length : null;

  // ── ARR BANDS (deal size distribution) ───────────────────────────────────────
  const BANDS = [
    { lbl: '<$1k',     lo: 0,    hi: 1000 },
    { lbl: '$1–5k',    lo: 1000, hi: 5000 },
    { lbl: '$5–20k',   lo: 5000, hi: 20000 },
    { lbl: '$20–50k',  lo: 20000,hi: 50000 },
    { lbl: '$50k+',    lo: 50000,hi: Infinity },
  ];
  const bandCounts = BANDS.map(b => rangeWon.filter(d => {
    const v = parseFloat(d['Deal - Value']) || 0;
    return v >= b.lo && v < b.hi;
  }).length);
  const bandARR = BANDS.map(b => rangeWon.filter(d => {
    const v = parseFloat(d['Deal - Value']) || 0;
    return v >= b.lo && v < b.hi;
  }).reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0));

  // ── TOP REVENUE ORGS ─────────────────────────────────────────────────────────
  const orgRevenue = {};
  rangeWon.forEach(d => {
    const personName = d['Deal - Person'] || '';
    const person = _pd_people.find(p => (p['Person - Name'] || p['Name'] || '') === personName);
    const org = (person && person['Person - Organisation']) || d['Deal - Organisation'] || d['Organisation'] || 'Unknown';
    orgRevenue[org] = (orgRevenue[org] || 0) + (parseFloat(d['Deal - Value']) || 0);
  });
  const topOrgs = Object.entries(orgRevenue).filter(([k]) => k !== 'Unknown').sort((a, b) => b[1] - a[1]).slice(0, 12);

  // ── ARR GAP ───────────────────────────────────────────────────────────────────
  const arrGap      = TARGET_ARR - totalBooked;
  const arrGapPct   = pct(totalBooked, TARGET_ARR);
  const mrrGap      = MRR_TARGET - (newARRByMonth[rangeMonths[rangeMonths.length-1]] || 0) / 12;

  sc.innerHTML = `
    ${!wonDeals.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive deals CSV first.</div></div>' : ''}

    <div class="cards" style="margin-bottom:18px">
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Total contracted revenue (all time)${infoBtn('Total contracted revenue','<span class="src-tag">Pipedrive · Won Deals</span><br>Sum of <b>Deal Value</b> across all won deals, ever. Total revenue ever signed — not adjusted for customers who later left.<br><div class="calc-row">SUM(Deal Value) where Status = "Won"</div>')}</div>
        <div class="card-value">${fmtCur(totalBooked)}</div>
        <div class="card-sub">vs $${(TARGET_ARR/1e6).toFixed(1)}M target · ${fmtPct(arrGapPct)} there</div>
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Active customer revenue (gross)${infoBtn('Active customer revenue (gross)','<span class="src-tag">Pipedrive · People + Deals</span><br>Real sum of the actual contract value of every organisation that still has at least one active paying person. Linked by organisation name; counts each org\'s largest won deal once to avoid double-counting seats.<br><div class="calc-row">SUM(largest won Deal Value per still-active organisation)</div>This is gross signed revenue from current customers — not adjusted for partial-year or discounts.')}</div>
        ${estActiveARR != null
          ? `<div class="card-value">${fmtCur(estActiveARR)}</div><div class="card-sub">${matchedActiveOrgs} active orgs matched to a deal</div>`
          : `<div class="card-nodata">import people CSV</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Active revenue per month${infoBtn('Active revenue per month','<span class="src-tag">Pipedrive · People + Deals</span><br>Active customer revenue (gross) ÷ 12. Assumes yearly contracts.<br><div class="calc-row">Active customer revenue ÷ 12</div>')}</div>
        ${estActiveMRR != null
          ? `<div class="card-value">${fmtCur(Math.round(estActiveMRR))}</div><div class="card-sub">target ${fmtCur(MRR_TARGET)}/mo</div>`
          : `<div class="card-nodata">import people CSV</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Avg contract value${infoBtn('Average Contract Value','<span class="src-tag">Pipedrive · Won Deals</span><br>Mean Deal Value across won deals in the selected date range.<br><div class="calc-row">SUM(Deal Value) ÷ COUNT(Won deals) in range</div>')}</div>
        ${rangeACV != null
          ? `<div class="card-value">${fmtCur(Math.round(rangeACV))}</div><div class="card-sub">${rangeWon.length} deals · ${range.label}</div>`
          : `<div class="card-nodata">no data</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Gap to $2.4M target${infoBtn('Gap to $2.4M target','<span class="src-tag">Calculated</span><br>Difference between the $2.4M yearly revenue target and total contracted revenue. How much more needs to be signed to hit the annual goal.<br><div class="calc-row">$2.4M − total contracted revenue</div>')}</div>
        <div class="card-value" style="color:${arrGap > 0 ? 'var(--re)' : 'var(--gr)'}">${arrGap > 0 ? '−' : '+'}${fmtCur(Math.abs(arrGap))}</div>
        <div class="card-sub">${arrGap > 0 ? 'still needed' : 'target exceeded'}</div>
      </div>
    </div>

    <div class="box">
      <div class="box-title">Cumulative contracted revenue — all time</div>
      ${allMonthsSorted.length ? `<div class="chart-wrap" style="height:260px"><canvas id="pd-arr-cumul"></canvas></div>` : '<div class="no-data">No won deal data.</div>'}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">New revenue by month — ${range.label}</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-arr-month"></canvas></div>
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue per month — ${range.label}</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-mrr-month"></canvas></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Deal size distribution — ${range.label}</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-arr-bands"></canvas></div>
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue by deal size</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-arr-band-rev"></canvas></div>
      </div>
    </div>

    ${topOrgs.length ? `<div class="box">
      <div class="box-title">Top organisations by contracted revenue — ${range.label}</div>
      <div class="chart-wrap" style="height:${Math.max(240, topOrgs.length * 30)}px"><canvas id="pd-arr-orgs"></canvas></div>
    </div>` : ''}

    <div class="box">
      <div class="box-title">Revenue progress to $2.4M target</div>
      <div style="margin:16px 0 8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px">
          <span style="font-weight:600;color:var(--navy)">${fmtCur(totalBooked)}</span>
          <span style="color:var(--tl)">target: $2.4M</span>
        </div>
        <div style="height:16px;border-radius:8px;background:var(--bg2);overflow:hidden">
          <div style="height:100%;border-radius:8px;background:${arrGapPct>=100?'var(--gr)':arrGapPct>=60?'var(--acc)':'#c25a00'};width:${Math.min(arrGapPct,100)}%;transition:width .4s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--tl)">
          <span>${fmtPct(arrGapPct)} of target</span>
          <span>${arrGap > 0 ? fmtCur(arrGap) + ' remaining' : 'Target hit!'}</span>
        </div>
      </div>
      <div style="font-size:12px;color:var(--tm);margin-top:8px">
        At current avg deal value of <strong>${fmtCur(Math.round(avgDealVal))}</strong>, you need
        <strong>${avgDealVal > 0 ? Math.ceil(arrGap / avgDealVal) : '—'}</strong> more won deals to hit $2.4M.
      </div>
    </div>

    <div class="box">
      <div class="box-title">Growth health ${infoBtn('Growth health',
        `<p>Compares the last 12 months to the 12 months before that, for both new signed revenue and number of deals won.</p>
        <p><b>Note:</b> a full business-health score would also include a profit/efficiency measure (such as the "Rule of 40"). That needs cost data, which isn\'t in the dashboard — so this shows the growth side only.</p>
        <span class="src-tag">Pipedrive · Won Deals</span>`)}</div>
      ${(() => {
        const mk = (back) => { const d = new Date(today.getFullYear(), today.getMonth() - back, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
        const last12 = Array.from({length:12}, (_,i) => mk(i));
        const prev12 = Array.from({length:12}, (_,i) => mk(i+12));
        const sum = (months, map) => months.reduce((s,m) => s + (map[m]||0), 0);
        const revNow = sum(last12, newARRByMonth), revPrev = sum(prev12, newARRByMonth);
        const dealNow = sum(last12, newDealsCountByMonth), dealPrev = sum(prev12, newDealsCountByMonth);
        const g = (n,p) => p > 0 ? Math.round((n-p)/p*100) : null;
        const revG = g(revNow, revPrev), dealG = g(dealNow, dealPrev);
        const tile = (label, now, prev, gr, money) => {
          const col = gr == null ? 'var(--tl)' : gr >= 0 ? '#2a7a4b' : '#e05252';
          return `<div style="background:var(--bg2);border-radius:8px;padding:12px 14px">
            <div style="font-size:12px;color:var(--tl)">${label}</div>
            <div style="font-size:24px;font-weight:700;color:${col};margin:2px 0">${gr==null?'—':(gr>=0?'+':'')+gr+'%'}</div>
            <div style="font-size:11px;color:var(--tl)">${money?fmtCur(now):fmtNum(now)} vs ${money?fmtCur(prev):fmtNum(prev)} prior 12 mo</div>
          </div>`;
        };
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${tile('New revenue growth (year on year)', revNow, revPrev, revG, true)}
          ${tile('Deals-won growth (year on year)', dealNow, dealPrev, dealG, false)}
        </div>`;
      })()}
    </div>`;

  // ── REVENUE FORECAST (open pipeline × win rate) ───────────────────────────
  // Append forecast section after progress bar
  (() => {
    const openSalesPipe = _pd_deals.filter(d =>
      d['Deal - Status'] === 'Open' &&
      (!_pdSalesPipeline || d['Deal - Pipeline'] === _pdSalesPipeline)
    );
    const allSales = _pd_deals.filter(d =>
      !_pdSalesPipeline || d['Deal - Pipeline'] === _pdSalesPipeline
    );
    const allWon2  = allSales.filter(d => d['Deal - Status'] === 'Won');
    const allLost2 = allSales.filter(d => d['Deal - Status'] === 'Lost');
    const winRate2 = (allWon2.length + allLost2.length) ? allWon2.length / (allWon2.length + allLost2.length) : 0.5;
    const pipeVal  = openSalesPipe.reduce((s,d) => s + (parseFloat(d['Deal - Value'])||0), 0);
    const forecast = pipeVal * winRate2; // expected value

    // Monthly ARR run-rate for last 6 months
    const now = new Date();
    const last6 = Array.from({length:6}, (_,i) => {
      const d = new Date(now.getFullYear(), now.getMonth()-5+i, 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    });
    const avgMonthlyARR = last6.reduce((s,m) => s+(newARRByMonth[m]||0), 0) / 6;
    const projMonths = Array.from({length:6}, (_,i) => {
      const d = new Date(now.getFullYear(), now.getMonth()+1+i, 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    });

    if (!openSalesPipe.length) return;
    const forecastEl = document.createElement('div');
    forecastEl.className = 'box';
    forecastEl.innerHTML = `
      <div class="box-title">Revenue forecast ${infoBtn('Revenue forecast',
        `<p><b>Pipeline forecast</b>: sum of open deal values × current win rate (${fmtPct(winRate2*100)}).</p>
        <p><b>Run-rate projection</b>: average monthly new revenue from the last 6 months, projected forward 6 months.</p>
        <div class="calc-row">Forecast = Open pipeline × Win rate</div>
        <span class="src-tag">Pipedrive Deals</span>`)}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">
        <div class="card" style="margin:0">
          <div class="card-label">Open pipeline</div>
          <div class="card-value">${fmtCur(pipeVal)}</div>
          <div class="card-sub">${openSalesPipe.length} deals</div>
        </div>
        <div class="card" style="margin:0">
          <div class="card-label">Expected from pipeline</div>
          <div class="card-value" style="color:var(--gr)">${fmtCur(forecast)}</div>
          <div class="card-sub">at ${fmtPct(winRate2*100)} win rate</div>
        </div>
        <div class="card" style="margin:0">
          <div class="card-label">6-mo run-rate projection</div>
          <div class="card-value">${avgMonthlyARR>0?fmtCur(avgMonthlyARR*6):'—'}</div>
          <div class="card-sub">${avgMonthlyARR>0?fmtCur(avgMonthlyARR)+'/mo avg':'insufficient history'}</div>
        </div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="pd-arr-forecast"></canvas></div>`;
    sc.appendChild(forecastEl);

    // Build chart: historical last 6 months + projected next 6
    const histLabels = last6.map(m => monthLabel(m));
    const projLabels = projMonths.map(m => monthLabel(m));
    const histData   = last6.map(m => newARRByMonth[m] || 0);
    const projData   = projMonths.map(() => avgMonthlyARR);

    makeChart('pd-arr-forecast', {
      type: 'bar',
      data: {
        labels: [...histLabels, ...projLabels],
        datasets: [
          { label: 'Actual new revenue', data: [...histData, ...projMonths.map(()=>null)], backgroundColor: '#2a7a4b', borderRadius: 3 },
          { label: 'Projected (run-rate)', data: [...last6.map(()=>null), ...projData], backgroundColor: 'rgba(42,122,75,0.25)', borderRadius: 3, borderWidth: 2, borderColor: '#2a7a4b', borderDash: [4,4] },
          { label: 'Expected from pipeline (÷6 mo)', data: [...last6.map(()=>null), ...projMonths.map(()=>forecast/6)], type:'line', borderColor:'#c25a00', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false, spanGaps:false },
        ]
      },
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'bottom', labels:{font:{family:'DM Sans',size:11},boxWidth:12}} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle, ticks:{...axStyle,callback:v=>'$'+(v/1000).toFixed(0)+'k'}, beginAtZero:true} }
      }
    });
  })();

  if (!wonDeals.length) return;

  // ── CHARTS ────────────────────────────────────────────────────────────────────
  // Cumulative ARR
  if (allMonthsSorted.length) {
    makeChart('pd-arr-cumul', {
      type: 'line',
      data: {
        labels: allMonthsSorted.map(m => monthLabel(m)),
        datasets: [
          { label: 'Cumulative revenue ($)', data: allMonthsSorted.map(m => cumulARR[m]), borderColor: '#2a7a4b', borderWidth: 2.5, backgroundColor: 'rgba(42,122,75,.08)', fill: true, tension: .3, pointRadius: 2 },
          { label: 'Target $2.4M', data: allMonthsSorted.map(() => TARGET_ARR), type: 'line', borderColor: '#c25a00', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
        scales: { x: { grid: { display: false }, ticks: { ...axStyle, maxTicksLimit: 16 } }, y: { grid: gridStyle, ticks: { ...axStyle, callback: v => '$' + (v/1000).toFixed(0) + 'k' }, beginAtZero: true } }
      }
    });
  }

  // New revenue by month
  makeChart('pd-arr-month', {
    type: 'bar',
    data: {
      labels: rangeMonths.map(m => monthLabel(m)),
      datasets: [
        { label: 'New revenue ($)', data: rangeMonths.map(m => newARRByMonth[m] || 0), backgroundColor: '#2a7a4b', borderRadius: 3, yAxisID: 'y' },
        { label: 'Target revenue/mo', data: rangeMonths.map(() => TARGET_ARR / 12), type: 'line', borderColor: '#c25a00', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false, yAxisID: 'y' },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
      scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, callback: v => '$' + (v/1000).toFixed(0) + 'k' }, beginAtZero: true } }
    }
  });

  // Revenue per month (new ARR / 12)
  makeChart('pd-mrr-month', {
    type: 'bar',
    data: {
      labels: rangeMonths.map(m => monthLabel(m)),
      datasets: [
        { label: 'New revenue per month (est.)', data: rangeMonths.map(m => newARRByMonth[m] ? Math.round(newARRByMonth[m] / 12) : 0), backgroundColor: '#1a3c5e', borderRadius: 3 },
        { label: 'Monthly revenue target ($200k)', data: rangeMonths.map(() => MRR_TARGET), type: 'line', borderColor: '#c25a00', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
      scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, callback: v => '$' + (v/1000).toFixed(0) + 'k' }, beginAtZero: true } }
    }
  });

  // Deal size distribution (count)
  makeChart('pd-arr-bands', {
    type: 'bar',
    data: { labels: BANDS.map(b => b.lbl), datasets: [{ label: 'Deals', data: bandCounts, backgroundColor: '#2e8bc0', borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true } }
    }
  });

  // ARR concentration by band (value)
  makeChart('pd-arr-band-rev', {
    type: 'doughnut',
    data: { labels: BANDS.map(b => b.lbl), datasets: [{ data: bandARR, backgroundColor: ['#d0e8f0','#2e8bc0','#1a3c5e','#2a7a4b','#c25a00'], borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12,
        generateLabels: chart => chart.data.labels.map((l, i) => ({
          text: l + ' — ' + fmtCur(chart.data.datasets[0].data[i]),
          fillStyle: chart.data.datasets[0].backgroundColor[i], hidden: false, index: i
        }))
      } } }
    }
  });

  // Top orgs by ARR
  if (topOrgs.length) {
    makeChart('pd-arr-orgs', {
      type: 'bar',
      data: { labels: topOrgs.map(([k]) => k.length > 40 ? k.slice(0,40)+'…' : k), datasets: [{ label: 'Revenue ($)', data: topOrgs.map(([,v]) => v), backgroundColor: '#2a7a4b', borderRadius: 3 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: gridStyle, ticks: { ...axStyle, callback: v => '$'+(v/1000).toFixed(0)+'k' }, beginAtZero: true }, y: { grid: { display: false }, ticks: { ...axStyle, font: { family: 'DM Sans', size: 11 } } } }
      }
    });
  }
}

function renderPdSales(sc) {
  const range = pdGetRange();
  const rangeMonths = pdRangeMonths(range);
  const pipelineLabel = _pdSalesPipeline || 'All pipelines';
  const salesDeals = _pdSalesPipeline
    ? _pd_deals.filter(d => d['Deal - Pipeline'] === _pdSalesPipeline)
    : _pd_deals;
  const wonDeals   = salesDeals.filter(d => d['Deal - Status'] === 'Won'  && pdInRange(d['Deal - Won time'],  range));
  const lostDeals  = salesDeals.filter(d => d['Deal - Status'] === 'Lost' && pdInRange(d['Deal - Lost time'], range));
  const months12   = rangeMonths;

  // ── WIN / LOSS ANALYSIS (#15) ──────────────────────────────────────────────
  const wlReasons = {};
  lostDeals.forEach(d => { const r = (d['Deal - Lost reason'] || '').trim() || '(no reason given)'; wlReasons[r] = (wlReasons[r] || 0) + 1; });
  const wlReasonEntries = Object.entries(wlReasons).sort((a, b) => b[1] - a[1]);
  const wlClosed   = wonDeals.length + lostDeals.length;
  const wlOverall  = wlClosed ? pct(wonDeals.length, wlClosed) : null;
  const wlBySrc = {};
  wonDeals.forEach(d => { const s = (d['Deal - Source channel'] || 'Unknown').trim() || 'Unknown'; (wlBySrc[s] = wlBySrc[s] || {won:0,lost:0}).won++; });
  lostDeals.forEach(d => { const s = (d['Deal - Source channel'] || 'Unknown').trim() || 'Unknown'; (wlBySrc[s] = wlBySrc[s] || {won:0,lost:0}).lost++; });
  const wlSrcRows = Object.entries(wlBySrc).map(([s, v]) => ({ s, ...v, rate: pct(v.won, v.won + v.lost) })).filter(r => r.won + r.lost >= 2).sort((a, b) => b.rate - a.rate);

  // Won by month (count + value)
  const wonByMonth = {};
  wonDeals.forEach(d => {
    const dt = pdParseDate(d['Deal - Won time']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    if (!wonByMonth[k]) wonByMonth[k] = { count: 0, value: 0 };
    wonByMonth[k].count++;
    wonByMonth[k].value += parseFloat(d['Deal - Value']) || 0;
  });

  // Lost by month
  const lostByMonth = {};
  lostDeals.forEach(d => {
    const dt = pdParseDate(d['Deal - Lost time']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    lostByMonth[k] = (lostByMonth[k] || 0) + 1;
  });

  // Avg sales cycle by month
  const cycleByMonth = {};
  wonDeals.forEach(d => {
    const c = pdParseDate(d['Deal - Deal created']);
    const w = pdParseDate(d['Deal - Won time']);
    if (!pdValidDate(c) || !pdValidDate(w)) return;
    const days = Math.round((w - c) / 86400000);
    const k = monthKey(w.toISOString());
    if (!cycleByMonth[k]) cycleByMonth[k] = { total: 0, count: 0 };
    cycleByMonth[k].total += days;
    cycleByMonth[k].count++;
  });

  // Win rate by month
  const winRateByMonth = {};
  months12.forEach(m => {
    const w = wonByMonth[m]?.count || 0;
    const l = lostByMonth[m] || 0;
    winRateByMonth[m] = (w + l > 0) ? pct(w, w + l) : null;
  });

  // Deals closed same month opened
  const sameMonth = wonDeals.filter(d => {
    const c = pdParseDate(d['Deal - Deal created']);
    const w = pdParseDate(d['Deal - Won time']);
    return pdValidDate(c) && pdValidDate(w) && monthKey(c.toISOString()) === monthKey(w.toISOString());
  });

  // Source performance (range-filtered closed deals)
  const srcPerf = {};
  salesDeals.filter(d => d['Deal - Status'] !== 'Open').forEach(d => {
    const dateField = d['Deal - Status'] === 'Won' ? d['Deal - Won time'] : d['Deal - Lost time'];
    if (!pdInRange(dateField, range)) return;
    const src = d['Deal - Source channel'] || 'Unknown';
    if (!srcPerf[src]) srcPerf[src] = { won: 0, lost: 0, wonVal: 0 };
    if (d['Deal - Status'] === 'Won') { srcPerf[src].won++; srcPerf[src].wonVal += parseFloat(d['Deal - Value']) || 0; }
    else srcPerf[src].lost++;
  });

  // Category donut (won only, range-filtered)
  const catPerf = {};
  wonDeals.forEach(d => { const c = d['Deal - Category'] || 'Other'; catPerf[c] = (catPerf[c] || 0) + 1; });

  // Owner bar (won only, range-filtered)
  const ownerPerf = {};
  wonDeals.forEach(d => { const o = d['Deal - Owner'] || 'Unknown'; ownerPerf[o] = (ownerPerf[o] || 0) + 1; });

  // Pipeline snapshot — all statuses per stage (current state, not range-filtered)
  const SALES_STAGES = ['Contact Made/Discovery','Meeting Scheduled','Negotiations','Order Form Sent','Signed Order Form Returned','Invoice Sent','Payment Received','Closed Lost'];
  const stageByStatus = { open: {}, won: {}, lost: {} };
  SALES_STAGES.forEach(s => { stageByStatus.open[s]=0; stageByStatus.won[s]=0; stageByStatus.lost[s]=0; });
  salesDeals.forEach(d => {
    let st = d['Deal - Stage'] || '';
    if (st === 'Contact Made') st = 'Contact Made/Discovery';
    if (!SALES_STAGES.includes(st)) return;
    const status = (d['Deal - Status'] || '').toLowerCase();
    if (stageByStatus[status]) stageByStatus[status][st]++;
  });

  // Avg sales cycle overall
  const allCycle = Object.values(cycleByMonth);
  const avgCycleTotal = allCycle.reduce((s,v) => s+v.total, 0);
  const avgCycleCount = allCycle.reduce((s,v) => s+v.count, 0);
  const avgCycleDays = avgCycleCount ? Math.round(avgCycleTotal / avgCycleCount) : null;

  const avgWinRate12 = (() => { const r = months12.map(m => winRateByMonth[m]).filter(v => v != null); return r.length ? r.reduce((a,b)=>a+b,0)/r.length : null; })();

  // ── CONVERSION FUNNEL (OPTI-MAX stages) ─────────────────────────────────────
  const FUNNEL_S = [
    'Contact Made/Discovery','Meeting Scheduled','Negotiations',
    'Order Form Sent','Signed Order Form Returned','Invoice Sent','Payment Received'
  ];
  const funnelSIdx = Object.fromEntries(FUNNEL_S.map((s,i)=>[s,i]));
  function dealReachedS(d, idx) {
    if (d['Deal - Status'] === 'Won') return true;
    let stg = d['Deal - Stage'] || '';
    if (stg === 'Contact Made') stg = 'Contact Made/Discovery';
    const di = funnelSIdx[stg]; return di != null && di >= idx;
  }
  // Use deals created in current range for funnel
  const funnelDeals = salesDeals.filter(d =>
    range.from ? pdInRange(d['Deal - Deal created'], range) : true
  );
  const funnelCnts  = FUNNEL_S.map((_,i) => funnelDeals.filter(d => dealReachedS(d,i)).length);
  const funnelRates = FUNNEL_S.map((_,i) =>
    i===0 ? null : (funnelCnts[i-1]>0 ? pct(funnelCnts[i], funnelCnts[i-1]) : null)
  );
  const funnelWon   = funnelDeals.filter(d => d['Deal - Status']==='Won').length;
  const funnelOvr   = funnelCnts[0]>0 ? pct(funnelWon, funnelCnts[0]) : null;

  // Load OPTI-MAX targets for reference lines
  function omTargets() {
    try { return { meeting:80,neg:95,order:82,invoice:90,won:90,...JSON.parse(localStorage.getItem('liq_optimax')||'{}') }; }
    catch { return {meeting:80,neg:95,order:82,invoice:90,won:90}; }
  }
  const omt = omTargets();
  const funnelTargets = [null, omt.meeting, omt.neg, omt.order, null, omt.invoice, omt.won];

  // Month-by-month stage-to-stage conversion rates
  const stageConvByMonth = FUNNEL_S.slice(1).map((_, si) =>
    months12.map(m => {
      const mDeals = salesDeals.filter(d => {
        const dt = pdParseDate(d['Deal - Deal created']);
        return pdValidDate(dt) && monthKey(dt.toISOString())===m;
      });
      const prev = mDeals.filter(d=>dealReachedS(d,si)).length;
      const curr = mDeals.filter(d=>dealReachedS(d,si+1)).length;
      return prev>0 ? pct(curr,prev) : null;
    })
  );

  // ── SALES VELOCITY ───────────────────────────────────────────────────────────
  const CYCLE_BKTS = [{lo:0,hi:14,lbl:'0–14d'},{lo:15,hi:30,lbl:'15–30d'},{lo:31,hi:60,lbl:'31–60d'},{lo:61,hi:90,lbl:'61–90d'},{lo:91,hi:Infinity,lbl:'90d+'}];
  function dealCycleDays(d) {
    const c=pdParseDate(d['Deal - Deal created']), w=pdParseDate(d['Deal - Won time']);
    if (!pdValidDate(c)||!pdValidDate(w)) return null;
    return Math.round((w-c)/86400000);
  }
  const cycleDistrib = CYCLE_BKTS.map(b => ({...b, count: wonDeals.filter(d=>{const dy=dealCycleDays(d);return dy!=null&&dy>=b.lo&&dy<=b.hi;}).length}));
  const within30Cnt  = cycleDistrib[0].count + cycleDistrib[1].count;
  const within30Pct  = wonDeals.length ? pct(within30Cnt, wonDeals.length) : null;
  const within30ByMo = {};
  months12.forEach(m => {
    const mw = wonDeals.filter(d=>{const dt=pdParseDate(d['Deal - Won time']);return pdValidDate(dt)&&monthKey(dt.toISOString())===m;});
    const mw30 = mw.filter(d=>{const dy=dealCycleDays(d);return dy!=null&&dy<=30;});
    within30ByMo[m] = mw.length>0 ? pct(mw30.length,mw.length) : null;
  });
  const velTarget30 = (() => {
    try { return JSON.parse(localStorage.getItem('liq_optimax')||'{}').cycle_30d_target ?? 50; } catch { return 50; }
  })();
  const velTargetCycle = (() => {
    try { return JSON.parse(localStorage.getItem('liq_optimax')||'{}').avg_cycle_target ?? 45; } catch { return 45; }
  })();

  sc.innerHTML = `
    ${!wonDeals.length && !_pd_deals.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive deals CSV first.</div></div>' : ''}
    <div class="cards" style="margin-bottom:18px">
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Won deals (${range.label})${infoBtn('Won deals (total)','<span class="src-tag">Pipedrive · '+pipelineLabel+'</span><br>Count of deals with <b>Status = Won</b> and Won time within the selected date range.<br><div class="calc-row">Status = "Won" AND Won time in '+range.label+'</div>')}</div><div class="card-value">${wonDeals.length || 0}</div><div class="card-sub">${pipelineLabel}</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Closed same month${infoBtn('Closed same month','<span class="src-tag">Pipedrive · '+pipelineLabel+'</span><br>Won deals where the <b>Deal created</b> month equals the <b>Won time</b> month — i.e. opened and closed in the same calendar month.<br><div class="calc-row">monthKey(Deal created) === monthKey(Won time)</div>')}</div>
        ${sameMonth.length ? `<div class="card-value">${sameMonth.length}</div><div class="card-sub">${fmtPct(pct(sameMonth.length, wonDeals.length))} of won deals</div>` : '<div class="card-nodata">no data</div>'}
      </div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Avg win rate${infoBtn('Avg win rate (period)','<span class="src-tag">Pipedrive · '+pipelineLabel+'</span><br>Average of monthly win rates across the selected range. Each month: <b>Won ÷ (Won + Lost)</b>. Months with zero closed deals are excluded.<br><div class="calc-row">avg(Won / (Won + Lost)) per month in range</div>')}</div>
        ${avgWinRate12 != null ? `<div class="card-value">${fmtPct(avgWinRate12)}</div><div class="card-sub">avg monthly rate · ${range.label}</div>` : '<div class="card-nodata">no data</div>'}
      </div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Avg sales cycle${infoBtn('Avg sales cycle','<span class="src-tag">Pipedrive · '+pipelineLabel+'</span><br>Average number of days from <b>Deal created</b> to <b>Won time</b> across all won deals in the selected range.<br><div class="calc-row">avg(Won time − Deal created) in days</div>')}</div>
        ${avgCycleDays != null ? `<div class="card-value">${avgCycleDays}d</div><div class="card-sub">created → won · ${range.label}</div>` : '<div class="card-nodata">no data</div>'}
      </div>
    </div>

    <div class="box"><div class="box-title">Won deals &amp; revenue by month — ${range.label} · ${pipelineLabel}</div>
      <div class="chart-wrap" style="height:260px"><canvas id="pd-won-month"></canvas></div></div>

    <div class="box"><div class="box-title">Win rate by month — ${range.label} · ${pipelineLabel}</div>
      <div class="chart-wrap" style="height:210px"><canvas id="pd-winrate"></canvas></div></div>

    <div class="box"><div class="box-title">Won vs Lost by month — ${range.label} · ${pipelineLabel}</div>
      <div class="chart-wrap" style="height:210px"><canvas id="pd-wl-month"></canvas></div></div>

    <div class="box"><div class="box-title">Average sales cycle — days from created to won — ${range.label} · ${pipelineLabel}</div>
      <div class="chart-wrap" style="height:200px"><canvas id="pd-cycle"></canvas></div></div>

    <div class="box"><div class="box-title">Deal source performance (won vs lost) · ${pipelineLabel}</div>
      ${Object.keys(srcPerf).length ? `<div class="chart-wrap" style="height:${Math.max(200, Object.keys(srcPerf).length * 42)}px"><canvas id="pd-sources"></canvas></div>` : '<div class="no-data">No source data.</div>'}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0"><div class="box-title">Won deals by category</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-category"></canvas></div></div>
      <div class="box" style="margin-bottom:0"><div class="box-title">Won deals by owner</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-owner"></canvas></div></div>
    </div>

    <div class="box"><div class="box-title">Pipeline stage snapshot — ${pipelineLabel} (Open · Won · Lost)</div>
      <div class="chart-wrap" style="height:${SALES_STAGES.length * 38 + 60}px"><canvas id="pd-stage-snap"></canvas></div></div>

    <div class="box" style="margin-top:14px">
      <div class="box-title">Sales conversion funnel — ${range.label}
        <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:auto">"Reached stage" · deals created in period · overall conversion: ${funnelOvr!=null?fmtPct(funnelOvr):'—'}</span>
      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="pd-funnel"></canvas></div>
      <table class="conv-table" style="margin-top:14px">
        <thead><tr><th>Stage</th><th style="text-align:right">Deals</th><th style="text-align:right">Conv%</th><th style="text-align:right">Target%</th><th style="text-align:right">Gap</th></tr></thead>
        <tbody>
          ${FUNNEL_S.map((s,i)=>{
            const cnt=funnelCnts[i], rate=funnelRates[i], tgt=funnelTargets[i];
            const gap=rate!=null&&tgt!=null ? +(rate-tgt).toFixed(1) : null;
            const cls=gap==null?'':gap>=0?'good':'bad';
            return `<tr><td>${s}</td>
              <td style="text-align:right;font-weight:500">${cnt}</td>
              <td style="text-align:right">${rate!=null?`<span class="conv-pct ${rate>=70?'good':rate>=50?'mid':'bad'}">${fmtPct(rate)}</span>`:i===0?'<span style="color:var(--tl)">entry</span>':'—'}</td>
              <td style="text-align:right">${tgt!=null?tgt+'%':'—'}</td>
              <td style="text-align:right">${gap!=null?`<span class="conv-pct ${cls}">${gap>=0?'+':''}${gap}%</span>`:'—'}</td>
            </tr>`;
          }).join('')}
          <tr style="border-top:2px solid var(--bd);font-weight:600"><td>Won (total)</td><td style="text-align:right">${funnelWon}</td>
            <td style="text-align:right">${funnelOvr!=null?`<span class="conv-pct ${funnelOvr>=40?'good':funnelOvr>=25?'mid':'bad'}">${fmtPct(funnelOvr)}</span>`:'—'}</td>
            <td colspan="2" style="text-align:right;font-size:11px;color:var(--tl)">overall entry→won</td></tr>
        </tbody>
      </table>
    </div>

    <div class="box" style="margin-top:14px">
      <div class="box-title">Sales conversion funnel — visual
        <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:auto">Pipedrive "reached stage" · deals created in ${range.label}</span>
      </div>
      ${(() => {
        // Compact Pipedrive-style funnel visual
        const fStages = ['Contact Made','Meetings Sched.','Negotiations','Order Form','Signed OFR','Invoice Sent','Payment Rcvd'];
        const fCts = funnelCnts;
        const fRts = funnelRates;
        return `<div class="pd-funnel-row">
          ${fStages.map((s,i) => `
            ${i>0 ? `<div class="pd-funnel-arrow">
              <div class="pd-funnel-pct" style="color:${fRts[i]!=null?(fRts[i]>=75?'#2a7a4b':fRts[i]>=50?'#c25a00':'#c0392b'):'#aaa'}">${fRts[i]!=null?fmtPct(fRts[i]):'—'}</div>
              <div class="pd-funnel-chevron">›</div>
            </div>` : ''}
            <div class="pd-funnel-box">
              <div class="pd-funnel-count">${fCts[i]}</div>
              <div class="pd-funnel-name">${s}</div>
            </div>
          `).join('')}
          <div class="pd-funnel-arrow">
            <div class="pd-funnel-pct" style="color:${funnelOvr!=null?(funnelOvr>=40?'#2a7a4b':funnelOvr>=25?'#c25a00':'#c0392b'):'#aaa'}">${funnelOvr!=null?fmtPct(funnelOvr):'—'}</div>
            <div class="pd-funnel-chevron">›</div>
          </div>
          <div class="pd-funnel-box won-box">
            <div class="pd-funnel-count">${funnelWon}</div>
            <div class="pd-funnel-name">Won</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--tl);margin-top:6px">
          Overall conversion: <strong>${funnelOvr!=null?fmtPct(funnelOvr):'—'}</strong> entry → won.
          For detailed conversion targets, see the <strong>OPTI-MAX</strong> subtab.
        </div>`;
      })()}
    </div>

    <div class="box" style="margin-top:14px">
      <div class="box-title">Sales velocity — time from deal creation to won</div>
      <div class="cards" style="margin-bottom:14px">
        ${within30Pct!=null ? `<div class="card"><div class="card-label">Won within 30 days</div><div class="card-value">${fmtPct(within30Pct)}</div><div class="card-sub">${within30Cnt} of ${wonDeals.length} won deals · target ${velTarget30}%</div></div>`
          : `<div class="card"><div class="card-label">Won within 30 days</div><div class="card-nodata">no data</div></div>`}
        ${avgCycleDays!=null ? `<div class="card"><div class="card-label">Avg days to close</div><div class="card-value ${avgCycleDays<=velTargetCycle?'':''}">  ${avgCycleDays}d</div><div class="card-sub">target ≤${velTargetCycle}d · created→won</div></div>`
          : `<div class="card"><div class="card-label">Avg days to close</div><div class="card-nodata">no data</div></div>`}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><div style="font-size:12px;font-weight:500;color:var(--navy);margin-bottom:8px">Cycle time distribution</div>
          <div class="chart-wrap" style="height:200px"><canvas id="pd-cycle-dist"></canvas></div></div>
        <div><div style="font-size:12px;font-weight:500;color:var(--navy);margin-bottom:8px">% won within 30 days — by month</div>
          <div class="chart-wrap" style="height:200px"><canvas id="pd-vel-month"></canvas></div></div>
      </div>
    </div>

    <!-- Won deals detail table -->
    ${wonDeals.length ? `<div class="box" style="margin-top:14px">
      <div class="box-title">All won deals — ${range.label} · ${pipelineLabel}</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="border-bottom:2px solid var(--bor)">
            <th style="text-align:left;padding:5px 8px">Deal</th>
            <th style="text-align:left;padding:5px 8px">Org / Person</th>
            <th style="text-align:left;padding:5px 8px">Owner</th>
            <th style="text-align:left;padding:5px 8px">Source</th>
            <th style="text-align:right;padding:5px 8px">Value</th>
            <th style="text-align:right;padding:5px 8px">Won date</th>
            <th style="text-align:right;padding:5px 8px">Cycle</th>
          </tr></thead>
          <tbody>
            ${wonDeals.slice().sort((a,b)=>{
              const da=pdParseDate(a['Deal - Won time']), db=pdParseDate(b['Deal - Won time']);
              return (pdValidDate(db)?db:new Date(0)) - (pdValidDate(da)?da:new Date(0));
            }).map(d => {
              const cycle = dealCycleDays(d);
              const won = pdParseDate(d['Deal - Won time']);
              return `<tr style="border-bottom:1px solid var(--bg2)">
                <td style="padding:5px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d['Deal - Title']||d['Title']||'—'}</td>
                <td style="padding:5px 8px;color:var(--tl);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d['Deal - Organisation']||d['Organisation']||d['Deal - Person']||'—'}</td>
                <td style="padding:5px 8px;color:var(--tl)">${d['Deal - Owner']||'—'}</td>
                <td style="padding:5px 8px;color:var(--tl)">${d['Deal - Source channel']||d['Source channel']||'—'}</td>
                <td style="padding:5px 8px;text-align:right;font-weight:600">${d['Deal - Value']?fmtCur(parseFloat(d['Deal - Value'])):'—'}</td>
                <td style="padding:5px 8px;text-align:right">${pdValidDate(won)?fmtDate(won).slice(0,6):'—'}</td>
                <td style="padding:5px 8px;text-align:right;color:${cycle!=null?(cycle<=30?'#2a7a4b':cycle<=60?'#c25a00':'#e05252'):'#999'}">${cycle!=null?cycle+'d':'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}

    <div class="box" style="margin-top:14px">
      <div class="box-title">Win / loss analysis — ${range.label} · ${pipelineLabel}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start">
        <div>
          <div style="font-size:12px;color:var(--tl);margin-bottom:8px">Why deals were lost · ${lostDeals.length} lost · overall win rate <b>${wlOverall!=null?fmtPct(wlOverall):'—'}</b></div>
          ${wlReasonEntries.length ? `<div class="chart-wrap" style="height:${Math.max(180, wlReasonEntries.length*34)}px"><canvas id="pd-winloss-reasons"></canvas></div>` : '<div class="no-data">No lost deals in this period.</div>'}
        </div>
        <div>
          <div style="font-size:12px;color:var(--tl);margin-bottom:8px">Win rate by lead source <span style="color:var(--tl)">(2+ closed deals)</span></div>
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr>
              <th style="text-align:left;padding:5px 6px;border-bottom:1px solid var(--bor)">Source</th>
              <th style="text-align:center;padding:5px 6px;border-bottom:1px solid var(--bor)">Won</th>
              <th style="text-align:center;padding:5px 6px;border-bottom:1px solid var(--bor)">Lost</th>
              <th style="text-align:right;padding:5px 6px;border-bottom:1px solid var(--bor)">Win rate</th>
            </tr></thead>
            <tbody>${wlSrcRows.length ? wlSrcRows.map(r => { const cls = r.rate>=60?'good':r.rate>=35?'mid':'bad'; return `<tr style="border-bottom:1px solid var(--bg2)">
              <td style="padding:5px 6px">${r.s}</td>
              <td style="text-align:center;padding:5px 6px">${r.won}</td>
              <td style="text-align:center;padding:5px 6px">${r.lost}</td>
              <td style="text-align:right;padding:5px 6px"><span class="conv-pct ${cls}">${fmtPct(r.rate)}</span></td>
            </tr>`; }).join('') : '<tr><td colspan="4" style="padding:8px;color:var(--tl)">Not enough closed deals to compare sources.</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  if (wlReasonEntries.length) {
    makeChart('pd-winloss-reasons', {
      type: 'bar',
      data: {
        labels: wlReasonEntries.map(([r]) => r.length > 32 ? r.slice(0,32)+'…' : r),
        datasets: [{ label: 'Lost deals', data: wlReasonEntries.map(([,n]) => n), backgroundColor: '#c0392b', borderRadius: 3 }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true }, y: { grid: { display: false }, ticks: { ...axStyle, font: { family: 'DM Sans', size: 10 } } } }
      }
    });
  }

  if (wonDeals.length) {
    makeChart('pd-won-month', {
      type: 'bar',
      data: {
        labels: months12.map(m => monthLabel(m)),
        datasets: [
          { label: 'Won deals', data: months12.map(m => wonByMonth[m]?.count||0), backgroundColor:'#2a7a4b', borderRadius:3, yAxisID:'y' },
          { label: 'Revenue ($)', data: months12.map(m => wonByMonth[m]?.value||0), type:'line', borderColor:'#1a3c5e', borderWidth:2, pointRadius:3, tension:.3, fill:false, yAxisID:'y1' },
          { label: 'Target $200k/mo', data: months12.map(()=>TARGET_ARR/12), type:'line', borderColor:'#c25a00', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false, yAxisID:'y1' },
        ]
      },
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{position:'left',grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true}, y1:{position:'right',grid:{drawOnChartArea:false},ticks:{...axStyle,callback:v=>'$'+(v/1000).toFixed(0)+'k'},beginAtZero:true} }
      }
    });
    makeChart('pd-winrate', {
      type: 'line',
      data: {
        labels: months12.map(m => monthLabel(m)),
        datasets: [
          { label:'Win rate', data:months12.map(m=>winRateByMonth[m]), borderColor:'#2e8bc0', borderWidth:2, tension:.3, pointRadius:3, fill:false, spanGaps:true },
          { label:'50% target', data:months12.map(()=>50), borderColor:'#c25a00', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false },
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,callback:v=>v+'%'},min:0,max:100} }
      }
    });
    makeChart('pd-wl-month', {
      type:'bar',
      data:{ labels:months12.map(m=>monthLabel(m)), datasets:[
        {label:'Won', data:months12.map(m=>wonByMonth[m]?.count||0), backgroundColor:'#2a7a4b', borderRadius:3},
        {label:'Lost', data:months12.map(m=>lostByMonth[m]||0), backgroundColor:'#e8d4d4', borderRadius:3},
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
      }
    });
    makeChart('pd-cycle', {
      type:'line',
      data:{ labels:months12.map(m=>monthLabel(m)), datasets:[{
        label:'Avg days to close', spanGaps:true, fill:false,
        data:months12.map(m=>cycleByMonth[m]?Math.round(cycleByMonth[m].total/cycleByMonth[m].count):null),
        borderColor:'#7b1fa2', borderWidth:2, tension:.3, pointRadius:3
      }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,callback:v=>v+'d'},beginAtZero:true} }
      }
    });
    const srcEntries = Object.entries(srcPerf).filter(([k])=>k&&k!=='Unknown').sort((a,b)=>b[1].won-a[1].won);
    if (srcEntries.length) makeChart('pd-sources', {
      type:'bar', data:{
        labels:srcEntries.map(([k])=>k),
        datasets:[
          {label:'Won', data:srcEntries.map(([,v])=>v.won), backgroundColor:'#2a7a4b', borderRadius:3},
          {label:'Lost', data:srcEntries.map(([,v])=>v.lost), backgroundColor:'#e8d4d4', borderRadius:3},
        ]
      },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{grid:gridStyle,ticks:axStyle}, y:{grid:{display:false},ticks:axStyle} }
      }
    });
    const catEntries = Object.entries(catPerf).filter(([k])=>k&&k!=='').sort((a,b)=>b[1]-a[1]);
    if (catEntries.length) makeChart('pd-category', {
      type:'doughnut',
      data:{ labels:catEntries.map(([k])=>k), datasets:[{ data:catEntries.map(([,v])=>v), backgroundColor:['#1a3c5e','#2e8bc0','#2a7a4b','#c25a00','#7b1fa2','#00796b'], borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:10, padding:10 } } }
      }
    });
    const ownerEntries = Object.entries(ownerPerf).sort((a,b)=>b[1]-a[1]);
    if (ownerEntries.length) makeChart('pd-owner', {
      type:'bar',
      data:{ labels:ownerEntries.map(([k])=>k.split(' ')[0]), datasets:[{label:'Won deals', data:ownerEntries.map(([,v])=>v), backgroundColor:'#2e8bc0', borderRadius:3}] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
      }
    });
    // Conversion funnel chart (Pipedrive-style vertical bars)
    if (funnelCnts[0] > 0) {
      makeChart('pd-funnel', {
        type: 'bar',

          labels: FUNNEL_S.map(s=>s.length>20?s.slice(0,20)+'…':s),
          datasets: [
            { label:'Reached stage', data:funnelCnts, backgroundColor:'#2e8bc0', borderRadius:4 },
            { label:'Won', data:FUNNEL_S.map((_,i)=>i===FUNNEL_S.length-1?funnelWon:null), backgroundColor:'#2a7a4b', borderRadius:4 },
