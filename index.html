function renderTraining(el) {
  el = el || document.getElementById('main-content');
  const data = load('training');
  const webinars = load('webinars');
  const sub = activeSub.training_sub || 'sessions';
  const _now = new Date();

  const tm = thisMonth(data, 'date');

  // Pipedrive people with access granted = people who were trained/onboarded
  // Exclude contact-only types that have a date set but were never actually trained
  const _PD_UNTRAINED_TYPES = ['Contact Register', 'Expression of Interest'];
  const pdTrained = _pd_people.filter(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    return pdValidDate(dt) && !_PD_UNTRAINED_TYPES.includes(p['Person - Customer Type']);
  });
  const trainedThisMonth = pdTrained.length
    ? pdTrained.filter(p => {
        const dt = pdParseDate(p['Person - Date Access Granted']);
        return dt.getFullYear() === _now.getFullYear() && dt.getMonth() === _now.getMonth();
      }).length
    : tm.reduce((s, r) => s + (r.attendees || 0), 0);
  const cumulative = pdTrained.length || data.reduce((s, r) => s + (r.attendees || 0), 0);

  // Build monthly chart: Pipedrive access-granted dates (full history) + manual sessions
  const months = {};
  pdTrained.forEach(p => {
    const k = monthKey(p['Person - Date Access Granted']);
    if (k) months[k] = (months[k] || 0) + 1;
  });
  data.forEach(r => {
    const k = monthKey(r.date);
    if (k) months[k] = (months[k] || 0) + (r.attendees || 0);
  });
  const barData = Object.entries(months).sort().slice(-36);

  // Pipedrive onboarding pipeline
  const onboarding = _pd_deals.filter(d => d['Deal - Pipeline'] === 'General Onboarding Pipeline');
  const stageCount = (s) => onboarding.filter(d => d['Deal - Stage'] === s).length;
  const awaiting   = stageCount('Awaiting Onboarding');
  const inOnboard  = stageCount('In Onboarding');
  const growth2m   = stageCount('2 Month Growth Period');
  const complete   = stageCount('Onboarding Complete');
  const maintenance = stageCount('Maintenance') + stageCount('Month 11!');

  // Pipedrive trial pipeline
  const trials = _pd_deals.filter(d => d['Deal - Pipeline'] === 'Trial Pipeline');
  const trialActive   = trials.filter(d => d['Deal - Stage'] === 'Trial in Progress').length;
  const trialMid      = trials.filter(d => d['Deal - Stage'] === 'Trial Mid Point').length;
  const trialComplete = trials.filter(d => d['Deal - Stage'] === 'Trial Complete').length;
  const trialFollowUp = trials.filter(d => d['Deal - Stage'] === 'Follow Up').length;
  const trialLost     = trials.filter(d => d['Deal - Stage'] === 'Closed Lost').length;
  const trialConvRate = trials.length ? pct(trialComplete, trials.length - trialLost) : 0;

  // Onboarding funnel stages ordered
  const funnelStages = [
    { label: 'Awaiting Onboarding', count: awaiting,  color: '#90c4e0' },
    { label: 'In Onboarding',       count: inOnboard, color: '#2e8bc0' },
    { label: '2-Month Growth',      count: growth2m,  color: '#1a3c5e' },
    { label: 'Onboarding Complete', count: complete,  color: '#2a7a4b' },
    { label: 'Maintenance',         count: maintenance, color: '#7b9e7b' },
  ];
  const funnelMax = Math.max(...funnelStages.map(s => s.count), 1);

  el.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">Training</div>
        <div class="section-sub">Session tracking · Onboarding pipeline · Trial status</div>
      </div>
      <a class="src-link" href="https://app.pipedrive.com" target="_blank">↗ Pipedrive</a>
    </div>

    ${cardsHTML([
      ['Trained this month', trainedThisMonth || null, null, null, null,
        '<span class="src-tag">Pipedrive · People</span><br>Count of people with <b>Date Access Granted</b> in the current calendar month. All licence types included (Paid, Trial, Centrally Funded).<br><div class="calc-row">COUNT where Date Access Granted month = current month</div>Falls back to manually entered training session attendees if Pipedrive is not loaded.'],
      ['Trained (total)', cumulative || null, null, null, null,
        '<span class="src-tag">Pipedrive · People</span><br>Total count of all Pipedrive people with any <b>Date Access Granted</b> date set — across all time and all licence types.<br><div class="calc-row">COUNT where Date Access Granted is not null</div>Falls back to sum of manually entered attendee counts if Pipedrive is not loaded.'],
      ['Currently onboarding', inOnboard + awaiting || null, null, null, 'Pipedrive: Onboarding Pipeline',
        '<span class="src-tag">Pipedrive · General Onboarding Pipeline</span><br>Deals currently at <b>In Onboarding</b> (' + inOnboard + ') or <b>Awaiting Onboarding</b> (' + awaiting + ') stages. Current open deal snapshot — not date-filtered.<br><div class="calc-row">Stage = "In Onboarding" OR "Awaiting Onboarding"</div>'],
      ['In 2-month growth', growth2m || null, null, null, 'Pipedrive: Onboarding Pipeline',
        '<span class="src-tag">Pipedrive · General Onboarding Pipeline</span><br>Deals at the <b>2 Month Growth Period</b> stage. These customers have completed initial training and are in the post-training follow-up phase.<br><div class="calc-row">Stage = "2 Month Growth Period"</div>'],
      ['Active trials', trialActive + trialMid || null, null, null, 'Pipedrive: Trial Pipeline',
        '<span class="src-tag">Pipedrive · Trial Pipeline</span><br>Deals at <b>Trial in Progress</b> (' + trialActive + ') plus <b>Trial Mid Point</b> (' + trialMid + ') stages. Both stages represent active, ongoing trials.<br><div class="calc-row">Stage = "Trial in Progress" OR "Trial Mid Point"</div>'],
    ])}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="box">
        <div class="box-title">Onboarding pipeline <span style="font-size:11px;color:var(--tl);font-weight:400;margin-left:4px">General Onboarding · ${onboarding.length} total</span></div>
        ${onboarding.length ? `
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
            ${funnelStages.map(s => `
              <div style="display:flex;align-items:center;gap:10px">
                <div style="font-size:12px;color:var(--tx);min-width:160px;white-space:nowrap">${s.label}</div>
                <div style="flex:1;background:var(--bd);border-radius:4px;height:20px;position:relative;overflow:hidden">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(s.count/funnelMax*100)}%;background:${s.color};border-radius:4px;transition:.4s"></div>
                </div>
                <div style="font-size:13px;font-weight:700;color:var(--navy);min-width:28px;text-align:right">${s.count}</div>
              </div>
            `).join('')}
          </div>
        ` : '<div class="no-data">No Pipedrive data loaded.</div>'}
      </div>

      <div class="box">
        <div class="box-title">Trial pipeline <span style="font-size:11px;color:var(--tl);font-weight:400;margin-left:4px">Trial Pipeline · ${trials.length} total</span></div>
        ${trials.length ? `
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
            ${[
              { label: 'Trial in Progress', count: trialActive,   color: '#2e8bc0' },
              { label: 'Trial Mid Point',   count: trialMid,      color: '#1a3c5e' },
              { label: 'Trial Complete',    count: trialComplete, color: '#2a7a4b' },
              { label: 'Follow Up',         count: trialFollowUp, color: '#f0a500' },
              { label: 'Closed Lost',       count: trialLost,     color: '#e05252' },
            ].map(s => `
              <div style="display:flex;align-items:center;gap:10px">
                <div style="font-size:12px;color:var(--tx);min-width:160px;white-space:nowrap">${s.label}</div>
                <div style="flex:1;background:var(--bd);border-radius:4px;height:20px;position:relative;overflow:hidden">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(s.count/Math.max(trialLost,1)*100)}%;background:${s.color};border-radius:4px;transition:.4s"></div>
                </div>
                <div style="font-size:13px;font-weight:700;color:var(--navy);min-width:28px;text-align:right">${s.count}</div>
              </div>
            `).join('')}
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--tl)">Trial completion rate (excl. lost): <strong style="color:var(--navy)">${fmtPct(trialConvRate)}</strong></div>
        ` : '<div class="no-data">No Pipedrive data loaded.</div>'}
      </div>
    </div>

    <div id="training-sub-content"></div>
  `;

  // Trial-to-paid conversions by month
  const trialConvByMonth = {};
  _pd_people.filter(p =>
    p['Person - Customer Type'] === 'Paid Subscription' &&
    p['Person - Previous Customer Type'] &&
    p['Person - Previous Customer Type'].toLowerCase().includes('trial')
  ).forEach(p => {
    const k = monthKey(p['Person - Date Access Granted']);
    if (k) trialConvByMonth[k] = (trialConvByMonth[k] || 0) + 1;
  });
  const convMonthData = Object.entries(trialConvByMonth).sort().slice(-18);
  let _running = 0;
  const convRunning = convMonthData.map(([, v]) => { _running += v; return _running; });

  // Pipedrive onboarding starts by month (deals past Awaiting stage)
  const pdOnboardByMonth = {};
  onboarding.filter(d => d['Deal - Stage'] !== 'Awaiting Onboarding').forEach(d => {
    const dt = pdParseDate(d['Deal - Deal created']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    pdOnboardByMonth[k] = (pdOnboardByMonth[k] || 0) + 1;
  });
  const pdOnboardData = Object.entries(pdOnboardByMonth).sort().slice(-18);

  setTrainingSub('sessions', false, barData, data, webinars, convMonthData, convRunning, pdOnboardData);
}

            </div>

      ${tableHTML('training', data, [

          plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: axStyle } }
        }
      });

    // ── TRAINING ROI: trained vs untrained orgs ──────────────────────────────

    const trainedOrgsMap = {};
    trainingData2.forEach(r => {
      const o = (r.org || r.organisation || '').trim();
      if (o) trainedOrgsMap[o] = (trainedOrgsMap[o] || 0) + (r.attendees || 1);
    });

    // Paid orgs with PostHog signal
    const paidPeopleROI = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
    const powerEmails  = new Set((_ph.powerUsers   || []).map(u => (u.distinct_id||'').toLowerCase()));
    const atRiskEmails = new Set((_ph.atRisk  || []).map(u => (u.distinct_id||'').toLowerCase()));

    const orgROI = {};
    paidPeopleROI.forEach(p => {
      const org = (p['Person - Organisation'] || 'Unknown').trim();
      if (!orgROI[org]) orgROI[org] = { sessions:0, hasPower:false, hasAtRisk:false, userCount:0 };
      orgROI[org].userCount++;
      orgROI[org].sessions = trainedOrgsMap[org] || 0;
      const em = (p['Person - Email'] || p['Email'] || '').toLowerCase();
      if (em && powerEmails.has(em))  orgROI[org].hasPower = true;

    });

    const roiOrgs = Object.entries(orgROI).map(([org, m]) => ({org, ...m}));
    const trained2   = roiOrgs.filter(o => o.sessions > 0);
    const untrained2 = roiOrgs.filter(o => o.sessions === 0);
    const trainedPower   = trained2.filter(o => o.hasPower).length;
    const untrainedPower = untrained2.filter(o => o.hasPower).length;
    const trainedAtRisk  = trained2.filter(o => o.hasAtRisk).length;
    const untrainedAtRisk = untrained2.filter(o => o.hasAtRisk).length;

    const roiHTML = roiOrgs.length ? `
      <div class="section-block" style="margin-top:0">
        <h3>Training ROI — trained vs untrained orgs ${infoBtn('Training ROI',
          `<p>Compares the PostHog engagement profile of <b>paying orgs that received training sessions</b> (from the manual training log) against those that did not.</p>

          <p>PostHog matching is by user email address — orgs with no email in PostHog are excluded from the signal columns.</p>
          <span class="src-tag">Training log · Pipedrive People · PostHog</span>`)}</h3>
        ${cardsHTML([
          ['Trained orgs', trained2.length, null, null, `${fmtPct(pct(trained2.length, roiOrgs.length))} of paid orgs`],
          ['Trained → power user', trainedPower, null, null, trained2.length ? fmtPct(pct(trainedPower, trained2.length)) + ' of trained orgs' : null],
          ['Trained → at-risk', trainedAtRisk, null, null, trained2.length ? fmtPct(pct(trainedAtRisk, trained2.length)) + ' of trained orgs' : null],
          ['Untrained → power user', untrainedPower, null, null, untrained2.length ? fmtPct(pct(untrainedPower, untrained2.length)) + ' of untrained orgs' : null],
          ['Untrained → at-risk', untrainedAtRisk, null, null, untrained2.length ? fmtPct(pct(untrainedAtRisk, untrained2.length)) + ' of untrained orgs' : null],
        ])}
        ${roiOrgs.length ? `<div class="chart-wrap" style="height:220px"><canvas id="training-roi-chart"></canvas></div>` : ''}
      </div>` : '';

    // Append ROI section
    const roiEl = document.createElement('div');
    roiEl.innerHTML = roiHTML;
    sc.appendChild(roiEl);

    if (roiOrgs.length) {
      makeChart('training-roi-chart', {
        type: 'bar',
        data: {
          labels: ['Trained orgs', 'Untrained orgs'],

            { label: 'Power users (%)', data: [

            y: { grid: gridStyle, ticks: { ...axStyle, callback: v => v + '%' }, beginAtZero: true, max: 100 }

function saveTrainingSession() {
  const date = document.getElementById('tr-date').value;
  if (!date) { toast('Please select a date.'); return; }
  const entry = {
    _id: 't' + Date.now(), date,
    type: document.getElementById('tr-type').value,
    attendees: Number(document.getElementById('tr-attendees').value) || null,
    org: document.getElementById('tr-org').value,
    custtype: document.getElementById('tr-custtype').value,
    trainer: document.getElementById('tr-trainer').value,
    sdk: document.getElementById('tr-sdk').value,
    notes: document.getElementById('tr-notes').value,
  };
  save('training', [...load('training'), entry]);
  toggleForm('training-form');
  toast('Training session saved.');
  renderTraining();
}

function saveWebinar() {
  const date = document.getElementById('wb-date').value;
  if (!date) { toast('Please select a date.'); return; }
  const numFields = ['regPageViews','registered','attended','cancelled','reactions'];
  const txtFields = ['title','avgTime'];
  const entry = { _id: 'w' + Date.now(), date };
  numFields.forEach(f => { const v = document.getElementById('wb-' + f)?.value; if (v !== '' && v != null) entry[f] = Number(v); });
  txtFields.forEach(f => { const v = document.getElementById('wb-' + f)?.value; if (v) entry[f] = v; });
  save('webinars', [...load('webinars'), entry]);
  toggleForm('webinar-form');
  toast('Webinar saved.');
  renderMarketing();
}

function renderMarketing(el) {
  el = el || document.getElementById('main-content');
  const data = load('content');
  const tm = thisMonth(data, 'date');

  const types = ['LinkedIn','YouTube','EDM','Viva Engage','Webinar','Blog','Speaking'];
  const typeColors = { LinkedIn:'#0a66c2', YouTube:'#c0392b', EDM:'#2a7a4b', 'Viva Engage':'#c25a00', Webinar:'#3949ab', Blog:'#7b1fa2', Speaking:'#00796b' };

  // Summary cards from latest tracker week
  const tracker = load('weekly_tracker').sort((a,b) => a.week > b.week ? 1 : -1);
  const latestW = tracker.length ? tracker[tracker.length - 1] : null;
  const liImpLatest = latestW ? ((latestW.jsImp||0) + (latestW.jmImp||0) + (latestW.lbImp||0)) : null;

  // Last 12 tracker weeks for charts
  const trackerRecent = tracker.slice(-12);

  // Webinars data
  const webinars = load('webinars');

  // ── FUNNEL: join tracker + trials by week ─────────────────────────────────
  const trialsData = load('trials').sort((a,b) => a.week > b.week ? 1 : -1);
  const trackerMap = Object.fromEntries(tracker.map(r => [r.week, r]));
  const trialsMap  = Object.fromEntries(trialsData.map(r => [r.week, r]));
  // All weeks that appear in either source
  const allFunnelWeeks = [...new Set([...tracker.map(r=>r.week), ...trialsData.map(r=>r.week)])].sort();
  const funnelRecent12 = allFunnelWeeks.slice(-12);
  // Funnel stages: [label, getValue(week)]
  const FUNNEL_STAGES_MK = [
    { label:'Website visitors',   key:'visitors',   get: w => (trackerMap[w]?.websiteVisits ?? null) },
    { label:'EOI / enquiries',    key:'eoi',        get: w => ((trackerMap[w]?.eoiTickets||0) + (trackerMap[w]?.purchaseEnq||0)) || null },
    { label:'Trials started',     key:'trials',     get: w => (trackerMap[w]?.trialsStarted ?? trialsMap[w]?.trialsGranted ?? null) },
    { label:'Demo attended',      key:'demos',      get: w => (trialsMap[w]?.demoAttended ?? null) },

// Parse a date string from Lucy's CSV header (e.g. "6-Nov", "26-Mar", "1-Apr-25", ISO dates)
function parseTrackerDate(str) {
  if (!str || !str.trim()) return null;
  str = str.trim();
  // Try standard ISO / JS parse first
  let d = new Date(str);
  if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
    return d.toISOString().split('T')[0];
  }
  // Match "6-Nov", "26-Mar", "1 Apr", "6-Nov-25", "6-Nov-2025"
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m = str.match(/^(\d{1,2})[\s\-\/]([a-zA-Z]{3})(?:[\s\-\/](\d{2,4}))?$/);
  if (m) {
    const day = parseInt(m[1]);
    const mo  = months[m[2].toLowerCase()];
    if (mo === undefined) return null;
    let year = m[3]
      ? (m[3].length === 2 ? 2000 + parseInt(m[3]) : parseInt(m[3]))
      : new Date().getFullYear();
    // If result is more than 6 months in the future, assume previous year
    const candidate = new Date(year, mo, day);
    if (candidate - new Date() > 180 * 86400000) year--;
    return new Date(year, mo, day).toISOString().split('T')[0];
  }
  return null;
}

function importTrackerCSV(input) {
  const file = input.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: (results) => {
      const rows = results.data;
      if (rows.length < 2) { toast('CSV appears empty.'); return; }

      // Row 0 = header: [label col, date1, date2, ...]
      const headerRow = rows[0];
      const dateKeys = []; // ISO date string per column (null if unparseable)
      for (let c = 1; c < headerRow.length; c++) {
        dateKeys.push(parseTrackerDate(String(headerRow[c] || '').trim()));
      }

      // Section-aware field mapping
      const SECTION_MAP = {
        linkedin: {
          'js post impressions': 'jsImp',
          'jm post impressions': 'jmImp',
          'lb post impressions': 'lbImp',
        },
        edm: {
          'email open rate':     'edmOpen',
          'open rate':           'edmOpen',
          'click through rate':  'edmCtr',
          'click-through rate':  'edmCtr',
          'ctr':                 'edmCtr',
        },
        webinar: {
          'email send':              'wbEmailSend',
          'email sends':             'wbEmailSend',
          'email open rate':         'wbEmailOpen',
          'open rate':               'wbEmailOpen',
          'click through rate':      'wbEmailCtr',
          'click-through rate':      'wbEmailCtr',
          'ctr':                     'wbEmailCtr',
          'event registration page': 'wbRegPage',
          'registration page':       'wbRegPage',
          'registrations':           'wbReg',
        },
        website: {
          'total users (visits)':    'websiteVisits',
          'total users':             'websiteVisits',
          'website visits':          'websiteVisits',
          'users':                   'websiteVisits',
          'purchase enquiries':      'purchaseEnq',
          'purchase enquiry':        'purchaseEnq',
          'purchase':                'purchaseEnq',
          'eoi tickets':             'eoiTickets',
          'eoi ticket':              'eoiTickets',
          'eoi':                     'eoiTickets',
          'trials started':          'trialsStarted',
          'trial':                   'trialsStarted',
        },
      };

      // Detect section from a row label
      function detectSection(label) {
        const l = label.toLowerCase();
        if (l.includes('linkedin'))                           return 'linkedin';
        if (l.includes('edm') || l.includes('2m growth') || l.includes('email marketing')) return 'edm';
        if (l.includes('webinar'))                            return 'webinar';
        if (l.includes('website') || l.includes('landing page')) return 'website';
        return null;
      }

      // Accumulate values per week
      const dataMap = {}; // { isoDate: { fieldKey: value } }
      dateKeys.forEach(dk => { if (dk) dataMap[dk] = dataMap[dk] || {}; });

      let currentSection = null;

      for (let ri = 1; ri < rows.length; ri++) {
        const row = rows[ri];
        const label = String(row[0] || '').trim();
        if (!label) continue;

        // Check if this row is a section header
        const sec = detectSection(label);
        if (sec) { currentSection = sec; continue; }
        if (!currentSection) continue;

        // Look up the field key for this metric label
        // Try exact match first, then starts-with (handles suffixes like "(Consolidated)", "(visits)")
        const labelNorm = label.toLowerCase().replace(/\s+/g, ' ').trim();
        const secMap = SECTION_MAP[currentSection] || {};
        let fieldKey = secMap[labelNorm];
        if (!fieldKey) {
          // Longest key first so "email open rate" beats "open rate"
          const keys = Object.keys(secMap).sort((a, b) => b.length - a.length);
          for (const k of keys) {
            if (labelNorm.startsWith(k)) { fieldKey = secMap[k]; break; }
          }
        }
        if (!fieldKey) continue;

        // Read each column's value
        for (let c = 1; c < row.length; c++) {
          const dk = dateKeys[c - 1];
          if (!dk) continue;
          const raw = String(row[c] || '').trim().replace(/%/g, '').replace(/,/g, '');
          if (!raw || raw === '-' || raw === '—') continue;
          const num = parseFloat(raw);
          if (!isNaN(num)) dataMap[dk][fieldKey] = num;
        }
      }

      // Merge with existing tracker records
      const existing   = load('weekly_tracker');
      const existingMap = Object.fromEntries(existing.map(r => [r.week, r]));
      let count = 0;
      Object.entries(dataMap).forEach(([week, fields]) => {
        if (!Object.keys(fields).length) return;
        const prev = existingMap[week] || { _id: 'trk-' + Date.now() + '-' + (++count) };
        existingMap[week] = { ...prev, week, ...fields };
        count++;
      });

      const merged = Object.values(existingMap).sort((a,b) => a.week > b.week ? 1 : -1);
      save('weekly_tracker', merged);
      input.value = '';
      const weekCount = Object.values(dataMap).filter(f => Object.keys(f).length > 0).length;
      toast(`Imported ${weekCount} weeks from CSV.`);
      renderTab(activeTab);
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

const pdParseDate = s => (s && s.trim()) ? new Date(s) : null;
const pdValidDate = d => d && !isNaN(d.getTime());
const isTrialType = s => !!(s && s.toLowerCase().includes('trial'));
const pd12Months = () => {
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return months;
};

// ── PEOPLE FIELD NORMALISER ──────────────────────────────────────────────────
// Pipedrive sometimes exports People CSVs without the "Person - " prefix on
// column headers (or with slight label variations). This function detects the
// actual column names and maps them to the canonical keys the dashboard uses.
function pdNormalisePeople(rows) {
  if (!rows.length) return rows;
  const p0 = rows[0];
  if ('Person - Customer Type' in p0) return rows; // already canonical, nothing to do
  const keys = Object.keys(p0);
  const find = (...needles) => keys.find(k => needles.some(n => k.toLowerCase() === n.toLowerCase()))
    || keys.find(k => needles.some(n => k.toLowerCase().includes(n.toLowerCase())));
  const map = {
    'Person - Customer Type':          find('Person - Customer Type', 'Customer Type', 'Customer type', 'customer_type'),
    'Person - Previous Customer Type': find('Person - Previous Customer Type', 'Previous Customer Type', 'previous customer type', 'Previous Customer'),
    'Person - Date Access Granted':    find('Person - Date Access Granted', 'Date Access Granted', 'date access granted', 'Access Granted'),
    'Person - Date Access Removed':    find('Person - Date Access Removed', 'Date Access Removed', 'date access removed', 'Access Removed'),
    'Person - Organisation':           find('Person - Organisation', 'Organisation', 'Organization', 'Company', 'Org'),
  };
  const hasAny = Object.values(map).some(Boolean);
  if (!hasAny) return rows; // nothing mappable found — return as-is
  return rows.map(p => {
    const n = {...p};
    for (const [canonical, src] of Object.entries(map)) {
      if (src && !(canonical in p)) n[canonical] = p[src] ?? '';
    }
    return n;
  });
}

// Deals equivalent — maps varying export headers to canonical 'Deal - X' keys AND
// cleans currency-formatted values ("A$24,000" → 24000) so parseFloat works.
// Runs on every load so it also repairs already-uploaded data with no re-upload.
function pdNormaliseDeals(rows) {
  if (!rows.length) return rows;
  const d0 = rows[0];
  const keys = Object.keys(d0);
  const find = (...needles) => keys.find(k => needles.some(n => k.toLowerCase() === n.toLowerCase()))
    || keys.find(k => needles.some(n => k.toLowerCase().includes(n.toLowerCase())));
  // Only build a header map if the canonical keys aren't already present.
  const needMap = !('Deal - Status' in d0);
  const map = needMap ? {
    'Deal - Title':          find('Deal - Title', 'Title'),
    'Deal - Value':          find('Deal - Value', 'Value', 'Deal value'),
    'Deal - Pipeline':       find('Deal - Pipeline', 'Pipeline'),
    'Deal - Stage':          find('Deal - Stage', 'Stage'),
    'Deal - Status':         find('Deal - Status', 'Status'),
    'Deal - Won time':       find('Deal - Won time', 'Won time', 'Won date'),
    'Deal - Lost time':      find('Deal - Lost time', 'Lost time', 'Lost date'),
    'Deal - Deal created':   find('Deal - Deal created', 'Deal created', 'Created', 'Add time'),
    'Deal - Category':       find('Deal - Category', 'Category', 'Label'),
    'Deal - Owner':          find('Deal - Owner', 'Owner', 'Deal owner'),
    'Deal - Source channel': find('Deal - Source channel', 'Source channel', 'Source'),
    'Deal - Lost reason':    find('Deal - Lost reason', 'Lost reason'),
    'Deal - Organisation':   find('Deal - Organisation', 'Organisation', 'Organization', 'Company'),
    'Deal - Person':         find('Deal - Person', 'Contact person', 'Person', 'Contact'),
  } : {};
  const cleanNum = v => (v == null || v === '') ? v : String(v).replace(/[^0-9.\-]/g, '');
  return rows.map(d => {
    const n = {...d};
    for (const [canonical, src] of Object.entries(map)) {
      if (src && !(canonical in d)) n[canonical] = d[src] ?? '';
    }
    // Always sanitise the value (handles "A$24,000", "$8,800", "1,234.5", etc.)
    if (n['Deal - Value'] != null) n['Deal - Value'] = cleanNum(n['Deal - Value']);
    return n;
  });
}

// ── DATE RANGE HELPERS ───────────────────
function pdGetRange() {
  const r = activeSub.pd_range || 'all';
  const to = new Date();
  if (r === 'all') return { from: null, to, label: 'All time' };
  // Specific calendar month, e.g. 'm:2026-03'
  if (r.startsWith('m:')) {
    const [y, m] = r.slice(2).split('-').map(Number);
    const mFrom = new Date(y, m - 1, 1, 0, 0, 0, 0);
    const mTo   = new Date(y, m, 0, 23, 59, 59, 999);   // last day of that month
    return { from: mFrom, to: mTo, label: mFrom.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }) };
  }
  const from = new Date();
  if      (r === '1m')  { from.setMonth(from.getMonth() - 1); }
  else if (r === '3m')  { from.setMonth(from.getMonth() - 3); }
  else if (r === '6m')  { from.setMonth(from.getMonth() - 6); }
  else if (r === '12m') { from.setMonth(from.getMonth() - 12); }
  else if (r === 'ytd') { from.setMonth(0); from.setDate(1); from.setHours(0,0,0,0); }
  from.setHours(0,0,0,0);
  const labels = { '1m':'Last month','3m':'Last 3 months','6m':'Last 6 months','12m':'Last 12 months','ytd':'Year to date' };
  return { from, to, label: labels[r] };
}

function pdInRange(dateStr, range) {
  if (!dateStr) return false;
  const d = pdParseDate(dateStr);
  if (!pdValidDate(d)) return false;
  if (!range.from) return true;
  return d >= range.from && d <= range.to;
}

function pdRangeMonths(range) {
  const now = new Date();
  let from;
  if (!range.from) {
    // All time — compute from earliest deal or person date
    let earliest = now;
    _pd_deals.concat(_pd_people).forEach(r => {
      const dates = [r['Deal - Won time'], r['Deal - Deal created'], r['Person - Date Access Granted']].filter(Boolean);
      dates.forEach(s => { const d = pdParseDate(s); if (pdValidDate(d) && d < earliest) earliest = d; });
    });
    from = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  } else {
    from = new Date(range.from.getFullYear(), range.from.getMonth(), 1);
  }
  // End at the range's upper bound (so a single-month selection returns just
  // that month), but never past today.
  const end = (range.to && range.to < now) ? range.to : now;
  const months = [];
  const d = new Date(from);
  while (d <= end) {
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth() + 1);
  }
  return months;
}

function setPdRange(r) { activeSub.pd_range = r; renderPipedrive(); }

// List of selectable calendar months (newest first), from the earliest deal/person date to now.
function pdMonthOptions() {
  let earliest = new Date();
  _pd_deals.concat(_pd_people).forEach(r => {
    ['Deal - Won time', 'Deal - Deal created', 'Person - Date Access Granted'].forEach(f => {
      const d = pdParseDate(r[f]); if (pdValidDate(d) && d < earliest) earliest = d;
    });
  });
  const now = new Date();
  const out = [];
  const d = new Date(now.getFullYear(), now.getMonth(), 1);
  const stop = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  while (d >= stop) {
    out.push('m:' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

// Sanity-check imported rows; returns a list of human-readable warnings (#8)
function pdValidateImport(rows, kind) {
  const warns = [];
  const now = new Date(); now.setHours(23,59,59,999);
  if (kind === 'deals') {
    const wonZero = rows.filter(r => (r['Deal - Status']||'').toLowerCase()==='won' && !(parseFloat(r['Deal - Value'])>0)).length;
    const negVal  = rows.filter(r => parseFloat(r['Deal - Value']) < 0).length;
    const future  = rows.filter(r => { const d=pdParseDate(r['Deal - Won time']); return pdValidDate(d) && d>now; }).length;
    const noPipe  = rows.filter(r => !(r['Deal - Pipeline']||'').trim()).length;
    if (wonZero) warns.push(`${wonZero} won deal(s) have no dollar value`);
    if (negVal)  warns.push(`${negVal} deal(s) have a negative value`);
    if (future)  warns.push(`${future} deal(s) have a "won" date in the future`);
    if (noPipe)  warns.push(`${noPipe} deal(s) have no pipeline set`);
  } else {
    const futureG = rows.filter(r => { const d=pdParseDate(r['Person - Date Access Granted']); return pdValidDate(d) && d>now; }).length;
    const badRange = rows.filter(r => { const g=pdParseDate(r['Person - Date Access Granted']), x=pdParseDate(r['Person - Date Access Removed']); return pdValidDate(g)&&pdValidDate(x)&&x<g; }).length;
    const noType  = rows.filter(r => !(r['Person - Customer Type']||r['Customer Type']||'').trim()).length;
    if (futureG)  warns.push(`${futureG} person(s) have an access-granted date in the future`);
    if (badRange) warns.push(`${badRange} person(s) have access removed before it was granted`);
    if (noType)   warns.push(`${noType} person(s) have no customer type`);
  }
  return warns;
}

async function handleDealsImport(input) {
  const file = input.files[0];
  if (!file) return;
  toast('Parsing deals CSV…');
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data;
      const warns = pdValidateImport(rows, 'deals');
      if (warns.length) toast('⚠ Data check: ' + warns.join(' · '), 7000);
      toast('Uploading ' + rows.length + ' deals…');
      await sb.from('liq_pipedrive_deals').delete().gte('imported_at', '1970-01-01T00:00:00Z');
      const batchSize = 100;
      for (let i = 0; i < rows.length; i += batchSize) {
        const { error } = await sb.from('liq_pipedrive_deals').insert(rows.slice(i, i + batchSize).map(r => ({ raw: r })));
        if (error) { toast('Upload error: ' + error.message); return; }
      }
      _pd_deals = pdNormaliseDeals(rows);
      _pd_deals_imported_at = new Date().toISOString();
      toast('✓ Imported ' + rows.length + ' deals');
      renderPipedrive();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}
