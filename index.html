// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
// ── PIPEDRIVE: OPTI-MAX GROWTH MODEL ────────────────────────────────────────
function renderPdOptimax(sc) {
  const OM_KEY = 'liq_optimax';
  const OM_DEF = {
    leads_curr: 50000, leads_target: 60000,
    contact_pct_target: 65,
    meeting_pct_target: 80,
    neg_pct_target: 95,
    order_pct_target: 82,
    invoice_pct_target: 90,
    won_pct_target: 90,
    upsell_pct_curr: 5, upsell_pct_target: 10,
    price_curr: 0,      price_target: 42,
    avg_lic_price: 8000,
    cycle_30d_target: 50,
    avg_cycle_target: 45,
  };

  function loadOM() { try { return {...OM_DEF,...JSON.parse(localStorage.getItem(OM_KEY)||'{}')}; } catch { return {...OM_DEF}; } }
  function saveOM(k, v) { const o=loadOM(); o[k]=parseFloat(v)||0; localStorage.setItem(OM_KEY,JSON.stringify(o)); renderPdOptimax(sc); }
  window.omSave  = saveOM;
  window.omReset = () => { localStorage.removeItem(OM_KEY); renderPdOptimax(sc); };
  window.setOmView = (v) => { activeSub.om_view = v; renderPdOptimax(sc); };
  const t = loadOM();
  const omView = activeSub.om_view || 'deals';

  // ── Pipedrive actuals (all-time) ─────────────────────────────────────────
  const sDeals = _pd_deals.filter(d => d['Deal - Pipeline']==='2026 Sales');
  const FSALL  = ['Contact Made/Discovery','Meeting Scheduled','Negotiations','Order Form Sent','Signed Order Form Returned','Invoice Sent','Payment Received'];
  const fsIdx  = Object.fromEntries(FSALL.map((s,i)=>[s,i]));
  function reached(d, idx) {
    if (d['Deal - Status']==='Won') return true;
    let stg=d['Deal - Stage']||''; if(stg==='Contact Made')stg='Contact Made/Discovery';
    const di=fsIdx[stg]; return di!=null&&di>=idx;
  }
  const fCnts  = FSALL.map((_,i) => sDeals.filter(d=>reached(d,i)).length);
  const fRates = FSALL.map((_,i) => i===0?null:(fCnts[i-1]>0?pct(fCnts[i],fCnts[i-1]):null));
  const wonAll = sDeals.filter(d=>d['Deal - Status']==='Won');

  // Open deals per stage (current snapshot)
  const openByStg = Object.fromEntries(FSALL.map(s=>[s,0]));
  sDeals.filter(d=>d['Deal - Status']==='Open').forEach(d=>{
    let stg=d['Deal - Stage']||''; if(stg==='Contact Made')stg='Contact Made/Discovery';
    if(openByStg.hasOwnProperty(stg)) openByStg[stg]++;
  });

  // Avg deal value from won deals
  const dealVals = wonAll.map(d=>parseFloat(d['Deal - Value'])||0).filter(v=>v>0);
  const avgDealVal   = dealVals.length ? Math.round(dealVals.reduce((a,b)=>a+b,0)/dealVals.length) : 8000;
  const fullPriceCnt = dealVals.filter(v=>v>=7000).length;
  const discountCnt  = dealVals.filter(v=>v>0&&v<7000).length;

  // ── (2.1) REAL average licence won cost = total $ ÷ total licences sold ──────
  // Licences per deal come from Pipedrive "Product quantity" (actual seats sold).
  // Computed from won deals that HAVE a quantity, so it reflects real prices after discounts.
  const qtyWon = wonAll.filter(d => (parseFloat(d['Deal - Product quantity'])||0) > 0);
  const totalLicencesSold = qtyWon.reduce((s,d)=>s+(parseFloat(d['Deal - Product quantity'])||0),0);
  const qtyWonValue = qtyWon.reduce((s,d)=>s+(parseFloat(d['Deal - Value'])||0),0);
  const avgLicWonCost = totalLicencesSold>0 ? Math.round(qtyWonValue/totalLicencesSold) : (t.avg_lic_price||8000);
  const licCostFromData = totalLicencesSold>0;         // true = real; false = fell back to assumption
  const avgLicPrice  = avgLicWonCost;                  // drives the licences-view estimate

  // Licence count helper: use real Product quantity where present, else estimate from value
  function dealLics(d){ const q=parseFloat(d['Deal - Product quantity'])||0; return q>0 ? q : Math.max(1, Math.round((parseFloat(d['Deal - Value'])||avgLicPrice) / avgLicPrice)); }

  // ── (2.2) Total marketing impressions (replaces "total leads reached") ───────
  const _content = load('content');
  const impContent  = _content.reduce((s,c)=>s+(c.impressions||0)+(c.ytviews||0)+(c.vivaviews||0)+(c.recipients||0),0);
  const _trk = load('weekly_tracker');
  const impLinkedIn = _trk.reduce((s,r)=>s+(liImp(r) || 0),0);
  const totalImpressions = impContent + impLinkedIn;

  // Licence counts per reached stage (all-time)
  function licsCntAtStage(idx) {
    return sDeals.filter(d=>reached(d,idx)).reduce((s,d)=>s+dealLics(d),0);
  }
  const licsCnts = FSALL.map((_,i)=>licsCntAtStage(i));
  const licsWon  = wonAll.reduce((s,d)=>s+dealLics(d),0);
  const licsRates= FSALL.map((_,i)=>i===0?null:(licsCnts[i-1]>0?pct(licsCnts[i],licsCnts[i-1]):null));

  // Sales velocity
  function cdDays(d){const c=pdParseDate(d['Deal - Deal created']),w=pdParseDate(d['Deal - Won time']);if(!pdValidDate(c)||!pdValidDate(w))return null;return Math.round((w-c)/86400000);}
  const cycleDays  = wonAll.map(cdDays).filter(v=>v!=null);
  const avgCycle   = cycleDays.length ? Math.round(cycleDays.reduce((a,b)=>a+b,0)/cycleDays.length) : null;
  const w30Cnt     = cycleDays.filter(d=>d<=30).length;
  const w30Pct     = cycleDays.length ? pct(w30Cnt,cycleDays.length) : null;

  // First deal date for rate calc
  const firstDealDt = sDeals.reduce((min,d)=>{const dt=pdParseDate(d['Deal - Deal created']);return pdValidDate(dt)&&(!min||dt<min)?dt:min;},null);
  const monthsElapsed = firstDealDt ? Math.max(1,(new Date()-firstDealDt)/(1000*60*60*24*30.44)) : 12;

  // ── Decide which view to show ─────────────────────────────────────────────
  // Deals view: deal counts. Licences view: licence counts derived from deal value.
  const isLic   = omView === 'licences';
  const currCnts= isLic ? licsCnts   : fCnts;
  const currRts = isLic ? licsRates  : fRates;
  const wonCurr = isLic ? licsWon    : wonAll.length;
  const unitLabel= isLic ? 'licences' : 'deals';

  // ── OPTI-MAX model rows ──────────────────────────────────────────────────
  // NOTE: Invoice currPct uses Order Form Sent (index 3) as denominator: not Signed OFR (index 4)
  // This avoids the 100% bug from Signed OFR → Invoice being 41/41=100%.
  const ROWS = [
    { isHdr:true, label:'STAGE 1: INCREASE LEADS & DRIVE MORE TRAFFIC' },
    { id:'leads',
      label:'Total impressions',
      desc:`${totalImpressions.toLocaleString()} marketing impressions logged · auto from content log + weekly tracker`,
      calc: '<span class="src-tag">Content log + Weekly Tracker</span><br>Total top-of-funnel reach across all logged marketing.<br><div class="calc-row">SUM(LinkedIn post impressions) + content-log (post impressions + YouTube views + Viva views + EDM recipients)</div>Content: ' + impContent.toLocaleString() + ' · LinkedIn: ' + impLinkedIn.toLocaleString() + '. Set the target impressions in the Target column.',
      currEditable:false, tgtKey:'leads_target',
      curr: totalImpressions, tgt: t.leads_target, currPct:null },
    { id:'contact',
      label:'Contact Made / Discovery',
      desc:`${currCnts[0].toLocaleString()} ${unitLabel} entered the CRM since pipeline start · live from Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals that reached the Contact Made / Discovery stage or beyond.<br><div class="calc-row">Current % = Contact Made ' + unitLabel + ' ÷ Total impressions</div>',
      currEditable:false, tgtKey:'contact_pct_target',
      curr: currCnts[0], currPct: totalImpressions>0?pct(currCnts[0],totalImpressions):null, tgtPct: t.contact_pct_target },
    { isHdr:true, label:'STAGE 2: INCREASE EFFECTIVENESS OF SALES PROCESS' },
    { id:'meeting',
      label:'Meetings Scheduled',
      desc:`${currCnts[1].toLocaleString()} ${unitLabel} progressed to meeting stage · ${openByStg['Meeting Scheduled']} deals currently open · Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals that reached Meeting Scheduled or beyond.<br><div class="calc-row">Current % = Meetings ÷ Contact Made (previous stage)</div>',
      currEditable:false, tgtKey:'meeting_pct_target',
      curr: currCnts[1], currPct: currRts[1], tgtPct: t.meeting_pct_target },
    { id:'neg',
      label:'Negotiations',
      desc:`${currCnts[2].toLocaleString()} ${unitLabel} in active negotiations · ${openByStg['Negotiations']} deals currently open · Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals that reached Negotiations or beyond.<br><div class="calc-row">Current % = Negotiations ÷ Meetings (previous stage)</div>',
      currEditable:false, tgtKey:'neg_pct_target',
      curr: currCnts[2], currPct: currRts[2], tgtPct: t.neg_pct_target },
    { id:'order',
      label:'Order Form Sent',
      desc:`${currCnts[3].toLocaleString()} ${unitLabel} with order form sent · ${openByStg['Order Form Sent']} deals currently open · Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals that reached Order Form Sent or beyond.<br><div class="calc-row">Current % = Order Form Sent ÷ Negotiations (previous stage)</div>',
      currEditable:false, tgtKey:'order_pct_target',
      curr: currCnts[3], currPct: currRts[3], tgtPct: t.order_pct_target },
    { isHdr:true, label:'STAGE 3: INCREASE SALES CONVERSIONS' },
    { id:'invoice',
      label:'Invoice Sent',
      desc:`${currCnts[5].toLocaleString()} ${unitLabel} with invoice sent · ${openByStg['Invoice Sent']} deals currently open · Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals that reached Invoice Sent or beyond.<br><div class="calc-row">Current % = Invoice Sent ÷ Order Form Sent</div>Denominator is Order Form Sent (not Signed OFR) to avoid a false 100%.',
      currEditable:false, tgtKey:'invoice_pct_target',
      curr: currCnts[5],
      currPct: currCnts[3]>0 ? pct(currCnts[5], currCnts[3]) : null,
      tgtPct: t.invoice_pct_target },
    { id:'won',
      label:'Won (Paid Subscription)',
      desc:`${wonCurr.toLocaleString()} ${unitLabel} closed as won · avg deal value ${fmtDollar(avgDealVal)} (${fullPriceCnt} full · ${discountCnt} discounted) · Pipedrive`,
      calc: '<span class="src-tag">Pipedrive · 2026 Sales</span><br>Deals with Status = Won.<br><div class="calc-row">Current % = Won ÷ Invoice Sent (previous stage)</div>',
      currEditable:false, tgtKey:'won_pct_target',
      curr: wonCurr,
      currPct: currCnts[5]>0 ? pct(wonCurr, currCnts[5]) : null,
      tgtPct: t.won_pct_target },
    { isHdr:true, label:'STAGE 4: INCREASE TRANSACTION VALUE' },
    { id:'upsell',
      label:'Upsell rate',
      desc:`${t.upsell_pct_curr}% of clients currently take additional licences · edit current below`,
      calc: '<span class="src-tag">Manual entry</span><br>Share of existing clients who take additional licences. Enter the current rate in the Current column and the target in the Target column.',
      currEditable:true, currKey:'upsell_pct_curr', currStep:1, currMax:100, isCurrPct:true,
      tgtKey:'upsell_pct_target',
      curr: null, currPct: t.upsell_pct_curr||null, tgtPct: t.upsell_pct_target },
    { id:'price',
      label:'Increase average price per licence (by reducing public sector discounts)',
      desc:`Avg licence won cost today: <b>${fmtDollar(avgLicWonCost)}</b>${licCostFromData?'':' (assumed)'} · set the price-increase target below`,
      calc: '<span class="src-tag">Pipedrive · Won Deals</span><br>Average licence won cost = total won revenue ÷ total licences sold (from Product quantity): the real average once discounts are factored in.<br><div class="calc-row">' + (licCostFromData ? fmtDollar(qtyWonValue) + ' ÷ ' + totalLicencesSold.toLocaleString() + ' licences = ' + fmtDollar(avgLicWonCost) : 'No Product quantity in the data yet: assumed ' + fmtDollar(avgLicWonCost)) + '</div>The Current / Target here are the $/licence/year price increase you aim to achieve.',
      currEditable:true, currKey:'price_curr', currStep:10, currPrefix:'$', isCurrCount:true,
      tgtKey:'price_target',
      curr: t.price_curr||0, tgt: t.price_target||0, currPct:null },
  ];

  // ── Build projections ────────────────────────────────────────────────────
  const proj = {};
  let prevProj = t.leads_target;
  for (const r of ROWS) {
    if (r.isHdr) continue;
    if      (r.id==='leads')   { proj.leads   = t.leads_target;                                  prevProj=proj.leads; }
    else if (r.id==='contact') { proj.contact = Math.round(prevProj*t.contact_pct_target/100);   prevProj=proj.contact; }
    else if (r.id==='meeting') { proj.meeting = Math.round(prevProj*t.meeting_pct_target/100);   prevProj=proj.meeting; }
    else if (r.id==='neg')     { proj.neg     = Math.round(prevProj*t.neg_pct_target/100);       prevProj=proj.neg; }
    else if (r.id==='order')   { proj.order   = Math.round(prevProj*t.order_pct_target/100);     prevProj=proj.order; }
    else if (r.id==='invoice') { proj.invoice = Math.round(prevProj*t.invoice_pct_target/100);   prevProj=proj.invoice; }
    else if (r.id==='won')     { proj.won     = Math.round(prevProj*t.won_pct_target/100);       prevProj=proj.won; }
    else proj[r.id] = null;
  }
  const projWon    = proj.won;
  const projImpPct = wonCurr>0&&projWon!=null ? Math.round((projWon-wonCurr)/wonCurr*100) : null;

  // ── Stage 5: Total Impact calculations ───────────────────────────────────
  // Per-stage uplifts (projected vs current, as %)
  const stageUpliftPairs = [
    { curr: totalImpressions, prj: t.leads_target },
    { curr: currCnts[0],   prj: proj.contact },
    { curr: currCnts[1],   prj: proj.meeting },
    { curr: currCnts[2],   prj: proj.neg },
    { curr: currCnts[3],   prj: proj.order },
    { curr: currCnts[5],   prj: proj.invoice },
    { curr: wonCurr,       prj: proj.won },
  ];
  const stageUplifts = stageUpliftPairs
    .map(x => (x.curr>0 && x.prj!=null) ? (x.prj - x.curr) / x.curr * 100 : null)
    .filter(v => v !== null);
  const avgUpliftPct     = stageUplifts.length ? stageUplifts.reduce((a,b)=>a+b,0)/stageUplifts.length : 0;
  // Cumulative = actual end-to-end improvement in won deals (leads → won, chained)
  // NOT a product of individual stage uplifts (that would double-count the chain effects)
  const cumulativeUplift = wonCurr>0 && projWon!=null ? (projWon - wonCurr) / wonCurr * 100 : 0;
  // Monthly and annual revenue
  const currRevMonth = monthsElapsed>0 ? Math.round(wonCurr / monthsElapsed * avgDealVal) : 0;
  const projRevMonth = projWon!=null   ? Math.round(projWon  / monthsElapsed * avgDealVal) : currRevMonth;
  const currRevYear  = currRevMonth * 12;
  const projRevYear  = projRevMonth * 12;

  // ── Revenue projection (36-month ARR trajectory) ─────────────────────────
  const currMoRate = wonCurr / monthsElapsed;
  const projMoRate = projWon!=null ? projWon/monthsElapsed : currMoRate;
  const proj36M    = Array.from({length:36},(_,i)=>i+1);
  const currCumARR = proj36M.map(m => currMoRate * m * avgDealVal);
  const targCumARR = proj36M.map(m => projMoRate * m * avgDealVal);
  const currARR1y  = Math.round(currCumARR[11]);
  const targARR1y  = Math.round(targCumARR[11]);
  const currARR3y  = Math.round(currCumARR[35]);
  const targARR3y  = Math.round(targCumARR[35]);
  function fmtM(v) { return v>=1000000?'$'+(v/1000000).toFixed(2)+'M':'$'+(v/1000).toFixed(0)+'k'; }

  // ── Pre-compute rows HTML: 7 columns matching reference model ──────────────
  // Columns: Stage | Current #/mo | Current % | Target #/mo | Target % | Actual % Increase | Cumulative % Increase
  const omRowsHTML = ROWS.map(r => {
    if (r.isHdr) return `<tr class="om-stage-hdr"><td colspan="7">${r.label}</td></tr>`;
    const prj = proj[r.id];

    // ── Col 2: Current # per month ──────────────────────────────────────────
    // Stage 1 (leads): editable count input
    // Upsell: editable % input (curr = rate, not a count)
    // Price: editable $ input
    // Others: Pipedrive count (read-only display)
    let currCell;
    if (r.id === 'leads') {
      currCell = `<span style="font-weight:600">${totalImpressions.toLocaleString()}</span>`;   // auto from marketing data
    } else if (r.id === 'upsell') {
      currCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input" type="number" min="0" max="100" step="1" value="${t[r.currKey]||0}" onchange="omSave('${r.currKey}',this.value)"><span style="font-size:11px;color:var(--tl)">%</span></div>`;
    } else if (r.id === 'price') {
      currCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><span style="font-size:11px;color:var(--tl)">$</span><input class="om-input" type="number" min="0" step="10" value="${t[r.currKey]||0}" onchange="omSave('${r.currKey}',this.value)"><span style="font-size:10px;color:var(--tl)">/yr</span></div>`;
    } else {
      currCell = `<span style="font-weight:500">${r.curr!=null?r.curr.toLocaleString():':'}</span>`;
    }

    // ── Col 3: Current % (conversion rate from Pipedrive) ───────────────────
    // Stage 1: no prior stage, show :
    // Upsell: upsell% is already in col 2, show: here
    // Price: no %, show :
    // Conv stages: from Pipedrive actuals
    let currPctCell;
    if (r.id === 'leads' || r.id === 'upsell' || r.id === 'price') {
      currPctCell = '<span style="color:var(--tl)">:</span>';
    } else {
      const label = r.id === 'contact' ? '<div style="font-size:9px;color:var(--tl)">of impressions</div>' : '';
      currPctCell = r.currPct!=null
        ? `<span class="conv-pct ${r.currPct>=70?'good':r.currPct>=40?'mid':'bad'}">${fmtPct(r.currPct)}</span>${label}`
        : ':';
    }

    // ── Col 4: Target # per month (computed projected count) ────────────────
    // Stage 1: editable target count input
    // Price: editable target $ per year
    // Upsell: no count target (rate-based), show :
    // Conv stages: computed projected count = proj[r.id]
    let tgtCountCell;
    if (r.id === 'leads') {
      tgtCountCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input om-input-wide" type="number" min="0" step="1000" value="${t[r.tgtKey]||0}" onchange="omSave('${r.tgtKey}',this.value)"></div>`;
    } else if (r.id === 'price') {
      tgtCountCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><span style="font-size:11px;color:var(--tl)">$</span><input class="om-input" type="number" min="0" step="10" value="${t[r.tgtKey]||0}" onchange="omSave('${r.tgtKey}',this.value)"><span style="font-size:10px;color:var(--tl)">/yr</span></div>`;
    } else if (r.id === 'upsell') {
      tgtCountCell = '<span style="color:var(--tl)">:</span>';
    } else {
      tgtCountCell = `<span style="font-weight:600;color:var(--gr)">${prj!=null?prj.toLocaleString():':'}</span>`;
    }

    // ── Col 5: Target % (editable input) ────────────────────────────────────
    // Stage 1, Price: no conversion %, show :
    // Conv stages + upsell: editable % input
    let tgtPctCell;
    if (r.id === 'leads' || r.id === 'price') {
      tgtPctCell = '<span style="color:var(--tl)">:</span>';
    } else {
      const step = r.id === 'upsell' ? (r.currStep||1) : 1;
      tgtPctCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input" type="number" min="0" max="100" step="${step}" value="${r.tgtPct||0}" onchange="omSave('${r.tgtKey}',this.value)"><span style="font-size:11px;color:var(--tl)">%</span></div>`;
    }

    // ── Col 6: Actual % Increase ─────────────────────────────────────────────
    // Stage 1: (target_count - curr_count) / curr_count × 100 (relative change in volume)
    // Conv stages: target_pct - current_pct (absolute pp improvement in conversion rate)
    // Upsell: target_pct - curr_pct
    // Price: (target_$ - curr_$) relative to avg deal value
    let actualPct;
    if (r.id === 'leads') {
      actualPct = totalImpressions > 0 ? +((t.leads_target - totalImpressions) / totalImpressions * 100).toFixed(1) : null;
    } else if (r.id === 'upsell') {
      actualPct = +((t.upsell_pct_target||0) - (t.upsell_pct_curr||0)).toFixed(1);
    } else if (r.id === 'price') {
      actualPct = avgDealVal > 0 && (t.price_target||0) > 0 ? +((t.price_target - (t.price_curr||0)) / avgDealVal * 100).toFixed(1) : null;
    } else {
      // Absolute pp improvement in conversion rate (target% - current%)
      actualPct = (r.currPct != null && r.tgtPct != null) ? +((r.tgtPct||0) - r.currPct).toFixed(1) : null;
    }
    const actualHTML = actualPct != null
      ? `<span class="conv-pct ${actualPct>=0?'good':'bad'}">${actualPct>=0?'+':''}${actualPct}%</span>`
      : ':';

    // ── Col 7: Cumulative % Increase ─────────────────────────────────────────
    // Stage 1: same as actual% (first stage, no prior chain)
    // Conv stages: (proj_count_at_stage - curr_count_at_stage) / curr_count_at_stage × 100
    //   This shows the compound chain effect: more leads AND better conversion
    // Upsell, Price:: (multiplicative revenue effects, not part of the chain count)
    let cumulativePct;
    if (r.id === 'leads') {
      cumulativePct = actualPct;
    } else if (r.id === 'upsell' || r.id === 'price') {
      cumulativePct = null;
    } else {
      const currBase = r.id === 'won' ? wonCurr : r.curr;
      cumulativePct = (currBase > 0 && prj != null) ? +((prj - currBase) / currBase * 100).toFixed(1) : null;
    }

      ? `<span class="conv-pct ${cumulativePct>=0?'good':'bad'}">${cumulativePct>=0?'+':''}${cumulativePct}%</span>`
      : ':';

    return `<tr>
      <td><div style="font-weight:500;display:flex;align-items:center;gap:2px;flex-wrap:wrap">${r.label}${r.calc?infoBtn(r.label, r.calc):''}</div>${r.desc?`<div style="font-size:11px;color:var(--tl);margin-top:2px">${r.desc}</div>`:''}</td>

      <td style="text-align:right">${currPctCell}</td>
      <td style="text-align:right">${tgtCountCell}</td>
      <td style="text-align:right">${tgtPctCell}</td>
      <td style="text-align:right">${actualHTML}</td>
      <td style="text-align:right">${cumulativeHTML}</td>
    </tr>`;
  }).join('');

  // ── Stage 5 TOTAL IMPACT rows ─────────────────────────────────────────────
  const cumUpliftDisp = cumulativeUplift.toFixed(1);
  const omStage5HTML = `
    <tr class="om-stage-hdr"><td colspan="7" style="background:#0d2b45">STAGE 5: TOTAL IMPACT &amp; COMBINED UPLIFT EFFECT</td></tr>
    <tr style="background:#f0f7ff">
      <td>
        <div style="font-weight:600;color:var(--navy)">Total Revenue Per Month</div>

      <td style="text-align:right">:</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">+${fmtDollar(projRevMonth - currRevMonth)}<span style="font-size:10px;color:var(--tl)">/mo</span></td>
      <td style="text-align:right"><span class="conv-pct ${cumulativeUplift>=0?'good':'bad'}">${cumulativeUplift>=0?'+':''}${cumUpliftDisp}%</span><div style="font-size:9px;color:var(--tl)">cumulative</div></td>
    </tr>
    <tr style="background:#f0f7ff;border-top:1px solid #dce7f0">
      <td>
        <div style="font-weight:600;color:var(--navy)">Annual Revenue</div>
        <div style="font-size:11px;color:var(--tl);margin-top:2px">Monthly rate × 12 · assumes constant win rate</div>
      </td>
      <td style="text-align:right;font-weight:600">${fmtDollar(currRevYear)}</td>
      <td style="text-align:center;color:var(--tl)">→</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">${fmtDollar(projRevYear)}</td>
      <td style="text-align:right">:</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">+${fmtDollar(projRevYear - currRevYear)}<span style="font-size:10px;color:var(--tl)">/yr</span></td>
      <td style="text-align:right"><span class="conv-pct ${cumulativeUplift>=0?'good':'bad'}">${cumulativeUplift>=0?'+':''}${cumUpliftDisp}%</span><div style="font-size:9px;color:var(--tl)">cumulative</div></td>
    </tr>`;

  // ── Render ────────────────────────────────────────────────────────────────
  sc.innerHTML = `
  <div class="box">

      <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:auto">

      </span>
    </div>
    <p style="font-size:12px;color:var(--tm);margin-bottom:12px;line-height:1.5">
      Small % improvements at each stage <strong>compound</strong> into significantly more won ${unitLabel} <strong>per month</strong>.
      Stage 1 (leads) and targets are set per-month. Stages 2–3 conversion rates are live from Pipedrive all-time data.
      <span style="color:var(--acc);font-weight:500">Blue input fields</span> are editable: projections update instantly.
    </p>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <span style="font-size:12px;font-weight:500;color:var(--navy)">View as:</span>
      <div class="range-toggle">
        <button class="range-btn${!isLic?' active':''}" onclick="setOmView('deals')">Deals</button>
        <button class="range-btn${isLic?' active':''}" onclick="setOmView('licences')">Licences</button>
      </div>
      ${isLic ? `<span style="font-size:11px;color:var(--tl)">Licences = Product quantity where recorded, else deal value ÷ ${licCostFromData ? '<b>'+fmtDollar(avgLicWonCost)+'</b> (real avg from data)' : 'fallback price below'}</span>
        ${licCostFromData ? '' : `<div style="display:flex;align-items:center;gap:4px;margin-left:8px">
          <span style="font-size:11px;color:var(--tl)">Fallback lic price: $</span>
          <input class="om-input" style="width:72px" type="number" min="100" step="500" value="${t.avg_lic_price||8000}" onchange="omSave('avg_lic_price',this.value)">
        </div>`}` : ''}
    </div>

    <div class="cards" style="margin-bottom:18px">
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Won ${unitLabel} (all time)${infoBtn('Won '+unitLabel,'<span class="src-tag">Pipedrive · 2026 Sales</span><br>Count of '+unitLabel+' with Status = Won.<br><div class="calc-row">'+(isLic?'SUM(Product quantity of won deals)':'COUNT(Won deals)')+'</div>')}</div><div class="card-value">${wonCurr}</div><div class="card-sub">2026 Sales pipeline</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Avg licence won cost${infoBtn('Average licence won cost','<span class="src-tag">Pipedrive · Won Deals</span><br>The real average price per licence once discounts are factored in.<br><div class="calc-row">Total won revenue ÷ total licences sold (Product quantity)<br>'+(licCostFromData?fmtDollar(qtyWonValue)+' ÷ '+totalLicencesSold.toLocaleString()+' = '+fmtDollar(avgLicWonCost):'no Product quantity yet: assumed')+'</div>')}</div><div class="card-value">${fmtDollar(avgLicWonCost)}</div><div class="card-sub">${licCostFromData?totalLicencesSold.toLocaleString()+' licences sold':'assumed: add Product quantity'}</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Projected won / month${infoBtn('Projected won / month','<span class="src-tag">Calculated</span><br>Won '+unitLabel+' per month if every target conversion rate is hit.<br><div class="calc-row">Target impressions × chained target % at each stage</div>')}</div><div class="card-value" style="color:var(--gr)">${projWon??':'}</div>${projImpPct!=null?`<div class="card-sub" style="color:var(--gr)">+${projImpPct}% improvement</div>`:''}</div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Revenue / month (current)${infoBtn('Revenue / month (current)','<span class="src-tag">Pipedrive · Won Deals</span><br>Current won run-rate × average deal value.<br><div class="calc-row">(Won deals ÷ months since first deal) × avg deal value ('+fmtDollar(avgDealVal)+')</div>')}</div><div class="card-value">${fmtDollar(currRevMonth)}</div><div class="card-sub">${fmtDollar(currRevYear)}/yr at current rate</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Revenue / month (target)${infoBtn('Revenue / month (target)','<span class="src-tag">Calculated</span><br>Projected won run-rate × average deal value.<br><div class="calc-row">(Projected won ÷ months) × avg deal value</div>')}</div><div class="card-value" style="color:var(--gr)">${fmtDollar(projRevMonth)}</div><div class="card-sub" style="color:var(--gr)">+${fmtDollar(projRevMonth-currRevMonth)}/mo uplift</div></div>
    </div>

    <div style="overflow-x:auto">
      <table class="om-table">
        <thead><tr>
          <th style="min-width:240px">Stage</th>
          <th style="text-align:right;min-width:90px">Current #<div style="font-size:10px;font-weight:400;color:var(--tl)">per month</div></th>
          <th style="text-align:right;min-width:70px">Current %<div style="font-size:10px;font-weight:400;color:var(--tl)">conv rate</div></th>

  </div>

  <!-- Revenue projection chart -->
  <div class="box">
    <div class="box-title">Revenue trajectory: current vs OPTI-MAX target (3-year projection)</div>
    <p style="font-size:12px;color:var(--tm);margin-bottom:12px;line-height:1.5">
      Cumulative annual contract value: ${currMoRate.toFixed(1)} won ${unitLabel}/month (current) vs ${projMoRate.toFixed(1)}/month (target).
      Annual licence at avg ${fmtDollar(avgDealVal)} · 0% churn assumption.
    </p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      <div class="card" style="margin:0"><div class="card-label">Year 1 · current</div><div class="card-value" style="font-size:20px">${fmtM(currARR1y)}</div></div>
      <div class="card" style="margin:0"><div class="card-label">Year 1 · target</div><div class="card-value" style="font-size:20px;color:var(--gr)">${fmtM(targARR1y)}</div><div class="card-sub" style="color:var(--gr)">+${fmtM(targARR1y-currARR1y)}</div></div>
      <div class="card" style="margin:0"><div class="card-label">Year 3 · current</div><div class="card-value" style="font-size:20px">${fmtM(currARR3y)}</div></div>

          </div>

        <div class="chart-wrap" style="height:130px"><canvas id="pd-om-velcyc"></canvas></div>
      </div>

  // Revenue line chart
  const moLabels = proj36M.map(m => [1,6,12,18,24,30,36].includes(m) ? (m===12?'Yr 1':m===24?'Yr 2':m===36?'Yr 3':'Mo '+m) : '');

  // Velocity charts
  makeChart('pd-om-vel30', {

      datasets:[{ data:[w30Pct??0, t.cycle_30d_target],

    }
  });
  const maxCB = Math.max((avgCycle||0), t.avg_cycle_target) * 1.3;
  makeChart('pd-om-velcyc', {
    type:'bar',
    data:{ labels:['Actual','Target'],
      datasets:[{ data:[avgCycle??0, t.avg_cycle_target],
        backgroundColor:[avgCycle!=null&&avgCycle<=t.avg_cycle_target?'#2a7a4b':'#2e8bc0','rgba(196,94,0,0.25)'],
        borderColor:[avgCycle!=null&&avgCycle<=t.avg_cycle_target?'#2a7a4b':'#2e8bc0','#c25a00'],
        borderWidth:2, borderRadius:4 }]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>' '+ctx.raw+' days' }} },
      scales:{ x:{ grid:gridStyle, ticks:{...axStyle,callback:v=>v+'d'}, min:0, max:Math.ceil(maxCB) }, y:{grid:{display:false},ticks:axStyle} }
    }
  });
}

// ── CUSTOMER HEALTH SCORE ─────────────────────────────────────────────────────
function renderPdHealth(sc) {
  const people  = _pd_people;
  const deals   = _pd_deals;
  const training = load('training');   // [{ org, date, ... }]
  const ph      = _ph;

  if (!people.length) {
    sc.innerHTML = `<div class="empty-state"><p>No Pipedrive people data loaded. Import a People CSV first.</p></div>`;
    return;
  }

  // ── Build per-org metrics ──────────────────────────────────────────────
  // Group paid subscribers by org
  const paidPeople = people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
  const orgMap = {};   // org → { people[], licenceType, accessDate, trained, dealValue }

  for (const p of paidPeople) {
    const org = (p['Person - Organisation'] || 'Unknown').trim();
    if (!orgMap[org]) orgMap[org] = { people:[], trained:0, dealValue:0, accessDate:null };
    orgMap[org].people.push(p);
    const ad = pdParseDate(p['Person - Date Access Granted']);
    if (ad && (!orgMap[org].accessDate || ad > orgMap[org].accessDate)) orgMap[org].accessDate = ad;
  }

  // Add deal values
  const now = new Date();
  for (const d of deals) {
    if (d['Deal - Status'] !== 'Won') continue;
    const org = (d['Person - Organisation'] || d['Deal - Organisation'] || '').trim();
    if (orgMap[org]) orgMap[org].dealValue += (parseFloat(d['Deal - Value']) || 0);
  }

  // Training events: count per org
  const trainedOrgs = {};
  for (const t of training) {
    const org = (t.org || t.organisation || '').trim();
    if (org) trainedOrgs[org] = (trainedOrgs[org] || 0) + 1;
  }

  // PostHog at-risk lookup (distinct_id often matches email)
  const atRiskSet = new Set((ph.atRisk || []).map(u => u.distinct_id?.toLowerCase()));
  const powerSet  = new Set((ph.powerUsers   || []).map(u => u.distinct_id?.toLowerCase()));

  // Full per-email usage map (best source): available once posthog_add_emails.sql
  // has been run and the sync has refilled the summaries.
  const emailAct = {};   // email → { last_seen: Date, active_days }
  (ph.emailActivity || []).forEach(r => {
    if (!r.email) return;
    const ls = new Date(r.last_seen);
    emailAct[r.email.toLowerCase()] = { last_seen: isNaN(ls) ? null : ls, active_days: Number(r.active_days) || 0 };
  });
  const hasEmailAct = Object.keys(emailAct).length > 0;

  // ── Usage-match reliability check (#6) ──────────────────────────────────
  const allCustEmails = [...new Set(paidPeople.map(p => (p['Person - Email'] || p['Email'] || '').toLowerCase()).filter(Boolean))];
  let matchVerdict, custEmailsMatched, knownPhIds = [];
  if (hasEmailAct) {
    // Direct measurement: how many customer emails appear in the usage data
    custEmailsMatched = allCustEmails.filter(e => emailAct[e]).length;
    const sharePct = allCustEmails.length ? Math.round(custEmailsMatched / allCustEmails.length * 100) : null;
    knownPhIds = Object.keys(emailAct);
    matchVerdict = sharePct == null
      ? { col:'var(--tl)', txt:'No customer emails found in the sales records: export the People CSV with the email column.' }
      : sharePct >= 40
        ? { col:'var(--gr)', txt:`${sharePct}% of paying customers matched to their product usage (${custEmailsMatched} of ${allCustEmails.length}). The activity column below is measured, not guessed.` }
        : { col:'var(--wa)', txt:`Only ${sharePct}% of paying customers matched to usage data (${custEmailsMatched} of ${allCustEmails.length}): many product accounts don't use their work email. Matched orgs are measured; unmatched orgs show "unknown".` };
  } else {
    // Fallback: only at-risk + power user IDs are available: check if they look like emails
    knownPhIds = [...new Set([...atRiskSet, ...powerSet])].filter(Boolean);
    const phIdsLookLikeEmail = knownPhIds.filter(id => id.includes('@')).length;
    const phEmailShare = knownPhIds.length ? Math.round(phIdsLookLikeEmail / knownPhIds.length * 100) : null;
    custEmailsMatched = allCustEmails.filter(e => atRiskSet.has(e) || powerSet.has(e)).length;
    matchVerdict = phEmailShare == null
      ? { col:'var(--tl)', txt:'No product-usage IDs loaded yet: load the Activity data to check.' }
      : { col:'var(--wa)', txt:`Approximate matching only. Run posthog_add_emails.sql then re-run the sync to enable full email matching (currently ${phEmailShare}% of the limited ID sample look like emails).` };
  }

  // ── Score each org ─────────────────────────────────────────────────────
  // Scoring dimensions (100 pts total):
  //   Licence size  (25): 1 user=5, 2-5=12, 6-15=20, 16+=25
  //   Tenure        (20): months since access date (capped at 24m → 20pts)
  //   Training      (20): any training event → 10, 2+ → 15, 3+ → 20
  //   Deal value    (15): >$0 → 5, >$5k → 10, >$20k → 15
  //   PostHog usage (20): power user in org → 20, no at-risk → 12, at-risk → 0
  const orgs = [];
  for (const [org, m] of Object.entries(orgMap)) {
    const n = m.people.length;

    // Licence size
    let scoreSize = n >= 16 ? 25 : n >= 6 ? 20 : n >= 2 ? 12 : 5;

    // Tenure
    let scoreTenure = 0;
    if (m.accessDate) {
      const months = (now - m.accessDate) / (1000 * 60 * 60 * 24 * 30.44);
      scoreTenure = Math.min(20, Math.round((months / 24) * 20));
    }

    // Training
    const tCount = trainedOrgs[org] || 0;
    const scoreTrain = tCount >= 3 ? 20 : tCount >= 2 ? 15 : tCount >= 1 ? 10 : 0;

    // Deal value
    const scoreVal = m.dealValue >= 20000 ? 15 : m.dealValue >= 5000 ? 10 : m.dealValue > 0 ? 5 : 0;

    // Product usage: measured per org where email matching is available
    const orgEmails = m.people.map(p => (p['Person - Email'] || p['Email'] || '').toLowerCase()).filter(Boolean);
    let scorePH, lastUsed = null;
    if (hasEmailAct) {
      // Most recent activity across the org's matched users
      const acts = orgEmails.map(e => emailAct[e]).filter(Boolean);
      if (acts.length) {
        lastUsed = acts.reduce((mx, a) => (a.last_seen && (!mx || a.last_seen > mx) ? a.last_seen : mx), null);
        const daysQuiet = lastUsed ? Math.floor((now - lastUsed) / 86400000) : null;
        scorePH = daysQuiet == null ? 10
                : daysQuiet <= 14 ? 20      // used in the last fortnight
                : daysQuiet <= 30 ? 14      // used in the last month
                : daysQuiet <= 90 ? 6       // going quiet
                : 2;                        // effectively dormant
      } else {
        scorePH = 10;                       // no matched users → unknown
      }
    } else {
      // Fallback: only power/at-risk ID lists available
      const hasPower  = orgEmails.some(e => powerSet.has(e));
      const hasAtRisk = orgEmails.some(e => atRiskSet.has(e));
      scorePH = hasPower ? 20 : hasAtRisk ? 0 : 12;
    }

    const total = scoreSize + scoreTenure + scoreTrain + scoreVal + scorePH;

    orgs.push({ org, n, total, scoreSize, scoreTenure, scoreTrain, scoreVal, scorePH, lastUsed,
      accessDate: m.accessDate, dealValue: m.dealValue, tCount });
  }

  orgs.sort((a, b) => b.total - a.total);

  // ── Bands ──────────────────────────────────────────────────────────────
  const healthy  = orgs.filter(o => o.total >= 70);
  const atRisk   = orgs.filter(o => o.total >= 40 && o.total < 70);
  const critical = orgs.filter(o => o.total < 40);

  const avgScore = orgs.length ? Math.round(orgs.reduce((s,o)=>s+o.total,0)/orgs.length) : 0;

  function scoreBar(v) {
    const col = v >= 70 ? '#2a7a4b' : v >= 40 ? '#e6a817' : '#e05252';
    return `<div style="display:flex;align-items:center;gap:6px;">
      <div style="flex:1;height:6px;background:#eee;border-radius:3px;">
        <div style="width:${v}%;height:100%;background:${col};border-radius:3px;"></div>
      </div>
      <span style="font-size:12px;font-weight:600;color:${col};min-width:28px;">${v}</span>
    </div>`;
  }

  function dimBar(v, max, col) {
    return `<div style="width:${Math.round((v/max)*100)}%;height:4px;background:${col};border-radius:2px;"></div>`;
  }

  const rowsHTML = orgs.map(o => `
    <tr>
      <td style="font-weight:500;">${o.org}</td>
      <td style="text-align:center;">${o.n}</td>
      <td style="min-width:120px;">${scoreBar(o.total)}</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreSize>=20?'#2a7a4b':o.scoreSize>=12?'#555':'#e05252'}">${o.scoreSize}/25</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreTenure>=15?'#2a7a4b':o.scoreTenure>=8?'#555':'#e05252'}">${o.scoreTenure}/20</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreTrain>=15?'#2a7a4b':o.scoreTrain>=10?'#555':'#e05252'}">${o.scoreTrain}/20</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreVal>=10?'#2a7a4b':o.scoreVal>=5?'#555':'#e05252'}">${o.scoreVal}/15</td>
      <td style="text-align:center;font-size:11px;color:${o.scorePH>=15?'#2a7a4b':o.scorePH>=10?'#555':'#e05252'}">${o.scorePH}/20${o.lastUsed?`<br><span style="color:var(--tl);font-size:10px">${fmtDate(o.lastUsed).slice(0,6)}</span>`:''}</td>
      <td style="text-align:center;font-size:11px;">${o.tCount || ':'}</td>
      <td style="text-align:center;font-size:11px;">${o.accessDate ? fmtDate(o.accessDate).slice(0,6) : ':'}</td>
      <td style="text-align:right;font-size:11px;">${o.dealValue ? fmtCur(o.dealValue) : ':'}</td>
    </tr>`).join('');

  sc.innerHTML = `
    <div class="section-block">
      <h3>Customer Health Score ${infoBtn('Customer Health Score',
        `<p>Composite 0–100 score per paying organisation based on five dimensions:</p>
        <div class="calc-row">Licence size (25) + Tenure (20) + Training (20) + Deal value (15) + PostHog usage (20)</div>
        <p><b>Green ≥ 70</b> · <b>Amber 40–69</b> · <b>Red &lt; 40</b></p>
        <p>PostHog matching uses email address. Orgs with no PostHog data receive 12/20 (unknown).</p>
        <span class="src-tag">Pipedrive People + Deals · Training log · PostHog at-risk / power users</span>`)}</h3>
      ${cardsHTML([
        ['Avg health score', avgScore, null, null, `across ${orgs.length} orgs`],
        ['Healthy orgs (≥70)', healthy.length, null, null, `${fmtPct(pct(healthy.length, orgs.length))} of total`],
        ['At-risk orgs (40–69)', atRisk.length, null, null, null],
        ['Critical orgs (<40)', critical.length, null, null, null],
      ])}
      <div style="margin-top:12px;padding:10px 14px;border-left:3px solid ${matchVerdict.col};background:var(--bg2);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tm)">
        <b style="color:${matchVerdict.col}">Product-usage match reliability:</b> ${matchVerdict.txt}
        ${knownPhIds.length ? `<br><span style="color:var(--tl)">${custEmailsMatched} of ${allCustEmails.length} customer emails matched a known active/at-risk user · ${knownPhIds.length} usage IDs checked</span>` : ''}
      </div>
    </div>

    <div class="section-block">
      <h3>Score distribution</h3>
      <div class="chart-wrap" style="height:220px"><canvas id="pd-health-dist"></canvas></div>
    </div>

    <div class="section-block">
      <h3>All paying orgs: ranked by health score</h3>
      <div style="overflow-x:auto;">
        <table class="data-table" style="font-size:12px;">
          <thead><tr>
            <th>Organisation</th>
            <th style="text-align:center;">Users</th>
            <th>Score</th>
            <th style="text-align:center;">Licence</th>
            <th style="text-align:center;">Tenure</th>
            <th style="text-align:center;">Training</th>
            <th style="text-align:center;">Deal $</th>
            <th style="text-align:center;">Activity</th>
            <th style="text-align:center;">Sessions</th>
            <th style="text-align:center;">Since</th>
            <th style="text-align:right;">Revenue est.</th>
          </tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>`;

  // Score distribution histogram
  const bands = [
    { label:'0–19',   col:'#e05252', count: orgs.filter(o=>o.total<20).length },
    { label:'20–39',  col:'#f08080', count: orgs.filter(o=>o.total>=20&&o.total<40).length },
    { label:'40–59',  col:'#e6a817', count: orgs.filter(o=>o.total>=40&&o.total<60).length },
    { label:'60–69',  col:'#a0c050', count: orgs.filter(o=>o.total>=60&&o.total<70).length },
    { label:'70–84',  col:'#2a7a4b', count: orgs.filter(o=>o.total>=70&&o.total<85).length },
    { label:'85–100', col:'#1a5c36', count: orgs.filter(o=>o.total>=85).length },
  ];
  makeChart('pd-health-dist', {
    type:'bar',
    data:{ labels: bands.map(b=>b.label), datasets:[{ label:'Orgs', data: bands.map(b=>b.count), backgroundColor: bands.map(b=>b.col), borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ grid:{display:false}, ticks:axStyle }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
    }
  });
}

function updateDbStatusPill() {
  const dot  = document.getElementById('db-status-dot');
  const text = document.getElementById('db-status-text');
  if (!dot || !text) return;
  if (_dbStatus.ok) {
    dot.style.background  = '#2a7a4b';
    text.textContent = `DB · ${_dbStatus.deals} deals · ${_dbStatus.dashboardRows} keys`;
    document.getElementById('db-status-pill').title =
      `Connected · ${_dbStatus.deals} deals · ${_dbStatus.people} contacts · ${_dbStatus.dashboardRows} data keys · checked ${_dbStatus.checkedAt?.toLocaleTimeString()}`;
  } else {
    dot.style.background  = '#e05252';
    text.textContent = 'DB offline';
    document.getElementById('db-status-pill').title =
      `Error: ${_dbStatus.error || 'unknown'} · Run supabase_harden.sql if RLS issue`;
  }
}

async function init() {
  await loadAll();
  await loadMetricFlags();
  await loadHiddenMetrics();
  updateDbStatusPill();
  buildNav();
  startFlagObserver();
  renderTab('home');
  // Load PostHog live data in background (non-blocking)
  loadPostHogLive().then(() => {
    // If user is on Activity tab, refresh it with live data
    if (activeTab === 'activity') renderActivity();
  });
}
