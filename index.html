        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{
            legend:{ position:'bottom', labels:{font:{family:'DM Sans',size:11},boxWidth:12} },
            datalabels:{ display:false }
          },
          scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
        }
      });
      // Funnel visual is now rendered via HTML/CSS in sc.innerHTML (no canvas needed)
    }
    // Velocity: cycle distribution
    makeChart('pd-cycle-dist', {
      type:'bar',
      data:{ labels:CYCLE_BKTS.map(b=>b.lbl), datasets:[{label:'Won deals', data:cycleDistrib.map(b=>b.count), backgroundColor:'#2e8bc0', borderRadius:3}] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
      }
    });
    makeChart('pd-vel-month', {
      type:'line',
      data:{ labels:months12.map(m=>monthLabel(m)), datasets:[
        {label:'% won ≤30d', data:months12.map(m=>within30ByMo[m]), borderColor:'#2e8bc0', borderWidth:2, tension:.3, pointRadius:3, fill:false, spanGaps:true},
        {label:`Target ${velTarget30}%`, data:months12.map(()=>velTarget30), borderColor:'#c25a00', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false},
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'bottom', labels:{font:{family:'DM Sans',size:11},boxWidth:12}} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:{...axStyle,callback:v=>v+'%'},min:0,max:100} }
      }
    });
    // Pipeline stage snapshot — stacked bar showing Open/Won/Lost per stage
    makeChart('pd-stage-snap', {
      type:'bar',
      data:{ labels:SALES_STAGES.map(s=>s.length>22?s.slice(0,22)+'…':s), datasets:[
        {label:'Open',  data:SALES_STAGES.map(s=>stageByStatus.open[s]||0),  backgroundColor:'#2e8bc0', borderRadius:2},
        {label:'Won',   data:SALES_STAGES.map(s=>stageByStatus.won[s]||0),   backgroundColor:'#2a7a4b', borderRadius:2},
        {label:'Lost',  data:SALES_STAGES.map(s=>stageByStatus.lost[s]||0),  backgroundColor:'#c0392b', borderRadius:2},
      ]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{stacked:false, grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true}, y:{grid:{display:false},ticks:{...axStyle,font:{family:'DM Sans',size:10}}} }
      }
    });
  }
}

// ── PIPEDRIVE: CHURN ─────────────────────────────────────────────────────────
function renderPdChurn(sc) {
  const range       = pdGetRange();
  const rangeMonths = pdRangeMonths(range);
  const today       = new Date();

  // ── SEGMENT PEOPLE ────────────────────────────────────────────────────────────
  // Revenue churn: were Paid Subscription, now Access Revoked
  const revChurned = _pd_people.filter(p =>
    p['Person - Customer Type'] === 'Access Revoked' &&
    (p['Person - Previous Customer Type'] || '').includes('Paid Subscription')
  );
  // Trial churn: were any trial type, now Access Revoked (non-conversion)
  const trialChurned = _pd_people.filter(p =>
    p['Person - Customer Type'] === 'Access Revoked' &&
    isTrialType(p['Person - Previous Customer Type']) &&
    !(p['Person - Previous Customer Type'] || '').includes('Paid Subscription')
  );
  // All churned
  const allChurned = _pd_people.filter(p => p['Person - Customer Type'] === 'Access Revoked');
  // Active paid (for churn rate denominator)
  const everPaid   = _pd_people.filter(p =>
    p['Person - Customer Type'] === 'Paid Subscription' ||
    (p['Person - Customer Type'] === 'Access Revoked' &&
     (p['Person - Previous Customer Type'] || '').includes('Paid Subscription'))
  );

  // ── TENURE CALCULATION ────────────────────────────────────────────────────────
  // Avg days from Date Access Granted → Date Access Removed for revenue churned
  const tenures = revChurned.map(p => {
    const g = pdParseDate(p['Person - Date Access Granted']);
    const r = pdParseDate(p['Person - Date Access Removed']);
    if (!pdValidDate(g) || !pdValidDate(r)) return null;
    return Math.round((r - g) / 86400000);
  }).filter(v => v !== null && v > 0);
  const avgTenureDays  = tenures.length ? Math.round(tenures.reduce((a,b)=>a+b,0) / tenures.length) : null;
  const avgTenureMonths = avgTenureDays ? Math.round(avgTenureDays / 30.4) : null;

  // ── CHURN RATE ────────────────────────────────────────────────────────────────
  const overallChurnRate = everPaid.length ? pct(revChurned.length, everPaid.length) : null;

  // ── CHURN BY MONTH (range-filtered, by Date Access Removed) ──────────────────
  const revChurnByMonth   = {};
  const trialChurnByMonth = {};
  allChurned.forEach(p => {
    const dt = pdParseDate(p['Person - Date Access Removed']);
    if (!pdValidDate(dt)) return;
    if (!pdInRange(p['Person - Date Access Removed'], range)) return;
    const k = monthKey(dt.toISOString());
    const isRev = (p['Person - Previous Customer Type'] || '').includes('Paid Subscription');
    if (isRev) revChurnByMonth[k] = (revChurnByMonth[k] || 0) + 1;
    else       trialChurnByMonth[k] = (trialChurnByMonth[k] || 0) + 1;
  });

  // ── NEW PAID BY MONTH (for net chart) ────────────────────────────────────────
  const newPaidByMonth = {};
  _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription' ||
    ((p['Person - Previous Customer Type'] || '').includes('Paid Subscription'))
  ).forEach(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    if (!pdValidDate(dt) || !pdInRange(p['Person - Date Access Granted'], range)) return;
    const k = monthKey(dt.toISOString());
    newPaidByMonth[k] = (newPaidByMonth[k] || 0) + 1;
  });

  // ── CHURN BY ORG (all time revenue churn) ────────────────────────────────────
  const churnByOrg = {};
  revChurned.forEach(p => {
    const o = p['Person - Organisation'] || 'Unknown';
    churnByOrg[o] = (churnByOrg[o] || 0) + 1;
  });
  const topChurnOrgs = Object.entries(churnByOrg)
    .filter(([k]) => k !== 'Unknown')
    .sort((a,b) => b[1]-a[1]).slice(0, 12);

  // ── TENURE BUCKETS ────────────────────────────────────────────────────────────
  const TEN_BKTS = [
    { lbl:'< 1 mo',  lo:0,   hi:30   },
    { lbl:'1–3 mo',  lo:30,  hi:90   },
    { lbl:'3–6 mo',  lo:90,  hi:180  },
    { lbl:'6–12 mo', lo:180, hi:365  },
    { lbl:'1–2 yr',  lo:365, hi:730  },
    { lbl:'2 yr+',   lo:730, hi:Infinity },
  ];
  const tenureBuckets = TEN_BKTS.map(b => tenures.filter(d => d >= b.lo && d < b.hi).length);

  // ── PREVIOUS CUSTOMER TYPE BREAKDOWN ─────────────────────────────────────────
  const prevTypeBreakdown = {};
  allChurned.forEach(p => {
    const t = p['Person - Previous Customer Type'] || 'Unknown';
    // Simplify multi-value: take last value
    const last = t.split(',').map(s=>s.trim()).filter(Boolean).pop() || 'Unknown';
    prevTypeBreakdown[last] = (prevTypeBreakdown[last] || 0) + 1;
  });
  const prevTypeEntries = Object.entries(prevTypeBreakdown).sort((a,b)=>b[1]-a[1]);

  // ── PERIOD SUMMARY ────────────────────────────────────────────────────────────
  const periodRevChurn   = Object.values(revChurnByMonth).reduce((a,b)=>a+b,0);
  const periodTrialChurn = Object.values(trialChurnByMonth).reduce((a,b)=>a+b,0);

  sc.innerHTML = `
    ${!_pd_people.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive people CSV first.</div></div>' : ''}

    <div class="cards" style="margin-bottom:18px">
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Revenue churned (all time)${infoBtn('Revenue churned','<span class="src-tag">Pipedrive · People</span><br>People with <b>Customer Type = "Access Revoked"</b> AND <b>Previous Customer Type includes "Paid Subscription"</b>. These are former paying customers who lost access.<br><div class="calc-row">Customer Type = "Access Revoked" AND Previous Type ∋ "Paid Subscription"</div>')}</div>
        <div class="card-value" style="color:var(--re)">${revChurned.length}</div>
        <div class="card-sub">of ${everPaid.length} ever-paid users</div>
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Overall churn rate${infoBtn('Overall churn rate','<span class="src-tag">Pipedrive · People</span><br>Revenue churned ÷ total people who ever held a Paid Subscription. All-time figure — not annualised.<br><div class="calc-row">Revenue churned / (Active paid + Revenue churned)</div>')}</div>
        ${overallChurnRate != null
          ? `<div class="card-value" style="color:${overallChurnRate>30?'var(--re)':overallChurnRate>15?'#c25a00':'var(--gr)'}">${fmtPct(overallChurnRate)}</div><div class="card-sub">all-time · not annualised</div>`
          : '<div class="card-nodata">no data</div>'}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Avg tenure before churn${infoBtn('Avg tenure before churn','<span class="src-tag">Pipedrive · People</span><br>Average days between <b>Date Access Granted</b> and <b>Date Access Removed</b> for revenue-churned people.<br><div class="calc-row">avg(Date Access Removed − Date Access Granted) for Revenue Churned</div>')}</div>
        ${avgTenureMonths != null
          ? `<div class="card-value">${avgTenureMonths} mo</div><div class="card-sub">${avgTenureDays} days avg · revenue churn only</div>`
          : '<div class="card-nodata">no date data</div>'}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Trial non-converts (all time)${infoBtn('Trial non-converts','<span class="src-tag">Pipedrive · People</span><br>People with <b>Customer Type = "Access Revoked"</b> whose previous type was a trial licence (not Paid Subscription). These trialled but never converted.<br><div class="calc-row">Customer Type = "Access Revoked" AND Previous Type includes "trial" AND NOT "Paid Subscription"</div>')}</div>
        <div class="card-value">${trialChurned.length}</div>
        <div class="card-sub">access revoked after trial</div>
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Rev. churn · ${range.label}${infoBtn('Revenue churn in period','<span class="src-tag">Pipedrive · People</span><br>Revenue-churned people whose <b>Date Access Removed</b> falls within the selected date range.<br><div class="calc-row">Revenue Churned AND Date Access Removed in range</div>')}</div>
        <div class="card-value" style="color:${periodRevChurn>0?'var(--re)':'var(--gr)'}">${periodRevChurn}</div>
        <div class="card-sub">${periodTrialChurn} trial non-converts same period</div>
      </div>
    </div>

    <div class="box">
      <div class="box-title">Revenue churn vs new paid subscribers by month — ${range.label}</div>
      <p style="font-size:12px;color:var(--tl);margin:-4px 0 12px">Green = new paid licences granted. Red = paid subscribers whose access was revoked.</p>
      ${rangeMonths.length ? `<div class="chart-wrap" style="height:240px"><canvas id="pd-churn-net"></canvas></div>` : '<div class="no-data">No data for this range.</div>'}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue churn by month — ${range.label}</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-churn-month"></canvas></div>
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Tenure at churn — distribution (revenue churn)</div>
        ${tenures.length ? `<div class="chart-wrap" style="height:220px"><canvas id="pd-churn-tenure"></canvas></div>` : '<div class="no-data">No tenure data available — check Date Access Granted/Removed fields.</div>'}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Previous customer type at churn (all time)</div>
        ${prevTypeEntries.length ? `<div class="chart-wrap" style="height:${Math.max(200,prevTypeEntries.length*40)}px"><canvas id="pd-churn-prevtype"></canvas></div>` : '<div class="no-data">No previous type data.</div>'}
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue churn by organisation (all time)</div>
        ${topChurnOrgs.length ? `<div class="chart-wrap" style="height:${Math.max(200,topChurnOrgs.length*32)}px"><canvas id="pd-churn-orgs"></canvas></div>` : '<div class="no-data">No org data.</div>'}
      </div>
    </div>

    <!-- Recently churned feed -->
    ${revChurned.length ? `
    <div class="box">
      <div class="box-title">Recently churned paid subscribers ${infoBtn('Churned subscribers',
        `<p>People whose <b>Customer Type = Access Revoked</b> and whose <b>Previous Customer Type</b> includes "Paid Subscription". Sorted by Date Access Removed (most recent first).</p>
        <span class="src-tag">Pipedrive People</span>`)}</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="border-bottom:2px solid var(--bor)">
            <th style="text-align:left;padding:5px 8px">Name</th>
            <th style="text-align:left;padding:5px 8px">Organisation</th>
            <th style="text-align:left;padding:5px 8px">Previous type</th>
            <th style="text-align:right;padding:5px 8px">Access granted</th>
            <th style="text-align:right;padding:5px 8px">Access removed</th>
            <th style="text-align:right;padding:5px 8px">Tenure</th>
          </tr></thead>
          <tbody>
            ${revChurned.slice().sort((a,b) => {
              const da=pdParseDate(a['Person - Date Access Removed']), db=pdParseDate(b['Person - Date Access Removed']);
              return (pdValidDate(db)?db:new Date(0)) - (pdValidDate(da)?da:new Date(0));
            }).slice(0, 25).map(p => {
              const granted = pdParseDate(p['Person - Date Access Granted']);
              const removed = pdParseDate(p['Person - Date Access Removed']);
              const tenDays = (pdValidDate(granted) && pdValidDate(removed)) ? Math.round((removed-granted)/86400000) : null;
              return `<tr style="border-bottom:1px solid var(--bg2)">
                <td style="padding:5px 8px">${p['Person - Name']||p['Name']||'—'}</td>
                <td style="padding:5px 8px;color:var(--tl)">${p['Person - Organisation']||'—'}</td>
                <td style="padding:5px 8px;color:var(--tl);font-size:11px">${p['Person - Previous Customer Type']||'—'}</td>
                <td style="padding:5px 8px;text-align:right;color:var(--tl)">${pdValidDate(granted)?fmtDate(granted).slice(0,6):'—'}</td>
                <td style="padding:5px 8px;text-align:right;color:#e05252">${pdValidDate(removed)?fmtDate(removed).slice(0,6):'—'}</td>
                <td style="padding:5px 8px;text-align:right;color:${tenDays!=null?(tenDays>=365?'#2a7a4b':tenDays>=90?'#c25a00':'#e05252'):'#999'}">${tenDays!=null?tenDays+'d':'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${revChurned.length > 25 ? `<div style="font-size:11px;color:var(--tl);padding:8px">Showing 25 of ${revChurned.length} churned subscribers.</div>` : ''}
      </div>
    </div>` : ''}`;

  if (!_pd_people.length) return;

  // ── CHARTS ────────────────────────────────────────────────────────────────────
  // Net: new paid vs churned
  makeChart('pd-churn-net', {
    type: 'bar',
    data: {
      labels: rangeMonths.map(m => monthLabel(m)),
      datasets: [
        { label: 'New paid licences', data: rangeMonths.map(m => newPaidByMonth[m] || 0), backgroundColor: '#2a7a4b', borderRadius: 3 },
        { label: 'Revenue churn',     data: rangeMonths.map(m => -(revChurnByMonth[m] || 0)), backgroundColor: '#c0392b', borderRadius: 3 },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
      scales: {
        x: { grid: { display: false }, ticks: axStyle, stacked: false },
        y: { grid: gridStyle, ticks: { ...axStyle, callback: v => (v < 0 ? '−' : '') + Math.abs(v) }, beginAtZero: false }
      }
    }
  });

  // Revenue churn by month
  makeChart('pd-churn-month', {
    type: 'bar',
    data: {
      labels: rangeMonths.map(m => monthLabel(m)),
      datasets: [
        { label: 'Revenue churn',    data: rangeMonths.map(m => revChurnByMonth[m] || 0),   backgroundColor: '#c0392b', borderRadius: 3 },
        { label: 'Trial non-convert',data: rangeMonths.map(m => trialChurnByMonth[m] || 0), backgroundColor: '#e8b4b8', borderRadius: 3 },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
      scales: { x: { grid: { display: false }, ticks: axStyle, stacked: true }, y: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true, stacked: true } }
    }
  });

  // Tenure distribution
  if (tenures.length) makeChart('pd-churn-tenure', {
    type: 'bar',
    data: { labels: TEN_BKTS.map(b => b.lbl), datasets: [{ label: 'Churned users', data: tenureBuckets, backgroundColor: '#c25a00', borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true } }
    }
  });

  // Previous type breakdown
  if (prevTypeEntries.length) makeChart('pd-churn-prevtype', {
    type: 'bar',
    data: { labels: prevTypeEntries.map(([k]) => k.length > 35 ? k.slice(0,35)+'…' : k), datasets: [{ label: 'Churned', data: prevTypeEntries.map(([,v])=>v), backgroundColor: '#7f8c8d', borderRadius: 3 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true }, y: { grid: { display: false }, ticks: { ...axStyle, font: { family: 'DM Sans', size: 11 } } } }
    }
  });

  // Top churn orgs
  if (topChurnOrgs.length) makeChart('pd-churn-orgs', {
    type: 'bar',
    data: { labels: topChurnOrgs.map(([k]) => k.length > 35 ? k.slice(0,35)+'…' : k), datasets: [{ label: 'Revenue churned', data: topChurnOrgs.map(([,v])=>v), backgroundColor: '#c0392b', borderRadius: 3 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true }, y: { grid: { display: false }, ticks: { ...axStyle, font: { family: 'DM Sans', size: 11 } } } }
    }
  });
}

// ── PIPEDRIVE: USERS & LICENCES ──────────────────────────────────────────────
function renderPdUsers(sc) {
  const today = new Date();
  const range = pdGetRange();
  const rangeMonths = pdRangeMonths(range);

  // Helper: is access currently active?
  function isActive(p) {
    const rem = p['Person - Date Access Removed'];
    if (!rem) return true;
    const d = pdParseDate(rem);
    return pdValidDate(d) && d > today;
  }

  // Paid Subscription people only
  const paidPeople = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
  const activePaid = paidPeople.filter(isActive);

  // ── RENEWALS COMING UP (#3) ────────────────────────────────────────────────
  // Assumes yearly contracts: next renewal = next anniversary of access-granted date.
  function nextAnniversary(granted) {
    const r = new Date(granted);
    while (r < today) r.setFullYear(r.getFullYear() + 1);
    return r;
  }
  const RENEW_WINDOW_DAYS = 90;
  const renewCutoff = new Date(today); renewCutoff.setDate(renewCutoff.getDate() + RENEW_WINDOW_DAYS);
  const renewOrgMap = {};
  activePaid.forEach(p => {
    const g = pdParseDate(p['Person - Date Access Granted']);
    if (!pdValidDate(g)) return;
    const due = nextAnniversary(g);
    if (due > renewCutoff) return;
    const org = (p['Person - Organisation'] || 'Unknown').trim() || 'Unknown';
    if (!renewOrgMap[org]) renewOrgMap[org] = { org, users: 0, due };
    renewOrgMap[org].users++;
    if (due < renewOrgMap[org].due) renewOrgMap[org].due = due;
  });
  // Attach contract dollars: each org's largest won deal (matched by organisation
  // name, falling back to the deal person's organisation) — same method as the
  // Revenue tab's active-customer figure.
  const _rnNorm = s => (s || '').trim().toLowerCase();
  const _rnPersonOrg = {};
  _pd_people.forEach(p => { const n = _rnNorm(p['Person - Name']); if (n) _rnPersonOrg[n] = _rnNorm(p['Person - Organisation']); });
  const _rnValueByOrg = {};
  _pd_deals.filter(d => d['Deal - Status'] === 'Won').forEach(d => {
    const o = _rnNorm(d['Deal - Organisation']) || _rnPersonOrg[_rnNorm(d['Deal - Person'])] || '';
    if (!o) return;
    const v = parseFloat(d['Deal - Value']) || 0;
    _rnValueByOrg[o] = Math.max(_rnValueByOrg[o] || 0, v);
  });
  Object.values(renewOrgMap).forEach(r => { r.value = _rnValueByOrg[_rnNorm(r.org)] || 0; });
  // Biggest dollars first, then soonest due
  const renewals = Object.values(renewOrgMap).sort((a, b) => (b.value - a.value) || (a.due - b.due));
  const renewTotalValue = renewals.reduce((s, r) => s + r.value, 0);
  const daysUntil = d => Math.round((d - today) / 86400000);

  // ── BY COUNCIL / REGION (#13) ──────────────────────────────────────────────
  // Uses a Pipedrive council/region field if present, else detects councils from
  // the organisation name (handles council customers automatically).
  const COUNCIL_RE = /(council|shire|city of|municipal|regional council|county)/i;
  function councilOf(p) {
    const fld = p['Person - Council'] || p['Person - LGA'] || p['Person - Region'] || p['Council'] || p['LGA'] || '';
    if (fld && fld.trim()) return fld.trim();
    const org = (p['Person - Organisation'] || '').trim();
    return COUNCIL_RE.test(org) ? org : null;
  }
  const councilMap = {};
  activePaid.forEach(p => {
    const c = councilOf(p); if (!c) return;
    if (!councilMap[c]) councilMap[c] = 0;
    councilMap[c]++;
  });
  const councilRows = Object.entries(councilMap).sort((a,b) => b[1]-a[1]);
  const councilCustomers = councilRows.reduce((s,[,n]) => s+n, 0);
  const unmappedActive = activePaid.length - councilCustomers;

  // Chart 11: Active paid subscribers at each month (point-in-time count, not cumulative)
  // Find all months from earliest access granted to today
  const allPaidMonths = (() => {
    let earliest = null;
    paidPeople.forEach(p => {
      const d = pdParseDate(p['Person - Date Access Granted']);
      if (pdValidDate(d) && (!earliest || d < earliest)) earliest = d;
    });
    if (!earliest) return [];
    const months = [], d = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
    const now = new Date();
    while (d <= now) {
      months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
      d.setMonth(d.getMonth() + 1);
    }
    return months;
  })();
  // For each month: count people who had active access at end of that month
  const activeAtMonth = allPaidMonths.map(m => {
    const [yr, mo] = m.split('-').map(Number);
    const monthEnd = new Date(yr, mo, 0, 23, 59, 59); // last moment of last day
    return paidPeople.filter(p => {
      const granted = pdParseDate(p['Person - Date Access Granted']);
      if (!pdValidDate(granted) || granted > monthEnd) return false;
      const removed = pdParseDate(p['Person - Date Access Removed']);
      if (!removed || !pdValidDate(removed)) return true;
      return removed > monthEnd;
    }).length;
  });

  // Chart 12: Customer type breakdown (all people, no range filter — always shows current state)
  const ctypes = {};
  _pd_people.forEach(p => { const ct = p['Person - Customer Type']||'Unknown'; ctypes[ct]=(ctypes[ct]||0)+1; });

  // Chart 13: Top orgs — active paid subscribers (current state, no range filter)
  const orgs = {};
  activePaid.forEach(p => { const o=p['Person - Organisation']; if(o&&o.trim()) orgs[o]=(orgs[o]||0)+1; });
  const topOrgs = Object.entries(orgs).sort((a,b)=>b[1]-a[1]).slice(0,15);

  // Chart 14: New paid subscribers by month — range-filtered
  const newByMonth = {};
  paidPeople.forEach(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    if (!pdValidDate(dt)) return;
    if (!pdInRange(p['Person - Date Access Granted'], range)) return;
    const k = monthKey(dt.toISOString());
    newByMonth[k] = (newByMonth[k]||0)+1;
  });

  // Chart 15: Access end dates — range-filtered
  const revokedByMonth = {};
  paidPeople.forEach(p => {
    const dt = pdParseDate(p['Person - Date Access Removed']);
    if (!pdValidDate(dt)) return;
    if (!pdInRange(p['Person - Date Access Removed'], range)) return;
    const k = monthKey(dt.toISOString());
    revokedByMonth[k] = (revokedByMonth[k]||0)+1;
  });
  const revokedMonths = rangeMonths.filter(m => revokedByMonth[m] != null);

  // After remap attempt, check if we still have a mismatch
  const _hasCustType = _pd_people.length > 0 && 'Person - Customer Type' in (_pd_people[0] || {});
  const _fieldMismatch = _pd_people.length > 0 && !_hasCustType;
  const _sampleKeys = _pd_people.length ? Object.keys(_pd_people[0] || {}).slice(0, 30).join(' · ') : '';

  sc.innerHTML = `
    ${!_pd_people.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive people CSV first.</div></div>' : ''}
    ${_fieldMismatch ? `<div class="callout warn" style="margin-bottom:12px"><div class="callout-label">Column name mismatch — cannot auto-detect fields</div><div class="callout-text">${_pd_people.length.toLocaleString()} people loaded but the customer type column could not be identified automatically.<br><br><b>Columns in your CSV (first 30):</b><br><code style="font-size:10px;line-height:1.6;word-break:break-all">${_sampleKeys}</code><br><br>Re-export the People CSV from Pipedrive with default column headers and re-import.</div></div>` : ''}
    <div class="cards" style="margin-bottom:18px">
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Active paid subscribers${infoBtn('Active paid subscribers','<span class="src-tag">Pipedrive · People</span><br>People with <b>Customer Type = "Paid Subscription"</b> AND (Date Access Removed is blank OR is a future date). Current snapshot.<br><div class="calc-row">Customer Type = "Paid Subscription" AND (Access Removed is null OR Access Removed > today)</div>')}</div><div class="card-value">${activePaid.length}</div><div class="card-sub">Target: 600</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">All paid (incl. past)${infoBtn('All paid (incl. past)','<span class="src-tag">Pipedrive · People</span><br>All people with <b>Customer Type = "Paid Subscription"</b> regardless of whether their access has been removed. Includes former subscribers.<br><div class="calc-row">Customer Type = "Paid Subscription" (no date filter)</div>')}</div><div class="card-value">${paidPeople.length}</div><div class="card-sub">Customer Type = Paid Subscription</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Active trials (all types)${infoBtn('Active trials (all types)','<span class="src-tag">Pipedrive · People</span><br>People with <b>Customer Type containing "trial"</b> (2 Week Trial Licence, Extended Trial Licence, etc.) AND (Date Access Removed is blank OR is a future date). Current snapshot.<br><div class="calc-row">Customer Type includes "trial" AND (Access Removed is null OR Access Removed > today)</div>')}</div><div class="card-value">${_pd_people.filter(p=>isTrialType(p['Person - Customer Type'])&&isActive(p)).length}</div><div class="card-sub">current snapshot</div></div>
      <div class="card"><div class="card-label" style="display:flex;align-items:center;gap:0">Centrally funded${infoBtn('Centrally funded','<span class="src-tag">Pipedrive · People</span><br>People with <b>Customer Type = "Centrally Funded Licence"</b>. No date filter — includes all records regardless of access status.')}</div><div class="card-value">${_pd_people.filter(p=>p['Person - Customer Type']==='Centrally Funded Licence').length}</div></div>
    </div>

    <div class="box">
      <div class="box-title">Renewals due in the next ${RENEW_WINDOW_DAYS} days ${infoBtn('Renewals coming up',
        `<p>Active paying organisations whose <b>next contract anniversary</b> falls within the next ${RENEW_WINDOW_DAYS} days. Assumes yearly contracts dated from <b>Date Access Granted</b>.</p>
        <p><b>Contract value</b> is the organisation's largest won deal — the revenue at stake if they don't renew. Sorted biggest dollars first.</p>
        <div class="calc-row">next anniversary of Access Granted ≤ today + ${RENEW_WINDOW_DAYS} days · still active</div>
        <span class="src-tag">Pipedrive People + Deals</span>`)}</div>
      ${renewals.length ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:2px solid var(--bor)">
          <th style="text-align:left;padding:5px 8px">Organisation</th>
          <th style="text-align:center;padding:5px 8px">Users</th>
          <th style="text-align:right;padding:5px 8px">Contract value</th>
          <th style="text-align:right;padding:5px 8px">Renewal due</th>
          <th style="text-align:right;padding:5px 8px">In</th>
        </tr></thead>
        <tbody>${renewals.map(r => { const du = daysUntil(r.due); const col = du <= 30 ? '#e05252' : du <= 60 ? '#c25a00' : '#2a7a4b'; return `<tr style="border-bottom:1px solid var(--bg2)">
          <td style="padding:5px 8px;font-weight:500">${r.org}</td>
          <td style="text-align:center;padding:5px 8px">${r.users}</td>
          <td style="text-align:right;padding:5px 8px;font-weight:600">${r.value ? fmtCur(r.value) : '<span style="color:var(--tl);font-weight:400">no deal matched</span>'}</td>
          <td style="text-align:right;padding:5px 8px">${fmtDate(r.due).slice(0,11)}</td>
          <td style="text-align:right;padding:5px 8px;color:${col};font-weight:600">${du}d</td>
        </tr>`; }).join('')}</tbody>
      </table></div>
      <div style="font-size:11px;color:var(--tl);padding:8px">${renewals.length} organisation(s) · ${renewals.reduce((s,r)=>s+r.users,0)} licence(s) · ${fmtCur(renewTotalValue)} of contracted revenue up for renewal</div>`
      : '<div class="no-data">No renewals due in the next ' + RENEW_WINDOW_DAYS + ' days.</div>'}
    </div>

    <div class="box">
      <div class="box-title">Active customers by council / region ${infoBtn('By council / region',
        `<p>Active paying customers grouped by council. Uses a Pipedrive <b>Council / LGA / Region</b> field if you have one; otherwise it recognises organisations whose name is a council (contains "council", "shire", "city of", etc.).</p>
        <p>${unmappedActive} active customer(s) aren\'t mapped to a council — add a council field in Pipedrive to capture non-council organisations too.</p>
        <span class="src-tag">Pipedrive People</span>`)}</div>
      ${councilRows.length ? `<div class="chart-wrap" style="height:${Math.max(220, councilRows.length*26)}px"><canvas id="pd-council"></canvas></div>
        <div style="font-size:11px;color:var(--tl);padding:8px 2px 0">${councilRows.length} councils · ${councilCustomers} customers mapped · ${unmappedActive} not mapped to a council</div>`
      : '<div class="no-data">No councils detected. Add a Council field in Pipedrive, or ensure council organisation names contain "Council".</div>'}
    </div>

    <div class="box"><div class="box-title">Active paid subscribers over time (all time)</div>
      ${allPaidMonths.length ? `<div class="chart-wrap" style="height:240px"><canvas id="pd-sub-growth"></canvas></div>` : '<div class="no-data">No access granted dates found.</div>'}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0"><div class="box-title">Customer type breakdown (all people)</div>
        <div class="chart-wrap" style="height:260px"><canvas id="pd-ctype"></canvas></div></div>
      <div class="box" style="margin-bottom:0"><div class="box-title">New paid subscribers by month — ${range.label}</div>
        <div class="chart-wrap" style="height:260px"><canvas id="pd-new-users"></canvas></div></div>
    </div>

    <div class="box"><div class="box-title">Active paid subscribers by organisation (as of today)</div>
      ${topOrgs.length ? `<div class="chart-wrap" style="height:${Math.max(300,topOrgs.length*28)}px"><canvas id="pd-top-orgs"></canvas></div>` : '<div class="no-data">No org data.</div>'}</div>

    <div class="box"><div class="box-title">Access end dates — paid subscribers — ${range.label}</div>
      ${revokedMonths.length ? `<div class="chart-wrap" style="height:200px"><canvas id="pd-revoked"></canvas></div>` : '<div class="no-data">No access end date data for this period.</div>'}</div>`;

  if (_pd_people.length) {
    if (councilRows.length) makeChart('pd-council', {
      type: 'bar',
      data: { labels: councilRows.map(([c]) => c.length > 38 ? c.slice(0,38)+'…' : c), datasets: [{ label: 'Active customers', data: councilRows.map(([,n]) => n), backgroundColor: '#2e8bc0', borderRadius: 3 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true }, y: { grid: { display: false }, ticks: { ...axStyle, font: { family: 'DM Sans', size: 10 } } } }
      }
    });
    if (allPaidMonths.length) makeChart('pd-sub-growth', {
      type:'line',
      data:{ labels:allPaidMonths.map(m=>monthLabel(m)), datasets:[
        {label:'Active paid subscribers', data:activeAtMonth, borderColor:'#2e8bc0', backgroundColor:'rgba(46,139,192,.08)', borderWidth:2, tension:.3, pointRadius:2, fill:true},
        {label:'Target: 600', data:allPaidMonths.map(()=>TARGET_USERS), borderColor:'#c25a00', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false},
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
        scales:{ x:{grid:{display:false},ticks:{...axStyle,maxTicksLimit:14}}, y:{grid:gridStyle,ticks:axStyle,beginAtZero:true,suggestedMax:TARGET_USERS} }
      }
    });
    const ctEntries = Object.entries(ctypes).filter(([k])=>k&&k!=='Unknown').sort((a,b)=>b[1]-a[1]);
    if (ctEntries.length) makeChart('pd-ctype', {
      type:'doughnut',
      data:{ labels:ctEntries.map(([k])=>k), datasets:[{ data:ctEntries.map(([,v])=>v), backgroundColor:['#1a3c5e','#2e8bc0','#2a7a4b','#c25a00','#7b1fa2','#00796b','#c0392b','#e8d4d4','#90c4e0'], borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:10}, boxWidth:10, padding:8 } } }
      }
    });
    makeChart('pd-new-users', {
      type:'bar',
      data:{ labels:rangeMonths.map(m=>monthLabel(m)), datasets:[{label:'New paid subscribers', data:rangeMonths.map(m=>newByMonth[m]||0), backgroundColor:'#2a7a4b', borderRadius:3}] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:{display:false},ticks:{...axStyle,maxTicksLimit:14}}, y:{grid:gridStyle,ticks:axStyle,beginAtZero:true} }
      }
    });
    if (topOrgs.length) makeChart('pd-top-orgs', {
      type:'bar',
      data:{ labels:topOrgs.map(([k])=>k.length>50?k.slice(0,50)+'…':k), datasets:[{label:'Active paid subscribers', data:topOrgs.map(([,v])=>v), backgroundColor:'#2e8bc0', borderRadius:3}] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:gridStyle,ticks:axStyle,beginAtZero:true}, y:{grid:{display:false},ticks:{...axStyle,font:{family:'DM Sans',size:10}}} }
      }
    });
    if (revokedMonths.length) makeChart('pd-revoked', {
      type:'bar',
      data:{ labels:revokedMonths.map(m=>monthLabel(m)), datasets:[{label:'Access end dates', data:revokedMonths.map(m=>revokedByMonth[m]||0), backgroundColor:'#c0392b', borderRadius:3}] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{grid:{display:false},ticks:axStyle}, y:{grid:gridStyle,ticks:axStyle,beginAtZero:true} }
      }
    });
  }
}

// ── PIPEDRIVE: TRIAL PIPELINE ────────────────────────────────────────────────
function renderPdTrials(sc) {
  const range = pdGetRange();
  const today = new Date();

  // ── PEOPLE-BASED TRIAL STATS ────────────────────
  function isActive(p) {
    const rem = p['Person - Date Access Removed'];
    if (!rem) return true;
    const d = pdParseDate(rem); return pdValidDate(d) && d > today;
  }
  const activeTrial   = _pd_people.filter(p => isTrialType(p['Person - Customer Type']) && isActive(p));
  const everTrialled  = _pd_people.filter(p =>
    isTrialType(p['Person - Customer Type']) ||
    isTrialType(p['Person - Previous Customer Type'])
  );
  const convertedFromTrial = _pd_people.filter(p =>
    p['Person - Customer Type'] === 'Paid Subscription' &&
    isTrialType(p['Person - Previous Customer Type'])
  );
  const trialConvRate = everTrialled.length ? pct(convertedFromTrial.length, everTrialled.length) : null;

  // New trials by month (range-filtered)
  const rangeMonths = pdRangeMonths(range);
  const newTrialsByMonth = {};
  _pd_people.filter(p => isTrialType(p['Person - Customer Type'])).forEach(p => {
    if (!pdInRange(p['Person - Date Access Granted'], range)) return;
    const k = monthKey(p['Person - Date Access Granted']);
    if (k) newTrialsByMonth[k] = (newTrialsByMonth[k] || 0) + 1;
  });

  // ── DEAL-BASED TRIAL STATS ────────────────────
  const allTrialDeals = _pd_deals.filter(d => d['Deal - Pipeline'] === 'Trial Pipeline');
  const openTrials    = allTrialDeals.filter(d => d['Deal - Status'] === 'Open');
  const trialDeals    = range.from
    ? allTrialDeals.filter(d => pdInRange(d['Deal - Deal created'], range))
    : allTrialDeals;
  const lostTrials    = trialDeals.filter(d => d['Deal - Status'] === 'Lost');
  const closedLost    = trialDeals.filter(d => d['Deal - Stage'] === 'Closed Lost' || d['Deal - Status'] === 'Lost').length;

  // Funnel stages in order
  const FUNNEL_STAGES = ['Follow Up','Demo Scheduled','Demo Booked','Trial in Progress','Trial Mid Point','Trial Complete','Pending Onboarding','Awaiting Onboarding'];
  const stageOrder = [...FUNNEL_STAGES, 'Closed Lost'];

  // Current open deals by stage (snapshot)
  const openByStage = {};
  stageOrder.forEach(s => openByStage[s] = 0);
  openTrials.forEach(d => { const s = d['Deal - Stage']; if (openByStage.hasOwnProperty(s)) openByStage[s]++; });

  // Funnel conversion: for each stage, count deals that *reached* that stage or beyond (all time)
  // A deal "reached" a stage if its current stage index >= that stage's index
  const reachedStage = FUNNEL_STAGES.map((s, i) => {
    return allTrialDeals.filter(d => {
      const idx = stageOrder.indexOf(d['Deal - Stage']);
      return idx >= i; // reached this stage or beyond (Closed Lost is beyond all)
    }).length;
  });

  // Monthly new trial deals (range-filtered)
  const newDealsByMonth = {};
  trialDeals.forEach(d => {
    const dt = pdParseDate(d['Deal - Deal created']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    newDealsByMonth[k] = (newDealsByMonth[k] || 0) + 1;
  });

  // Lost reasons
  const lostReasons = {};
  lostTrials.forEach(d => { const r = d['Deal - Lost reason']; if (r && r.trim()) lostReasons[r] = (lostReasons[r]||0)+1; });

  // Trial orgs (active trials by org)
  const trialOrgs = {};
  activeTrial.forEach(p => { const o = p['Person - Organisation']||'Unknown'; trialOrgs[o]=(trialOrgs[o]||0)+1; });
  const topTrialOrgs = Object.entries(trialOrgs).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // ── TRIAL-TO-PAID CONVERSION TIME-SERIES ──
  // For converted people: estimate days to convert = Date Access Granted → Date Access Removed (revocation in trial) or use a fixed 14d window
  // Better: flag via 'Person - Date Access Removed' → if null they are still active, so look at their granted date vs today
  // Use: granted date as the month they "trialled", then classify if Current Type = Paid Subscription
  const convByMonth = {};       // month → { count, totalDays }
  convertedFromTrial.forEach(p => {
    const granted = pdParseDate(p['Person - Date Access Granted']);
    if (!pdValidDate(granted)) return;
    if (!pdInRange(p['Person - Date Access Granted'], range)) return;
    const k = monthKey(granted.toISOString());
    if (!convByMonth[k]) convByMonth[k] = { count:0, totalDays:0 };
    convByMonth[k].count++;
    // Days estimate: we don't have a "converted date" field; use access removed date if present
    const removed = pdParseDate(p['Person - Date Access Removed']);
    if (pdValidDate(removed) && removed > granted) {
      convByMonth[k].totalDays += Math.round((removed - granted) / 86400000);
    }
  });

  sc.innerHTML = `
    ${!allTrialDeals.length && !_pd_people.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive deals and people CSVs first.</div></div>' : ''}

    <div class="cards" style="margin-bottom:18px">
      <div class="card"><div class="card-label">Active trials (all types)</div><div class="card-value">${activeTrial.length}</div><div class="card-sub">current snapshot · any trial licence</div></div>
      <div class="card"><div class="card-label">Ever trialled</div><div class="card-value">${everTrialled.length}</div><div class="card-sub">current or previous type includes "trial"</div></div>
      <div class="card"><div class="card-label">Converted to paid</div><div class="card-value">${convertedFromTrial.length}</div><div class="card-sub">Previous type includes any trial licence</div></div>
      <div class="card"><div class="card-label">Trial → paid rate</div>${trialConvRate!=null?`<div class="card-value">${fmtPct(trialConvRate)}</div>`:'<div class="card-nodata">no data</div>'}<div class="card-sub">of all who trialled</div></div>
      <div class="card"><div class="card-label">Open trial deals</div><div class="card-value">${openTrials.length}</div><div class="card-sub">current snapshot · Trial Pipeline</div></div>
      <div class="card"><div class="card-label">Closed Lost</div><div class="card-value" style="color:var(--re)">${closedLost}</div><div class="card-sub">${trialDeals.length?fmtPct(pct(closedLost,trialDeals.length))+' of deals · '+range.label:range.label}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Open trial deals — current stage snapshot</div>
        ${openTrials.length ? `<div class="pipeline">${(() => {
          const maxV = Math.max(...FUNNEL_STAGES.map(s=>openByStage[s]||0), 1);
          return FUNNEL_STAGES.map((stage, i) => {
            const count = openByStage[stage] || 0;
            const w = maxV > 0 ? (count/maxV*100) : 0;
            return `<div class="stage-bar-wrap"><div class="stage-bg" style="width:${w}%"></div>
              <div class="stage-content"><div class="stage-name">${stage}</div><div class="stage-count">${count}</div></div></div>`;
          }).join('');
        })()}</div>` : '<div class="no-data">No open trial deals.</div>'}
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Trial funnel — stage conversion (all time)</div>
        ${reachedStage[0] > 0 ? `<table class="conv-table">
          <thead><tr><th>Stage</th><th>Reached</th><th>Conv. from prev</th></tr></thead>
          <tbody>${FUNNEL_STAGES.map((s, i) => {
            const n = reachedStage[i];
            const conv = i > 0 && reachedStage[i-1] ? pct(n, reachedStage[i-1]) : null;
            const cls = conv == null ? '' : conv > 75 ? 'good' : conv > 40 ? 'mid' : 'bad';
            return `<tr><td style="font-size:12px">${s}</td><td style="text-align:right;font-weight:600">${n}</td>
              <td style="text-align:right">${conv!=null?`<span class="conv-pct ${cls}">${fmtPct(conv)}</span>`:'—'}</td></tr>`;
          }).join('')}
          <tr style="border-top:2px solid var(--bor)"><td style="font-size:12px;color:var(--re)">Closed Lost</td><td style="text-align:right;font-weight:600;color:var(--re)">${openByStage['Closed Lost']||lostTrials.length}</td><td></td></tr>
          </tbody></table>` : '<div class="no-data">No trial deal data.</div>'}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0"><div class="box-title">New trial people by month — ${range.label}</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-trial-new"></canvas></div></div>
      <div class="box" style="margin-bottom:0"><div class="box-title">New trial deals by month — ${range.label}</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-trial-deals"></canvas></div></div>
    </div>

    ${topTrialOrgs.length ? `<div class="box"><div class="box-title">Active trials by organisation (all types)</div>
      <div class="chart-wrap" style="height:${Math.max(200,topTrialOrgs.length*32)}px"><canvas id="pd-trial-orgs"></canvas></div></div>` : ''}

    <div class="box"><div class="box-title">Trial lost reasons — ${range.label}</div>
      ${Object.keys(lostReasons).length ? `<div class="chart-wrap" style="height:${Math.max(200,Object.keys(lostReasons).length*40)}px"><canvas id="pd-trial-lost"></canvas></div>` : '<div class="no-data">No lost reason data for this period.</div>'}</div>

    <div class="box"><div class="box-title">Trial → Paid conversions by month ${infoBtn('Trial conversion by month',
      `<p>Monthly count of people whose current type is <b>Paid Subscription</b> and whose previous type includes a trial licence, grouped by their <b>Date Access Granted</b> (i.e. when the trial started).</p>
      <p>Avg days shown where a Date Access Removed was recorded during the trial period.</p>
      <span class="src-tag">Pipedrive People</span>`)}</div>
      ${Object.keys(convByMonth).length ? `<div class="chart-wrap" style="height:220px"><canvas id="pd-trial-conv-ts"></canvas></div>` : '<div class="no-data">No conversion data for this period.</div>'}
    </div>`;

  // Charts
  makeChart('pd-trial-new', {
    type:'bar',
    data:{ labels:rangeMonths.map(m=>monthLabel(m)), datasets:[{label:'New trials (all types)', data:rangeMonths.map(m=>newTrialsByMonth[m]||0), backgroundColor:'#2e8bc0', borderRadius:3}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{grid:{display:false},ticks:{...axStyle,maxTicksLimit:14}}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
    }
  });
  makeChart('pd-trial-deals', {
    type:'bar',
    data:{ labels:rangeMonths.map(m=>monthLabel(m)), datasets:[{label:'New trial deals', data:rangeMonths.map(m=>newDealsByMonth[m]||0), backgroundColor:'#1a3c5e', borderRadius:3}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{grid:{display:false},ticks:{...axStyle,maxTicksLimit:14}}, y:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true} }
    }
  });
  if (topTrialOrgs.length) makeChart('pd-trial-orgs', {
    type:'bar',
    data:{ labels:topTrialOrgs.map(([k])=>k.length>40?k.slice(0,40)+'…':k), datasets:[{label:'Active trials', data:topTrialOrgs.map(([,v])=>v), backgroundColor:'#2e8bc0', borderRadius:3}] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true}, y:{grid:{display:false},ticks:{...axStyle,font:{family:'DM Sans',size:10}}} }
    }
  });
  if (Object.keys(convByMonth).length) {
    makeChart('pd-trial-conv-ts', {
      type: 'bar',
      data: {
        labels: rangeMonths.map(m => monthLabel(m)),
        datasets: [
          { label: 'Conversions', data: rangeMonths.map(m => convByMonth[m]?.count || 0), backgroundColor: '#2a7a4b', borderRadius: 3, yAxisID: 'y' },
          { label: 'Avg days in trial', data: rangeMonths.map(m => {
              const b = convByMonth[m]; return (b && b.totalDays && b.count) ? Math.round(b.totalDays/b.count) : null;
            }), type: 'line', borderColor: '#e6a817', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 4, tension: .3, spanGaps: true, yAxisID: 'y2'
          }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
        scales: {
          x: { grid: { display: false }, ticks: { ...axStyle, maxTicksLimit: 14 } },
          y:  { grid: gridStyle, ticks: { ...axStyle, stepSize: 1 }, beginAtZero: true, position: 'left' },
          y2: { grid: { display: false }, ticks: { ...axStyle, callback: v => v + 'd' }, beginAtZero: true, position: 'right' }
        }
      }
    });
  }
  if (Object.keys(lostReasons).length) {
    const lrEntries = Object.entries(lostReasons).sort((a,b)=>b[1]-a[1]);
    makeChart('pd-trial-lost', {
      type:'bar',
      data:{ labels:lrEntries.map(([k])=>k.length>45?k.slice(0,45)+'…':k), datasets:[{label:'Lost deals', data:lrEntries.map(([,v])=>v), backgroundColor:'#c0392b', borderRadius:3}] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ x:{grid:gridStyle,ticks:{...axStyle,stepSize:1},beginAtZero:true}, y:{grid:{display:false},ticks:{...axStyle,font:{family:'DM Sans',size:10}}} }
      }
    });
  }
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
// ── PIPEDRIVE: OPTI-MAX GROWTH MODEL ────────────────────────────────────────
function renderPdOptimax(sc) {
  const OM_KEY = 'liq_optimax';
  const OM_DEF = {
    leads_curr: 50000, leads_target: 60000,
    contact_pct_target: 65,
    meeting_pct_target: 80,
    neg_pct_target: 95,
    order_pct_target: 82,
    invoice_pct_target: 90,
    won_pct_target: 90,
    upsell_pct_curr: 5, upsell_pct_target: 10,
    price_curr: 0,      price_target: 42,
    avg_lic_price: 8000,
    cycle_30d_target: 50,
    avg_cycle_target: 45,
  };

  function loadOM() { try { return {...OM_DEF,...JSON.parse(localStorage.getItem(OM_KEY)||'{}')}; } catch { return {...OM_DEF}; } }
  function saveOM(k, v) { const o=loadOM(); o[k]=parseFloat(v)||0; localStorage.setItem(OM_KEY,JSON.stringify(o)); renderPdOptimax(sc); }
  window.omSave  = saveOM;
  window.omReset = () => { localStorage.removeItem(OM_KEY); renderPdOptimax(sc); };
  window.setOmView = (v) => { activeSub.om_view = v; renderPdOptimax(sc); };
  const t = loadOM();
  const omView = activeSub.om_view || 'deals';

  // ── Pipedrive actuals (all-time) ─────────────────────────────────────────
  const sDeals = _pd_deals.filter(d => d['Deal - Pipeline']==='2026 Sales');
  const FSALL  = ['Contact Made/Discovery','Meeting Scheduled','Negotiations','Order Form Sent','Signed Order Form Returned','Invoice Sent','Payment Received'];
  const fsIdx  = Object.fromEntries(FSALL.map((s,i)=>[s,i]));
  function reached(d, idx) {
    if (d['Deal - Status']==='Won') return true;
    let stg=d['Deal - Stage']||''; if(stg==='Contact Made')stg='Contact Made/Discovery';
    const di=fsIdx[stg]; return di!=null&&di>=idx;
  }
  const fCnts  = FSALL.map((_,i) => sDeals.filter(d=>reached(d,i)).length);
  const fRates = FSALL.map((_,i) => i===0?null:(fCnts[i-1]>0?pct(fCnts[i],fCnts[i-1]):null));
  const wonAll = sDeals.filter(d=>d['Deal - Status']==='Won');

  // Open deals per stage (current snapshot)
  const openByStg = Object.fromEntries(FSALL.map(s=>[s,0]));
  sDeals.filter(d=>d['Deal - Status']==='Open').forEach(d=>{
    let stg=d['Deal - Stage']||''; if(stg==='Contact Made')stg='Contact Made/Discovery';
    if(openByStg.hasOwnProperty(stg)) openByStg[stg]++;
  });

  // Avg deal value from won deals
  const dealVals = wonAll.map(d=>parseFloat(d['Deal - Value'])||0).filter(v=>v>0);
  const avgDealVal   = dealVals.length ? Math.round(dealVals.reduce((a,b)=>a+b,0)/dealVals.length) : 8000;
  const fullPriceCnt = dealVals.filter(v=>v>=7000).length;
  const discountCnt  = dealVals.filter(v=>v>0&&v<7000).length;
  const avgLicPrice  = t.avg_lic_price || 8000;

  // Licence count helper: deal value / avg licence price (rounds up)
  function dealLics(d){ return Math.max(1, Math.round((parseFloat(d['Deal - Value'])||avgLicPrice) / avgLicPrice)); }

  // Licence counts per reached stage (all-time)
  function licsCntAtStage(idx) {
    return sDeals.filter(d=>reached(d,idx)).reduce((s,d)=>s+dealLics(d),0);
  }
  const licsCnts = FSALL.map((_,i)=>licsCntAtStage(i));
  const licsWon  = wonAll.reduce((s,d)=>s+dealLics(d),0);
  const licsRates= FSALL.map((_,i)=>i===0?null:(licsCnts[i-1]>0?pct(licsCnts[i],licsCnts[i-1]):null));

  // Sales velocity
  function cdDays(d){const c=pdParseDate(d['Deal - Deal created']),w=pdParseDate(d['Deal - Won time']);if(!pdValidDate(c)||!pdValidDate(w))return null;return Math.round((w-c)/86400000);}
  const cycleDays  = wonAll.map(cdDays).filter(v=>v!=null);
  const avgCycle   = cycleDays.length ? Math.round(cycleDays.reduce((a,b)=>a+b,0)/cycleDays.length) : null;
  const w30Cnt     = cycleDays.filter(d=>d<=30).length;
  const w30Pct     = cycleDays.length ? pct(w30Cnt,cycleDays.length) : null;

  // First deal date for rate calc
  const firstDealDt = sDeals.reduce((min,d)=>{const dt=pdParseDate(d['Deal - Deal created']);return pdValidDate(dt)&&(!min||dt<min)?dt:min;},null);
  const monthsElapsed = firstDealDt ? Math.max(1,(new Date()-firstDealDt)/(1000*60*60*24*30.44)) : 12;

  // ── Decide which view to show ─────────────────────────────────────────────
  // Deals view: deal counts. Licences view: licence counts derived from deal value.
  const isLic   = omView === 'licences';
  const currCnts= isLic ? licsCnts   : fCnts;
  const currRts = isLic ? licsRates  : fRates;
  const wonCurr = isLic ? licsWon    : wonAll.length;
  const unitLabel= isLic ? 'licences' : 'deals';

  // ── OPTI-MAX model rows ──────────────────────────────────────────────────
  // NOTE: Invoice currPct uses Order Form Sent (index 3) as denominator — not Signed OFR (index 4)
  // This avoids the 100% bug from Signed OFR → Invoice being 41/41=100%.
  const ROWS = [
    { isHdr:true, label:'STAGE 1 — INCREASE LEADS & DRIVE MORE TRAFFIC' },
    { id:'leads',
      label:'Total leads reached',
      desc:`${t.leads_curr.toLocaleString()} total outbound touches per month (webinars, EDMs, events, calls) · edit current below`,
      currEditable:true, currKey:'leads_curr', currStep:1000, isCurrCount:true,
      tgtKey:'leads_target',
      curr: t.leads_curr, tgt: t.leads_target, currPct:null },
    { id:'contact',
      label:'Contact Made / Discovery',
      desc:`${currCnts[0].toLocaleString()} ${unitLabel} entered the CRM since pipeline start · live from Pipedrive`,
      currEditable:false, tgtKey:'contact_pct_target',
      curr: currCnts[0], currPct: t.leads_curr>0?pct(currCnts[0],t.leads_curr):null, tgtPct: t.contact_pct_target },
    { isHdr:true, label:'STAGE 2 — INCREASE EFFECTIVENESS OF SALES PROCESS' },
    { id:'meeting',
      label:'Meetings Scheduled',
      desc:`${currCnts[1].toLocaleString()} ${unitLabel} progressed to meeting stage · ${openByStg['Meeting Scheduled']} deals currently open · Pipedrive`,
      currEditable:false, tgtKey:'meeting_pct_target',
      curr: currCnts[1], currPct: currRts[1], tgtPct: t.meeting_pct_target },
    { id:'neg',
      label:'Negotiations',
      desc:`${currCnts[2].toLocaleString()} ${unitLabel} in active negotiations · ${openByStg['Negotiations']} deals currently open · Pipedrive`,
      currEditable:false, tgtKey:'neg_pct_target',
      curr: currCnts[2], currPct: currRts[2], tgtPct: t.neg_pct_target },
    { id:'order',
      label:'Order Form Sent',
      desc:`${currCnts[3].toLocaleString()} ${unitLabel} with order form sent · ${openByStg['Order Form Sent']} deals currently open · Pipedrive`,
      currEditable:false, tgtKey:'order_pct_target',
      curr: currCnts[3], currPct: currRts[3], tgtPct: t.order_pct_target },
    { isHdr:true, label:'STAGE 3 — INCREASE SALES CONVERSIONS' },
    { id:'invoice',
      label:'Invoice Sent',
      // FIX: denominator is Order Form Sent (index 3), not Signed Order Form Returned (index 4)
      // This avoids the 100% bug (Signed OFR → Invoice was 41/41).
      desc:`${currCnts[5].toLocaleString()} ${unitLabel} with invoice sent · ${openByStg['Invoice Sent']} deals currently open · Pipedrive`,
      currEditable:false, tgtKey:'invoice_pct_target',
      curr: currCnts[5],
      currPct: currCnts[3]>0 ? pct(currCnts[5], currCnts[3]) : null,
      tgtPct: t.invoice_pct_target },
    { id:'won',
      label:'Won (Paid Subscription)',
      desc:`${wonCurr.toLocaleString()} ${unitLabel} closed as won · avg deal value ${fmtDollar(avgDealVal)} (${fullPriceCnt} full · ${discountCnt} discounted) · Pipedrive`,
      currEditable:false, tgtKey:'won_pct_target',
      curr: wonCurr,
      currPct: currCnts[5]>0 ? pct(wonCurr, currCnts[5]) : null,
      tgtPct: t.won_pct_target },
    { isHdr:true, label:'STAGE 4 — INCREASE TRANSACTION VALUE' },
    { id:'upsell',
      label:'Upsell rate',
      desc:`${t.upsell_pct_curr}% of clients currently take additional licences · edit current below`,
      currEditable:true, currKey:'upsell_pct_curr', currStep:1, currMax:100, isCurrPct:true,
      tgtKey:'upsell_pct_target',
      curr: null, currPct: t.upsell_pct_curr||null, tgtPct: t.upsell_pct_target },
    { id:'price',
      label:'Increase average price per licence (by reducing public sector discounts)',
      desc:`Current avg price increase: $${t.price_curr||0}/licence/year · edit current below`,
      currEditable:true, currKey:'price_curr', currStep:10, currPrefix:'$', isCurrCount:true,
      tgtKey:'price_target',
      curr: t.price_curr||0, tgt: t.price_target||0, currPct:null },
  ];

  // ── Build projections ────────────────────────────────────────────────────
  const proj = {};
  let prevProj = t.leads_target;
  for (const r of ROWS) {
    if (r.isHdr) continue;
    if      (r.id==='leads')   { proj.leads   = t.leads_target;                                  prevProj=proj.leads; }
    else if (r.id==='contact') { proj.contact = Math.round(prevProj*t.contact_pct_target/100);   prevProj=proj.contact; }
    else if (r.id==='meeting') { proj.meeting = Math.round(prevProj*t.meeting_pct_target/100);   prevProj=proj.meeting; }
    else if (r.id==='neg')     { proj.neg     = Math.round(prevProj*t.neg_pct_target/100);       prevProj=proj.neg; }
    else if (r.id==='order')   { proj.order   = Math.round(prevProj*t.order_pct_target/100);     prevProj=proj.order; }
    else if (r.id==='invoice') { proj.invoice = Math.round(prevProj*t.invoice_pct_target/100);   prevProj=proj.invoice; }
    else if (r.id==='won')     { proj.won     = Math.round(prevProj*t.won_pct_target/100);       prevProj=proj.won; }
    else proj[r.id] = null;
  }
  const projWon    = proj.won;
  const projImpPct = wonCurr>0&&projWon!=null ? Math.round((projWon-wonCurr)/wonCurr*100) : null;

  // ── Stage 5: Total Impact calculations ───────────────────────────────────
  // Per-stage uplifts (projected vs current, as %)
  const stageUpliftPairs = [
    { curr: t.leads_curr,  prj: t.leads_target },
    { curr: currCnts[0],   prj: proj.contact },
    { curr: currCnts[1],   prj: proj.meeting },
    { curr: currCnts[2],   prj: proj.neg },
    { curr: currCnts[3],   prj: proj.order },
    { curr: currCnts[5],   prj: proj.invoice },
    { curr: wonCurr,       prj: proj.won },
  ];
  const stageUplifts = stageUpliftPairs
    .map(x => (x.curr>0 && x.prj!=null) ? (x.prj - x.curr) / x.curr * 100 : null)
    .filter(v => v !== null);
  const avgUpliftPct     = stageUplifts.length ? stageUplifts.reduce((a,b)=>a+b,0)/stageUplifts.length : 0;
  // Cumulative = actual end-to-end improvement in won deals (leads → won, chained)
  // NOT a product of individual stage uplifts (that would double-count the chain effects)
  const cumulativeUplift = wonCurr>0 && projWon!=null ? (projWon - wonCurr) / wonCurr * 100 : 0;
  // Monthly and annual revenue
  const currRevMonth = monthsElapsed>0 ? Math.round(wonCurr / monthsElapsed * avgDealVal) : 0;
  const projRevMonth = projWon!=null   ? Math.round(projWon  / monthsElapsed * avgDealVal) : currRevMonth;
  const currRevYear  = currRevMonth * 12;
  const projRevYear  = projRevMonth * 12;

  // ── Revenue projection (36-month ARR trajectory) ─────────────────────────
  const currMoRate = wonCurr / monthsElapsed;
  const projMoRate = projWon!=null ? projWon/monthsElapsed : currMoRate;
  const proj36M    = Array.from({length:36},(_,i)=>i+1);
  const currCumARR = proj36M.map(m => currMoRate * m * avgDealVal);
  const targCumARR = proj36M.map(m => projMoRate * m * avgDealVal);
  const currARR1y  = Math.round(currCumARR[11]);
  const targARR1y  = Math.round(targCumARR[11]);
  const currARR3y  = Math.round(currCumARR[35]);
  const targARR3y  = Math.round(targCumARR[35]);
  function fmtM(v) { return v>=1000000?'$'+(v/1000000).toFixed(2)+'M':'$'+(v/1000).toFixed(0)+'k'; }

  // ── Pre-compute rows HTML: 7 columns matching reference model ──────────────
  // Columns: Stage | Current #/mo | Current % | Target #/mo | Target % | Actual % Increase | Cumulative % Increase
  const omRowsHTML = ROWS.map(r => {
    if (r.isHdr) return `<tr class="om-stage-hdr"><td colspan="7">${r.label}</td></tr>`;
    const prj = proj[r.id];

    // ── Col 2: Current # per month ──────────────────────────────────────────
    // Stage 1 (leads): editable count input
    // Upsell: editable % input (curr = rate, not a count)
    // Price: editable $ input
    // Others: Pipedrive count (read-only display)
    let currCell;
    if (r.id === 'leads') {
      currCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input om-input-wide" type="number" min="0" step="1000" value="${t[r.currKey]||0}" onchange="omSave('${r.currKey}',this.value)"></div>`;
    } else if (r.id === 'upsell') {
      currCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input" type="number" min="0" max="100" step="1" value="${t[r.currKey]||0}" onchange="omSave('${r.currKey}',this.value)"><span style="font-size:11px;color:var(--tl)">%</span></div>`;
    } else if (r.id === 'price') {
      currCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><span style="font-size:11px;color:var(--tl)">$</span><input class="om-input" type="number" min="0" step="10" value="${t[r.currKey]||0}" onchange="omSave('${r.currKey}',this.value)"><span style="font-size:10px;color:var(--tl)">/yr</span></div>`;
    } else {
      currCell = `<span style="font-weight:500">${r.curr!=null?r.curr.toLocaleString():'—'}</span>`;
    }

    // ── Col 3: Current % (conversion rate from Pipedrive) ───────────────────
    // Stage 1: no prior stage, show —
    // Upsell: upsell% is already in col 2, show — here
    // Price: no %, show —
    // Conv stages: from Pipedrive actuals
    let currPctCell;
    if (r.id === 'leads' || r.id === 'upsell' || r.id === 'price') {
      currPctCell = '<span style="color:var(--tl)">—</span>';
    } else {
      const label = r.id === 'contact' ? '<div style="font-size:9px;color:var(--tl)">of leads</div>' : '';
      currPctCell = r.currPct!=null
        ? `<span class="conv-pct ${r.currPct>=70?'good':r.currPct>=40?'mid':'bad'}">${fmtPct(r.currPct)}</span>${label}`
        : '—';
    }

    // ── Col 4: Target # per month (computed projected count) ────────────────
    // Stage 1: editable target count input
    // Price: editable target $ per year
    // Upsell: no count target (rate-based), show —
    // Conv stages: computed projected count = proj[r.id]
    let tgtCountCell;
    if (r.id === 'leads') {
      tgtCountCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input om-input-wide" type="number" min="0" step="1000" value="${t[r.tgtKey]||0}" onchange="omSave('${r.tgtKey}',this.value)"></div>`;
    } else if (r.id === 'price') {
      tgtCountCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><span style="font-size:11px;color:var(--tl)">$</span><input class="om-input" type="number" min="0" step="10" value="${t[r.tgtKey]||0}" onchange="omSave('${r.tgtKey}',this.value)"><span style="font-size:10px;color:var(--tl)">/yr</span></div>`;
    } else if (r.id === 'upsell') {
      tgtCountCell = '<span style="color:var(--tl)">—</span>';
    } else {
      tgtCountCell = `<span style="font-weight:600;color:var(--gr)">${prj!=null?prj.toLocaleString():'—'}</span>`;
    }

    // ── Col 5: Target % (editable input) ────────────────────────────────────
    // Stage 1, Price: no conversion %, show —
    // Conv stages + upsell: editable % input
    let tgtPctCell;
    if (r.id === 'leads' || r.id === 'price') {
      tgtPctCell = '<span style="color:var(--tl)">—</span>';
    } else {
      const step = r.id === 'upsell' ? (r.currStep||1) : 1;
      tgtPctCell = `<div style="display:flex;align-items:center;gap:3px;justify-content:flex-end"><input class="om-input" type="number" min="0" max="100" step="${step}" value="${r.tgtPct||0}" onchange="omSave('${r.tgtKey}',this.value)"><span style="font-size:11px;color:var(--tl)">%</span></div>`;
    }

    // ── Col 6: Actual % Increase ─────────────────────────────────────────────
    // Stage 1: (target_count - curr_count) / curr_count × 100 (relative change in volume)
    // Conv stages: target_pct - current_pct (absolute pp improvement in conversion rate)
    // Upsell: target_pct - curr_pct
    // Price: (target_$ - curr_$) relative to avg deal value
    let actualPct;
    if (r.id === 'leads') {
      actualPct = t.leads_curr > 0 ? +((t.leads_target - t.leads_curr) / t.leads_curr * 100).toFixed(1) : null;
    } else if (r.id === 'upsell') {
      actualPct = +((t.upsell_pct_target||0) - (t.upsell_pct_curr||0)).toFixed(1);
    } else if (r.id === 'price') {
      actualPct = avgDealVal > 0 && (t.price_target||0) > 0 ? +((t.price_target - (t.price_curr||0)) / avgDealVal * 100).toFixed(1) : null;
    } else {
      // Absolute pp improvement in conversion rate (target% - current%)
      actualPct = (r.currPct != null && r.tgtPct != null) ? +((r.tgtPct||0) - r.currPct).toFixed(1) : null;
    }
    const actualHTML = actualPct != null
      ? `<span class="conv-pct ${actualPct>=0?'good':'bad'}">${actualPct>=0?'+':''}${actualPct}%</span>`
      : '—';

    // ── Col 7: Cumulative % Increase ─────────────────────────────────────────
    // Stage 1: same as actual% (first stage, no prior chain)
    // Conv stages: (proj_count_at_stage - curr_count_at_stage) / curr_count_at_stage × 100
    //   This shows the compound chain effect: more leads AND better conversion
    // Upsell, Price: — (multiplicative revenue effects, not part of the chain count)
    let cumulativePct;
    if (r.id === 'leads') {
      cumulativePct = actualPct;
    } else if (r.id === 'upsell' || r.id === 'price') {
      cumulativePct = null;
    } else {
      const currBase = r.id === 'won' ? wonCurr : r.curr;
      cumulativePct = (currBase > 0 && prj != null) ? +((prj - currBase) / currBase * 100).toFixed(1) : null;
    }
    const cumulativeHTML = cumulativePct != null
      ? `<span class="conv-pct ${cumulativePct>=0?'good':'bad'}">${cumulativePct>=0?'+':''}${cumulativePct}%</span>`
      : '—';

    return `<tr>
      <td><div style="font-weight:500">${r.label}</div>${r.desc?`<div style="font-size:11px;color:var(--tl);margin-top:2px">${r.desc}</div>`:''}</td>
      <td style="text-align:right">${currCell}</td>
      <td style="text-align:right">${currPctCell}</td>
      <td style="text-align:right">${tgtCountCell}</td>
      <td style="text-align:right">${tgtPctCell}</td>
      <td style="text-align:right">${actualHTML}</td>
      <td style="text-align:right">${cumulativeHTML}</td>
    </tr>`;
  }).join('');

  // ── Stage 5 TOTAL IMPACT rows ─────────────────────────────────────────────
  const cumUpliftDisp = cumulativeUplift.toFixed(1);
  const omStage5HTML = `
    <tr class="om-stage-hdr"><td colspan="7" style="background:#0d2b45">STAGE 5 — TOTAL IMPACT &amp; COMBINED UPLIFT EFFECT</td></tr>
    <tr style="background:#f0f7ff">
      <td>
        <div style="font-weight:600;color:var(--navy)">Total Revenue Per Month</div>
        <div style="font-size:11px;color:var(--tl);margin-top:2px">Won ${unitLabel}/mo × avg deal value · model projection</div>
      </td>
      <td style="text-align:right;font-weight:600">${fmtDollar(currRevMonth)}<span style="font-size:10px;color:var(--tl)">/mo</span></td>
      <td style="text-align:center;color:var(--tl)">→</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">${fmtDollar(projRevMonth)}<span style="font-size:10px;color:var(--tl)">/mo</span></td>
      <td style="text-align:right">—</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">+${fmtDollar(projRevMonth - currRevMonth)}<span style="font-size:10px;color:var(--tl)">/mo</span></td>
      <td style="text-align:right"><span class="conv-pct ${cumulativeUplift>=0?'good':'bad'}">${cumulativeUplift>=0?'+':''}${cumUpliftDisp}%</span><div style="font-size:9px;color:var(--tl)">cumulative</div></td>
    </tr>
    <tr style="background:#f0f7ff;border-top:1px solid #dce7f0">
      <td>
        <div style="font-weight:600;color:var(--navy)">Annual Revenue</div>
        <div style="font-size:11px;color:var(--tl);margin-top:2px">Monthly rate × 12 · assumes constant win rate</div>
      </td>
      <td style="text-align:right;font-weight:600">${fmtDollar(currRevYear)}</td>
      <td style="text-align:center;color:var(--tl)">→</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">${fmtDollar(projRevYear)}</td>
      <td style="text-align:right">—</td>
      <td style="text-align:right;font-weight:600;color:var(--gr)">+${fmtDollar(projRevYear - currRevYear)}<span style="font-size:10px;color:var(--tl)">/yr</span></td>
      <td style="text-align:right"><span class="conv-pct ${cumulativeUplift>=0?'good':'bad'}">${cumulativeUplift>=0?'+':''}${cumUpliftDisp}%</span><div style="font-size:9px;color:var(--tl)">cumulative</div></td>
    </tr>`;

  // ── Render ────────────────────────────────────────────────────────────────
  sc.innerHTML = `
  <div class="box">
    <div class="box-title">OPTI-MAX Sales Growth Model
      <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:auto">

          <span style="font-size:11px;color:var(--tl)">Avg lic price: $</span>
          <input class="om-input" style="width:72px" type="number" min="100" step="500" value="${t.avg_lic_price||8000}" onchange="omSave('avg_lic_price',this.value)">
        </div>` : ''}
    </div>

    <div class="cards" style="margin-bottom:18px">
      <div class="card"><div class="card-label">Won ${unitLabel} (all time)</div><div class="card-value">${wonCurr}</div><div class="card-sub">2026 Sales pipeline</div></div>
      <div class="card"><div class="card-label">Projected won / month (target)</div><div class="card-value" style="color:var(--gr)">${projWon??'—'}</div>${projImpPct!=null?`<div class="card-sub" style="color:var(--gr)">+${projImpPct}% improvement</div>`:''}</div>
      <div class="card"><div class="card-label">Revenue / month (current)</div><div class="card-value">${fmtDollar(currRevMonth)}</div><div class="card-sub">${fmtDollar(currRevYear)}/yr at current rate</div></div>
      <div class="card"><div class="card-label">Revenue / month (target)</div><div class="card-value" style="color:var(--gr)">${fmtDollar(projRevMonth)}</div><div class="card-sub" style="color:var(--gr)">+${fmtDollar(projRevMonth-currRevMonth)}/mo uplift</div></div>
    </div>

    <div style="overflow-x:auto">
      <table class="om-table">
        <thead><tr>
          <th style="min-width:240px">Stage</th>
          <th style="text-align:right;min-width:90px">Current #<div style="font-size:10px;font-weight:400;color:var(--tl)">per month</div></th>

          <th style="text-align:right;min-width:80px">Cumulative %<div style="font-size:10px;font-weight:400;color:var(--tl)">increase</div></th>
        </tr></thead>
        <tbody>

  <!-- Revenue projection chart -->

    <p style="font-size:12px;color:var(--tm);margin-bottom:12px;line-height:1.5">

      Annual licence at avg ${fmtDollar(avgDealVal)} · 0% churn assumption.
    </p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      <div class="card" style="margin:0"><div class="card-label">Year 1 · current</div><div class="card-value" style="font-size:20px">${fmtM(currARR1y)}</div></div>
      <div class="card" style="margin:0"><div class="card-label">Year 1 · target</div><div class="card-value" style="font-size:20px;color:var(--gr)">${fmtM(targARR1y)}</div><div class="card-sub" style="color:var(--gr)">+${fmtM(targARR1y-currARR1y)}</div></div>
      <div class="card" style="margin:0"><div class="card-label">Year 3 · current</div><div class="card-value" style="font-size:20px">${fmtM(currARR3y)}</div></div>
      <div class="card" style="margin:0"><div class="card-label">Year 3 · target</div><div class="card-value" style="font-size:20px;color:var(--gr)">${fmtM(targARR3y)}</div><div class="card-sub" style="color:var(--gr)">+${fmtM(targARR3y-currARR3y)}</div></div>
    </div>
    <div class="chart-wrap" style="height:280px"><canvas id="pd-om-rev"></canvas></div>
  </div>

  <!-- Sales velocity -->
  <div class="box">
    <div class="box-title">Sales Velocity Targets</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div>
            <div style="font-size:13px;font-weight:500;color:var(--navy)">% won within 30 days</div>
            <div style="font-size:11px;color:var(--tl)">${w30Cnt} of ${cycleDays.length} won deals · all time</div>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-size:11px;color:var(--tl)">Target:</span>
            <input class="om-input" style="width:54px" type="number" min="0" max="100" step="5" value="${t.cycle_30d_target}" onchange="omSave('cycle_30d_target',this.value)">
            <span style="font-size:11px;color:var(--tl)">%</span>
