            <div style="font-size:11px;color:var(--tl)">${avgCycle!=null?avgCycle+'d actual':'no data yet'} · created → won</div>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-size:11px;color:var(--tl)">Target:</span>
            <input class="om-input" style="width:54px" type="number" min="1" max="365" step="1" value="${t.avg_cycle_target}" onchange="omSave('avg_cycle_target',this.value)">
            <span style="font-size:11px;color:var(--tl)">d</span>
          </div>
        </div>
        <div class="chart-wrap" style="height:130px"><canvas id="pd-om-velcyc"></canvas></div>
      </div>
    </div>
  </div>`;

  // Revenue line chart
  const moLabels = proj36M.map(m => [1,6,12,18,24,30,36].includes(m) ? (m===12?'Yr 1':m===24?'Yr 2':m===36?'Yr 3':'Mo '+m) : '');
  makeChart('pd-om-rev', {
    type:'line',
    data:{ labels: moLabels,
      datasets:[
        { label:'Current trajectory', data:currCumARR, borderColor:'#2e8bc0', borderWidth:2.5, tension:.3, fill:false,
          pointRadius: proj36M.map(m=>[1,12,24,36].includes(m)?4:0) },
        { label:'OPTI-MAX target', data:targCumARR, borderColor:'#2a7a4b', borderWidth:2.5, tension:.3, fill:false,
          pointRadius: proj36M.map(m=>[1,12,24,36].includes(m)?4:0) },
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ position:'bottom', labels:{ font:{family:'DM Sans',size:11}, boxWidth:12 } } },
      scales:{
        x:{ grid:{display:false}, ticks:{ ...axStyle, callback:(v,i)=>moLabels[i]||null, maxRotation:0 } },
        y:{ grid:gridStyle, ticks:{ ...axStyle, callback:v=>v>=1000000?'$'+(v/1000000).toFixed(1)+'M':'$'+(v/1000).toFixed(0)+'k' }, beginAtZero:true }
      }
    }
  });

  // Velocity charts
  makeChart('pd-om-vel30', {
    type:'bar',
    data:{ labels:['Actual','Target'],
      datasets:[{ data:[w30Pct??0, t.cycle_30d_target],
        backgroundColor:[w30Pct!=null&&w30Pct>=t.cycle_30d_target?'#2a7a4b':'#2e8bc0','rgba(196,94,0,0.25)'],
        borderColor:[w30Pct!=null&&w30Pct>=t.cycle_30d_target?'#2a7a4b':'#2e8bc0','#c25a00'],
        borderWidth:2, borderRadius:4 }]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>' '+ctx.raw.toFixed(1)+'%' }} },
      scales:{ x:{ grid:gridStyle, ticks:{...axStyle,callback:v=>v+'%'}, min:0, max:100 }, y:{grid:{display:false},ticks:axStyle} }
    }
  });
  const maxCB = Math.max((avgCycle||0), t.avg_cycle_target) * 1.3;
  makeChart('pd-om-velcyc', {
    type:'bar',
    data:{ labels:['Actual','Target'],
      datasets:[{ data:[avgCycle??0, t.avg_cycle_target],
        backgroundColor:[avgCycle!=null&&avgCycle<=t.avg_cycle_target?'#2a7a4b':'#2e8bc0','rgba(196,94,0,0.25)'],
        borderColor:[avgCycle!=null&&avgCycle<=t.avg_cycle_target?'#2a7a4b':'#2e8bc0','#c25a00'],
        borderWidth:2, borderRadius:4 }]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>' '+ctx.raw+' days' }} },
      scales:{ x:{ grid:gridStyle, ticks:{...axStyle,callback:v=>v+'d'}, min:0, max:Math.ceil(maxCB) }, y:{grid:{display:false},ticks:axStyle} }
    }
  });
}

// ── CUSTOMER HEALTH SCORE ─────────────────────────────────────────────────────
function renderPdHealth(sc) {
  const people  = _pd_people;
  const deals   = _pd_deals;
  const training = load('training');   // [{ org, date, ... }]
  const ph      = _ph;

  if (!people.length) {
    sc.innerHTML = `<div class="empty-state"><p>No Pipedrive people data loaded. Import a People CSV first.</p></div>`;
    return;
  }

  // ── Build per-org metrics ──────────────────────────────────────────────
  // Group paid subscribers by org
  const paidPeople = people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
  const orgMap = {};   // org → { people[], licenceType, accessDate, trained, dealValue }

  for (const p of paidPeople) {
    const org = (p['Person - Organisation'] || 'Unknown').trim();
    if (!orgMap[org]) orgMap[org] = { people:[], trained:0, dealValue:0, accessDate:null };
    orgMap[org].people.push(p);
    const ad = pdParseDate(p['Person - Date Access Granted']);
    if (ad && (!orgMap[org].accessDate || ad > orgMap[org].accessDate)) orgMap[org].accessDate = ad;
  }

  // Add deal values
  const now = new Date();
  for (const d of deals) {
    if (d['Deal - Status'] !== 'Won') continue;
    const org = (d['Person - Organisation'] || d['Deal - Organisation'] || '').trim();
    if (orgMap[org]) orgMap[org].dealValue += (parseFloat(d['Deal - Value']) || 0);
  }

  // Training events — count per org
  const trainedOrgs = {};
  for (const t of training) {
    const org = (t.org || t.organisation || '').trim();
    if (org) trainedOrgs[org] = (trainedOrgs[org] || 0) + 1;
  }

  // PostHog at-risk lookup (distinct_id often matches email)
  const atRiskSet = new Set((ph.atRisk || []).map(u => u.distinct_id?.toLowerCase()));
  const powerSet  = new Set((ph.powerUsers   || []).map(u => u.distinct_id?.toLowerCase()));

  // Full per-email usage map (best source) — available once posthog_add_emails.sql
  // has been run and the sync has refilled the summaries.
  const emailAct = {};   // email → { last_seen: Date, active_days }
  (ph.emailActivity || []).forEach(r => {
    if (!r.email) return;
    const ls = new Date(r.last_seen);
    emailAct[r.email.toLowerCase()] = { last_seen: isNaN(ls) ? null : ls, active_days: Number(r.active_days) || 0 };
  });
  const hasEmailAct = Object.keys(emailAct).length > 0;

  // ── Usage-match reliability check (#6) ──────────────────────────────────
  const allCustEmails = [...new Set(paidPeople.map(p => (p['Person - Email'] || p['Email'] || '').toLowerCase()).filter(Boolean))];
  let matchVerdict, custEmailsMatched, knownPhIds = [];
  if (hasEmailAct) {
    // Direct measurement: how many customer emails appear in the usage data
    custEmailsMatched = allCustEmails.filter(e => emailAct[e]).length;
    const sharePct = allCustEmails.length ? Math.round(custEmailsMatched / allCustEmails.length * 100) : null;
    knownPhIds = Object.keys(emailAct);
    matchVerdict = sharePct == null
      ? { col:'var(--tl)', txt:'No customer emails found in the sales records — export the People CSV with the email column.' }
      : sharePct >= 40
        ? { col:'var(--gr)', txt:`${sharePct}% of paying customers matched to their product usage (${custEmailsMatched} of ${allCustEmails.length}). The activity column below is measured, not guessed.` }
        : { col:'var(--wa)', txt:`Only ${sharePct}% of paying customers matched to usage data (${custEmailsMatched} of ${allCustEmails.length}) — many product accounts don't use their work email. Matched orgs are measured; unmatched orgs show "unknown".` };
  } else {
    // Fallback: only at-risk + power user IDs are available — check if they look like emails
    knownPhIds = [...new Set([...atRiskSet, ...powerSet])].filter(Boolean);
    const phIdsLookLikeEmail = knownPhIds.filter(id => id.includes('@')).length;
    const phEmailShare = knownPhIds.length ? Math.round(phIdsLookLikeEmail / knownPhIds.length * 100) : null;
    custEmailsMatched = allCustEmails.filter(e => atRiskSet.has(e) || powerSet.has(e)).length;
    matchVerdict = phEmailShare == null
      ? { col:'var(--tl)', txt:'No product-usage IDs loaded yet — load the Activity data to check.' }
      : { col:'var(--wa)', txt:`Approximate matching only. Run posthog_add_emails.sql then re-run the sync to enable full email matching (currently ${phEmailShare}% of the limited ID sample look like emails).` };
  }

  // ── Score each org ─────────────────────────────────────────────────────
  // Scoring dimensions (100 pts total):
  //   Licence size  (25): 1 user=5, 2-5=12, 6-15=20, 16+=25
  //   Tenure        (20): months since access date (capped at 24m → 20pts)
  //   Training      (20): any training event → 10, 2+ → 15, 3+ → 20
  //   Deal value    (15): >$0 → 5, >$5k → 10, >$20k → 15
  //   PostHog usage (20): power user in org → 20, no at-risk → 12, at-risk → 0
  const orgs = [];
  for (const [org, m] of Object.entries(orgMap)) {
    const n = m.people.length;

    // Licence size
    let scoreSize = n >= 16 ? 25 : n >= 6 ? 20 : n >= 2 ? 12 : 5;

    // Tenure
    let scoreTenure = 0;
    if (m.accessDate) {
      const months = (now - m.accessDate) / (1000 * 60 * 60 * 24 * 30.44);
      scoreTenure = Math.min(20, Math.round((months / 24) * 20));
    }

    // Training
    const tCount = trainedOrgs[org] || 0;
    const scoreTrain = tCount >= 3 ? 20 : tCount >= 2 ? 15 : tCount >= 1 ? 10 : 0;

    // Deal value
    const scoreVal = m.dealValue >= 20000 ? 15 : m.dealValue >= 5000 ? 10 : m.dealValue > 0 ? 5 : 0;

    // Product usage — measured per org where email matching is available
    const orgEmails = m.people.map(p => (p['Person - Email'] || p['Email'] || '').toLowerCase()).filter(Boolean);
    let scorePH, lastUsed = null;
    if (hasEmailAct) {
      // Most recent activity across the org's matched users
      const acts = orgEmails.map(e => emailAct[e]).filter(Boolean);
      if (acts.length) {
        lastUsed = acts.reduce((mx, a) => (a.last_seen && (!mx || a.last_seen > mx) ? a.last_seen : mx), null);
        const daysQuiet = lastUsed ? Math.floor((now - lastUsed) / 86400000) : null;
        scorePH = daysQuiet == null ? 10
                : daysQuiet <= 14 ? 20      // used in the last fortnight
                : daysQuiet <= 30 ? 14      // used in the last month
                : daysQuiet <= 90 ? 6       // going quiet
                : 2;                        // effectively dormant
      } else {
        scorePH = 10;                       // no matched users → unknown
      }
    } else {
      // Fallback: only power/at-risk ID lists available
      const hasPower  = orgEmails.some(e => powerSet.has(e));
      const hasAtRisk = orgEmails.some(e => atRiskSet.has(e));
      scorePH = hasPower ? 20 : hasAtRisk ? 0 : 12;
    }

    const total = scoreSize + scoreTenure + scoreTrain + scoreVal + scorePH;

    orgs.push({ org, n, total, scoreSize, scoreTenure, scoreTrain, scoreVal, scorePH, lastUsed,
      accessDate: m.accessDate, dealValue: m.dealValue, tCount });
  }

  orgs.sort((a, b) => b.total - a.total);

  // ── Bands ──────────────────────────────────────────────────────────────
  const healthy  = orgs.filter(o => o.total >= 70);
  const atRisk   = orgs.filter(o => o.total >= 40 && o.total < 70);
  const critical = orgs.filter(o => o.total < 40);

  const avgScore = orgs.length ? Math.round(orgs.reduce((s,o)=>s+o.total,0)/orgs.length) : 0;

  function scoreBar(v) {
    const col = v >= 70 ? '#2a7a4b' : v >= 40 ? '#e6a817' : '#e05252';
    return `<div style="display:flex;align-items:center;gap:6px;">
      <div style="flex:1;height:6px;background:#eee;border-radius:3px;">
        <div style="width:${v}%;height:100%;background:${col};border-radius:3px;"></div>
      </div>
      <span style="font-size:12px;font-weight:600;color:${col};min-width:28px;">${v}</span>
    </div>`;
  }

  function dimBar(v, max, col) {
    return `<div style="width:${Math.round((v/max)*100)}%;height:4px;background:${col};border-radius:2px;"></div>`;
  }

  const rowsHTML = orgs.map(o => `
    <tr>
      <td style="font-weight:500;">${o.org}</td>
      <td style="text-align:center;">${o.n}</td>
      <td style="min-width:120px;">${scoreBar(o.total)}</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreSize>=20?'#2a7a4b':o.scoreSize>=12?'#555':'#e05252'}">${o.scoreSize}/25</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreTenure>=15?'#2a7a4b':o.scoreTenure>=8?'#555':'#e05252'}">${o.scoreTenure}/20</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreTrain>=15?'#2a7a4b':o.scoreTrain>=10?'#555':'#e05252'}">${o.scoreTrain}/20</td>
      <td style="text-align:center;font-size:11px;color:${o.scoreVal>=10?'#2a7a4b':o.scoreVal>=5?'#555':'#e05252'}">${o.scoreVal}/15</td>
      <td style="text-align:center;font-size:11px;color:${o.scorePH>=15?'#2a7a4b':o.scorePH>=10?'#555':'#e05252'}">${o.scorePH}/20${o.lastUsed?`<br><span style="color:var(--tl);font-size:10px">${fmtDate(o.lastUsed).slice(0,6)}</span>`:''}</td>
      <td style="text-align:center;font-size:11px;">${o.tCount || '—'}</td>
      <td style="text-align:center;font-size:11px;">${o.accessDate ? fmtDate(o.accessDate).slice(0,6) : '—'}</td>
      <td style="text-align:right;font-size:11px;">${o.dealValue ? fmtCur(o.dealValue) : '—'}</td>
    </tr>`).join('');

  sc.innerHTML = `
    <div class="section-block">
      <h3>Customer Health Score ${infoBtn('Customer Health Score',
        `<p>Composite 0–100 score per paying organisation based on five dimensions:</p>
        <div class="calc-row">Licence size (25) + Tenure (20) + Training (20) + Deal value (15) + PostHog usage (20)</div>
        <p><b>Green ≥ 70</b> · <b>Amber 40–69</b> · <b>Red &lt; 40</b></p>
        <p>PostHog matching uses email address. Orgs with no PostHog data receive 12/20 (unknown).</p>
        <span class="src-tag">Pipedrive People + Deals · Training log · PostHog at-risk / power users</span>`)}</h3>
      ${cardsHTML([
        ['Avg health score', avgScore, null, null, `across ${orgs.length} orgs`],
        ['Healthy orgs (≥70)', healthy.length, null, null, `${fmtPct(pct(healthy.length, orgs.length))} of total`],
        ['At-risk orgs (40–69)', atRisk.length, null, null, null],
        ['Critical orgs (<40)', critical.length, null, null, null],
      ])}
      <div style="margin-top:12px;padding:10px 14px;border-left:3px solid ${matchVerdict.col};background:var(--bg2);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tm)">
        <b style="color:${matchVerdict.col}">Product-usage match reliability:</b> ${matchVerdict.txt}
        ${phEmailShare != null ? `<br><span style="color:var(--tl)">${custEmailsMatched} of ${allCustEmails.length} customer emails matched a known active/at-risk user · ${knownPhIds.length} usage IDs checked</span>` : ''}
      </div>
    </div>

    <div class="section-block">
      <h3>Score distribution</h3>
      <div class="chart-wrap" style="height:220px"><canvas id="pd-health-dist"></canvas></div>
    </div>

    <div class="section-block">
      <h3>All paying orgs — ranked by health score</h3>
      <div style="overflow-x:auto;">
        <table class="data-table" style="font-size:12px;">
          <thead><tr>
            <th>Organisation</th>
            <th style="text-align:center;">Users</th>
            <th>Score</th>
            <th style="text-align:center;">Licence</th>
            <th style="text-align:center;">Tenure</th>
            <th style="text-align:center;">Training</th>
            <th style="text-align:center;">Deal $</th>
            <th style="text-align:center;">Activity</th>
            <th style="text-align:center;">Sessions</th>
            <th style="text-align:center;">Since</th>
            <th style="text-align:right;">Revenue est.</th>
          </tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
      </div>
    </div>`;

  // Score distribution histogram
  const bands = [
    { label:'0–19',   col:'#e05252', count: orgs.filter(o=>o.total<20).length },
    { label:'20–39',  col:'#f08080', count: orgs.filter(o=>o.total>=20&&o.total<40).length },
    { label:'40–59',  col:'#e6a817', count: orgs.filter(o=>o.total>=40&&o.total<60).length },
    { label:'60–69',  col:'#a0c050', count: orgs.filter(o=>o.total>=60&&o.total<70).length },
    { label:'70–84',  col:'#2a7a4b', count: orgs.filter(o=>o.total>=70&&o.total<85).length },
    { label:'85–100', col:'#1a5c36', count: orgs.filter(o=>o.total>=85).length },
  ];
  makeChart('pd-health-dist', {
    type:'bar',
    data:{ labels: bands.map(b=>b.label), datasets:[{ label:'Orgs', data: bands.map(b=>b.count), backgroundColor: bands.map(b=>b.col), borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ grid:{display:false}, ticks:axStyle }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
    }
  });
}

function updateDbStatusPill() {
  const dot  = document.getElementById('db-status-dot');
  const text = document.getElementById('db-status-text');
  if (!dot || !text) return;
  if (_dbStatus.ok) {
    dot.style.background  = '#2a7a4b';
    text.textContent = `DB · ${_dbStatus.deals} deals · ${_dbStatus.dashboardRows} keys`;
    document.getElementById('db-status-pill').title =
      `Connected · ${_dbStatus.deals} deals · ${_dbStatus.people} contacts · ${_dbStatus.dashboardRows} data keys · checked ${_dbStatus.checkedAt?.toLocaleTimeString()}`;
  } else {
    dot.style.background  = '#e05252';
    text.textContent = 'DB offline';
    document.getElementById('db-status-pill').title =
      `Error: ${_dbStatus.error || 'unknown'} · Run supabase_harden.sql if RLS issue`;
  }
}

async function init() {
  await loadAll();
  await loadMetricFlags();
  updateDbStatusPill();
  buildNav();
  startFlagObserver();
  renderTab('home');
  // Load PostHog live data in background (non-blocking)
  loadPostHogLive().then(() => {
    // If user is on Activity tab, refresh it with live data
    if (activeTab === 'activity') renderActivity();
  });
}

// init() is called by initialiseDatabaseAuth() → showApp() after successful auth

// ─────────────────────────────────────────
// INFO POPUP SYSTEM
// ─────────────────────────────────────────
const _INFO = {};
function infoBtn(title, body) {
  const id = 'inf_' + Math.random().toString(36).slice(2, 9);
  _INFO[id] = { title, body };
  return `<button class="info-btn" onclick="event.stopPropagation();showInfoById('${id}')" title="Data source">i</button>`;
}
function showInfoById(id) {
  const d = _INFO[id];
  if (d) showInfo(d.title, d.body);
}
function showInfo(title, body) {
  document.getElementById('info-box-title').textContent = title;
  document.getElementById('info-box-body').innerHTML = body;
  document.getElementById('info-overlay').classList.add('open');
}
function closeInfo() {
  document.getElementById('info-overlay').classList.remove('open');
}
</script>

<div id="info-overlay" onclick="closeInfo()">
  <div id="info-box" onclick="event.stopPropagation()">
    <button id="info-close" onclick="closeInfo()">✕</button>
    <div id="info-box-title"></div>
    <div id="info-box-body"></div>
  </div>
</div>
</body>
