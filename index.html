<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land iQ Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root {
  --navy:#1a3c5e; --navy2:#24527f; --acc:#2e8bc0; --acc2:#e8f3f9;
  --sur:#f4f6f8; --wh:#fff; --tx:#1a2733; --tm:#4a5f70; --tl:#8a9fb0;
  --bd:#dde5ec; --gr:#2a7a4b; --gr2:#e8f5ee; --wa:#c25a00; --wa2:#fdf0e6;
  --re:#c0392b; --re2:#fdecea;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sur);color:var(--tx);font-size:14px;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

/* LOCK */
#lock{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:24px}
.lock-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px;width:340px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(10px)}
.lock-logo{color:#fff;font-size:22px;font-weight:700;text-align:center;letter-spacing:-.02em}.lock-logo span{color:var(--acc)}
.lock-sub{color:rgba(255,255,255,.4);font-size:12px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.lock-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;width:100%;font-family:inherit;outline:none}
.lock-input::placeholder{color:rgba(255,255,255,.3)}
.lock-input:focus{border-color:var(--acc)}
.lock-btn{background:var(--acc);color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.lock-btn:hover{background:var(--navy2)}
.lock-err{color:#ff6b6b;font-size:12px;text-align:center;min-height:18px}

/* LAYOUT */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.h-logo{color:#fff;font-weight:700;font-size:16px;letter-spacing:-.02em}.h-logo span{color:var(--acc)}
.h-tag{font-size:9px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:2px 7px;letter-spacing:.1em;font-family:'DM Mono',monospace}
.h-space{flex:1}
.h-actions{display:flex;gap:8px;align-items:center}
.h-link{font-size:12px;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;padding:4px 10px;border-radius:4px;font-family:inherit;text-decoration:none;transition:.15s}
.h-link:hover{color:#fff;background:rgba(255,255,255,.08)}

nav{background:var(--wh);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;overflow-x:auto;flex-shrink:0}
.nav-btn{padding:13px 16px 11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tl);font-weight:400;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;margin-bottom:-1px}
.nav-btn:hover{color:var(--navy)}
.nav-btn.active{color:var(--navy);font-weight:600;border-bottom-color:var(--acc)}

main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.card-label{font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.card-value{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.03em;line-height:1.1}
.card-nodata{font-size:13px;color:var(--tl)}
.card-change{font-size:11px;font-weight:600}
.card-change.up{color:var(--gr)}.card-change.dn{color:var(--re)}
.card-sub{font-size:11px;color:var(--tl)}

/* BOXES */
.box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.box-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.box-title a{font-size:11px;color:var(--acc);font-weight:400;text-decoration:none}
.box-title a:hover{text-decoration:underline}
.no-data{text-align:center;color:var(--tl);font-size:13px;padding:40px 0}

/* CALLOUT */
.callout{border-radius:8px;padding:12px 16px;margin-bottom:14px}
.callout.warn{background:var(--wa2);border:1px solid #e5b896}
.callout.info{background:var(--acc2);border:1px solid #b3d4e8}
.callout.good{background:var(--gr2);border:1px solid #a8d5b5}
.callout-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.callout.warn .callout-label{color:var(--wa)}
.callout.info .callout-label{color:var(--acc)}
.callout.good .callout-label{color:var(--gr)}
.callout-text{font-size:13px;color:var(--tm);line-height:1.5}

/* FORMS */
.form-section{margin-bottom:14px}
.add-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s}
.add-btn:hover{background:var(--navy2)}
.add-btn.sec{background:none;color:var(--navy);border:1px solid var(--bd)}
.add-btn.sec:hover{background:var(--sur)}
.form-box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-top:10px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:var(--tm);font-weight:500;letter-spacing:.02em}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--wh);outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,139,192,.1)}
textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-save{background:var(--acc);color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#2477a8}
.btn-cancel{background:none;border:1px solid var(--bd);color:var(--tm);border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.form-divider{font-size:12px;color:var(--tl);padding:8px 0;border-top:1px solid var(--bd);margin-bottom:8px}
.source-note{font-size:10px;color:var(--tl);margin-top:2px}
.input-group-label{font-size:12px;font-weight:600;color:var(--navy);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--bd)}

/* TABLE */
.tbl-wrap{background:var(--wh);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tbl-head{font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;padding:10px 16px;border-bottom:1px solid var(--bd);background:#fafafa;display:flex;justify-content:space-between;align-items:center}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--tl);font-weight:500;font-size:11px;border-bottom:1px solid var(--bd);background:#fafafa;white-space:nowrap}
td{padding:8px 12px;color:var(--tm);border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcfe}
.btn-del{background:none;border:none;color:var(--re);font-size:11px;cursor:pointer;font-family:inherit;padding:2px 6px}
.show-all-btn{font-size:12px;color:var(--acc);background:none;border:none;cursor:pointer;padding:8px 16px;font-family:inherit}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.badge-linkedin{background:#e1f3ff;color:#0a66c2}
.badge-youtube{background:#ffe1e1;color:#c0392b}
.badge-edm{background:#e8f5ee;color:#2a7a4b}
.badge-viva{background:#fff3e0;color:#c25a00}
.badge-blog{background:#f3e5f5;color:#7b1fa2}
.badge-speaking{background:#e0f2f1;color:#00796b}
.badge-webinar{background:#e8eaf6;color:#3949ab}

/* PIPELINE */
.pipeline{display:grid;gap:0;margin-bottom:14px}
.pipeline-stage{display:flex;align-items:center;gap:0;position:relative}
.stage-bar-wrap{flex:1;background:var(--wh);border:1px solid var(--bd);padding:12px 16px;position:relative;overflow:hidden}
.stage-bar-wrap:first-child{border-radius:8px 8px 0 0}
.stage-bar-wrap:last-child{border-radius:0 0 8px 8px}
.stage-bg{position:absolute;left:0;top:0;bottom:0;background:var(--acc2);transition:.5s}
.stage-content{position:relative;display:flex;align-items:center;gap:12px}
.stage-name{font-size:12px;font-weight:500;color:var(--navy);min-width:160px}
.stage-count{font-size:20px;font-weight:700;color:var(--navy);min-width:50px;font-family:'DM Mono',monospace}
.stage-conv{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:4px}
.stage-conv-arrow{font-size:10px;color:var(--tl)}
.stage-target{font-size:11px;color:var(--tl);margin-left:auto}

/* RANGE TOGGLE */
.range-toggle{display:flex;gap:4px;background:var(--sur);border-radius:6px;padding:3px}
.range-btn{background:none;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.range-btn.active{background:var(--wh);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* FUNNEL CONV TABLE */
.conv-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.conv-table th{text-align:left;padding:6px 10px;color:var(--tl);font-size:11px;font-weight:500;border-bottom:1px solid var(--bd)}
.conv-table td{padding:6px 10px;border-bottom:1px solid var(--bd)}
.conv-table tr:last-child td{border-bottom:none}
.conv-pct{font-family:'DM Mono',monospace;font-weight:600}
.conv-pct.good{color:var(--gr)}.conv-pct.mid{color:var(--wa)}.conv-pct.bad{color:var(--re)}
.conv-pct.good::before{content:"\25B2 "}.conv-pct.mid::before{content:"\25C6 "}.conv-pct.bad::before{content:"\25BC "}

/* OPTI-MAX TABLE */
.om-table{width:100%;border-collapse:collapse;font-size:13px}
.om-table th{padding:9px 12px;font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.06em;background:#f5f7fa;border-bottom:2px solid var(--bd);text-align:left}
.om-table td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.om-table tr.om-stage-hdr td{background:#1a3c5e;color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.om-table tr:last-child td{border-bottom:none}
.om-input{padding:4px 7px;border:1.5px solid var(--acc);border-radius:5px;font-size:12px;font-family:'DM Mono',monospace;text-align:right;background:var(--wh);width:72px;color:var(--navy);font-weight:600}
.om-input:focus{outline:none;border-color:var(--navy)}
.om-input-wide{width:100px}
/* PIPEDRIVE FUNNEL VISUAL */
.pd-funnel-row{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:12px 0}
.pd-funnel-box{min-width:100px;background:#2e8bc0;color:#fff;border-radius:8px;padding:12px 8px;text-align:center;flex-shrink:0}
.pd-funnel-box.won-box{background:#2a7a4b}
.pd-funnel-count{font-size:22px;font-weight:700;line-height:1}
.pd-funnel-name{font-size:10px;opacity:.9;margin-top:4px;line-height:1.3}
.pd-funnel-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;min-width:48px;gap:2px}
.pd-funnel-pct{font-size:12px;font-weight:700}
.pd-funnel-chevron{color:var(--tl);font-size:18px;line-height:1}
/* OUTCOME ITEM */
.outcome-item{font-size:13px;color:var(--tm);padding:8px 12px;border-left:3px solid var(--acc);margin-bottom:8px;line-height:1.5;background:var(--acc2);border-radius:0 6px 6px 0}

/* FRESHNESS ROW */
.fresh-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.fresh-row:last-child{border-bottom:none}

/* TABS WITHIN TAB */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--sur);padding:4px;border-radius:8px;width:fit-content}
.sub-tab{background:none;border:none;padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.sub-tab.active{background:var(--wh);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideup .2s ease}
@keyframes slideup{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* CHART WRAP */
.chart-wrap{position:relative;width:100%}

/* SOURCE LINK */
.src-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--acc);text-decoration:none;padding:3px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--wh)}
.src-link:hover{background:var(--acc2)}

/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.section-sub{font-size:12px;color:var(--tl);margin-top:2px}

/* INFO BUTTON + MODAL */
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:none;border:1px solid var(--tl);color:var(--tl);font-size:9px;font-weight:700;cursor:pointer;margin-left:4px;padding:0;vertical-align:middle;line-height:1;flex-shrink:0}
.info-btn:hover{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
#info-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center}
#info-overlay.open{display:flex}
#info-box{background:var(--wh);border-radius:12px;padding:24px 28px;max-width:440px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.18);position:relative}
#info-box-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;padding-right:24px}
#info-box-body{font-size:13px;color:var(--tx);line-height:1.6}
#info-box-body b{color:var(--navy)}
#info-box-body .src-tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;margin-bottom:8px}
#info-box-body .calc-row{margin-top:8px;padding:8px 10px;background:#f4f6f8;border-radius:6px;font-size:12px;color:var(--tm);font-family:monospace}
#info-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--tl);cursor:pointer;line-height:1;padding:2px 4px}
#info-close:hover{color:var(--navy)}
@media print {
  #main-nav, #auth-bar, #db-status-pill, .add-btn, button:not([onclick="window.print()"]), .form-section { display:none!important; }
  body, html { background:#fff!important; }
  .box, .card { break-inside:avoid; box-shadow:none!important; border:1px solid #ddd!important; }
  .chart-wrap { max-height:180px!important; }
  #main-content { padding:0!important; }
}
/* ── Metric trust flags ── */
.flag-dot{display:none;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle;box-sizing:border-box;border:1.5px solid transparent;flex-shrink:0}
.flag-dot.green{display:inline-block;background:#2a7a4b}
.flag-dot.yellow{display:inline-block;background:#e6a817}
.flag-dot.red{display:inline-block;background:#e05252}
body.review-mode .flag-dot{display:inline-block;cursor:pointer;background:transparent;border-color:#c4c4c4}
body.review-mode .flag-dot.green{background:#2a7a4b;border-color:#2a7a4b}
body.review-mode .flag-dot.yellow{background:#e6a817;border-color:#e6a817}
body.review-mode .flag-dot.red{background:#e05252;border-color:#e05252}
body.review-mode .flag-dot:hover{transform:scale(1.35)}
/* Hide-metric toggle (review mode): curate what shows in the everyday view */
.hide-toggle{display:none}
body.review-mode .hide-toggle{display:inline-block;cursor:pointer;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--acc);background:var(--acc2);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;margin-left:6px;user-select:none;vertical-align:middle}
body.review-mode .hide-toggle:hover{border-color:var(--acc)}
body:not(.review-mode) .metric-hidden{display:none !important}
body.review-mode .metric-hidden{opacity:.4;outline:1px dashed #c4c4c4;outline-offset:3px}
/* Marketing section headings + posts/events calendar */
.mk-head{font-size:15px;font-weight:700;color:var(--acc);margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--acc2);letter-spacing:.02em}
.gantt{border-collapse:collapse;min-width:640px;width:100%}
.gantt th,.gantt td{border:1px solid var(--bd);padding:3px 4px;text-align:center}
.gantt .gc-type{text-align:left;font-size:11.5px;font-weight:600;color:var(--tx);white-space:nowrap;padding:4px 10px}
.gantt .gc-month{font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc2);letter-spacing:.4px;white-space:nowrap}
.gantt .gc-week{font-size:9.5px;color:var(--tl);min-width:34px;font-weight:500}
.gantt .gc-cell{height:26px;min-width:34px}
.gantt .gc-now{background:var(--acc2)}
.gantt .gc-mstart{border-left:2px solid var(--acc)}
.cal-dot{width:7px;height:7px;border-radius:50%;display:inline-block;box-sizing:border-box;margin:0 1px}
.cal-dot.proposed{background:transparent !important;border:1.5px dashed currentColor}
.cal-dot.confirmed{outline:1.5px solid var(--tx);outline-offset:1px}
.cal-more{font-size:8px;color:var(--tl)}
/* KPI band: the headline metrics, pinned to the top of a tab so they read as "the KPIs" */
.kpi-band{background:var(--acc2);border:1px solid #cfe3f0;border-radius:10px;padding:12px 14px 2px;margin-bottom:22px}
.kpi-band-head{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.kpi-band-head::before{content:'';width:12px;height:12px;border-radius:3px;background:var(--acc);display:inline-block;flex:none}
/* Webinar conversion funnel (OPTI-MAX-style): stage bars scaled to the largest stage */
.fn-wrap{min-width:520px}
.fn-row{display:grid;grid-template-columns:132px 1fr 168px;align-items:center;gap:10px;margin-bottom:7px}
.fn-label{font-size:12px;color:var(--tx);text-align:right;font-weight:500}
.fn-track{background:var(--bg2);border-radius:4px;height:24px;overflow:hidden}
.fn-bar{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;min-width:32px;transition:width .4s}
.fn-val{color:#fff;font-size:11px;font-weight:700;padding-right:7px;white-space:nowrap}
.fn-note{font-size:11px;color:var(--tl)}
.fn-bridge{font-size:10.5px;color:var(--tl);border-top:1px dashed var(--bd);padding-top:6px;margin:2px 0 8px 142px}
/* Review-only blocks: hidden for the everyday/exec view, revealed in review mode */
.review-only{display:none}
body.review-mode .review-only{display:block}
/* ── Data-source freshness banner ── */
.freshness{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.5;padding:9px 13px;border-radius:8px;margin-bottom:14px;border:1px solid}
.freshness.ok{background:#eef7f1;border-color:#b3dfc5;color:#1f6740}
.freshness.warn{background:#fdf6e9;border-color:#f0d9a8;color:#8a5a00}
.freshness.stale{background:#fdeeee;border-color:#f2c2c2;color:#b0342b}
</style>
</head>

// AUTH: Email OTP via Supabase Auth
// State machine: initialising → authenticated ↔ refreshing → unauthenticated

const TARGET_ARR = 2400000;

let _authState   = 'initialising'; // 'initialising'|'authenticated'|'unauthenticated'|'refreshing'
let _authSession = null;
let _authEmail   = null;
let _refreshTimer = null;
let _initInFlight = null; // deduplication: prevents concurrent initialiseDatabaseAuth calls

// ─────────────────────────────────────────
// SUPABASE CLIENT (must be defined before any sb.auth.* calls below)
// ─────────────────────────────────────────
const SUPABASE_URL = 'https://ysdonnjezvoyrrizadik.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZG9ubmplenZveXJyaXphZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODY4MzYsImV4cCI6MjA5MzI2MjgzNn0.9bJ2FPEqV6NEtrnS567HBbwx0zcyQfshfcqWVRvH7RQ';
// Auth config per Database Authentication protocol:
// - persistSession: false  (app manages sessions manually)
// - autoRefreshToken: false (we schedule refresh 5 min before expiry)
// - null storage (no cookies / localStorage leaking tokens)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

    persistSession:     false,

function showLockErr(msg) { document.getElementById('lock-err').textContent = msg || ''; }

// Listen for Supabase auth events: fires when magic link is clicked and user lands back
sb.auth.onAuthStateChange(async (event, session) => {
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
    await initialiseDatabaseAuth(session);
  }
  if (event === 'SIGNED_OUT') {
    showLock();
  }
});

async function initialiseDatabaseAuth(session) {
  // Deduplication: if already in-flight, return same promise
  if (_initInFlight) return _initInFlight;
  _initInFlight = _doInitAuth(session);
  try { await _initInFlight; } finally { _initInFlight = null; }
}

async function _doInitAuth(session) {
  if (!session?.access_token) throw new Error('No session returned');
  // Note: do NOT call sb.auth.setSession() here: the client already has the
  // session set (by signInWithPassword, magic link URL parsing, or the IIFE).
  // Calling setSession again fires a spurious SIGNED_OUT event which hides the app.
  _authSession = session;
  _authState   = 'authenticated';
  try { localStorage.setItem('liq_session', JSON.stringify(session)); } catch {}
  scheduleTokenRefresh(session.expires_at);
  showApp();
}

function scheduleTokenRefresh(expiresAt) {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  // Refresh 5 minutes before token expiry (per protocol spec)
  const msUntilRefresh = (expiresAt * 1000) - Date.now() - (5 * 60 * 1000);
  _refreshTimer = setTimeout(doTokenRefresh, Math.max(0, msUntilRefresh));
}

async function doTokenRefresh() {
  _authState = 'refreshing';
  try {
    const { data, error } = await sb.auth.refreshSession();
    if (error) throw error;
    _authSession = data.session;
    _authState   = 'authenticated';
    try { sessionStorage.setItem('liq_session', JSON.stringify(data.session)); } catch {}
    scheduleTokenRefresh(data.session.expires_at);
  } catch (e) {
    console.warn('Token refresh failed:', e.message);
    _authState = 'unauthenticated';
    _authSession = null;
    localStorage.removeItem('liq_session');
    toast('Session expired: please sign in again.');
    showLock();
  }
}

function signOut() {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  _authSession = null;
  _authState   = 'unauthenticated';
  localStorage.removeItem('liq_session');
  sb.auth.signOut().catch(() => {});
  showLock();
}

function showApp() {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display  = 'flex';
  const userEl = document.getElementById('header-user');
  if (userEl) userEl.textContent = _authSession?.user?.email || '';

  if (!window._appInitialised) {
    window._appInitialised = true;
    init();
  }
}

function showLock() {
  document.getElementById('app').style.display  = 'none';
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('lock-step-loading').style.display = 'none';
  document.getElementById('lock-step-email').style.display   = 'block';
  document.getElementById('lock-step-sent').style.display    = 'none';

}

document.getElementById('lock-email').addEventListener('keydown', e => { if (e.key === 'Enter') signInWithPassword(); });
document.getElementById('lock-password').addEventListener('keydown', e => { if (e.key === 'Enter') signInWithPassword(); });

// ── On page load: restore session or show lock ───────────────────
// onAuthStateChange handles magic link redirects (fires SIGNED_IN before
// this IIFE can check localStorage). We must not call showLock() if
// onAuthStateChange already authenticated the user.
(async () => {
  // Show loading briefly while we check
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('lock-step-email').style.display   = 'none';
  document.getElementById('lock-step-loading').style.display = 'block';

  // Give onAuthStateChange a tick to fire first (handles magic link URLs)
  await new Promise(r => setTimeout(r, 100));
  if (_authState === 'authenticated') return; // already handled by onAuthStateChange

  let restored = false;
  try {
    const stored = JSON.parse(localStorage.getItem('liq_session') || 'null');
    if (stored?.access_token && stored?.refresh_token) {
      const { data, error } = await sb.auth.setSession({
        access_token:  stored.access_token,
        refresh_token: stored.refresh_token
      });
      if (!error && data?.session) {
        // onAuthStateChange will fire SIGNED_IN and call initialiseDatabaseAuth
        restored = true;
        // Wait briefly for the event to process
        await new Promise(r => setTimeout(r, 200));
      }
    }
  } catch (e) {
    console.warn('Session restore failed:', e.message);
  }
  // Only show lock if auth hasn't succeeded
  if (_authState !== 'authenticated') showLock();
})();

// ─────────────────────────────────────────
// DATA LAYER (Supabase)
// ─────────────────────────────────────────

const KEYS = { sales:'sales', trials:'trials', website:'website', website_daily:'website_daily', training:'training', content:'content', webinars:'webinars', linkedin_weekly:'linkedin_weekly', edm_2m:'edm_2m', weekly_tracker:'weekly_tracker', activity_giraffe:'activity_giraffe', activity_sdk:'activity_sdk', activity_labs:'activity_labs', proficiency:'proficiency', planned_events:'planned_events' };

// In-memory cache: loaded from Supabase on init, kept in sync on every save
const _cache = {};
let _pd_deals = [];
let _pd_people = [];
let _pd_deals_imported_at = null;
let _pd_people_imported_at = null;
let _pdSalesPipeline = '2026 Sales'; // toggle: '2026 Sales' | null (all pipelines)

// PostHog live data cache (populated by loadPostHogLive)
let _ph = {
  loaded: false,
  error: null,
  refreshedAt: null,
  summary: null,         // { total_users, total_events, first_event_date, last_event_date, avg_active_days }
  weekly: [],            // [{ week_start, active_users, login_users, new_users, total_events }]
  daily: [],             // [{ day, active_users, login_users, total_events }]
  dauMau: [],            // [{ day, dau, mau, dau_mau_pct }]
  features: [],          // [{ feature, total_events, active_users, latest_day }]
  newUsers: [],          // [{ week_start, new_users }]
  retention: [],         // [{ cohort_week, cohort_size, retained_w1..w8 }]
  segments: [],          // [{ segment, user_count }]
  atRisk: [],            // [{ distinct_id, first_seen, last_seen, active_days, total_events }]
  featureAdoption: [],   // [{ feature, users_who_tried, total_users, adoption_pct }]
  featureCompletion: [], // [{ feature, started, completed, completion_pct }]
  powerUsers: [],        // [{ distinct_id, first_seen, last_seen, active_days, total_events }]
  emailActivity: [],     // [{ email, first_seen, last_seen, active_days, total_events }]: optional, needs posthog_add_emails.sql
};

async function fetchAllRows(table, columns) {
  const PAGE = 1000;
  let all = [], offset = 0, done = false;
  while (!done) {
    const { data, error } = await sb.from(table).select(columns).range(offset, offset + PAGE - 1);
    if (error) throw error;
    if (!data || data.length === 0) { done = true; break; }
    all = all.concat(data);
    if (data.length < PAGE) { done = true; } else { offset += PAGE; }
  }
  return all;
}

let _dbStatus = { ok: false, error: null, deals: 0, people: 0, dashboardRows: 0, checkedAt: null };

// ── Local storage backup helpers ─────────────────────────────────
// Every save() writes to localStorage as well as Supabase.
// On load, if Supabase returns empty for a key but localStorage has data,
// we restore from local and re-push to Supabase automatically.
const LS_PREFIX = 'liq_bk_';
function lsWrite(sbKey, arr) {
  try { localStorage.setItem(LS_PREFIX + sbKey, JSON.stringify(arr)); } catch(e) {}
}
function lsRead(sbKey) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + sbKey);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

async function loadAll() {
  try {
    const [mainRes, dealsRows, peopleRows] = await Promise.all([
      sb.from('dashboard_data').select('key, value'),
      fetchAllRows('liq_pipedrive_deals', 'raw, imported_at'),
      fetchAllRows('liq_pipedrive_people', 'raw, imported_at')
    ]);
    if (mainRes.error) throw mainRes.error;
    mainRes.data.forEach(row => {
      _cache[row.key] = row.value || [];
      lsWrite(row.key, row.value || []); // keep localStorage in sync
    });
    _pd_deals  = pdNormaliseDeals(dealsRows.map(r => r.raw));
    _pd_people = pdNormalisePeople(peopleRows.map(r => r.raw));
    // Use the LATEST imported_at across rows (not an arbitrary row), so the
    // displayed date is the true most-recent write for each table.
    const maxTs = rows => rows.reduce((mx, r) => (r.imported_at && r.imported_at > mx) ? r.imported_at : mx, '') || null;
    if (dealsRows.length)  _pd_deals_imported_at  = maxTs(dealsRows);
    if (peopleRows.length) _pd_people_imported_at = maxTs(peopleRows);

    // ── Auto-restore: if main table is missing keys, try Supabase backup table first ──
    const missingKeys = Object.values(KEYS).filter(k => !_cache[k] || _cache[k].length === 0);
    if (missingKeys.length > 0) {
      const { data: backupRows } = await sb.rpc('get_latest_backups');
      if (backupRows?.length) {
        let restored = 0;
        backupRows.forEach(row => {
          if (missingKeys.includes(row.key) && row.value?.length > 0) {
            _cache[row.key] = row.value;
            lsWrite(row.key, row.value);
            // Re-push to main dashboard_data table
            sb.from('dashboard_data')
              .upsert({ key: row.key, value: row.value, updated_at: new Date().toISOString() })
              .then(({ error }) => { if (error) console.warn('Restore push failed for', row.key, error); });
            restored++;
          }
        });
        if (restored > 0) toast(`⚡ Restored ${restored} data set${restored>1?'s':''} from Supabase backup`);
      }

      // ── Tertiary: localStorage fallback for anything still missing ──
      Object.keys(KEYS).forEach(k => {
        const sbKey = KEYS[k];
        if (!_cache[sbKey] || _cache[sbKey].length === 0) {
          const local = lsRead(sbKey);
          if (local?.length > 0) {
            _cache[sbKey] = local;
            // Push back to both main table and backup
            sb.from('dashboard_data')
              .upsert({ key: sbKey, value: local, updated_at: new Date().toISOString() })
              .then(() => {});
            sb.from('dashboard_backups')
              .insert({ key: sbKey, value: local })
              .then(() => {});
          }
        }
      });
    }

    const totalRows = Object.values(KEYS).filter(k => _cache[k]?.length > 0).length;
    _dbStatus = { ok: true, error: null, deals: dealsRows.length, people: peopleRows.length, dashboardRows: totalRows, checkedAt: new Date() };
  } catch (e) {
    console.error('Supabase load failed:', e);
    // Full fallback: localStorage only
    let restoredFromLocal = 0;
    Object.keys(KEYS).forEach(k => {
      const backup = lsRead(KEYS[k]);
      if (backup?.length > 0) { _cache[KEYS[k]] = backup; restoredFromLocal++; }
    });
    _dbStatus = { ok: false, error: e.message || String(e), deals: 0, people: 0, dashboardRows: restoredFromLocal, checkedAt: new Date() };
    if (e.message?.includes('timeout')) {
      toast('⚠️ Database timeout. Try refreshing in a moment.');
    } else {
      toast(`⚠️ DB offline: showing local backup (${restoredFromLocal} sets)`);
    }
  }
}

function load(key) { return _cache[KEYS[key]] || []; }

// ── PostHog live data loader ─────────────────────────────────────
async function loadPostHogLive(forceRefresh = false) {
  if (_ph.loaded && !forceRefresh) return;
  _ph.error = null;
  try {
    const [summaryRes, weeklyRes, dailyRes, dauMauRes, featuresRes, newUsersRes, retentionRes,
           segmentsRes, atRiskRes, adoptionRes, completionRes, powerRes, emailActRes] = await Promise.all([
      sb.rpc('ph_summary'),
      sb.rpc('ph_weekly_stats',        { weeks_back: 16 }),
      sb.rpc('ph_daily_active_users',  { days_back:  30 }),
      sb.rpc('ph_dau_mau',             { days_back:  30 }),
      sb.rpc('ph_feature_usage',       { days_back:  30 }),
      sb.rpc('ph_new_users',           { weeks_back: 16 }),
      sb.rpc('ph_retention_cohort',    { cohort_weeks_back: 12 }),
      sb.rpc('ph_user_segments'),
      sb.rpc('ph_at_risk_users',       { min_active_days: 5, days_threshold: 30 }),
      sb.rpc('ph_feature_adoption'),
      sb.rpc('ph_feature_completion'),
      sb.rpc('ph_power_users',         { user_limit: 25 }),
      sb.rpc('ph_email_activity'),   // per-email usage: absent until posthog_add_emails.sql is run
    ]);
    // Load whatever succeeded: one slow/failed query no longer blanks the whole tab.
    // (Supabase rpc() resolves with an { error } field rather than throwing.)
    _ph.summary           = summaryRes.data?.[0]   || null;
    _ph.weekly            = weeklyRes.data          || [];
    _ph.daily             = dailyRes.data           || [];
    _ph.dauMau            = dauMauRes.data          || [];
    _ph.features          = featuresRes.data        || [];
    _ph.newUsers          = newUsersRes.data        || [];
    _ph.retention         = retentionRes.data       || [];
    _ph.segments          = segmentsRes.data        || [];
    _ph.atRisk            = atRiskRes.data          || [];
    _ph.featureAdoption   = adoptionRes.data        || [];
    _ph.featureCompletion = completionRes.data      || [];
    _ph.powerUsers        = powerRes.data           || [];
    _ph.emailActivity     = emailActRes.data        || [];

    // Which specific queries failed (for a precise warning, not a generic one).
    // emailActivity is deliberately excluded: it's optional until posthog_add_emails.sql runs.
    const failed = [
      ['summary', summaryRes], ['weekly', weeklyRes], ['daily', dailyRes], ['daily-vs-monthly', dauMauRes],
      ['features', featuresRes], ['new users', newUsersRes], ['retention', retentionRes],
      ['segments', segmentsRes], ['at-risk', atRiskRes], ['adoption', adoptionRes],
      ['completion', completionRes], ['power users', powerRes],
    ].filter(([, r]) => r.error).map(([name, r]) => `${name} (${r.error.message})`);

    // Tab is "live" as long as the core weekly numbers came through
    _ph.loaded = (_ph.weekly.length > 0) || (_ph.summary != null);
    _ph.error = failed.length ? failed.join(' · ') : null;
    _ph.refreshedAt = new Date();
    if (failed.length) console.warn('PostHog: some queries failed :', _ph.error);
  } catch (e) {
    _ph.error = e.message || 'PostHog RPC failed';
    console.warn('PostHog live load failed:', e.message);
    // Not a fatal error: the tab still works with manual data
  }
}

async function refreshPostHog() {
  // Trigger materialized view refresh then reload
  const el = document.getElementById('ph-refresh-btn');
  if (el) { el.disabled = true; el.textContent = 'Refreshing…'; }
  try {
    await sb.rpc('ph_refresh_views');
    await loadPostHogLive(true);
    renderActivity();
    toast('PostHog data refreshed.');
  } catch (e) {
    toast('Refresh failed: ' + (e.message || e));
  } finally {
    if (el) { el.disabled = false; el.textContent = '↺ Refresh PostHog'; }
  }
}

function save(key, arr) {
  const sbKey = KEYS[key];
  _cache[sbKey] = arr;
  lsWrite(sbKey, arr); // 1. localStorage: instant, works offline

  // 2. Main table: upsert (overwrite latest)
  sb.from('dashboard_data')
    .upsert({ key: sbKey, value: arr, updated_at: new Date().toISOString() })
    .then(({ error }) => {
      if (error) {
        console.error('Supabase save failed:', error);
        toast('⚠️ Cloud save failed: data kept locally. ' + (error.message || error.code || ''));
        _dbStatus.ok = false; _dbStatus.error = error.message;
        updateDbStatusPill();
      }
    });

  // 3. Backup table: append (never overwrites, survives main table wipes)
  sb.from('dashboard_backups')
    .insert({ key: sbKey, value: arr })
    .then(({ error }) => {
      if (error) console.warn('Backup insert failed for', sbKey, error.message);
    });
}

function exportData() {
  const data = {};
  Object.keys(KEYS).forEach(k => data[k] = load(k));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landiq_dashboard_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Data exported successfully.');
}

function importBackup(json) {
  try {
    const data = JSON.parse(json);
    Object.keys(KEYS).forEach(k => { if (data[k]) save(k, data[k]); });
    toast('Backup imported successfully.');
    renderTab(activeTab);
  } catch { toast('Import failed: invalid JSON.'); }
}

// ─────────────────────────────────────────
// METRIC TRUST FLAGS  (green = trusted · yellow = check · red = known error)
// Stored in Supabase so the flags are the same for everyone who opens the board.
// Hidden by default; a header "Review mode" toggle reveals + lets you set them.
// ─────────────────────────────────────────
let _metricFlags = {};
let _hiddenMetrics = {};
let _reviewMode  = false;
let _wbFunnelSel = null;   // selected webinar id for the conversion funnel

function flagKey(text) {
  return activeTab + '|' + text.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().slice(0, 48);
}

async function loadMetricFlags() {
  try { _metricFlags = JSON.parse(localStorage.getItem('liq_metric_flags') || '{}'); } catch { _metricFlags = {}; }
  try {
    const { data } = await sb.from('dashboard_data').select('value').eq('key', 'metric_flags').maybeSingle();
    if (data && data.value && typeof data.value === 'object') {
      _metricFlags = data.value;
      localStorage.setItem('liq_metric_flags', JSON.stringify(_metricFlags));
    }
  } catch (e) { /* offline: keep local copy */ }
}

function saveMetricFlags() {
  localStorage.setItem('liq_metric_flags', JSON.stringify(_metricFlags));
  sb.from('dashboard_data').upsert({ key: 'metric_flags', value: _metricFlags, updated_at: new Date().toISOString() })
    .then(({ error }) => { if (error) console.warn('flag save failed:', error.message); });
}

// Hidden metrics: which metrics the user has toggled off so they don't show in the
// everyday view. Keyed by the same flagKey() as trust flags; persisted like them.
async function loadHiddenMetrics() {
  try { _hiddenMetrics = JSON.parse(localStorage.getItem('liq_hidden_metrics') || '{}'); } catch { _hiddenMetrics = {}; }
  try {
    const { data } = await sb.from('dashboard_data').select('value').eq('key', 'hidden_metrics').maybeSingle();
    if (data && data.value && typeof data.value === 'object') {
      _hiddenMetrics = data.value;
      localStorage.setItem('liq_hidden_metrics', JSON.stringify(_hiddenMetrics));
    }
  } catch (e) { /* offline: keep local copy */ }
}

function saveHiddenMetrics() {
  localStorage.setItem('liq_hidden_metrics', JSON.stringify(_hiddenMetrics));
  sb.from('dashboard_data').upsert({ key: 'hidden_metrics', value: _hiddenMetrics, updated_at: new Date().toISOString() })
    .then(({ error }) => { if (error) console.warn('hidden save failed:', error.message); });
}

function _flagLabelText(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('button, .info-btn, .flag-dot, .hide-toggle').forEach(n => n.remove());
  return c.textContent.replace(/\s+/g, ' ').trim();
}

function metricDocFor(txt) {
  // Punctuation-proof matching: compare on letters/numbers only, so title
  // punctuation changes (dashes, colons, arrows) never break the registry.
  const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const t = norm(txt);
  for (const [pat, src, calc] of METRIC_DOCS) if (t.includes(norm(pat))) return { src, calc };
  return null;
}

  pipedrive: 'Pipedrive CSV import: see the import dates in the banner above',
  team: 'Pipedrive · Deals (Deal Owner)',
  activity: 'PostHog usage data · nightly sync',
  marketing: 'Manual entry: content log / weekly tracker / webinar log',

// Adds a trust dot to every metric label/title AND an ⓘ calculation popup to
// every box title (from METRIC_DOCS, else a per-tab source fallback).
// Idempotent: safe on every DOM change (MutationObserver covers sub-tabs).
function injectFlags(root) {
  root = root || document.getElementById('main-content');
  if (!root) return;
  root.querySelectorAll('.card-label, .box-title').forEach(el => {
    if (el.querySelector(':scope > .flag-dot')) return;
    const txt = _flagLabelText(el);
    if (!txt || txt.length < 3) return;
    // ⓘ popup for box titles that don't already have one
    if (el.classList.contains('box-title') && !el.querySelector('.info-btn')) {
      const doc = metricDocFor(txt);
      const src = doc ? doc.src : (TAB_FALLBACK_SRC[activeTab] || 'See source data');
      const calc = doc ? doc.calc : 'Computed directly from the source above, grouped as the title describes.';
      el.insertAdjacentHTML('beforeend', infoBtn(txt.slice(0, 70), '<span class="src-tag">' + src + '</span><br>' + calc));
    }
    const key = flagKey(txt);
    const status = _metricFlags[key] || '';
    const dot = document.createElement('span');
    dot.className = 'flag-dot' + (status ? ' ' + status : '');
    dot.dataset.fk = key;
    dot.title = status ? `Trust: ${status}: click to change` : 'Unrated: click to set trust';
    el.appendChild(dot);
    // Hide toggle: lets a reviewer curate this metric out of the everyday view.
    const isHidden = !!_hiddenMetrics[key];
    const eye = document.createElement('span');
    eye.className = 'hide-toggle';
    eye.dataset.hk = key;
    eye.textContent = isHidden ? 'show' : 'hide';
    eye.title = isHidden ? 'Hidden from the everyday view: click to show' : 'Click to hide this from the everyday view';
    el.appendChild(eye);
    if (isHidden && el.parentElement) el.parentElement.classList.add('metric-hidden');
  });
}

document.addEventListener('click', e => {
  const dot = e.target.closest ? e.target.closest('.flag-dot') : null;
  if (!dot || !_reviewMode) return;
  e.stopPropagation();
  const order = ['', 'green', 'yellow', 'red'];
  const cur = _metricFlags[dot.dataset.fk] || '';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next) _metricFlags[dot.dataset.fk] = next; else delete _metricFlags[dot.dataset.fk];
  dot.className = 'flag-dot' + (next ? ' ' + next : '');
  dot.title = next ? `Trust: ${next}: click to change` : 'Unrated: click to set trust';
  saveMetricFlags();
  updateFlagLegend();
});

document.addEventListener('click', e => {
  const eye = e.target.closest ? e.target.closest('.hide-toggle') : null;
  if (!eye || !_reviewMode) return;
  e.stopPropagation();
  const k = eye.dataset.hk;
  if (_hiddenMetrics[k]) delete _hiddenMetrics[k]; else _hiddenMetrics[k] = 1;
  const nowHidden = !!_hiddenMetrics[k];
  const container = eye.parentElement && eye.parentElement.parentElement;  // title → container
  if (container) container.classList.toggle('metric-hidden', nowHidden);
  eye.textContent = nowHidden ? 'show' : 'hide';
  eye.title = nowHidden ? 'Hidden from the everyday view: click to show' : 'Click to hide this from the everyday view';
  saveHiddenMetrics();
  updateFlagLegend();
});

function toggleReviewMode() {
  _reviewMode = !_reviewMode;
  document.body.classList.toggle('review-mode', _reviewMode);
  const btn = document.getElementById('review-toggle');
  if (btn) { btn.textContent = _reviewMode ? '✓ Review mode on' : '⚑ Review mode'; btn.style.color = _reviewMode ? '#2a7a4b' : ''; }
  const leg = document.getElementById('flag-legend');
  if (leg) leg.style.height = _reviewMode ? '22px' : '0';
  updateFlagLegend();
  // Re-render so review-only sections (and any charts inside them) draw into a
  // correctly-sized, now-visible container rather than a hidden 0-height one.
  if (typeof renderTab === 'function' && activeTab) renderTab(activeTab);
}

function updateFlagLegend() {
  const el = document.getElementById('flag-legend');
  if (!el) return;
  if (!_reviewMode) { el.innerHTML = ''; return; }
  const v = Object.values(_metricFlags);
  const g = v.filter(x => x === 'green').length, y = v.filter(x => x === 'yellow').length, r = v.filter(x => x === 'red').length;
  const h = Object.keys(_hiddenMetrics).length;
  el.innerHTML = `<span style="padding:3px 0;display:inline-block">Click a dot to rate trust, or "hide" to curate: `
    + `<span style="color:#1f6740;font-weight:600">● ${g} trusted</span> · `
    + `<span style="color:#8a5a00;font-weight:600">● ${y} check</span> · `
    + `<span style="color:#b0342b;font-weight:600">● ${r} known error</span>`
    + (h ? ` · <span style="color:#555;font-weight:600">${h} hidden</span>` : '') + `</span>`;
}

function startFlagObserver() {
  const mc = document.getElementById('main-content');
  if (!mc || !window.MutationObserver) return;
  new MutationObserver(() => injectFlags(mc)).observe(mc, { childList: true, subtree: true });
}

// ── Data-source freshness banner (automatic: no manual flagging) ────────────
// Deals and People are uploaded SEPARATELY, so each is tracked independently :
// a fresh deals upload must never make the People data look current.
function pdFreshnessHTML() {
  if (!_pd_deals_imported_at && !_pd_people_imported_at)
    return '<div class="freshness stale">⚠ No Pipedrive data imported yet: upload your Deals and People CSVs on the Import tab.</div>';
  function part(label, ts) {
    if (!ts) return { cls: 'stale', html: `⚠ <b>${label}:</b> never imported` };
    const d = new Date(ts);
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    const cls = days > 14 ? 'stale' : days > 7 ? 'warn' : 'ok';
    const age = days === 0 ? 'today' : days + ' day' + (days > 1 ? 's' : '') + ' ago';
    return { cls, html: `${cls === 'ok' ? '●' : '⚠'} <b>${label}:</b> ${fmtDate(d)} (${age})` };
  }
  const dl = part('Deals', _pd_deals_imported_at);
  const pl = part('People', _pd_people_imported_at);
  const rank = { ok: 0, warn: 1, stale: 2 };
  const worst = rank[dl.cls] >= rank[pl.cls] ? dl.cls : pl.cls;
  const note = (dl.cls !== 'ok' || pl.cls !== 'ok')
    ? `<div style="margin-top:5px;font-size:11.5px;opacity:.9">Deals and People are separate uploads: re-upload whichever is old on the Import tab. Any figure that combines both (subscribers, churn, health scores) is only as current as the <b>older</b> of the two.</div>`
    : '';
  return `<div class="freshness ${worst}"><div style="flex:1">
    <span>${dl.html}</span> &nbsp;&nbsp;·&nbsp;&nbsp; <span>${pl.html}</span>${note}
  </div></div>`;
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { importBackup(e.target.result); input.value = ''; };
  reader.readAsText(file);
}

function confirmClear() {
  if (confirm('Delete ALL dashboard data? This cannot be undone.')) {
    Object.keys(KEYS).forEach(k => save(k, []));
    toast('All data cleared.');
    renderTab(activeTab);
  }
}

const fmtDate = d => d ? new Date(d).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' }) : ':';
// Combined LinkedIn post impressions for a tracker week: the sum of every team
// member's column (js/jm/lb/sk). Per-person figures are legacy; only the combined
// total is ever shown. Returns null when the week has no LinkedIn data at all.
const liImp = r => {
  if (!r) return null;
  if (r.jsImp == null && r.jmImp == null && r.lbImp == null && r.skImp == null) return null;
  return (r.jsImp || 0) + (r.jmImp || 0) + (r.lbImp || 0) + (r.skImp || 0);
};
// Chart axis labels: '16 Mar': readable at a glance (vs raw '03-16')
const shortDate = s => { const d = new Date(s); return isNaN(d) ? (s || '') : d.toLocaleDateString('en-AU', { day:'numeric', month:'short' }); };
const fmtNum  = n => n != null ? Number(n).toLocaleString() : ':';
const fmtPct  = n => n != null ? Number(n).toFixed(1) + '%' : ':';
// Duration parsing for webinar times: accepts "49m 34s", "49:34", "49m", "45" (mins)
function parseMinSec(s) {
  if (s == null || s === '') return null;
  s = String(s).trim();
  let m = s.match(/^(\d+)\s*[:m]\s*(\d+)/i);       // 49:34 or 49m 34s
  if (m) return (+m[1]) * 60 + (+m[2]);
  m = s.match(/^(\d+(?:\.\d+)?)\s*m/i);             // 49m / 49 min
  if (m) return Math.round(+m[1] * 60);
  m = s.match(/^(\d+(?:\.\d+)?)$/);                 // bare number → minutes
  if (m) return Math.round(+m[1] * 60);
  return null;
}
const fmtMinSec = sec => sec == null ? ':' : Math.floor(sec / 60) + ':' + String(Math.round(sec % 60)).padStart(2, '0');
const fmtDollar = n => n != null ? '$' + Number(n).toLocaleString() : ':';
const fmtCur = n => { if (n == null) return ':'; if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M'; if (n >= 1000) return '$' + (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k'; return '$' + Math.round(n).toLocaleString(); };
const pct = (a, b) => (a != null && b && b !== 0) ? (a / b * 100) : null;

function thisMonth(arr, dateKey = 'week') {
  const now = new Date();
  return arr.filter(r => {
    const d = new Date(r[dateKey]);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function monthKey(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  return new Date(y, m - 1).toLocaleString('default', { month: 'short', year: '2-digit' });
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function makeChart(id, config) {

}

function toast(msg, dur = 3000) {

// ─────────────────────────────────────────
// SUMMARY CARD BUILDER
// ─────────────────────────────────────────
function cardHTML(label, value, prev, type, sub, info) {
  let disp = value == null ? null : type === '$' ? fmtDollar(value) : type === '%' ? fmtPct(value) : fmtNum(value);
  let changeHTML = '';
  if (value != null && prev != null && prev !== 0) {
    const d = ((value - prev) / prev * 100).toFixed(1);
    const up = value >= prev;
    changeHTML = `<div class="card-change ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${d}%</div>`;
  }
  return `<div class="card">
    <div class="card-label" style="display:flex;align-items:center;gap:0;flex-wrap:wrap">${label}${info ? infoBtn(label, info) : ''}</div>
    ${disp ? `<div class="card-value">${disp}</div>` : '<div class="card-nodata">no data</div>'}
    ${changeHTML}
    ${sub ? `<div class="card-sub">${sub}</div>` : ''}
  </div>`;
}

function cardsHTML(items) {
  return `<div class="cards">${items.map(i => cardHTML(...i)).join('')}</div>`;
}

// KPI band: wraps the headline KPI cards in a labelled, tinted band pinned to the
// top of a tab so they're unmistakably "the KPIs".
function kpiBand(cardsHtml, note) {
  return `<div class="kpi-band">
    <div class="kpi-band-head">Key Performance Indicators${note ? `<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--tl);font-size:11px;margin-left:2px">· ${note}</span>` : ''}</div>
    <div class="cards">${cardsHtml}</div>
  </div>`;
}

// KPI card: a highlighted card for metrics with an agreed goal. Same treatment as
// the Executive tab's key metrics: accent top border, a KPI tag (with the target
// when there is one) and a progress bar toward it. Uses .card-label so the
// review-mode trust dot and hide toggle still attach.
function kpiCardHTML(label, value, type, target, targetLabel, sub, info) {
  const disp = value == null ? null : type === '$' ? fmtDollar(value) : type === '%' ? fmtPct(value) : fmtNum(value);
  const prog = (value != null && target) ? Math.min(100, Math.max(0, value / target * 100)) : null;
  const bar = prog != null
    ? `<div style="margin-top:9px;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.round(prog)}%;background:${prog >= 100 ? '#2a7a4b' : 'var(--acc)'};border-radius:3px"></div></div>` : '';
  return `<div class="card" style="border-top:3px solid var(--acc);position:relative;padding-top:16px">
    <div style="position:absolute;top:9px;right:11px;font-size:8px;font-weight:700;letter-spacing:.5px;color:var(--acc)">KPI${targetLabel ? ' · TARGET ' + targetLabel : ''}</div>
    <div class="card-label" style="display:flex;align-items:center;gap:0;flex-wrap:wrap">${label}${info ? infoBtn(label, info) : ''}</div>
    ${disp != null ? `<div class="card-value">${disp}</div>` : '<div class="card-nodata">no data</div>'}
    ${sub ? `<div class="card-sub">${sub}</div>` : ''}
    ${bar}
  </div>`;
}

function tableHTML(key, rows, cols, idField, showAllKey) {
  const limit = activeSub[showAllKey || key + '_all'] ? rows.length : 8;
  const visible = [...rows].reverse().slice(0, limit);
  if (!rows.length) return `<div class="box"><div class="no-data">No entries yet.</div></div>`;
  return `<div class="tbl-wrap">
    <div class="tbl-head">Recent entries
      ${rows.length > 8 ? `<button class="show-all-btn" onclick="toggleShowAll('${showAllKey || key + '_all'}')">${activeSub[showAllKey || key + '_all'] ? 'Show less' : 'Show all ' + rows.length}</button>` : ''}
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody>${visible.map(row => `<tr>${cols.map(c => `<td>${c.render ? c.render(row) : (row[c.key] != null ? row[c.key] : ':')}</td>`).join('')}
        <td><button class="btn-del" onclick="delRow('${key}','${row[idField] || row.week || row._id}','${idField}')"">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

// ── EXECUTIVE BRIEF ──────────────────────────────────────────────────────────
function renderExec(el) {
  el = el || document.getElementById('main-content');
  const today = new Date();
  const fmtToday = fmtDate(today);

  // ── Pull headline numbers from every source ─────────────────────────────
  // Sales (Pipedrive)
  const paidPeople = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
  const allWon = _pd_deals.filter(d => d['Deal - Status'] === 'Won');
  const wonARR = allWon.reduce((s,d) => s + (parseFloat(d['Deal - Value'])||0), 0);
  const wonThisMonth = allWon.filter(d => {
    const dt = pdParseDate(d['Deal - Won time'] || d['Deal - Deal created']);
    return pdValidDate(dt) && dt.getFullYear() === today.getFullYear() && dt.getMonth() === today.getMonth();
  });
  const openDeals = _pd_deals.filter(d => d['Deal - Pipeline'] === '2026 Sales' && d['Deal - Status'] === 'Open');
  const pipelineValue = openDeals.reduce((s,d) => s + (parseFloat(d['Deal - Value'])||0), 0);
  const activeTrial = _pd_people.filter(p => {
    if (!isTrialType(p['Person - Customer Type'])) return false;
    const rem = pdParseDate(p['Person - Date Access Removed']);
    return !pdValidDate(rem) || rem > today;
  });
  const churnedThisMonth = _pd_people.filter(p => {
    if (p['Person - Customer Type'] !== 'Access Revoked') return false;
    if (!p['Person - Previous Customer Type']?.includes('Paid Subscription')) return false;
    const dt = pdParseDate(p['Person - Date Access Removed']);
    return pdValidDate(dt) && dt.getFullYear() === today.getFullYear() && dt.getMonth() === today.getMonth();
  });

  // Marketing (weekly tracker: most recent row)
  const tracker = load('weekly_tracker').sort((a,b) => a.week > b.week ? 1 : -1);
  const tLast = tracker[tracker.length-1] || {};
  const tPrev = tracker[tracker.length-2] || {};
  const visitors = tLast.websiteVisits ?? null;
  const visitorsPrev = tPrev.websiteVisits ?? null;

  // Activity (PostHog)
  const phWeekly = (_ph.weekly || []).slice(-1)[0] || {};
  const phWeeklyPrev = (_ph.weekly || []).slice(-2,-1)[0] || {};
  const dauMau = (_ph.daumau || []).slice(-1)[0] || {};
  const segments = _ph.segments || [];

  // Training
  const pdTrained = _pd_people.filter(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    return pdValidDate(dt) && !['Contact Register','Expression of Interest'].includes(p['Person - Customer Type']);
  });
  const trainedThisMonth = pdTrained.filter(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    return dt && dt.getFullYear() === today.getFullYear() && dt.getMonth() === today.getMonth();
  }).length;

  // Content (marketing)
  const content = load('content');
  const contentThisMonth = content.filter(r => {
    const dt = new Date(r.date || r.week || '');
    return !isNaN(dt) && dt.getFullYear() === today.getFullYear() && dt.getMonth() === today.getMonth();
  }).length;

  // ── Trend arrows ──────────────────────────────────────────────────────────
  function trend(curr, prev) {
    if (curr == null || prev == null) return '';
    const d = curr - prev;
    if (d > 0) return `<span style="color:#2a7a4b;font-size:11px;margin-left:4px">▲ ${fmtNum(d)}</span>`;
    if (d < 0) return `<span style="color:#e05252;font-size:11px;margin-left:4px">▼ ${fmtNum(Math.abs(d))}</span>`;
    return `<span style="font-size:11px;margin-left:4px;color:#999">→</span>`;
  }

  // ── Build auto-narrative bullets ─────────────────────────────────────────
  const bullets = [];
  if (wonThisMonth.length > 0)
    bullets.push(`<b>${wonThisMonth.length}</b> deal${wonThisMonth.length>1?'s':''} won this month: ${fmtCur(wonThisMonth.reduce((s,d)=>s+(parseFloat(d['Deal - Value'])||0),0))} in new revenue.`);
  if (churnedThisMonth.length > 0)
    bullets.push(`<b>${churnedThisMonth.length}</b> paid subscriber${churnedThisMonth.length>1?'s':''} churned this month.`);
  if (activeTrial.length > 0)
    bullets.push(`<b>${activeTrial.length}</b> active trial${activeTrial.length>1?'s':''} in progress.`);
  if (pipelineValue > 0)
    bullets.push(`Open pipeline: <b>${fmtCur(pipelineValue)}</b> across ${openDeals.length} deals (2026 Sales).`);
  if (phWeekly.active_users)
    bullets.push(`PostHog: <b>${fmtNum(phWeekly.active_users)}</b> active users last week${trend(phWeekly.active_users, phWeeklyPrev.active_users)}.`);
  if (dauMau.dau_mau_pct)
    bullets.push(`On a typical day, <b>${fmtPct(dauMau.dau_mau_pct)}</b> of monthly users are active (last 30 days).`);
  if (visitors)
    bullets.push(`Website visitors last week: <b>${fmtNum(visitors)}</b>${trend(visitors, visitorsPrev)}.`);
  if (trainedThisMonth > 0)
    bullets.push(`<b>${trainedThisMonth}</b> new user${trainedThisMonth>1?'s':''} onboarded (access granted) this month.`);
  if (contentThisMonth > 0)
    bullets.push(`<b>${contentThisMonth}</b> content piece${contentThisMonth>1?'s':''} published this month.`);

  // ── Key-metric card (the 3 primary exec numbers, highlighted) ───────────────
  function keyCard(label, value, sub, pctToTarget) {
    const bar = pctToTarget != null
      ? `<div style="margin-top:9px;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.min(100,Math.max(0,Math.round(pctToTarget)))}%;background:var(--acc);border-radius:3px"></div></div>` : '';
    return `<div class="card" style="border-top:3px solid var(--acc);position:relative;padding-top:16px">
      <div style="position:absolute;top:9px;right:11px;font-size:8px;font-weight:700;letter-spacing:.5px;color:var(--acc)">KEY METRIC</div>
      <div class="card-label">${label}</div>
      <div class="card-value">${value}</div>
      ${sub ? `<div class="card-sub">${sub}</div>` : ''}
      ${bar}
    </div>`;
  }
  const revToTarget = pct(wonARR, TARGET_ARR);
  const subsToTarget = pct(paidPeople.length, TARGET_USERS);

  el.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">Executive Brief</div>
        <div class="section-sub">Auto-generated summary · as of ${fmtToday}</div>
      </div>
      <button onclick="renderExec()" style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--bor);background:var(--bg2);cursor:pointer;color:var(--tx)">↺ Refresh</button>
    </div>

    <!-- The three key executive metrics (highlighted) -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px">
      ${keyCard('Active paying customers', fmtNum(paidPeople.length), `${fmtPct(subsToTarget)} of ${fmtNum(TARGET_USERS)} target`, subsToTarget)}
      ${keyCard('Total revenue won', fmtDollar(Math.round(wonARR)), `${fmtPct(revToTarget)} of $2.4M target`, revToTarget)}
      ${keyCard('Open sales pipeline', fmtDollar(Math.round(pipelineValue)), `${openDeals.length} open deals · 2026 Sales`, null)}
    </div>

    <!-- Supporting metrics -->
    ${cardsHTML([
      ['Won this month', wonThisMonth.length || null, null, null, wonThisMonth.length ? fmtCur(wonThisMonth.reduce((s,d)=>s+(parseFloat(d['Deal - Value'])||0),0)) + ' new revenue' : null],
      ['Churned this month', churnedThisMonth.length || null, null, null, 'paid subscribers lost'],
      ['Active trials', activeTrial.length || null, null, null, 'in progress'],
      ['Active users (last week)', phWeekly.active_users || null, null, null, 'product usage'],
    ])}

    <!-- Narrative (full width) -->
    <div class="box" style="margin-top:16px">
      <div class="box-title" style="font-size:14px;font-weight:700;margin-bottom:12px">This month at a glance</div>
      ${bullets.length
        ? `<ul style="margin:0;padding-left:18px;line-height:1.9;font-size:13px;color:var(--tx)">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`
        : '<div class="no-data">Load Pipedrive + PostHog data to generate narrative.</div>'}
    </div>

    <!-- Recent deal activity -->
    <div class="box">
      <div class="box-title">Recent deal activity</div>
      ${(() => {
        const recent = _pd_deals
          .filter(d => d['Deal - Status'] === 'Won' || d['Deal - Status'] === 'Lost')
          .map(d => ({
            title:  d['Deal - Title'] || d['Title'] || ':',
            org:    d['Deal - Organisation'] || d['Organisation'] || '',
            status: d['Deal - Status'],
            value:  parseFloat(d['Deal - Value']) || 0,
            date:   pdParseDate(d['Deal - Won time'] || d['Deal - Lost time'] || d['Deal - Deal created']),
            owner:  d['Deal - Owner'] || '',
          }))
          .filter(d => pdValidDate(d.date))
          .sort((a,b) => b.date - a.date)
          .slice(0, 10);
        if (!recent.length) return '<div class="no-data">No closed deals yet. Import Pipedrive data.</div>';
        return `<table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr>
            <th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--bor)">Deal</th>
            <th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--bor)">Org</th>
            <th style="text-align:center;padding:4px 8px;border-bottom:1px solid var(--bor)">Status</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid var(--bor)">Value</th>
            <th style="text-align:right;padding:4px 8px;border-bottom:1px solid var(--bor)">Date</th>
            <th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--bor)">Owner</th>
          </tr></thead>
          <tbody>${recent.map(d => `<tr style="border-bottom:1px solid var(--bg2)">
            <td style="padding:5px 8px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.title}</td>
            <td style="padding:5px 8px;color:var(--tl);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.org}</td>
            <td style="padding:5px 8px;text-align:center">
              <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:${d.status==='Won'?'rgba(42,122,75,.12)':'rgba(224,82,82,.1)'};color:${d.status==='Won'?'#2a7a4b':'#e05252'}">${d.status}</span>
            </td>
            <td style="padding:5px 8px;text-align:right;font-weight:600">${d.value ? fmtCur(d.value) : ':'}</td>
            <td style="padding:5px 8px;text-align:right;color:var(--tl)">${fmtDate(d.date).slice(0,6)}</td>
            <td style="padding:5px 8px;color:var(--tl)">${d.owner}</td>
          </tr>`).join('')}</tbody>
        </table>`;
      })()}
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <div style="font-size:11px;color:var(--tl)">Generated ${fmtToday} · Pipedrive ${fmtNum(_pd_people.length)} people · ${fmtNum(_pd_deals.length)} deals</div>
      <button onclick="window.print()" style="font-size:11px;padding:4px 12px;border-radius:6px;border:1px solid var(--bor);background:var(--bg2);cursor:pointer;color:var(--tx)">🖨 Print / Export PDF</button>
    </div>`;
}

function renderSales(el) {
  el = el || document.getElementById('main-content');
  const data = load('sales');
  const sub = activeSub.sales_sub || 'pipeline';

  const tm = thisMonth(data, 'week');
  const sl = data.length ? data[data.length - 1] : null;
  const sp = data.length > 1 ? data[data.length - 2] : null;

  // Monthly aggregation for win/loss
  const monthlyWL = {};
  data.forEach(r => {
    const k = monthKey(r.week);
    if (!monthlyWL[k]) monthlyWL[k] = { won: 0, lost: 0, wonVal: 0, lostVal: 0 };
    monthlyWL[k].won     += r.won     || 0;
    monthlyWL[k].lost    += r.lost    || 0;
    monthlyWL[k].wonVal  += r.wonVal  || 0;
    monthlyWL[k].lostVal += r.lostVal || 0;
  });
  const wlMonths = Object.entries(monthlyWL).sort().slice(-6);

  // Source aggregation
  const sources = ['Webinar', 'Helpdesk EOI', 'Vendor initiative', 'Customer initiated', 'Emailed'];
  const sourceMonth = {};
  data.forEach(r => {
    const k = monthKey(r.week);
    if (!sourceMonth[k]) sourceMonth[k] = {};
    sources.forEach(s => {
      const sk = s.replace(/ /g, '_').toLowerCase();
      sourceMonth[k][sk] = (sourceMonth[k][sk] || 0) + (r['src_' + sk] || 0);
    });
  });
  const srcMonths = Object.entries(sourceMonth).sort().slice(-6);

  el.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">Sales Funnel</div>
        <div class="section-sub">Pipedrive deal pipeline: Opt-Max conversion tracking</div>
      </div>
      <a class="src-link" href="https://app.pipedrive.com" target="_blank">↗ Pipedrive</a>
    </div>

    ${cardsHTML([
      ['Won this month', sl?.won, sp?.won],
      ['Revenue (month)', sl?.revenue, sp?.revenue, '$'],
      ['Win rate', sl?.winRate, sp?.winRate, '%'],

      ${['pipeline','winloss','sources','ratios'].map(s =>
        `<button class="sub-tab${sub === s ? ' active' : ''}" onclick="setSalesSub('${s}')">${{pipeline:'Pipeline',winloss:'Win / Loss',sources:'Deal Sources',ratios:'Ratios'}[s]}</button>`
      ).join('')}
    </div>

    <div id="sales-sub-content"></div>

    <div class="form-section">
      <button class="add-btn" onclick="toggleForm('sales-form')">+ Add week of data</button>
      <div id="sales-form" style="display:none">
        <div class="form-box">
          <div class="form-grid">
            <div class="form-group"><label>Week ending</label><input type="date" id="s-week"><div class="source-note">Monday of each week</div></div>
            <div class="form-group"><label>New deals added</label><input type="number" id="s-newDeals"><div class="source-note">Pipedrive</div></div>
            <div class="form-group"><label>Won</label><input type="number" id="s-won"><div class="source-note">Pipedrive</div></div>
            <div class="form-group"><label>Won value ($)</label><input type="number" id="s-wonVal"></div>
            <div class="form-group"><label>Lost</label><input type="number" id="s-lost"></div>
            <div class="form-group"><label>Lost value ($)</label><input type="number" id="s-lostVal"></div>
            <div class="form-group"><label>Win rate (%)</label><input type="number" id="s-winRate" step=".1"><div class="source-note">Pipedrive conversion report</div></div>
            <div class="form-group"><label>Revenue ($)</label><input type="number" id="s-revenue"></div>
            <div class="form-group"><label>Avg deal value ($)</label><input type="number" id="s-avgDealVal"></div>
            <div class="form-group"><label>Website users</label><input type="number" id="s-websiteUsers"><div class="source-note">Looker Studio (for Home trend)</div></div>
          </div>

          <div class="input-group-label">Pipeline stage counts (from Pipedrive)</div>
          <div class="form-grid">
            ${DEAL_STAGES.map(s => `<div class="form-group"><label>${s.label}</label><input type="number" id="s-${s.key}"></div>`).join('')}
          </div>

          <div class="input-group-label">Deal sources (count of deals)</div>
          <div class="form-grid">
            ${sources.map(s => `<div class="form-group"><label>${s}</label><input type="number" id="s-src_${s.replace(/ /g,'_').toLowerCase()}"></div>`).join('')}

          <div class="input-group-label">Conversion ratios</div>

            <div class="form-group"><label>Trial → purchase (no trial, %)</label><input type="number" id="s-noTrial" step=".1"></div>
