function setSalesSub(sub, rerender = true) {
  activeSub.sales_sub = sub;
  if (rerender) { renderSales(); return; }

  const data = load('sales');
  const sc = document.getElementById('sales-sub-content');
  if (!sc) return;

  const DEAL_STAGES_LOCAL = DEAL_STAGES;

  if (sub === 'pipeline') {
    const sl = data.length ? data[data.length - 1] : null;
    const max = sl ? Math.max(...DEAL_STAGES_LOCAL.map(s => sl[s.key] || 0), 1) : 1;

    sc.innerHTML = `
      <div class="box">
        <div class="box-title">Deal pipeline: current week
          <span style="margin-left:auto;font-size:11px;color:var(--tl)">Win rate: ${sl ? fmtPct(sl.winRate) : 'no data'}</span>
        </div>
        ${sl ? `<div class="pipeline">
          ${DEAL_STAGES_LOCAL.map((s, i) => {
            const count = sl[s.key] || 0;
            const prev = i > 0 ? (sl[DEAL_STAGES_LOCAL[i-1].key] || 0) : null;
            const conv = prev ? pct(count, prev) : null;
            const w = max > 0 ? (count / max * 100) : 0;
            return `<div class="stage-bar-wrap" style="border-radius:${i===0?'8px 8px':'0'} 0 0${i===DEAL_STAGES_LOCAL.length-1?' 0 8px 8px':' 0 0'}">
              <div class="stage-bg" style="width:${w}%"></div>
              <div class="stage-content">
                <div class="stage-name">${s.label}</div>
                <div class="stage-count">${fmtNum(count)}</div>
                ${conv != null ? `<div class="stage-conv"><span class="stage-conv-arrow">↑</span>${fmtPct(conv)} from prev</div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>` : '<div class="no-data">No data yet. Add a week of data below.</div>'}

        <canvas id="sales-pipeline-chart" height="220"></canvas>
      </div>
    `;

    const chartData = data.slice(-8);
    if (chartData.length) {
      makeChart('sales-pipeline-chart', {
        type: 'bar',
        data: {
          labels: chartData.map(r => fmtDate(r.week).slice(0, 6)),
          datasets: [
            { label: 'Won', data: chartData.map(r => r.won || 0), backgroundColor: '#2a7a4b', borderRadius: 3 },
            { label: 'Lost', data: chartData.map(r => r.lost || 0), backgroundColor: '#e8d4d4', borderRadius: 3 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: { x: { grid: { display: false }, ticks: axStyle, stacked: false }, y: { grid: gridStyle, ticks: axStyle } }
        }
      });
    }

  } else if (sub === 'winloss') {
    const monthlyWL = {};
    data.forEach(r => {
      const k = monthKey(r.week);
      if (!monthlyWL[k]) monthlyWL[k] = { won: 0, lost: 0, wonVal: 0, lostVal: 0 };
      monthlyWL[k].won     += r.won     || 0;
      monthlyWL[k].lost    += r.lost    || 0;
      monthlyWL[k].wonVal  += r.wonVal  || 0;
      monthlyWL[k].lostVal += r.lostVal || 0;
    });
    const wlMonths = Object.entries(monthlyWL).sort().slice(-6);

    sc.innerHTML = `
      <div class="box">
        <div class="box-title">Win / Loss by month</div>
        ${wlMonths.length ? `<canvas id="wl-chart" height="220"></canvas>` : '<div class="no-data">No data yet.</div>'}
      </div>
      <div class="box">
        <div class="box-title">Revenue won vs lost by month ($)</div>
        ${wlMonths.length ? `<canvas id="wl-val-chart" height="200"></canvas>` : '<div class="no-data">No data yet.</div>'}
        ${wlMonths.length ? `<table class="conv-table" style="margin-top:12px">
          <thead><tr><th>Month</th><th>Won</th><th>Lost</th><th>Win rate</th><th>Won $</th><th>Lost $</th></tr></thead>
          <tbody>${wlMonths.map(([k, v]) => {
            const wr = pct(v.won, v.won + v.lost);
            const cls = wr > 60 ? 'good' : wr > 40 ? 'mid' : 'bad';
            return `<tr><td>${monthLabel(k)}</td><td>${fmtNum(v.won)}</td><td>${fmtNum(v.lost)}</td>
              <td><span class="conv-pct ${cls}">${fmtPct(wr)}</span></td>
              <td>${fmtDollar(v.wonVal)}</td><td>${fmtDollar(v.lostVal)}</td></tr>`;
          }).join('')}</tbody>
        </table>` : ''}
      </div>
    `;

    if (wlMonths.length) {
      makeChart('wl-chart', {
        type: 'bar',
        data: {
          labels: wlMonths.map(([k]) => monthLabel(k)),
          datasets: [
            { label: 'Won', data: wlMonths.map(([,v]) => v.won), backgroundColor: '#2a7a4b', borderRadius: 4 },
            { label: 'Lost', data: wlMonths.map(([,v]) => v.lost), backgroundColor: '#e8d4d4', borderRadius: 4 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: axStyle } }
        }
      });

      makeChart('wl-val-chart', {
        type: 'bar',
        data: {
          labels: wlMonths.map(([k]) => monthLabel(k)),
          datasets: [
            { label: 'Won ($)', data: wlMonths.map(([,v]) => v.wonVal), backgroundColor: '#2a7a4b', borderRadius: 4 },
            { label: 'Lost ($)', data: wlMonths.map(([,v]) => v.lostVal), backgroundColor: '#f5b7b1', borderRadius: 4 },
            { label: 'Monthly revenue target ($200k)', data: wlMonths.map(() => TARGET_ARR / 12), type: 'line', borderColor: '#c25a00', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, callback: v => '$' + v.toLocaleString() } } }
        }
      });
    }

  } else if (sub === 'sources') {
    const sources = ['Webinar', 'Helpdesk EOI', 'Vendor initiative', 'Customer initiated', 'Emailed'];
    const srcColors = ['#1a3c5e', '#2e8bc0', '#2a7a4b', '#c25a00', '#7b1fa2'];
    const sourceMonth = {};
    data.forEach(r => {
      const k = monthKey(r.week);
      if (!sourceMonth[k]) sourceMonth[k] = {};
      sources.forEach(s => {
        const sk = 'src_' + s.replace(/ /g, '_').toLowerCase();
        sourceMonth[k][sk] = (sourceMonth[k][sk] || 0) + (r[sk] || 0);
      });
    });
    const srcMonths = Object.entries(sourceMonth).sort().slice(-6);

    sc.innerHTML = `
      <div class="box">
        <div class="box-title">Deal sources by month</div>
        ${srcMonths.length ? `<canvas id="src-chart" height="240"></canvas>` : '<div class="no-data">No data yet.</div>'}
      </div>
    `;

    if (srcMonths.length) {
      makeChart('src-chart', {
        type: 'bar',
        data: {
          labels: srcMonths.map(([k]) => monthLabel(k)),
          datasets: sources.map((s, i) => ({
            label: s,
            data: srcMonths.map(([, v]) => v['src_' + s.replace(/ /g, '_').toLowerCase()] || 0),
            backgroundColor: srcColors[i],
            borderRadius: 3,
            stack: 'a',
          }))
        },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: axStyle },
            y: { stacked: true, grid: gridStyle, ticks: axStyle }
          }
        }
      });
    }

  } else if (sub === 'ratios') {
    const recent = data.slice(-12);
    sc.innerHTML = `
      <div class="box">
        <div class="box-title">Trial → Purchase conversion ratios</div>
        ${recent.length ? `<canvas id="ratio-chart" height="220"></canvas>` : '<div class="no-data">No data yet.</div>'}
      </div>
    `;
    if (recent.length) {
      makeChart('ratio-chart', {
        type: 'line',
        data: {
          labels: recent.map(r => fmtDate(r.week).slice(0, 6)),
          datasets: [
            { label: 'With trial (%)', data: recent.map(r => r.withTrial), borderColor: '#2a7a4b', borderWidth: 2, tension: .3, pointRadius: 3 },
            { label: 'Without trial (%)', data: recent.map(r => r.noTrial), borderColor: '#c0392b', borderWidth: 2, tension: .3, pointRadius: 3 },
            { label: 'With demo (%)', data: recent.map(r => r.withDemo), borderColor: '#2e8bc0', borderWidth: 2, tension: .3, pointRadius: 3 },
            { label: 'Without demo (%)', data: recent.map(r => r.noDemo), borderColor: '#c25a00', borderWidth: 2, tension: .3, pointRadius: 3 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: { x: { grid: { display: false }, ticks: axStyle }, y: { grid: gridStyle, ticks: { ...axStyle, callback: v => v + '%' }, min: 0, max: 100 } }
        }
      });
    }
  }
}

function saveSales() {
  const week = document.getElementById('s-week').value;
  if (!week) { toast('Please select a week ending date.'); return; }

  const entry = { week };
  ['newDeals','won','wonVal','lost','lostVal','revenue','avgDealVal','websiteUsers','withTrial','noTrial','withDemo','noDemo'].forEach(f => {
    const v = document.getElementById('s-' + f)?.value;
    if (v !== '' && v != null) entry[f] = Number(v);
  });
  entry.winRate = entry.won != null && entry.lost != null ? pct(entry.won, entry.won + entry.lost) : (Number(document.getElementById('s-winRate')?.value) || null);

  DEAL_STAGES.forEach(s => {
    const v = document.getElementById('s-' + s.key)?.value;
    if (v !== '' && v != null) entry[s.key] = Number(v);
  });

  const sources = ['webinar','helpdesk_eoi','vendor_initiative','customer_initiated','emailed'];
  sources.forEach(s => {
    const v = document.getElementById('s-src_' + s)?.value;
    if (v !== '' && v != null) entry['src_' + s] = Number(v);
  });

  const arr = load('sales').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('sales', arr);
  toggleForm('sales-form');
  toast('Saved: week of ' + fmtDate(week));
  renderSales();
}

function renderWebsite(el) {
  el = el || document.getElementById('main-content');
  const granularity = activeSub.website_gran || 'weekly';
  const range = activeSub.website_range || '6m';
  // Inline = embedded in the Marketing tab (vs the standalone Website view). On the
  // Marketing tab we drop the empty CTA cards and tuck data-entry controls + the raw
  // table into review mode, keeping the everyday view to the useful summary.
  const inline = !!(el && el.id === 'website-inline');
  const collapsibleTable = inner => `<details${inline?' class="review-only"':''} style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--acc);font-weight:500;padding:4px 0">Show data table (recent entries)</summary>${inner}</details>`;

  if (granularity === 'daily') {
    // ── Daily view ────────────────────────────────────────────────────────
    const dailyData = load('website_daily');
    const daysMap = { '30d':30, '60d':60, '90d':90, 'all':9999 };
    const dRange   = activeSub.website_drange || '60d';
    // Anchor the window to the most recent logged day, not today. A stale Looker
    // export (data ending weeks ago) would otherwise show an empty chart once the
    // rolling "today" window scrolled past the last entry.
    const latestDay = dailyData.reduce((m, r) => (r.date && r.date > m ? r.date : m), '');
    const anchor    = latestDay ? new Date(latestDay) : new Date();
    const cutoff    = new Date(anchor); cutoff.setDate(cutoff.getDate() - (daysMap[dRange] || 60));
    const recent   = dailyData.filter(r => !r.date || new Date(r.date) >= cutoff).sort((a,b)=>a.date>b.date?1:-1);
    const today    = new Date().toISOString().split('T')[0];
    const latestMonth = latestDay ? latestDay.slice(0, 7) : new Date().toISOString().slice(0, 7);
    const latestMonthLabel = latestDay ? new Date(latestDay).toLocaleDateString('en-AU', { month:'short', year:'numeric' }) : 'this month';
    const staleNote = (latestDay && latestMonth !== new Date().toISOString().slice(0,7))
      ? `<span style="font-size:11px;font-weight:400;color:#8a5a00;margin-left:6px">latest data: ${fmtDate(latestDay)}</span>` : '';
    const tmDaily  = dailyData.filter(r => r.date && r.date.startsWith(latestMonth));

    el.innerHTML = `
      <div class="section-header">
        <div>
          <div class="section-title">Website</div>
          <div class="section-sub">Daily traffic data</div>

        ['Sessions (' + latestMonthLabel + ')', tmDaily.reduce((s,r)=>s+(r.sessions||0),0)||null, null, null, null,
          '<span class="src-tag">Manual · Looker Studio daily</span><br>Sum of the <b>Sessions</b> field across all daily website records in the latest logged month (' + latestMonthLabel + ').'],
        // CTA cards carry no data yet; hidden on the Marketing tab, kept on the standalone view.
        ...(inline ? [] : [['CTA clicks (' + latestMonthLabel + ')', tmDaily.reduce((s,r)=>s+(r.cta||0),0)||null, null, null, null,
          '<span class="src-tag">Manual · Looker Studio daily</span><br>Sum of <b>CTA button clicks</b> across all daily records in the latest logged month (' + latestMonthLabel + '). Tracks clicks on the primary call-to-action on the Land iQ website.']]),
        ['Days logged', dailyData.length||null, null, null, 'total entries',
          '<span class="src-tag">Manual · Daily log</span><br>Total number of individual daily records imported. Each row = one calendar day of website data.'],
      ])}
      <div class="box">
        <div class="box-title">
          Daily users${staleNote}
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
            <div class="range-toggle">
              <button class="range-btn${granularity==='daily'?' active':''}" onclick="setWebsiteGran('daily')">Daily</button>
              <button class="range-btn${granularity==='weekly'?' active':''}" onclick="setWebsiteGran('weekly')">Weekly</button>
            </div>
            <div class="range-toggle">
              ${['30d','60d','90d','all'].map(r=>`<button class="range-btn${dRange===r?' active':''}" onclick="setWebsiteDRange('${r}')">${r==='all'?'All':r}</button>`).join('')}
            </div>

        ${recent.length ? `<div class="chart-wrap" style="height:260px"><canvas id="web-daily-chart"></canvas></div>` : '<div class="no-data">No daily data yet. Add entries below.</div>'}

      <div class="form-section${inline?' review-only':''}">

          <button class="add-btn" onclick="toggleForm('web-daily-form')">+ Add single day</button>
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--acc);background:var(--acc2);border:1px solid var(--acc);border-radius:6px;padding:6px 12px">
            ↑ Import CSV (Looker Studio export)

function importWebsiteCSV() {
  const raw = document.getElementById('web-csv').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
  const entries = {};
  lines.forEach(row => {
    const sep = row.includes('\t') ? '\t' : ',';
    const p = row.split(sep).map(x => x.trim());
    if (!p[0] || p[0].toLowerCase() === 'date') return;
    const dt = new Date(p[0]);
    if (isNaN(dt.getTime())) return;
    const we = new Date(dt);
    while (we.getDay() !== 0) we.setDate(we.getDate() + 1);
    const k = we.toISOString().split('T')[0];
    if (!entries[k]) entries[k] = { views: 0, users: 0, active: 0, sessions: 0 };
    entries[k].views    += parseInt(p[1]) || 0;
    entries[k].users    += parseInt(p[2]) || 0;
    entries[k].active   += parseInt(p[3]) || 0;
    entries[k].sessions += parseInt(p[4]) || 0;
  });
  const newRows = Object.entries(entries).map(([week, m]) => ({ week, ...m }));
  const merged = load('website');
  newRows.forEach(nr => {
    const idx = merged.findIndex(r => r.week === nr.week);
    if (idx >= 0) merged[idx] = { ...merged[idx], ...nr };
    else merged.push(nr);
  });
  save('website', merged.sort((a, b) => a.week > b.week ? 1 : -1));
  document.getElementById('web-csv').value = '';
  toggleForm('web-form');
  toast('Imported ' + newRows.length + ' weeks of website data.');
  renderWebsite();
}

// Header-aware daily website import: accepts a raw Looker Studio / GA export:
// finds the date column and metric columns by NAME wherever they sit, skips any
// report-title rows above the header, and handles "1,234" numbers and odd dates.
// Falls back to the legacy fixed-order format (date,views,users,sessions,cta,eoi).
function importWebsiteDailyCSV(input) {
  const file = input.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: (results) => {
      const raw = results.data;
      const num = v => { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
      // Local-date string (NOT toISOString, which shifts Sydney dates back a day)
      const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const parseD = s => {
        s = String(s || '').trim(); if (!s) return null;
        const m = s.match(/^(\d{4})(\d{2})(\d{2})$/);            // Looker's 20260401 format
        if (m) { const d = new Date(+m[1], +m[2] - 1, +m[3]); return isNaN(d) ? null : d; }
        const d = new Date(s); return isNaN(d) ? null : d;
      };
      // Locate the header row (Looker exports sometimes put a report title above it)
      const hIdx = raw.findIndex(row => row.some(c => /^(date|day)\b/i.test(String(c || '').trim())));
      const existing = load('website_daily');
      const map = Object.fromEntries(existing.map(r => [r.date, r]));
      let imported = 0, matchedNote = '';

      if (hIdx >= 0) {
        const headers = raw[hIdx].map(h => String(h || '').trim());
        const lc = headers.map(h => h.toLowerCase());
        const col = (...needles) => {
          let i = lc.findIndex(h => needles.some(n => h === n));
          if (i < 0) i = lc.findIndex(h => needles.some(n => h.includes(n)));
          return i;
        };
        const cDate = col('date', 'day');
        const cViews = col('screen page views', 'page views', 'pageviews', 'views');
        const cUsers = col('total users', 'users');
        const cActive = col('active users');
        const cSess = col('sessions');
        const cCta = col('cta', 'key events', 'conversions');
        const cEoi = col('eoi', 'form submissions', 'form');
        raw.slice(hIdx + 1).forEach(p => {
          const d = parseD(p[cDate]); if (!d) return;
          const date = ymd(d);
          const prev = map[date] || {};
          const pick = (ci, old) => ci >= 0 ? (num(p[ci]) ?? old ?? null) : (old ?? null);
          map[date] = {
            date,
            views:    pick(cViews, prev.views),
            users:    cUsers >= 0 ? (num(p[cUsers]) ?? prev.users ?? null) : pick(cActive, prev.users),
            sessions: pick(cSess, prev.sessions),
            cta:      pick(cCta, prev.cta),
            eoiform:  pick(cEoi, prev.eoiform),
          };
          imported++;
        });
        matchedNote = [['views', cViews], ['users', cUsers >= 0 ? cUsers : cActive], ['sessions', cSess], ['CTA', cCta], ['EOI', cEoi]]
          .filter(([, ci]) => ci >= 0).map(([k, ci]) => k + ' ← “' + headers[ci] + '”').join(' · ');
      } else {
        // Legacy fixed-order file with no recognisable header
        raw.forEach(p => {
          const d = parseD(p[0]); if (!d) return;
          const date = ymd(d);
          map[date] = { date,
            views: num(p[1]) ?? map[date]?.views ?? null, users: num(p[2]) ?? map[date]?.users ?? null,
            sessions: num(p[3]) ?? map[date]?.sessions ?? null, cta: num(p[4]) ?? map[date]?.cta ?? null,
            eoiform: num(p[5]) ?? map[date]?.eoiform ?? null };
          imported++;
        });
        matchedNote = 'fixed column order (no header row found)';
      }
      if (!imported) { toast('⚠ No rows imported: could not find a date column. Check the file has a Date column.', 8000); input.value = ''; return; }
      const merged = Object.values(map).sort((a, b) => a.date > b.date ? 1 : -1);
      save('website_daily', merged);
      input.value = '';
      toast('✓ Imported ' + imported + ' days · ' + matchedNote, 9000);
      renderWebsite();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

function saveWebsite() {
  const week = document.getElementById('web-week').value;
  if (!week) { toast('Please select a week ending date.'); return; }
  const entry = { week };
  ['views','users','active','sessions','cta','eoiform'].forEach(f => {
    const v = document.getElementById('web-' + f)?.value;
    if (v !== '' && v != null) entry[f] = Number(v);
  });
  const arr = load('website').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('website', arr);
  toggleForm('web-form');
  toast('Saved: week of ' + fmtDate(week));
  renderWebsite();
}

function saveWebsiteDaily() {
  const date = document.getElementById('wbd-date').value;

        '<span class="src-tag">Manual · Labs weekly snapshot</span><br>Active users from the most recent manually entered Labs weekly record (Labs is not in PostHog yet). Add snapshots in the Giraffe sub-tab below.') +
      kpiCardHTML('Weekly Labs sessions', lLast?.sessions ?? null, null, null, null, lLast ? 'week of ' + fmtDate(lLast.week) + ' · manual' : 'no Labs data logged yet',
        '<span class="src-tag">Manual · Labs weekly snapshot</span><br>Session count from the most recent manually entered Labs weekly record: the closest available stand-in for weekly Labs events until Labs joins PostHog.'),

    )}

    ${cardsHTML([
      ['Total users (all time)', totalUsers, null, null, phLive ? 'all time · PostHog' : 'run SQL migration to enable',

          ? '<span class="src-tag">Live · PostHog</span><br>Distinct users who have ever triggered an event in Land iQ, from the <b>ph_summary()</b> materialized view.<br><div class="calc-row">ph_summary() → total_users</div>'
          : '<span class="src-tag">Not available</span><br>Requires the PostHog SQL migration to be run in Supabase. Once enabled, pulls from the ph_summary() materialized view.'],
      ['Active users', phLive ? activeCount : null, null, null, 'seen in last 14 days',
        '<span class="src-tag">Live · PostHog</span><br>Users in the <b>"Active"</b> segment: seen at least once in the last 14 days. From <b>ph_user_segments()</b>.<br><div class="calc-row">ph_user_segments() → segment = "Active"</div>'],
      ['At-risk users', phLive ? atRiskCount : null, null, null, 'quiet for 14–30 days',
        '<span class="src-tag">Live · PostHog</span><br>Users in the <b>"At-risk"</b> segment: last seen between <b>14 and 30 days ago</b> (quieter than that counts as Dormant). From <b>ph_user_segments()</b>. The at-risk <i>list</i> in Insights uses a stricter, more actionable filter: was active 5+ days, quiet 30–90 days.<br><div class="calc-row">ph_user_segments() → segment = "At-risk"</div>'],
    ])}

    <div class="sub-tabs">
      ${['giraffe','sdk','retention','insights'].map(s =>
        `<button class="sub-tab${sub===s?' active':''}" onclick="setActivitySub('${s}')">${
          {giraffe:'Giraffe',sdk:'SDK / Features',retention:'Retention',insights:'Insights'}[s]
        }</button>`
      ).join('')}
    </div>

    <div id="activity-sub-content"></div>
  `;

  setActivitySub(sub, false, { giraffe, sdk, labs });
}

function setActivitySub(sub, rerender = true, data) {
  activeSub.activity_sub = sub;
  if (rerender) { renderActivity(); return; }

  const sc = document.getElementById('activity-sub-content');
  if (!sc) return;

  const giraffe = data?.giraffe || load('activity_giraffe');
  const sdk     = data?.sdk     || load('activity_sdk');
  const labs    = data?.labs    || load('activity_labs');
  const phLive  = _ph.loaded && !_ph.error;

  // ── GIRAFFE ─────────────────────────────────────────────────────────────
  if (sub === 'giraffe') {
    const hasLive   = phLive && _ph.weekly.length > 0;
    const hasDau    = phLive && _ph.daily.length > 0;
    const hasDauMau = phLive && _ph.dauMau.length > 0;

    // Pre-compute weekly table rows (live preferred, else manual)
    let weeklyTableHTML = '';
    if (hasLive) {
      const liveRows = [..._ph.weekly].slice(-12).reverse().map(r =>
        '<tr>' +
        '<td>' + (r.week_start||'').slice(0,10) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.active_users) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.login_users) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.new_users) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.total_events) + '</td>' +
        '</tr>'
      ).join('');
      weeklyTableHTML = '<div class="tbl-scroll"><table>' +
        '<thead><tr><th>Week start</th><th style="text-align:right">Active users</th><th style="text-align:right">Login users</th><th style="text-align:right">New users</th><th style="text-align:right">Events</th></tr></thead>' +
        '<tbody>' + liveRows + '</tbody></table></div>';
    } else if (giraffe.length) {
      const manualRows = [...giraffe].reverse().slice(0,12).map(r =>
        '<tr>' +
        '<td>' + fmtDate(r.week) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.logins) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.active_users) + '</td>' +
        '<td style="text-align:right">' + fmtNum(r.new_users) + '</td>' +
        '<td style="text-align:right">' + (r.dau_mau != null ? r.dau_mau.toFixed(1)+'%' : ':') + '</td>' +
        '<td style="text-align:right">' + (r.avg_session != null ? r.avg_session+'m' : ':') + '</td>' +
        '<td style="color:var(--tl)">' + (r.notes||':') + '</td>' +

        '<tbody>' + manualRows + '</tbody></table></div>';

    const chartWrap1 = (hasLive || giraffe.length) ? '<div class="chart-wrap" style="height:240px"><canvas id="act-giraffe-chart"></canvas></div>' : '<div class="no-data">No Giraffe activity data yet.</div>';
    const chartWrap2 = hasDau ? '<div class="chart-wrap" style="height:200px;margin-top:16px"><canvas id="act-dau-chart"></canvas></div>' : '';
    const chartWrap3 = hasDauMau ? '<div class="chart-wrap" style="height:180px;margin-top:16px"><canvas id="act-daumau-chart"></canvas></div>' : '';

    // Chart 1: WAU line (live preferred)

    } else if (giraffe.length) {

        type: 'line',

          datasets: [
            { label:'Active users', data:recent.map(r=>r.active_users||0), borderColor:'#2e8bc0', backgroundColor:'rgba(46,139,192,.07)', borderWidth:2, fill:true, tension:.3, pointRadius:3 },
            { label:'Logins',       data:recent.map(r=>r.logins||0),       borderColor:'#2a7a4b', borderWidth:2, fill:false, tension:.3, pointRadius:3 },
            { label:'New users',    data:recent.map(r=>r.new_users||0),    borderColor:'#c25a00', borderWidth:2, fill:false, tension:.3, pointRadius:3, borderDash:[5,4] },
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'DM Sans', size:11 }, boxWidth:12 } } },
          scales:{ x:{ grid:{ display:false }, ticks:{ ...axStyle, maxRotation:35 } }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
        }
      });
    }

    // Chart 2: DAU (last 30 days)
    if (hasDau) {
      const dData = _ph.daily.slice(-30);
      makeChart('act-dau-chart', {
        type:'bar',
        data:{
          labels: dData.map(r => shortDate(r.day)),
          datasets:[
            { label:'Daily active users', data:dData.map(r=>r.active_users||0), backgroundColor:'rgba(46,139,192,.6)', borderRadius:2, barThickness:'flex' },
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ title: ctx => 'Day: '+ctx[0].label } } },
          scales:{ x:{ grid:{ display:false }, ticks:{ ...axStyle, maxRotation:45, font:{ size:9 } } }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
        }
      });
    }

    // Chart 3: DAU/MAU
    if (hasDauMau) {
      const dmData = _ph.dauMau.slice(-30);
      makeChart('act-daumau-chart', {
        type:'line',
        data:{
          labels: dmData.map(r => shortDate(r.day)),
          datasets:[
            { label:'Daily ÷ monthly users %', data:dmData.map(r=>r.dau_mau_pct||0), borderColor:'#7b1fa2', backgroundColor:'rgba(123,31,162,.06)', fill:true, borderWidth:2, tension:.3, pointRadius:2 },
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false } },
          scales:{
            x:{ grid:{ display:false }, ticks:{ ...axStyle, maxRotation:45, font:{ size:9 } } },
            y:{ grid:gridStyle, ticks:{ ...axStyle, callback: v => v+'%' }, beginAtZero:true, max:100 }
          }
        }
      });
    }

  // ── SDK / FEATURES ───────────────────────────────────────────────────────
  } else if (sub === 'sdk') {
    const hasFeat = phLive && _ph.features.length > 0;

    // Manual SDK data (fallback)
    const appEvents = {};
    const appUsers  = {};
    sdk.forEach(r => {
      if (!r.app_name) return;
      appEvents[r.app_name] = (appEvents[r.app_name]||0) + (r.events||0);
      appUsers[r.app_name]  = Math.max(appUsers[r.app_name]||0, r.active_users||0);
    });
    const appNamesSorted = Object.entries(appEvents).sort((a,b)=>b[1]-a[1]).map(([k])=>k);

    // Live feature table rows
    let featTableHTML = '';
    if (hasFeat) {
      const liveFeats = _ph.features.slice(0,20).map(f =>
        '<tr>' +
        '<td style="font-weight:500">' + (f.feature||':') + '</td>' +
        '<td style="text-align:right">' + fmtNum(f.total_events) + '</td>' +
        '<td style="text-align:right">' + fmtNum(f.active_users) + '</td>' +
        '<td style="color:var(--tl)">' + ((f.latest_day||'').slice(0,10)) + '</td>' +
        '</tr>'

        '<tbody>' + liveFeats + '</tbody></table></div>';

        '<td style="color:var(--tl)">' + (r.notes||':') + '</td>' +
        '<td><button class="btn-del" onclick="delRow(\'activity_sdk\',\'' + r._id + '\',\'_id\')">Delete</button></td>' +
        '</tr>'
      ).join('');
      sdkTableHTML = '<div class="tbl-scroll"><table>' +
        '<thead><tr><th>Date</th><th>App / Component</th><th style="text-align:right">Events</th><th style="text-align:right">Active users</th><th>Notes</th><th></th></tr></thead>' +
        '<tbody>' + manualRows + '</tbody></table></div>';
    }

    sc.innerHTML = `
      <div class="box">
        <div class="box-title">SDK &amp; Feature Usage: by app / component

          <a class="src-link" href="https://posthog.com" target="_blank" style="margin-left:auto">↗ PostHog</a>
        </div>
        ${hasFeat || appNamesSorted.length ? '<div class="chart-wrap" style="height:260px"><canvas id="act-sdk-chart"></canvas></div>' : '<div class="no-data">No SDK / feature data yet. Add entries below or run the SQL migration for live data.</div>'}
      </div>

      ${hasFeat ? '<div class="box"><div class="box-title">Feature breakdown: last 30 days</div>' + featTableHTML + '</div>' : ''}

      ${sdk.length ? '<div class="box"><div class="box-title">Manual snapshots</div>' + sdkTableHTML + '</div>' : ''}

      <div class="form-section">
        <button class="add-btn" onclick="toggleForm('act-sdk-form')">+ Add manual SDK snapshot</button>

          <div class="form-grid">
            <div class="form-group"><label>Date</label><input type="date" id="as-date"></div>

          <div class="form-actions">

    `;

    if (hasFeat) {
      const feats = _ph.features.slice(0, 12);
      makeChart('act-sdk-chart', {
        type:'bar',
        data:{
          labels: feats.map(f => f.feature),
          datasets:[
            { label:'Events (30d)',   data:feats.map(f=>f.total_events||0), backgroundColor:'#2e8bc0', borderRadius:4 },
            { label:'Active users',  data:feats.map(f=>f.active_users||0),  backgroundColor:'rgba(42,122,75,.7)', borderRadius:4 },

        },

        data:{
          labels: appNamesSorted,

            <div class="form-group"><label>Sessions</label><input type="number" id="al-sessions"></div>
            <div class="form-group"><label>Avg session (minutes)</label><input type="number" id="al-session" step="1"></div>

          </div>
        </div></div>
      </div>
    `;

    if (labs.length && recentLabs.length) {
      makeChart('act-labs-chart', {
        type:'line',
        data:{
          labels: recentLabs.map(r => fmtDate(r.week).slice(0,6)),
          datasets:[
            { label:'Active users', data:recentLabs.map(r=>r.active_users||0), borderColor:'#3949ab', backgroundColor:'rgba(57,73,171,.07)', borderWidth:2, fill:true, tension:.3, pointRadius:3 },

          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'DM Sans', size:11 }, boxWidth:12 } } },
          scales:{ x:{ grid:{ display:false }, ticks:{ ...axStyle, maxRotation:35 } }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
        }
      });
    }

  // ── RETENTION ────────────────────────────────────────────────────────────
  } else if (sub === 'retention') {
    const hasRet  = phLive && _ph.retention.length > 0;
    const hasNew  = phLive && _ph.newUsers.length > 0;
    const segMap  = Object.fromEntries((_ph.segments||[]).map(s => [s.segment, Number(s.user_count)]));
    const segTotal = Object.values(segMap).reduce((a,b)=>a+b,0);

    // ── Summary stats across all cohorts ──────────────────────────────────
    function avgRetention(field) {
      const valid = _ph.retention.filter(r => r.cohort_size > 0 && r[field] != null);
      if (!valid.length) return null;
      return Math.round(valid.reduce((s,r) => s + r[field]/r.cohort_size*100, 0) / valid.length);
    }
    const avgW1 = hasRet ? avgRetention('retained_w1') : null;
    const avgW2 = hasRet ? avgRetention('retained_w2') : null;
    const avgW4 = hasRet ? avgRetention('retained_w4') : null;
    const avgW8 = hasRet ? avgRetention('retained_w8') : null;
    const totalCohorted = hasRet ? _ph.retention.reduce((s,r) => s+(r.cohort_size||0), 0) : null;

    // ── Heatmap cell colour: green (high) → red (low) ─────────────────────
    function heatColour(p) {
      if (p == null) return '#f4f6f8';
      if (p >= 80) return '#c8ecd4';
      if (p >= 60) return '#d4edda';
      if (p >= 40) return '#fff3cd';
      if (p >= 20) return '#fde8d8';
      return '#fcd9d9';
    }
    function heatText(p) {
      if (p == null) return '#aaa';
      if (p >= 60) return '#1a4d2e';
      if (p >= 40) return '#7a4f00';
      return '#7a1a1a';
    }

    // ── Heatmap table ─────────────────────────────────────────────────────
    const heatRows = hasRet ? _ph.retention.slice(-16).reverse().map(r => {
      const p = field => r.cohort_size > 0 && r[field] != null ? Math.round(r[field]/r.cohort_size*100) : null;
      const cell = (v, bold) => {
        const bg = heatColour(v); const col = heatText(v);
        return `<td style="text-align:center;background:${bg};color:${col};font-weight:${bold?700:500};border-radius:4px;padding:5px 8px;font-size:12px">${v!=null?v+'%':':'}</td>`;
      };
      return `<tr>
        <td style="font-size:11px;color:var(--tm);padding:4px 8px;white-space:nowrap">${shortDate(r.cohort_week)}</td>
        <td style="text-align:center;font-weight:700;font-size:12px;padding:4px 8px">${fmtNum(r.cohort_size)}</td>
        ${cell(100, true)}
        ${cell(p('retained_w1'), false)}
        ${cell(p('retained_w2'), false)}
        ${cell(p('retained_w4'), false)}
        ${cell(p('retained_w8'), false)}
      </tr>`;
    }).join('') : '';

    // ── At-risk user list ─────────────────────────────────────────────────
    const atRiskRows = (_ph.atRisk||[]).slice(0,15).map(u =>
      `<tr>
        <td style="font-size:11px;font-family:monospace;max-width:180px;overflow:hidden;text-overflow:ellipsis">${u.distinct_id||':'}</td>
        <td style="text-align:right;font-size:11px">${u.active_days||0}d</td>
        <td style="text-align:right;font-size:11px">${(u.last_seen||'').slice(0,10)}</td>
        <td style="text-align:right;font-size:11px;color:${(() => { const days=(new Date()-new Date(u.last_seen))/86400000; return days>30?'var(--re)':days>14?'#c25a00':'var(--gr)'; })()}">${(() => { const days=Math.round((new Date()-new Date(u.last_seen))/86400000); return days+'d ago'; })()}</td>
      </tr>`
    ).join('');

    sc.innerHTML = `
      ${!phLive ? '<div class="callout warn" style="margin-bottom:16px"><div class="callout-text">Retention data requires the PostHog SQL migration. Run <strong>posthog_migrations.sql</strong> in the <a href="https://supabase.com/dashboard/project/ysdonnjezvoyrrizadik/editor" target="_blank" style="color:var(--acc)">Supabase SQL Editor</a> first.</div></div>' : ''}

      <div class="cards" style="margin-bottom:18px">
        ${cardsHTML([
          ['Avg W1 retention', avgW1, null, '%', 'across all cohorts', '<span class="src-tag">Live · PostHog</span><br>Average % of new users who returned in week 1, across all cohorts tracked.<br><div class="calc-row">avg(retained_w1 / cohort_size) across all cohorts</div>'],
          ['Avg W2 retention', avgW2, null, '%', 'across all cohorts', '<span class="src-tag">Live · PostHog</span><br>Average % of new users still active in week 2.<br><div class="calc-row">avg(retained_w2 / cohort_size)</div>'],
          ['Avg W4 retention', avgW4, null, '%', 'across all cohorts', '<span class="src-tag">Live · PostHog</span><br>Average % of new users still active in week 4 (1 month).<br><div class="calc-row">avg(retained_w4 / cohort_size)</div>'],
          ['Avg W8 retention', avgW8, null, '%', 'across all cohorts', '<span class="src-tag">Live · PostHog</span><br>Average % of new users still active in week 8 (2 months).<br><div class="calc-row">avg(retained_w8 / cohort_size)</div>'],
          ['Total cohorted users', totalCohorted, null, null, 'all tracked cohorts', '<span class="src-tag">Live · PostHog</span><br>Sum of all cohort sizes tracked: total unique users who entered a cohort.<br><div class="calc-row">SUM(cohort_size)</div>'],
        ])}
      </div>

      ${hasNew ? `<div class="box">
        <div class="box-title">New users per week: last 16 weeks</div>
        <div class="chart-wrap" style="height:180px"><canvas id="act-newusers-chart"></canvas></div>
      </div>` : ''}

      <div class="box">
        <div class="box-title">Cohort retention heatmap: % retained after N weeks
          <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:8px">Green = high retention · Red = low · last 16 cohorts</span>
        </div>
        ${hasRet ? `
        <div class="tbl-scroll">
          <table style="border-collapse:separate;border-spacing:3px;width:100%">
            <thead><tr>
              <th style="text-align:left;font-size:11px;padding:4px 8px">Cohort week</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">Size</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">W0 (entry)</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">W1</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">W2</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">W4</th>
              <th style="text-align:center;font-size:11px;padding:4px 8px">W8</th>
            </tr></thead>
            <tbody>${heatRows}</tbody>
            <tfoot><tr>
              <td style="font-size:11px;font-weight:600;padding:6px 8px">Avg</td>
              <td></td>
              <td style="text-align:center;background:${heatColour(100)};color:${heatText(100)};font-weight:700;border-radius:4px;padding:5px 8px;font-size:12px">100%</td>
              ${[avgW1,avgW2,avgW4,avgW8].map(v => `<td style="text-align:center;background:${heatColour(v)};color:${heatText(v)};font-weight:700;border-radius:4px;padding:5px 8px;font-size:12px">${v!=null?v+'%':':'}</td>`).join('')}
            </tr></tfoot>
          </table>
        </div>` : '<div class="no-data">No retention data. Run SQL migration to enable.</div>'}
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
        ${hasRet ? `<div class="box" style="margin-bottom:0">
          <div class="box-title">Retention decay: latest 6 cohorts</div>
          <div class="chart-wrap" style="height:240px"><canvas id="act-retention-chart"></canvas></div>
        </div>` : ''}
        ${segTotal > 0 ? `<div class="box" style="margin-bottom:0">
          <div class="box-title">User health segments</div>
          <div class="chart-wrap" style="height:240px"><canvas id="act-seg-donut"></canvas></div>
        </div>` : ''}
      </div>

      ${(_ph.atRisk||[]).length > 0 ? `<div class="box">
        <div class="box-title">At-risk users: was active 5+ days, quiet 30+ days (top 15)
          <span style="font-size:11px;font-weight:400;color:var(--tl);margin-left:8px">3+ lifetime active days · not seen in 14d+</span>
        </div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>User ID</th><th style="text-align:right">Active days</th><th style="text-align:right">Last seen</th><th style="text-align:right">Inactive for</th></tr></thead>
          <tbody>${atRiskRows}</tbody>
        </table></div>
      </div>` : ''}
    `;

    if (hasNew) {
      const nuData = _ph.newUsers.slice(-16);
      makeChart('act-newusers-chart', {
        type:'bar',
        data:{
          labels: nuData.map(r => shortDate(r.week_start)),
          datasets:[{ label:'New users', data:nuData.map(r=>r.new_users||0), backgroundColor:'rgba(46,139,192,.7)', borderRadius:3 }]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false } },
          scales:{ x:{ grid:{ display:false }, ticks:{ ...axStyle, maxRotation:35 } }, y:{ grid:gridStyle, ticks:axStyle, beginAtZero:true } }
        }
      });
    }

    if (hasRet) {
      const cohorts = _ph.retention.slice(-6);
      const palette = ['#2e8bc0','#2a7a4b','#c25a00','#7b1fa2','#c0392b','#f39c12'];
      const datasets = cohorts.map((r, i) => ({
        label: shortDate(r.cohort_week),
        data: [100,
          r.cohort_size>0 ? Math.round(r.retained_w1/r.cohort_size*100) : 0,
          r.cohort_size>0 ? Math.round(r.retained_w2/r.cohort_size*100) : 0,
          r.cohort_size>0 ? Math.round(r.retained_w4/r.cohort_size*100) : 0,
          r.cohort_size>0 ? Math.round(r.retained_w8/r.cohort_size*100) : 0,
        ],
        borderColor: palette[i%palette.length], borderWidth:2, fill:false, tension:.3, pointRadius:4,
      }));
      makeChart('act-retention-chart', {
        type:'line',
        data:{ labels:['W0','W1','W2','W4','W8'], datasets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'DM Sans', size:10 }, boxWidth:10 } } },
          scales:{ x:{ grid:{ display:false }, ticks:axStyle }, y:{ grid:gridStyle, ticks:{ ...axStyle, callback: v=>v+'%' }, beginAtZero:true, max:100 } }
        }
      });
    }

    if (segTotal > 0) {
      const segColours = { New:'#2e8bc0', Active:'#2a7a4b', 'At-risk':'#c25a00', Dormant:'#8a9fb0' };
      const segEntries = Object.entries(segMap).filter(([,v])=>v>0);
      makeChart('act-seg-donut', {
        type:'doughnut',
        data:{
          labels: segEntries.map(([k])=>k),
          datasets:[{ data: segEntries.map(([,v])=>v), backgroundColor: segEntries.map(([k])=>segColours[k]||'#ccc'), borderWidth:2 }]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'right', labels:{
            font:{ family:'DM Sans', size:11 }, boxWidth:12,
            generateLabels: chart => chart.data.labels.map((l,i) => ({
              text: l+': '+fmtNum(chart.data.datasets[0].data[i]),
              fillStyle: chart.data.datasets[0].backgroundColor[i], hidden:false, index:i
            }))
          }}}
        }
      });
    }

  // ── INSIGHTS ─────────────────────────────────────────────────────────────
  } else if (sub === 'insights') {
    const hasData = phLive && _ph.featureAdoption.length > 0;

    // Segment donut data
    const segMap = Object.fromEntries((_ph.segments||[]).map(s => [s.segment, Number(s.user_count)]));
    const segTotal = Object.values(segMap).reduce((a,b)=>a+b,0);
    const segColours = { New:'#2e8bc0', Active:'#2a7a4b', 'At-risk':'#c25a00', Dormant:'#8a9fb0' };

    // Feature adoption table rows
    const adoptionRows = (_ph.featureAdoption||[]).slice(0,15).map(f =>
      '<tr>' +
      '<td style="font-weight:500;text-transform:capitalize">' + f.feature + '</td>' +
      '<td style="text-align:right">' + fmtNum(f.users_who_tried) + '</td>' +
      '<td style="text-align:right">' +
        '<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">' +
        '<div style="width:80px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden">' +
        '<div style="width:' + Math.min(f.adoption_pct,100) + '%;height:100%;background:var(--acc);border-radius:3px"></div>' +
        '</div>' + f.adoption_pct + '%</div></td>' +
      '</tr>'
    ).join('');

    // At-risk users rows
    const atRiskRows = (_ph.atRisk||[]).slice(0,20).map(u =>
      '<tr>' +
      '<td style="font-family:monospace;font-size:11px;color:var(--tm)">' + (u.distinct_id||'').slice(0,24) + '…</td>' +
      '<td style="text-align:right">' + (u.first_seen||'').slice(0,10) + '</td>' +
      '<td style="text-align:right;color:var(--wa);font-weight:600">' + (u.last_seen||'').slice(0,10) + '</td>' +
      '<td style="text-align:right">' + fmtNum(u.active_days) + 'd</td>' +
      '<td style="text-align:right">' + fmtNum(u.total_events) + '</td>' +
      '</tr>'
    ).join('');

    // Power users rows
    const powerRows = (_ph.powerUsers||[]).map((u,i) =>
      '<tr>' +
      '<td style="color:var(--tl);font-size:11px">#' + (i+1) + '</td>' +
      '<td style="font-family:monospace;font-size:11px;color:var(--tm)">' + (u.distinct_id||'').slice(0,28) + '…</td>' +
      '<td style="text-align:right">' + fmtNum(u.total_events) + '</td>' +
      '<td style="text-align:right">' + fmtNum(u.active_days) + 'd</td>' +
      '<td style="text-align:right;color:var(--tl)">' + (u.last_seen||'').slice(0,10) + '</td>' +
      '</tr>'
    ).join('');

    sc.innerHTML = `
      ${!hasData ? '<div class="callout warn"><div class="callout-text">Run the SQL migration and click Refresh PostHog to load Insights data.</div></div>' : ''}

      <div style="margin-bottom:0">

        <div class="box">
          <div class="box-title">User health segments</div>
          ${segTotal > 0 ? `
            <div class="chart-wrap" style="height:200px"><canvas id="act-segments-chart"></canvas></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
              ${['New','Active','At-risk','Dormant'].map(s => `
                <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sur);border-radius:6px">
                  <span style="width:8px;height:8px;border-radius:50%;background:${segColours[s]};flex-shrink:0"></span>
                  <div>
                    <div style="font-size:13px;font-weight:600">${fmtNum(segMap[s]||0)}</div>
                    <div style="font-size:11px;color:var(--tl)">${s}</div>
                  </div>
                </div>`).join('')}
            </div>` : '<div class="no-data">No segment data yet.</div>'}
        </div>

      </div>

      <div class="box">
        <div class="box-title">Feature adoption: % of all users who have tried each feature</div>
        ${adoptionRows ? `
          <div class="chart-wrap" style="height:220px;margin-bottom:16px"><canvas id="act-adoption-chart"></canvas></div>
          <div class="tbl-scroll"><table>
            <thead><tr><th>Feature</th><th style="text-align:right">Users</th><th style="text-align:right">Adoption</th></tr></thead>
            <tbody>${adoptionRows}</tbody>
          </table></div>` : '<div class="no-data">No adoption data.</div>'}
      </div>

      ${(() => {
        // Paying customers gone quiet: the actionable version of "at-risk".
        // Needs email matching (posthog_add_emails.sql + a sync run).
        const ea = {};
        (_ph.emailActivity || []).forEach(r => { if (r.email) ea[r.email.toLowerCase()] = r; });
        if (!Object.keys(ea).length) return '';
        const nowQ = new Date();
        const quiet = _pd_people
          .filter(p => {
            if (p['Person - Customer Type'] !== 'Paid Subscription') return false;
            const rem = pdParseDate(p['Person - Date Access Removed']);
            return !pdValidDate(rem) || rem > nowQ;
          })
          .map(p => {
            const em = (p['Person - Email'] || p['Email'] || '').toLowerCase();
            const act = em && ea[em];
            if (!act || !act.last_seen) return null;
            const days = Math.floor((nowQ - new Date(act.last_seen)) / 86400000);
            return days >= 14 ? { name: p['Person - Name'] || em, org: p['Person - Organisation'] || ':', days, activeDays: act.active_days } : null;
          })
          .filter(Boolean)
          .sort((a, b) => a.days - b.days)
          .slice(0, 20);
        return `<div class="box">
          <div class="box-title">Paying customers gone quiet
            <span style="font-size:10px;font-weight:400;color:var(--tl);margin-left:6px">active paid users not seen in 14+ days · most recently lapsed first: call these first</span>
          </div>
          ${quiet.length ? `<div class="tbl-scroll"><table>
            <thead><tr><th>Name</th><th>Organisation</th><th style="text-align:right">Days quiet</th><th style="text-align:right">Lifetime active days</th></tr></thead>
            <tbody>${quiet.map(q => `<tr>
              <td style="font-size:12px">${q.name}</td>
              <td style="font-size:12px;color:var(--tm)">${q.org}</td>
              <td style="text-align:right;font-weight:600;color:${q.days<=30?'#c25a00':'#c0392b'}">${q.days}d</td>
              <td style="text-align:right">${fmtNum(q.activeDays)}</td>
            </tr>`).join('')}</tbody>
          </table></div>` : '<div class="no-data">Every matched paying customer has been active in the last 14 days.</div>'}
        </div>`;
      })()}

      <div class="box">
        <div class="box-title">At-risk users
          <span style="font-size:10px;font-weight:400;color:var(--tl);margin-left:6px">was active 5+ days · not seen in 30–90 days</span>
        </div>
        ${atRiskRows ? `<div class="tbl-scroll"><table>
          <thead><tr><th>User ID</th><th style="text-align:right">First seen</th><th style="text-align:right">Last seen</th><th style="text-align:right">Active days</th><th style="text-align:right">Events</th></tr></thead>
          <tbody>${atRiskRows}</tbody>
        </table></div>` : '<div class="no-data">No at-risk users: great sign!</div>'}
      </div>

      <div class="box">
        <div class="box-title">Power users: top 25 by activity</div>
        ${powerRows ? `<div class="tbl-scroll"><table>
          <thead><tr><th>#</th><th>User ID</th><th style="text-align:right">Events</th><th style="text-align:right">Active days</th><th style="text-align:right">Last seen</th></tr></thead>
          <tbody>${powerRows}</tbody>
        </table></div>` : '<div class="no-data">No data.</div>'}
      </div>
    `;

    // Segments donut chart
    if (segTotal > 0) {
      makeChart('act-segments-chart', {
        type: 'doughnut',
        data: {
          labels: ['New','Active','At-risk','Dormant'],
          datasets: [{ data: ['New','Active','At-risk','Dormant'].map(s=>segMap[s]||0),
            backgroundColor: ['#2e8bc0','#2a7a4b','#c25a00','#8a9fb0'], borderWidth: 2, borderColor: '#fff' }]
        },
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: ctx => ctx.label+': '+fmtNum(ctx.raw)+' users' } } },
          cutout: '60%'
        }
      });
    }

    // Feature adoption bar chart
    if (_ph.featureAdoption.length) {
      const top = _ph.featureAdoption.slice(0,12);
      makeChart('act-adoption-chart', {
        type:'bar',
        data:{
          labels: top.map(f => f.feature),
          datasets:[{ label:'Adoption %', data:top.map(f=>f.adoption_pct||0),
            backgroundColor:'rgba(46,139,192,.75)', borderRadius:4 }]
        },
        options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
          plugins:{ legend:{ display:false } },
          scales:{
            x:{ grid:gridStyle, ticks:{ ...axStyle, callback: v=>v+'%' }, beginAtZero:true, max:100 },
            y:{ grid:{ display:false }, ticks:{ ...axStyle, font:{ size:11 } } }
          }
        }
      });
    }
  }
}

function saveGiraffeActivity() {
  const week = document.getElementById('ag-week').value;
  if (!week) { toast('Select a week ending date.'); return; }
  const entry = {
    _id: 'ag-' + Date.now(), week,
    logins:      Number(document.getElementById('ag-logins').value)  || null,
    active_users:Number(document.getElementById('ag-active').value)  || null,
    new_users:   Number(document.getElementById('ag-new').value)     || null,
    first_login: document.getElementById('ag-first').value           || null,
    last_login:  document.getElementById('ag-last').value            || null,
    dau_mau:     parseFloat(document.getElementById('ag-daumau').value) || null,
    avg_session: Number(document.getElementById('ag-session').value) || null,
    notes:       document.getElementById('ag-notes').value           || null,
  };
  const arr = load('activity_giraffe').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a,b) => a.week > b.week ? 1 : -1);
  save('activity_giraffe', arr);
  toggleForm('act-giraffe-form');
  toast('Giraffe snapshot saved.');
  renderActivity();
}

// TRAINING TAB
// ─────────────────────────────────────────
// Weekly trained / self-trained series for the last 12 weeks (Monday-start).
// "Trained" = manual session attendees (non Self-serve) + Pipedrive access granted.
// "Self-trained" = sessions logged with type "Self-serve": manual until Labs tracking is live.
function trainingWeeklySeries() {
  const ymdL = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const weekStartOf = ds => { const x = new Date(ds); if (isNaN(x)) return null; x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymdL(x); };
  const weeks = [];
  const cur = new Date(); cur.setHours(0, 0, 0, 0); cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
  for (let i = 11; i >= 0; i--) { const w = new Date(cur); w.setDate(w.getDate() - i * 7); weeks.push(ymdL(w)); }
  const trained = Object.fromEntries(weeks.map(w => [w, 0]));
  const self    = Object.fromEntries(weeks.map(w => [w, 0]));
  load('training').forEach(r => {
    const w = weekStartOf(r.date); if (w == null || !(w in trained)) return;
    if ((r.type || '') === 'Self-serve') self[w] += (r.attendees || 0); else trained[w] += (r.attendees || 0);
  });
  const _skip = ['Contact Register', 'Expression of Interest'];
  _pd_people.forEach(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    if (!pdValidDate(dt) || _skip.includes(p['Person - Customer Type'])) return;
    const w = weekStartOf(dt); if (w != null && (w in trained)) trained[w] += 1;
  });
  return { weeks, trained, self };
}

// Manual proficiency audits (1-5 self-score) until the in-app Labs pop-up ships.
function saveProficiency() {
  const date = document.getElementById('prof-date').value;
  const score = Number(document.getElementById('prof-score').value);
  if (!date || !score) { toast('Enter a date and an average score.'); return; }
  if (score < 1 || score > 5) { toast('Score must be between 1 and 5.'); return; }
  const entry = { _id: 'prof-' + Date.now(), date, score };
  const sample = document.getElementById('prof-sample').value; if (sample) entry.sample = Number(sample);
  const notes = document.getElementById('prof-notes').value; if (notes) entry.notes = notes;
  save('proficiency', [...load('proficiency'), entry].sort((a, b) => a.date > b.date ? 1 : -1));
  toggleForm('prof-form');
  toast('Proficiency audit saved.');
  renderTraining();
}

function renderTraining(el) {
  el = el || document.getElementById('main-content');
  const data = load('training');
  const webinars = load('webinars');
  const sub = activeSub.training_sub || 'sessions';
  const _now = new Date();

  const tm = thisMonth(data, 'date');

  // Pipedrive people with access granted = people who were trained/onboarded
  // Exclude contact-only types that have a date set but were never actually trained
  const _PD_UNTRAINED_TYPES = ['Contact Register', 'Expression of Interest'];
  const pdTrained = _pd_people.filter(p => {
    const dt = pdParseDate(p['Person - Date Access Granted']);
    return pdValidDate(dt) && !_PD_UNTRAINED_TYPES.includes(p['Person - Customer Type']);
  });
  const trainedThisMonth = pdTrained.length
    ? pdTrained.filter(p => {
        const dt = pdParseDate(p['Person - Date Access Granted']);
        return dt.getFullYear() === _now.getFullYear() && dt.getMonth() === _now.getMonth();
      }).length
    : tm.reduce((s, r) => s + (r.attendees || 0), 0);
  const cumulative = pdTrained.length || data.reduce((s, r) => s + (r.attendees || 0), 0);

  // Build monthly chart: Pipedrive access-granted dates (full history) + manual sessions
  const months = {};
  pdTrained.forEach(p => {
    const k = monthKey(p['Person - Date Access Granted']);
    if (k) months[k] = (months[k] || 0) + 1;
  });
  data.forEach(r => {
    const k = monthKey(r.date);
    if (k) months[k] = (months[k] || 0) + (r.attendees || 0);
  });
  const barData = Object.entries(months).sort().slice(-36);

  // Weekly trained / self-trained (last 12 weeks) + this-week snapshot
  const wkSeries = trainingWeeklySeries();
  const thisWk = wkSeries.weeks[wkSeries.weeks.length - 1];
  const trainedThisWeek = wkSeries.trained[thisWk] || 0;
  const selfThisWeek = wkSeries.self[thisWk] || 0;

  // % of the user base trained in the last year (approximate: attendee counts can
  // include repeat attendees, and the user base is PostHog's all-time user count)
  const yearAgo = new Date(); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
  const trainedLastYear = pdTrained.filter(p => pdParseDate(p['Person - Date Access Granted']) >= yearAgo).length
    + data.filter(r => r.date && new Date(r.date) >= yearAgo && (r.type || '') !== 'Self-serve').reduce((s, r) => s + (r.attendees || 0), 0);
  const userBase = (_ph && _ph.summary && _ph.summary.total_users) || cumulative || null;
  const pctTrainedYr = userBase ? Math.min(100, trainedLastYear / userBase * 100) : null;

  // Manual proficiency audits
  const profs = load('proficiency').sort((a, b) => a.date > b.date ? 1 : -1);
  const profLatest = profs.length ? profs[profs.length - 1] : null;

  // Pipedrive onboarding pipeline
  const onboarding = _pd_deals.filter(d => d['Deal - Pipeline'] === 'General Onboarding Pipeline');
  const stageCount = (s) => onboarding.filter(d => d['Deal - Stage'] === s).length;
  const awaiting   = stageCount('Awaiting Onboarding');
  const inOnboard  = stageCount('In Onboarding');
  const growth2m   = stageCount('2 Month Growth Period');
  const complete   = stageCount('Onboarding Complete');
  const maintenance = stageCount('Maintenance') + stageCount('Month 11!');

      ['Active trials', trialActive + trialMid || null, null, null, 'Pipedrive: Trial Pipeline',
        '<span class="src-tag">Pipedrive · Trial Pipeline</span><br>Deals at <b>Trial in Progress</b> (' + trialActive + ') plus <b>Trial Mid Point</b> (' + trialMid + ') stages. Both stages represent active, ongoing trials.<br><div class="calc-row">Stage = "Trial in Progress" OR "Trial Mid Point"</div>'],
    ])}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="box">
        <div class="box-title">Onboarding pipeline <span style="font-size:11px;color:var(--tl);font-weight:400;margin-left:4px">General Onboarding · ${onboarding.length} total</span></div>
        ${onboarding.length ? `
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
            ${funnelStages.map(s => `
              <div style="display:flex;align-items:center;gap:10px">
                <div style="font-size:12px;color:var(--tx);min-width:160px;white-space:nowrap">${s.label}</div>

                </div>

              </div>
            `).join('')}

      </div>

      <div class="box">
        <div class="box-title">Trial pipeline <span style="font-size:11px;color:var(--tl);font-weight:400;margin-left:4px">Trial Pipeline · ${trials.length} total</span></div>
        ${trials.length ? `

            ${[

              { label: 'Trial Mid Point',   count: trialMid,      color: '#1a3c5e' },

                <div style="flex:1;background:var(--bd);border-radius:4px;height:20px;position:relative;overflow:hidden">

  const pdOnboardData = Object.entries(pdOnboardByMonth).sort().slice(-18);

  setTrainingSub('sessions', false, barData, data, webinars, convMonthData, convRunning, pdOnboardData);
}

    // Paid orgs with PostHog signal
    const paidPeopleROI = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
    const powerEmails  = new Set((_ph.powerUsers   || []).map(u => (u.distinct_id||'').toLowerCase()));
    const atRiskEmails = new Set((_ph.atRisk  || []).map(u => (u.distinct_id||'').toLowerCase()));

    const orgROI = {};
    paidPeopleROI.forEach(p => {
      const org = (p['Person - Organisation'] || 'Unknown').trim();
      if (!orgROI[org]) orgROI[org] = { sessions:0, hasPower:false, hasAtRisk:false, userCount:0 };
      orgROI[org].userCount++;
      orgROI[org].sessions = trainedOrgsMap[org] || 0;
      const em = (p['Person - Email'] || p['Email'] || '').toLowerCase();
      if (em && powerEmails.has(em))  orgROI[org].hasPower = true;
      if (em && atRiskEmails.has(em)) orgROI[org].hasAtRisk = true;
    });

    const roiOrgs = Object.entries(orgROI).map(([org, m]) => ({org, ...m}));
    const trained2   = roiOrgs.filter(o => o.sessions > 0);
    const untrained2 = roiOrgs.filter(o => o.sessions === 0);
    const trainedPower   = trained2.filter(o => o.hasPower).length;
    const untrainedPower = untrained2.filter(o => o.hasPower).length;
    const trainedAtRisk  = trained2.filter(o => o.hasAtRisk).length;
    const untrainedAtRisk = untrained2.filter(o => o.hasAtRisk).length;

    const roiHTML = roiOrgs.length ? `
      <div class="section-block" style="margin-top:0">
        <h3>Training ROI: trained vs untrained orgs ${infoBtn('Training ROI',
          `<p>Compares the PostHog engagement profile of <b>paying orgs that received training sessions</b> (from the manual training log) against those that did not.</p>
          <p><b>Power user</b>: in PostHog top-25 most active users. <b>At-risk</b>: not seen in the last 14 days but were previously active.</p>
          <p>PostHog matching is by user email address: orgs with no email in PostHog are excluded from the signal columns.</p>
          <span class="src-tag">Training log · Pipedrive People · PostHog</span>`)}</h3>
        ${cardsHTML([
          ['Trained orgs', trained2.length, null, null, `${fmtPct(pct(trained2.length, roiOrgs.length))} of paid orgs`],
          ['Trained → power user', trainedPower, null, null, trained2.length ? fmtPct(pct(trainedPower, trained2.length)) + ' of trained orgs' : null],
          ['Trained → at-risk', trainedAtRisk, null, null, trained2.length ? fmtPct(pct(trainedAtRisk, trained2.length)) + ' of trained orgs' : null],
          ['Untrained → power user', untrainedPower, null, null, untrained2.length ? fmtPct(pct(untrainedPower, untrained2.length)) + ' of untrained orgs' : null],
          ['Untrained → at-risk', untrainedAtRisk, null, null, untrained2.length ? fmtPct(pct(untrainedAtRisk, untrained2.length)) + ' of untrained orgs' : null],
        ])}
        ${roiOrgs.length ? `<div class="chart-wrap" style="height:220px"><canvas id="training-roi-chart"></canvas></div>` : ''}
      </div>` : '';

    // Append ROI section
    const roiEl = document.createElement('div');
    roiEl.innerHTML = roiHTML;
    sc.appendChild(roiEl);

    if (roiOrgs.length) {
      makeChart('training-roi-chart', {
        type: 'bar',
        data: {
          labels: ['Trained orgs', 'Untrained orgs'],
          datasets: [
            { label: 'Power users (%)', data: [
                trained2.length   ? Math.round(pct(trainedPower,   trained2.length))   : 0,
                untrained2.length ? Math.round(pct(untrainedPower, untrained2.length)) : 0
              ], backgroundColor: '#2a7a4b', borderRadius: 4 },
            { label: 'At-risk (%)', data: [
                trained2.length   ? Math.round(pct(trainedAtRisk,   trained2.length))   : 0,
                untrained2.length ? Math.round(pct(untrainedAtRisk, untrained2.length)) : 0
              ], backgroundColor: '#e05252', borderRadius: 4 },
          ]
        },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
          scales: {
            x: { grid: { display: false }, ticks: axStyle },
            y: { grid: gridStyle, ticks: { ...axStyle, callback: v => v + '%' }, beginAtZero: true, max: 100 }
          }
        }
      });
    }

  }
}

function renderMarketing(el) {
  el = el || document.getElementById('main-content');
  const data = load('content');
  const tm = thisMonth(data, 'date');

  const types = ['LinkedIn','YouTube','EDM','Viva Engage','Webinar','Blog','Speaking'];
  const typeColors = { LinkedIn:'#0a66c2', YouTube:'#c0392b', EDM:'#2a7a4b', 'Viva Engage':'#c25a00', Webinar:'#3949ab', Blog:'#7b1fa2', Speaking:'#00796b' };

  // Summary cards from latest tracker week
  const tracker = load('weekly_tracker').sort((a,b) => a.week > b.week ? 1 : -1);
  const latestW = tracker.length ? tracker[tracker.length - 1] : null;
  const liImpLatest = liImp(latestW);

  // Last 12 tracker weeks for charts
  const trackerRecent = tracker.slice(-12);

  // Webinars data: enriched with derived performance metrics, chronological
  const DEFAULT_WB_SECS = 3600;   // assume 60 min when a length isn't recorded
  const webinars = load('webinars');
  const wbPerf = [...webinars].sort((a, b) => (a.date > b.date ? 1 : -1)).map(w => {
    const avgSec = parseMinSec(w.avgTime);
    const lenSec = parseMinSec(w.length);
    const usedLen = lenSec || DEFAULT_WB_SECS;
    return {
      ...w,
      emailOpenRate: pct(w.emailsOpened, w.emailsSent),           // email opens ÷ sent
      emailClickRate: pct(w.emailsClicked, w.emailsSent),         // email clicks ÷ sent
      emailToReg:    pct(w.registered, w.emailsSent),             // sent → registered
      attendRate:  pct(w.attended, w.registered),                 // show rate
      regConv:     pct(w.registered, w.regPageViews),             // reg-page conversion
      cancelRate:  pct(w.cancelled, w.registered),
      avgSec, lenSec, lenAssumed: !lenSec,
      engageRatio: avgSec != null ? avgSec / usedLen * 100 : null, // watch ÷ length
      reactPerAtt: (w.reactions != null && w.attended) ? w.reactions / w.attended : null,
      noShow:      (w.registered != null && w.attended != null) ? w.registered - w.attended : null,
    };
  });
  const wbAvg = k => { const v = wbPerf.map(w => w[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const wbTotAttended = wbPerf.reduce((s, w) => s + (w.attended || 0), 0);
  // Webinar funnel selector: default to the current pick, else the most recent
  // webinar that shows the multi-channel gap, else the most recent with any data.
  const wbFunnelList = [...webinars].sort((a, b) => a.date > b.date ? 1 : -1);
  const wbFunnelDefault =
    (_wbFunnelSel && wbFunnelList.some(w => w._id === _wbFunnelSel)) ? _wbFunnelSel
    : ([...wbFunnelList].reverse().find(w => w.regPageViews != null && w.emailsClicked != null && w.regPageViews > w.emailsClicked)?._id
       || [...wbFunnelList].reverse().find(w => w.emailsSent != null || w.registered != null)?._id
       || (wbFunnelList.length ? wbFunnelList[wbFunnelList.length - 1]._id : ''));
  window.editWebinar = (id) => {
    const w = load('webinars').find(x => x._id === id); if (!w) return;
    toggleForm('webinar-form');
    ['date','title','emailsSent','emailsOpened','emailsClicked','regPageViews','registered','attended','cancelled','avgTime','reactions','length'].forEach(f => {
      const el = document.getElementById('wb-' + f); if (el) el.value = w[f] ?? '';
    });
    const idEl = document.getElementById('wb-editid'); if (idEl) idEl.value = id;
    document.getElementById('webinar-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  // EDM data
  const edms = data.filter(r => r.type === 'EDM').reverse();
  const growth2m = load('edm_2m');

  // EDM indicator data: campaigns in date order for clicks/recipient-growth KPIs
  const edmSorted = data.filter(r => r.type === 'EDM' && r.date).sort((a, b) => a.date > b.date ? 1 : -1);
  const edmLast = edmSorted[edmSorted.length - 1] || null;
  const edmPrev = edmSorted[edmSorted.length - 2] || null;
  const edmRecGrowth = (edmLast?.recipients != null && edmPrev?.recipients != null) ? edmLast.recipients - edmPrev.recipients : null;
  const edmRec = edmSorted.filter(e => e.recipients != null);

  // ── POSTS & EVENTS CALENDAR ──
  // Past months show what was actually published/held (content + webinar logs).
  // Future items come ONLY from the manually locked-in planned-events list, each
  // marked proposed or confirmed. A planned event whose date has passed drops off
  // the calendar automatically (the held event should come from the logs) and is
  // flagged for cleanup in the review-mode manager below.
  const calEvents = {};
  const _td = new Date();
  const todayIso = _td.getFullYear() + '-' + String(_td.getMonth() + 1).padStart(2, '0') + '-' + String(_td.getDate()).padStart(2, '0');
  const addCalEv = (dateStr, type, title, status) => {
    if (!dateStr) return;
    const d = String(dateStr).slice(0, 10);
    if (!status && d > todayIso) return;   // logs are past-only: nothing projected
    (calEvents[d] = calEvents[d] || []).push({ type, title: title || type, status });
  };
  data.forEach(c => addCalEv(c.date, c.type || 'Other', c.title));
  webinars.forEach(w => addCalEv(w.date, 'Webinar', w.title));
  const planned = load('planned_events').sort((a, b) => a.date > b.date ? 1 : -1);
  const plannedUpcoming = planned.filter(p => p.date >= todayIso);
  const plannedStale = planned.filter(p => p.date < todayIso);
  plannedUpcoming.forEach(p => addCalEv(p.date, p.type || 'Other', p.title, p.status || 'proposed'));
  // Gantt-style timeline: week columns with month headers spanning above, one row
  // per content type. Range: previous 2 months through the end of next month.
  const partsDate = s => { const [yy, mm, dd] = s.split('-').map(Number); return new Date(yy, mm - 1, dd); };
  const ymdG = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const wkStartG = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const gWeeks = [];
  { const gEnd = new Date(_td.getFullYear(), _td.getMonth() + 2, 0);   // end of next month
    for (let w = wkStartG(new Date(_td.getFullYear(), _td.getMonth() - 2, 1)); w <= gEnd; w.setDate(w.getDate() + 7)) gWeeks.push(ymdG(w)); }
  const nowWk = ymdG(wkStartG(_td));
  // Month header spans: each week belongs to the month its Monday falls in
  const gMonths = [];
  gWeeks.forEach(w => {
    const lbl = partsDate(w).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
    if (gMonths.length && gMonths[gMonths.length - 1].lbl === lbl) gMonths[gMonths.length - 1].span++;
    else gMonths.push({ lbl, span: 1 });
  });
  const gMonthStarts = new Set();
  { let acc = 0; gMonths.forEach(m => { gMonthStarts.add(acc); acc += m.span; }); }
  // Events grouped: type → week-start → list
  const gRows = {};
  Object.entries(calEvents).forEach(([d, evs]) => {
    const w = ymdG(wkStartG(partsDate(d)));
    evs.forEach(e => {
      const t = e.type || 'Other';
      ((gRows[t] = gRows[t] || {})[w] = gRows[t][w] || []).push({ ...e, date: d });
    });
  });
  const gTypes = [...types, 'Other'].filter(t => gRows[t]);
  const gDot = e => {
    const col = typeColors[e.type] || '#888';
    if (e.status === 'proposed')  return `<span class="cal-dot proposed" style="border-color:${col}"></span>`;
    if (e.status === 'confirmed') return `<span class="cal-dot confirmed" style="background:${col}"></span>`;
    return `<span class="cal-dot" style="background:${col}"></span>`;
  };
  const calHTML = gTypes.length ? `<table class="gantt">
    <thead>
      <tr><th class="gc-type"></th>${gMonths.map(m => `<th class="gc-month" colspan="${m.span}">${m.lbl}</th>`).join('')}</tr>
      <tr><th class="gc-type" style="font-weight:400;color:var(--tl);font-size:10px">week starting</th>${gWeeks.map((w, i) =>
        `<th class="gc-week${w === nowWk ? ' gc-now' : ''}${gMonthStarts.has(i) ? ' gc-mstart' : ''}">${partsDate(w).getDate()}${w === nowWk ? '<div style="font-size:8px;color:var(--acc);font-weight:700">now</div>' : ''}</th>`).join('')}</tr>
    </thead>
    <tbody>${gTypes.map(t => `<tr>
      <td class="gc-type">${t}</td>
      ${gWeeks.map((w, i) => {
        const evs = (gRows[t] && gRows[t][w]) || [];
        const tip = evs.map(e => fmtDate(e.date) + (e.status ? ' (' + e.status + ')' : '') + ': ' + (e.title || e.type)).join(' | ').replace(/"/g, '&quot;');
        return `<td class="gc-cell${w === nowWk ? ' gc-now' : ''}${gMonthStarts.has(i) ? ' gc-mstart' : ''}"${evs.length ? ` title="${tip}"` : ''}>${evs.slice(0, 3).map(gDot).join('')}${evs.length > 3 ? '<span class="cal-more">+' + (evs.length - 3) + '</span>' : ''}</td>`;
      }).join('')}
    </tr>`).join('')}</tbody>
  </table>` : '';

function saveTrackerWeek() {
  const week = document.getElementById('tr2-week').value;
  if (!week) { toast('Select a week.'); return; }
  // Every form field except the legacy per-person LinkedIn splits.
  const fields = ['jsImp','postsWeek','edmOpen','edmCtr','wbEmailSend','wbEmailOpen','wbEmailCtr','wbRegPage','wbReg','websiteVisits','websiteViews','purchaseEnq','eoiTickets','trialsStarted'];
  // Start from the existing row so we edit in place and keep its _id.
  const existing = load('weekly_tracker').find(r => r.week === week);
  const entry = { ...(existing || {}), _id: existing?._id || ('trk-' + Date.now()), week };
  // The single LinkedIn input is the combined total; drop the legacy js/jm/lb/sk
  // splits so a manual edit can't double-count against the total.
  delete entry.jmImp; delete entry.lbImp; delete entry.skImp;
  fields.forEach(f => {
    const v = document.getElementById('tr2-' + f)?.value;
    if (v !== '' && v != null) entry[f] = Number(v);
    else delete entry[f];   // cleared field → remove it
  });
  const arr = load('weekly_tracker').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('weekly_tracker', arr);
  toggleForm('tracker-form');
  toast('Tracker week saved.');
  renderTab(activeTab);
}

// Populate the add/edit form from an existing tracker week (or clear it for a new one).
function loadTrackerWeek(week) {
  const fields = ['postsWeek','edmOpen','edmCtr','wbEmailSend','wbEmailOpen','wbEmailCtr','wbRegPage','wbReg','websiteVisits','websiteViews','purchaseEnq','eoiTickets','trialsStarted'];
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = (val == null ? '' : val); };
  if (!week) { set('tr2-week', ''); set('tr2-jsImp', ''); fields.forEach(f => set('tr2-' + f, '')); return; }
  const rec = load('weekly_tracker').find(r => r.week === week) || {};
  set('tr2-week', week);
  set('tr2-jsImp', liImp(rec));                       // show the combined LinkedIn total
  fields.forEach(f => set('tr2-' + f, rec[f]));
}

function saveTrackerEdit(id) {
  const fields = ['jsImp','jmImp','lbImp','skImp','postsWeek','edmOpen','edmCtr','wbEmailSend','wbEmailOpen','wbEmailCtr','wbRegPage','wbReg','websiteVisits','websiteViews','purchaseEnq','eoiTickets','trialsStarted'];
  const arr = load('weekly_tracker');
  const idx = arr.findIndex(r => r._id === id);
  if (idx < 0) { toast('Row not found.'); return; }
  fields.forEach(f => {
    const el = document.getElementById('trkedit-' + f);
    if (!el) return;
    const v = el.value;
    if (v !== '' && v != null) arr[idx][f] = Number(v);
    else delete arr[idx][f];
  });
  save('weekly_tracker', arr);
  activeSub.editing_tracker = null;
  toast('Row updated.');
  renderTab(activeTab);
}

// Parse a date string from Lucy's CSV header (e.g. "6-Nov", "26-Mar", "1-Apr-25", ISO dates)
function parseTrackerDate(str) {
  if (!str || !str.trim()) return null;
  str = str.trim();
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // Native parse ONLY when the string carries a full 4-digit year — otherwise
  // Chrome reads a day-month like "6-Nov" as year 2001 (a V8 quirk). Also uses
  // local y-m-d, not toISOString (which shifts Sydney dates back a day).
  if (/\b\d{4}\b/.test(str)) {
    const d = new Date(str);
    if (!isNaN(d.getTime())) return ymd(d);
  }
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const yearOf = (raw) => raw ? (raw.length === 2 ? 2000 + parseInt(raw) : parseInt(raw)) : new Date().getFullYear();
  const build = (day, mo, rawYear) => {
    if (mo == null || mo < 0 || mo > 11 || !(day >= 1 && day <= 31)) return null;
    let year = yearOf(rawYear);
    let c = new Date(year, mo, day);
    if (c - new Date() > 180 * 86400000) c = new Date(--year, mo, day);  // future → prior year
    return ymd(c);
  };
  // "6-Nov", "26-Mar", "1 Apr", "6-Nov-25", "6-Nov-2025"
  let m = str.match(/^(\d{1,2})[\s\-\/]([a-zA-Z]{3})(?:[\s\-\/](\d{2,4}))?$/);
  if (m) return build(parseInt(m[1]), months[m[2].toLowerCase()], m[3]);
  // "6/11" or "6/11/25" — day/month(/year), Australian order
  m = str.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
  if (m) return build(parseInt(m[1]), parseInt(m[2]) - 1, m[3]);
  return null;
}
