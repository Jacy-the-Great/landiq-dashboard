function importTrackerCSV(input) {
  const file = input.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: (results) => {
      const rows = results.data;
      if (rows.length < 2) { toast('CSV appears empty.'); return; }

      // Row 0 = header: [label col, date1, date2, ...]
      const headerRow = rows[0];
      const dateKeys = []; // ISO date string per column (null if unparseable / skipped)
      const skippedCols = [];
      const FUTURE_CUTOFF = Date.now() + 45 * 86400000; // a weekly tracker never reports months ahead
      for (let c = 1; c < headerRow.length; c++) {
        const raw = String(headerRow[c] || '').trim();
        let dk = parseTrackerDate(raw);
        // Drop stray far-future columns (e.g. a lone legacy "6-Nov" adrift from the run)
        if (dk && new Date(dk).getTime() > FUTURE_CUTOFF) { skippedCols.push(raw); dk = null; }
        dateKeys.push(dk);
      }

      // Section-aware field mapping
      const SECTION_MAP = {
        linkedin: {
          'js post impressions': 'jsImp',
          'jm post impressions': 'jmImp',
          'lb post impressions': 'lbImp',
          'sk post impressions': 'skImp',
          'total posts per week': 'postsWeek',
          'total posts':          'postsWeek',
          'posts per week':       'postsWeek',
          'number of posts':      'postsWeek',
        },
        edm: {
          'email open rate':     'edmOpen',
          'open rate':           'edmOpen',
          'click through rate':  'edmCtr',
          'click-through rate':  'edmCtr',
          'ctr':                 'edmCtr',
        },
        webinar: {
          'email send':              'wbEmailSend',
          'email sends':             'wbEmailSend',
          'email open rate':         'wbEmailOpen',
          'open rate':               'wbEmailOpen',
          'click through rate':      'wbEmailCtr',
          'click-through rate':      'wbEmailCtr',
          'ctr':                     'wbEmailCtr',
          'event registration page': 'wbRegPage',
          'registration page':       'wbRegPage',
          'registrations':           'wbReg',
        },
        website: {
          'website/landing page visits (total users)': 'websiteVisits',
          'total users (visits)':    'websiteVisits',
          'total users':             'websiteVisits',
          'website visits':          'websiteVisits',
          'users':                   'websiteVisits',
          'website/landing page visits (views)': 'websiteViews',
          'total views':             'websiteViews',
          'purchase enquiries':      'purchaseEnq',
          'purchase enquiry':        'purchaseEnq',
          'purchse enquiries':       'purchaseEnq',   // common misspelling in Lucy's sheet
          'purchse enquiry':         'purchaseEnq',
          'purchase':                'purchaseEnq',
          'eoi tickets':             'eoiTickets',
          'eoi ticket':              'eoiTickets',
          'eoi':                     'eoiTickets',
          'trials started':          'trialsStarted',
          'trial':                   'trialsStarted',
        },
      };

      // Detect section from a row label
      function detectSection(label) {
        const l = label.toLowerCase();
        if (l.includes('linkedin'))                           return 'linkedin';
        if (l.includes('edm') || l.includes('2m growth') || l.includes('email marketing')) return 'edm';
        if (l.includes('webinar'))                            return 'webinar';
        if (l.includes('website') || l.includes('landing page')) return 'website';
        return null;
      }

      // Accumulate values per week
      const dataMap = {}; // { isoDate: { fieldKey: value } }
      dateKeys.forEach(dk => { if (dk) dataMap[dk] = dataMap[dk] || {}; });

      let currentSection = null;

      for (let ri = 1; ri < rows.length; ri++) {
        const row = rows[ri];
        const label = String(row[0] || '').trim();
        if (!label) continue;

        // Switch section when a row names one. Don't skip the row afterwards: in
        // Lucy's sheet some rows are BOTH the section marker and a data row (e.g.
        // "Website/Landing Page Visits (total users)" carries the visits figures),
        // so we still try to map it below. Pure header rows (e.g. "LinkedIn",
        // "Webinar - May") simply match no field and fall through harmlessly.
        const sec = detectSection(label);
        if (sec) currentSection = sec;
        if (!currentSection) continue;

        // Look up the field key for this metric label
        // Try exact match first, then starts-with (handles suffixes like "(Consolidated)", "(visits)")
        const labelNorm = label.toLowerCase().replace(/\s+/g, ' ').trim();
        const secMap = SECTION_MAP[currentSection] || {};
        let fieldKey = secMap[labelNorm];
        if (!fieldKey) {
          // Longest key first so "email open rate" beats "open rate"
          const keys = Object.keys(secMap).sort((a, b) => b.length - a.length);
          for (const k of keys) {
            if (labelNorm.startsWith(k)) { fieldKey = secMap[k]; break; }
          }
        }
        if (!fieldKey) continue;

        // Read each column's value
        for (let c = 1; c < row.length; c++) {
          const dk = dateKeys[c - 1];
          if (!dk) continue;
          const raw = String(row[c] || '').trim().replace(/%/g, '').replace(/,/g, '');
          if (!raw || raw === '-' || raw === ':') continue;
          const num = parseFloat(raw);
          if (!isNaN(num)) dataMap[dk][fieldKey] = num;
        }
      }

      // Merge with existing tracker records. Drop any corrupt weeks first: an older
      // import mis-parsed day-month headers as year 2001 (a V8 date quirk). Anything
      // dated before 2020 is bogus for this product and is cleared out here.
      const existing   = load('weekly_tracker').filter(r => {
        const y = parseInt(String(r.week).slice(0, 4), 10);
        return !(y && y < 2020);
      });
      const existingMap = Object.fromEntries(existing.map(r => [r.week, r]));
      let count = 0;
      Object.entries(dataMap).forEach(([week, fields]) => {
        if (!Object.keys(fields).length) return;
        const prev = existingMap[week] || { _id: 'trk-' + Date.now() + '-' + (++count) };
        existingMap[week] = { ...prev, week, ...fields };
        count++;
      });

      const merged = Object.values(existingMap).sort((a,b) => a.week > b.week ? 1 : -1);
      save('weekly_tracker', merged);
      input.value = '';
      const weekCount = Object.values(dataMap).filter(f => Object.keys(f).length > 0).length;
      const skipNote = skippedCols.length ? ` · skipped ${skippedCols.length} stray column${skippedCols.length > 1 ? 's' : ''} (${skippedCols.join(', ')})` : '';
      toast(`Imported ${weekCount} weeks from CSV${skipNote}.`);
      renderTab(activeTab);
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

// Webinar conversion funnel: the full flow from emails sent through to reactions,
// with each stage's absolute count and stage-to-stage conversion. The bars are
// scaled to the largest stage, so when reg-page visits exceed email clicks the
// funnel visibly WIDENS: that surplus arrived from non-email channels (social,
// EDM). Built to extend later with UTM source splits.
function webinarFunnelHTML(w) {
  if (!w) return '<div class="no-data">No webinar selected.</div>';
  const openRate = pct(w.emailsOpened, w.emailsSent);
  const clickRate = pct(w.emailsClicked, w.emailsSent);
  const regConv = pct(w.registered, w.regPageViews);
  const attRate = pct(w.attended, w.registered);
  const reactRate = pct(w.reactions, w.attended);
  const stages = [
    { key:'sent',    label:'Emails sent',      value: w.emailsSent,    note: '', grp:'email' },
    { key:'opened',  label:'Emails opened',    value: w.emailsOpened,  note: openRate  != null ? fmtPct(openRate)  + ' open rate'  : '', grp:'email' },
    { key:'clicked', label:'Emails clicked',   value: w.emailsClicked, note: clickRate != null ? fmtPct(clickRate) + ' click rate' : '', grp:'email' },
    { key:'regview', label:'Reg. page visits', value: w.regPageViews,  note: '', grp:'event' },
    { key:'reg',     label:'Registered',       value: w.registered,    note: regConv != null ? fmtPct(regConv) + ' of page visits' : '', grp:'event' },
    { key:'att',     label:'Attended',         value: w.attended,      note: attRate != null ? fmtPct(attRate) + ' of registered' : '', grp:'event' },
    { key:'react',   label:'Reactions',        value: w.reactions,     note: reactRate != null ? fmtPct(reactRate) + ' of attendees' : '', grp:'event' },
  ].filter(s => s.value != null);
  if (!stages.length) return '<div class="no-data">No funnel data for this webinar yet: add emails sent, reg-page visits, registered and attended via Edit.</div>';
  const maxVal = Math.max(...stages.map(s => s.value));
  const grpColor = { email: '#6b9bc4', event: '#2e8bc0' };
  const otherChannel = (w.regPageViews != null && w.emailsClicked != null && w.regPageViews > w.emailsClicked) ? w.regPageViews - w.emailsClicked : null;
  const otherPct = (otherChannel != null && w.regPageViews) ? otherChannel / w.regPageViews * 100 : null;
  let lastGrp = null;
  const bars = stages.map(s => {
    const bridge = (lastGrp === 'email' && s.grp === 'event')
      ? '<div class="fn-bridge">↓ reaches the event page: email clicks + other channels (social, EDM)</div>' : '';
    lastGrp = s.grp;
    const wpc = maxVal ? Math.max(2.5, s.value / maxVal * 100) : 0;
    const highlight = s.key === 'regview' && otherChannel != null;
    const col = highlight ? '#c25a00' : grpColor[s.grp];
    return bridge + `<div class="fn-row">
      <div class="fn-label">${s.label}</div>
      <div class="fn-track"><div class="fn-bar" style="width:${wpc}%;background:${col}"><span class="fn-val">${fmtNum(s.value)}</span></div></div>
      <div class="fn-note">${s.note}</div>
    </div>`;
  }).join('');
  let callout = '';
  if (otherChannel != null) {
    callout = `<div class="callout info" style="margin-top:14px">
      <div class="callout-label">Not just email: other channels are driving this webinar</div>
      <div class="callout-text">Only <b>${fmtNum(w.emailsClicked)}</b> people clicked the webinar email, yet <b>${fmtNum(w.regPageViews)}</b> reached the registration page. That gap of about <b>${fmtNum(otherChannel)}</b> visits (${fmtPct(otherPct)} of page visits) came from beyond the email: social posts and EDM. Email alone isn't carrying registrations.</div>
    </div>`;
  } else if (w.emailsClicked == null && w.regPageViews != null) {
    callout = `<div style="font-size:11px;color:var(--tl);margin-top:10px">Add <b>promo emails clicked</b> via Edit to compare email clicks against reg-page visits and reveal how much traffic comes from other channels.</div>`;
  }
  return `<div class="fn-wrap">${bars}</div>${callout}
    <div style="font-size:10.5px;color:var(--tl);margin-top:10px">Bars scaled to the largest stage. When "Reg. page visits" runs longer than "Emails clicked", the extra arrived from channels other than the email. UTM source splits (email / EDM / socials) can slot in here later.</div>`;
}

const pd12Months = () => {

// ── PEOPLE FIELD NORMALISER ──────────────────────────────────────────────────
// Pipedrive sometimes exports People CSVs without the "Person - " prefix on
// column headers (or with slight label variations). This function detects the
// actual column names and maps them to the canonical keys the dashboard uses.
function pdNormalisePeople(rows) {
  if (!rows.length) return rows;
  const p0 = rows[0];
  const keys = Object.keys(p0);
  const find = (...needles) => keys.find(k => needles.some(n => k.toLowerCase() === n.toLowerCase()))
    || keys.find(k => needles.some(n => k.toLowerCase().includes(n.toLowerCase())));
  // Map each canonical field independently (no all-or-nothing early return) so a
  // file with SOME canonical headers still gets the rest mapped: e.g. Pipedrive
  // People exports name the email column just "Email".
  const map = {
    'Person - Customer Type':          find('Person - Customer Type', 'Customer Type', 'Customer type', 'customer_type'),
    'Person - Previous Customer Type': find('Person - Previous Customer Type', 'Previous Customer Type', 'previous customer type', 'Previous Customer'),
    'Person - Date Access Granted':    find('Person - Date Access Granted', 'Date Access Granted', 'date access granted', 'Access Granted'),
    'Person - Date Access Removed':    find('Person - Date Access Removed', 'Date Access Removed', 'date access removed', 'Access Removed'),
    'Person - Organisation':           find('Person - Organisation', 'Organisation', 'Organization', 'Company', 'Org'),
    'Person - Email':                  find('Person - Email', 'Email - Work', 'Primary email', 'Email'),
    'Person - Name':                   find('Person - Name', 'Name'),
  };
  const need = Object.entries(map).filter(([canonical, src]) => src && src !== canonical);
  if (!need.length) return rows; // everything already canonical
  return rows.map(p => {
    const n = {...p};
    for (const [canonical, src] of need) {
      if (n[canonical] == null || n[canonical] === '') n[canonical] = p[src] ?? '';
    }
    return n;
  });
}

// Deals equivalent: maps varying export headers to canonical 'Deal - X' keys AND
// cleans currency-formatted values ("A$24,000" → 24000) so parseFloat works.
// Runs on every load so it also repairs already-uploaded data with no re-upload.
function pdNormaliseDeals(rows) {
  if (!rows.length) return rows;
  const d0 = rows[0];
  const keys = Object.keys(d0);
  const find = (...needles) => keys.find(k => needles.some(n => k.toLowerCase() === n.toLowerCase()))
    || keys.find(k => needles.some(n => k.toLowerCase().includes(n.toLowerCase())));
  // Only build a header map if the canonical keys aren't already present.
  const needMap = !('Deal - Status' in d0);
  const map = needMap ? {
    'Deal - Title':          find('Deal - Title', 'Title'),
    'Deal - Value':          find('Deal - Value', 'Value', 'Deal value'),
    'Deal - Pipeline':       find('Deal - Pipeline', 'Pipeline'),
    'Deal - Stage':          find('Deal - Stage', 'Stage'),
    'Deal - Status':         find('Deal - Status', 'Status'),
    'Deal - Won time':       find('Deal - Won time', 'Won time', 'Won date'),
    'Deal - Lost time':      find('Deal - Lost time', 'Lost time', 'Lost date'),
    'Deal - Deal created':   find('Deal - Deal created', 'Deal created', 'Created', 'Add time'),
    'Deal - Category':       find('Deal - Category', 'Category', 'Label'),
    'Deal - Owner':          find('Deal - Owner', 'Owner', 'Deal owner'),
    'Deal - Source channel': find('Deal - Source channel', 'Source channel', 'Source'),
    'Deal - Lost reason':    find('Deal - Lost reason', 'Lost reason'),
    'Deal - Organisation':   find('Deal - Organisation', 'Organisation', 'Organization', 'Company'),
    'Deal - Person':         find('Deal - Person', 'Contact person', 'Person', 'Contact'),
  } : {};
  const cleanNum = v => (v == null || v === '') ? v : String(v).replace(/[^0-9.\-]/g, '');
  return rows.map(d => {
    const n = {...d};
    for (const [canonical, src] of Object.entries(map)) {
      if (src && !(canonical in d)) n[canonical] = d[src] ?? '';
    }
    // Always sanitise the value (handles "A$24,000", "$8,800", "1,234.5", etc.)
    if (n['Deal - Value'] != null) n['Deal - Value'] = cleanNum(n['Deal - Value']);
    return n;
  });
}

// ── REQUIRED-FIELD VALIDATION ────────────────────────────────────────────────
// The dashboard declares the fields each indicator depends on, then checks every
// import for them: so a Pipedrive export that dropped a column (e.g. the People
// export without Customer Type) is caught and flagged instead of silently
// zeroing metrics.
const PD_FIELDS = {
  deals: [
    { key: 'Deal - Status',         label: 'Status (won/lost/open)', req: true,  used: 'Won/lost counts, win rate, revenue' },
    { key: 'Deal - Value',          label: 'Value ($)',              req: true,  used: 'All revenue figures' },
    { key: 'Deal - Pipeline',       label: 'Pipeline',               req: true,  used: '2026 Sales filtering' },
    { key: 'Deal - Stage',          label: 'Stage',                  req: true,  used: 'Funnels, OPTI-MAX, stage snapshot' },
    { key: 'Deal - Won time',       label: 'Won time',               req: true,  used: 'Revenue by month, sales cycle' },
    { key: 'Deal - Deal created',   label: 'Deal created',           req: false, used: 'Sales cycle length' },
    { key: 'Deal - Organisation',   label: 'Organisation',           req: false, used: 'Revenue by organisation' },
    { key: 'Deal - Lost time',      label: 'Lost time',              req: false, used: 'Lost-by-month' },
    { key: 'Deal - Owner',          label: 'Owner',                  req: false, used: 'Deals by owner' },
    { key: 'Deal - Source channel', label: 'Source channel',         req: false, used: 'Source performance, win/loss' },
    { key: 'Deal - Lost reason',    label: 'Lost reason',            req: false, used: 'Win/loss analysis' },
  ],
  people: [
    { key: 'Person - Customer Type',          label: 'Customer Type',          req: true,  used: 'Subscribers, trials, churn: everything' },
    { key: 'Person - Date Access Granted',    label: 'Date Access Granted',    req: true,  used: 'Tenure, renewals, trained, active' },
    { key: 'Person - Date Access Removed',    label: 'Date Access Removed',    req: true,  used: 'Active vs churned detection' },
    { key: 'Person - Organisation',           label: 'Organisation',           req: true,  used: 'Org grouping, councils, health' },
    { key: 'Person - Previous Customer Type', label: 'Previous Customer Type', req: false, used: 'Churn + trial→paid conversion' },
    { key: 'Person - Email',                  label: 'Email',                  req: false, used: 'Linking usage to customers' },
  ],
};

// For each declared field: is the column present, and what % of rows are filled?
function pdFieldReport(rows, kind) {
  const fields = PD_FIELDS[kind] || [];
  const n = rows.length;
  return fields.map(f => {
    const filled = n ? rows.reduce((c, r) => c + ((r[f.key] != null && String(r[f.key]).trim() !== '') ? 1 : 0), 0) : 0;
    const pct = n ? Math.round(filled / n * 100) : 0;
    const status = filled === 0 ? 'missing' : pct < 40 ? 'partial' : 'ok';
    return { ...f, filled, n, pct, status };
  });
}

// A red banner listing any REQUIRED field that's missing/empty across loaded data.
function pdFieldWarningHTML() {
  const probs = [];
  if (_pd_deals.length)  pdFieldReport(_pd_deals, 'deals').forEach(f => { if (f.req && f.status === 'missing') probs.push('Deals → <b>' + f.label + '</b>'); });
  if (_pd_people.length) pdFieldReport(_pd_people, 'people').forEach(f => { if (f.req && f.status === 'missing') probs.push('People → <b>' + f.label + '</b>'); });
  if (!probs.length) return '';
  return `<div class="freshness stale"><span>⚠ <b>Missing required field${probs.length > 1 ? 's' : ''}:</b> ${probs.join(' · ')}. Any metric built on ${probs.length > 1 ? 'these' : 'this'} will be blank or wrong: re-export from Pipedrive with the column${probs.length > 1 ? 's' : ''} included (see the Import tab checklist).</span></div>`;
}

// Per-file field checklist for the Import tab.
function pdFieldChecklistHTML(rows, kind) {
  if (!rows.length) return '';

// ── DATE RANGE HELPERS ───────────────────
function pdGetRange() {
  const r = activeSub.pd_range || 'all';
  const to = new Date();
  if (r === 'all') return { from: null, to, label: 'All time' };
  // Specific calendar month, e.g. 'm:2026-03'
  if (r.startsWith('m:')) {
    const [y, m] = r.slice(2).split('-').map(Number);
    const mFrom = new Date(y, m - 1, 1, 0, 0, 0, 0);
    const mTo   = new Date(y, m, 0, 23, 59, 59, 999);   // last day of that month
    return { from: mFrom, to: mTo, label: mFrom.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }) };
  }
  const from = new Date();
  if      (r === '1m')  { from.setMonth(from.getMonth() - 1); }
  else if (r === '3m')  { from.setMonth(from.getMonth() - 3); }
  else if (r === '6m')  { from.setMonth(from.getMonth() - 6); }
  else if (r === '12m') { from.setMonth(from.getMonth() - 12); }
  else if (r === 'ytd') { from.setMonth(0); from.setDate(1); from.setHours(0,0,0,0); }
  from.setHours(0,0,0,0);
  const labels = { '1m':'Last month','3m':'Last 3 months','6m':'Last 6 months','12m':'Last 12 months','ytd':'Year to date' };
  return { from, to, label: labels[r] };
}

function pdInRange(dateStr, range) {
  if (!dateStr) return false;
  const d = pdParseDate(dateStr);
  if (!pdValidDate(d)) return false;
  if (!range.from) return true;
  return d >= range.from && d <= range.to;
}

function pdRangeMonths(range) {
  const now = new Date();
  let from;
  if (!range.from) {
    // All time: compute from earliest deal or person date
    let earliest = now;
    _pd_deals.concat(_pd_people).forEach(r => {
      const dates = [r['Deal - Won time'], r['Deal - Deal created'], r['Person - Date Access Granted']].filter(Boolean);
      dates.forEach(s => { const d = pdParseDate(s); if (pdValidDate(d) && d < earliest) earliest = d; });
    });
    from = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  } else {
    from = new Date(range.from.getFullYear(), range.from.getMonth(), 1);
  }
  // End at the range's upper bound (so a single-month selection returns just
  // that month), but never past today.
  const end = (range.to && range.to < now) ? range.to : now;
  const months = [];
  const d = new Date(from);
  while (d <= end) {
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth() + 1);
  }
  return months;
}

function setPdRange(r) { activeSub.pd_range = r; renderPipedrive(); }
function setPdKpiGran(g) { activeSub.pd_kpi_gran = g; renderPipedrive(); }

// List of selectable calendar months (newest first), from the earliest deal/person date to now.
function pdMonthOptions() {
  let earliest = new Date();
  _pd_deals.concat(_pd_people).forEach(r => {
    ['Deal - Won time', 'Deal - Deal created', 'Person - Date Access Granted'].forEach(f => {
      const d = pdParseDate(r[f]); if (pdValidDate(d) && d < earliest) earliest = d;
    });
  });
  const now = new Date();
  const out = [];
  const d = new Date(now.getFullYear(), now.getMonth(), 1);
  const stop = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  while (d >= stop) {
    out.push('m:' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

function pdRangeToggleHTML() {
  const cur = activeSub.pd_range || 'all';
  const opts = [['1m','1M'],['3m','3M'],['6m','6M'],['12m','12M'],['ytd','YTD'],['all','All']];
  const monthSel = cur.startsWith('m:') ? cur : '';
  const monthOpts = pdMonthOptions().map(v => {
    const [y, m] = v.slice(2).split('-').map(Number);
    const label = new Date(y, m - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
    return `<option value="${v}"${monthSel === v ? ' selected' : ''}>${label}</option>`;
  }).join('');
  return `<div class="range-toggle" style="align-items:center">
    ${opts.map(([v,l]) => `<button class="range-btn${cur===v?' active':''}" onclick="setPdRange('${v}')">${l}</button>`).join('')}
    <select onchange="if(this.value)setPdRange(this.value)" title="Jump to a specific calendar month"
      style="margin-left:6px;font-size:11px;padding:4px 6px;border-radius:6px;border:1.5px solid ${monthSel?'var(--acc)':'var(--bor)'};background:${monthSel?'var(--acc)':'var(--sur)'};color:${monthSel?'#fff':'var(--tm)'};cursor:pointer;font-family:inherit">
      <option value="">${monthSel ? '↻ Month' : 'Month ▾'}</option>
      ${monthOpts}
    </select>
  </div>`;
}

// ── quarter helpers
function wsQuarterKey(d) { return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1); }
function wsQuarterRange(key) {
  const [y, q] = key.split('-Q').map(Number);
  return { from: new Date(y, (q - 1) * 3, 1), to: new Date(y, q * 3, 0, 23, 59, 59, 999), label: 'Q' + q + ' ' + y };
}
function wsQuarters(n) {
  const out = []; const now = new Date();
  let y = now.getFullYear(), q = Math.floor(now.getMonth() / 3) + 1;
  for (let i = 0; i < n; i++) { out.unshift(y + '-Q' + q); q--; if (q < 1) { q = 4; y--; } }
  return out;
}

// ── auto KPI computations (quarter-scoped where the KPI is a flow; snapshots noted)
function wsAuto(key, qr) {
  const inQ = ds => { const d = pdParseDate(ds); return pdValidDate(d) && d >= qr.from && d <= qr.to; };
  const val = d => parseFloat(d['Deal - Value']) || 0;
  const advDeal = d => /advis/i.test((d['Deal - Pipeline'] || '') + ' ' + (d['Deal - Category'] || '') + ' ' + (d['Deal - Title'] || ''));
  const now = new Date();
  switch (key) {
    case 'linkedin_reach': {
      const wks = load('weekly_tracker').filter(r => { const d = new Date(r.week); return !isNaN(d) && d >= qr.from && d <= qr.to; });
      if (!wks.length) return { disp: ':', sub: 'no tracker weeks in ' + qr.label };
      const sum = wks.reduce((s, r) => s + (liImp(r) || 0), 0);
      return { num: sum, disp: fmtNum(sum), sub: 'LinkedIn impressions · ' + qr.label + ' · Weekly Tracker' };
    }
    case 'email_rates': {
      const wks = load('weekly_tracker').filter(r => { const d = new Date(r.week); return !isNaN(d) && d >= qr.from && d <= qr.to && r.edmOpen != null; });
      if (!wks.length) return { disp: ':', sub: 'no email data in ' + qr.label };
      const o = wks.reduce((s, r) => s + (r.edmOpen || 0), 0) / wks.length;
      const c = wks.reduce((s, r) => s + (r.edmCtr || 0), 0) / wks.length;
      return { num: o, disp: fmtPct(o) + ' / ' + fmtPct(c), sub: 'avg open / click · ' + qr.label };
    }
    case 'seat_churn': {
      const churned = _pd_people.filter(p => p['Person - Customer Type'] === 'Access Revoked'
        && (p['Person - Previous Customer Type'] || '').includes('Paid Subscription')
        && inQ(p['Person - Date Access Removed']));
      const active = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription').length;
      const pctv = (active + churned.length) ? churned.length / (active + churned.length) * 100 : null;
      return { num: pctv, disp: churned.length + (pctv != null ? ' (' + fmtPct(pctv) + ')' : ''), sub: 'paid seats lost in ' + qr.label, lowerBetter: true };
    }
    case 'active_usage': {
      const act = _ph.emailActivity || [];
      if (!act.length) return { disp: ':', sub: 'needs email matching (run posthog_add_emails.sql)' };
      const emails = new Set(act.filter(r => { const d = new Date(r.last_seen); return !isNaN(d) && (now - d) < 30 * 86400000; }).map(r => (r.email || '').toLowerCase()));
      const paid = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription');
      const used = paid.filter(p => emails.has((p['Person - Email'] || p['Email'] || '').toLowerCase())).length;
      const pctv = paid.length ? used / paid.length * 100 : null;
      return { num: pctv, disp: pctv != null ? fmtPct(pctv) : ':', sub: used + ' of ' + paid.length + ' paid seats active in last 30d' };
    }
    case 'onboarding_active': {
      const ob = _pd_deals.filter(d => d['Deal - Pipeline'] === 'General Onboarding Pipeline');
      if (!ob.length) return { disp: ':', sub: 'no onboarding deals' };
      const done = ob.filter(d => ['Onboarding Complete', 'Maintenance', 'Month 11!', '2 Month Growth Period'].includes(d['Deal - Stage']) || d['Deal - Status'] === 'Won').length;
      return { num: done / ob.length * 100, disp: fmtPct(done / ob.length * 100), sub: done + ' of ' + ob.length + ' past onboarding · snapshot' };
    }
    case 'users_trained': {
      // Prefer REAL training data (session-log attendees). Access-granted is an
      // onboarding proxy, only used when no sessions are logged for the quarter.
      const sess = load('training').filter(r => { const d = new Date(r.date || ''); return !isNaN(d) && d >= qr.from && d <= qr.to; });
      const att = sess.reduce((s, r) => s + (r.attendees || 0), 0);
      if (att > 0) return { num: att, disp: fmtNum(att), sub: att + ' attendees · ' + sess.length + ' logged sessions · ' + qr.label };
      const skip = ['Contact Register', 'Expression of Interest'];
      const n = _pd_people.filter(p => !skip.includes(p['Person - Customer Type']) && inQ(p['Person - Date Access Granted'])).length;
      return { num: n, disp: fmtNum(n), sub: 'proxy: access granted (no training sessions logged for ' + qr.label + ')' };
    }
    case 'new_leads': {
      const n = _pd_deals.filter(d => inQ(d['Deal - Deal created'])).length;
      return { num: n, disp: fmtNum(n), sub: 'deals created in ' + qr.label + ' · all pipelines' };
    }
    case 'lead_conversion': {
      const won = _pd_deals.filter(d => d['Deal - Status'] === 'Won' && inQ(d['Deal - Won time'])).length;
      const lost = _pd_deals.filter(d => d['Deal - Status'] === 'Lost' && inQ(d['Deal - Lost time'])).length;
      if (!won && !lost) return { disp: ':', sub: 'no closed deals in ' + qr.label };
      return { num: won / (won + lost) * 100, disp: fmtPct(won / (won + lost) * 100), sub: won + ' won / ' + lost + ' lost · ' + qr.label };
    }
    case 'net_new_seats': {
      const added = _pd_people.filter(p => p['Person - Customer Type'] === 'Paid Subscription' && inQ(p['Person - Date Access Granted'])).length;
      const churned = _pd_people.filter(p => p['Person - Customer Type'] === 'Access Revoked'
        && (p['Person - Previous Customer Type'] || '').includes('Paid Subscription') && inQ(p['Person - Date Access Removed'])).length;
      return { num: added - churned, disp: (added - churned >= 0 ? '+' : '') + (added - churned), sub: added + ' added − ' + churned + ' churned · ' + qr.label };
    }
    case 'license_revenue': {
      const deals = _pd_deals.filter(d => d['Deal - Status'] === 'Won' && !advDeal(d) && inQ(d['Deal - Won time']));
      const sum = deals.reduce((s, d) => s + val(d), 0);
      return { num: sum, disp: fmtCur(sum), sub: deals.length + ' won deals · ' + qr.label };
    }
    case 'centrally_funded': {
      const n = _pd_people.filter(p => p['Person - Customer Type'] === 'Centrally Funded Licence').length;
      return { num: n, disp: fmtNum(n), sub: 'current snapshot' };
    }
    case 'advisory_rev': {
      const deals = _pd_deals.filter(d => advDeal(d) && d['Deal - Status'] === 'Won' && inQ(d['Deal - Won time']));
      if (!_pd_deals.some(advDeal)) return null;   // not in Pipedrive yet → manual fallback
      const sum = deals.reduce((s, d) => s + val(d), 0);
      return { num: sum, disp: fmtCur(sum), sub: deals.length + ' advisory deals won · ' + qr.label };
    }
    case 'advisory_pipe': {
      if (!_pd_deals.some(advDeal)) return null;
      const open = _pd_deals.filter(d => advDeal(d) && d['Deal - Status'] === 'Open');
      const sum = open.reduce((s, d) => s + val(d), 0);
      return { num: sum, disp: fmtCur(sum), sub: open.length + ' open advisory deals · snapshot' };
    }
    case 'advisory_signed': {
      if (!_pd_deals.some(advDeal)) return null;
      const n = _pd_deals.filter(d => advDeal(d) && d['Deal - Status'] === 'Won' && inQ(d['Deal - Won time'])).length;
      return { num: n, disp: fmtNum(n), sub: 'advisory engagements won · ' + qr.label };
    }
    case 'feature_adoption': {
      const rows = _ph.featureAdoption || [];
      if (!rows.length) return { disp: ':', sub: 'no usage data' };
      const top = rows.slice(0, 8);
      const avg = top.reduce((s, r) => s + (Number(r.adoption_pct) || 0), 0) / top.length;
      return { num: avg, disp: fmtPct(avg), sub: 'avg adoption · top ' + top.length + ' features · all time' };
    }
    case 'dashboards_weekly': {
      const ages = [];
      if (_pd_deals_imported_at) ages.push((now - new Date(_pd_deals_imported_at)) / 86400000);
      if (_pd_people_imported_at) ages.push((now - new Date(_pd_people_imported_at)) / 86400000);
      const lastDay = (_ph.daily || []).reduce((mx, r) => (r.day && r.day > mx ? r.day : mx), '');
      if (lastDay) ages.push((now - new Date(lastDay)) / 86400000);
      if (!ages.length) return { disp: ':', sub: 'no data sources loaded' };
      const worst = Math.ceil(Math.max(...ages));
      return { num: worst <= 7 ? 100 : 0, disp: worst <= 7 ? '✓ Yes' : '✗ No', sub: 'oldest source: ' + worst + ' day' + (worst === 1 ? '' : 's') + ' · target ≤7', lowerBetter: false };
    }
    case 'kpis_integrated': {
      let auto = 0, total = 0;
      WORKSTREAMS.forEach(s => s.items.forEach(w => w.kpis.forEach(k => { total++; if (k.type === 'auto') auto++; })));
      return { num: auto, disp: auto + ' of ' + total, sub: 'KPIs live-tracked on this board' };
    }
    case 'events_delivered': {
      // Thought leadership = Speaking / Webinar / Blog / YouTube entries in the content log
      const types = ['Speaking', 'Webinar', 'Blog', 'YouTube'];
      const items = load('content').filter(c => {
        if (!types.includes(c.type)) return false;
        const x = new Date(c.date || ''); return !isNaN(x) && x >= qr.from && x <= qr.to;
      });
      return { num: items.length, disp: fmtNum(items.length), sub: 'speaking / webinars / blogs / video in ' + qr.label + ' · content log' };
    }
    case 'campaign_engage': {
      const items = load('content').filter(c => { const x = new Date(c.date || ''); return !isNaN(x) && x >= qr.from && x <= qr.to; });
      if (!items.length) return { disp: ':', sub: 'no content logged in ' + qr.label };
      const reach = items.reduce((s, c) => s + (c.impressions || 0) + (c.ytviews || 0) + (c.vivaviews || 0) + (c.recipients || 0), 0);
      const eng = items.reduce((s, c) => s + (c.reactions || 0) + (c.comments || 0) + (c.shares || 0) + (c.clicks || 0) + (c.edmclicks || 0) + (c.vivareactions || 0), 0);
      return { num: reach, disp: fmtNum(reach) + ' reach · ' + fmtNum(eng) + ' engaged', sub: items.length + ' content items in ' + qr.label + ' · content log' };
    }
    case 'renewal_rate': {
      // Seats whose 12-month anniversary fell in this quarter, and whether they
      // were still active when it passed. Assumes yearly terms from access grant.
      let due = 0, kept = 0;
      _pd_people.forEach(p => {
        const ct = p['Person - Customer Type'];
        const wasPaid = ct === 'Paid Subscription' ||
          (ct === 'Access Revoked' && (p['Person - Previous Customer Type'] || '').includes('Paid Subscription'));
        if (!wasPaid) return;
        const g = pdParseDate(p['Person - Date Access Granted']); if (!pdValidDate(g)) return;
        const a = new Date(g); a.setFullYear(a.getFullYear() + 1);
        while (a < qr.from) a.setFullYear(a.getFullYear() + 1);
        if (a > qr.to) return;
        due++;
        const rem = pdParseDate(p['Person - Date Access Removed']);
        if (!pdValidDate(rem) || rem > a) kept++;
      });
      if (!due) return { disp: ':', sub: 'no renewal anniversaries fall in ' + qr.label };
      return { num: kept / due * 100, disp: fmtPct(kept / due * 100), sub: kept + ' of ' + due + ' seats retained past their anniversary · assumes 12-month terms' };
    }
    // ── PROPOSED upgrades (tabled as better-practice alternatives) ──────────
    case 'engagement_rate': {
      const items = load('content').filter(c => { const x = new Date(c.date || ''); return !isNaN(x) && x >= qr.from && x <= qr.to && (c.impressions || 0) > 0; });
      if (!items.length) return { disp: ':', sub: 'no content with impressions in ' + qr.label };
      const imp = items.reduce((s, c) => s + (c.impressions || 0), 0);
      const eng = items.reduce((s, c) => s + (c.reactions || 0) + (c.comments || 0) + (c.shares || 0) + (c.clicks || 0), 0);
      return { num: eng / imp * 100, disp: fmtPct(eng / imp * 100), sub: fmtNum(eng) + ' engagements ÷ ' + fmtNum(imp) + ' impressions · ' + qr.label };
    }
    case 'inbound_enquiries': {
      const wks = load('weekly_tracker').filter(r => { const x = new Date(r.week); return !isNaN(x) && x >= qr.from && x <= qr.to; });
      if (!wks.length) return { disp: ':', sub: 'no tracker weeks in ' + qr.label };
      const n = wks.reduce((s, r) => s + (r.purchaseEnq || 0) + (r.eoiTickets || 0), 0);
      return { num: n, disp: fmtNum(n), sub: 'purchase enquiries + EOI tickets · ' + qr.label };
    }
    case 'time_to_value': {
      const act = _ph.emailActivity || [];
      if (!act.length) return { disp: ':', sub: 'needs email matching (run posthog_add_emails.sql)' };
      const em = {}; act.forEach(r => { if (r.email) em[r.email.toLowerCase()] = r; });
      const skip = ['Contact Register', 'Expression of Interest'];
      const cohort = _pd_people.filter(p => {
        if (skip.includes(p['Person - Customer Type'])) return false;
        const g = pdParseDate(p['Person - Date Access Granted']);
        return pdValidDate(g) && g >= qr.from && g <= qr.to && (g.getTime() + 14 * 86400000) <= now.getTime();
      });
      if (!cohort.length) return { disp: ':', sub: 'no measurable new users in ' + qr.label };
      const hit = cohort.filter(p => {
        const r = em[(p['Person - Email'] || p['Email'] || '').toLowerCase()]; if (!r) return false;
        const g = pdParseDate(p['Person - Date Access Granted']);
        const fs = new Date(r.first_seen), ls = new Date(r.last_seen);
        return !isNaN(fs) && !isNaN(ls) && fs <= new Date(g.getTime() + 14 * 86400000) && ls >= g;
      }).length;
      return { num: hit / cohort.length * 100, disp: fmtPct(hit / cohort.length * 100), sub: hit + ' of ' + cohort.length + ' new users active within 14 days of access · ' + qr.label };
    }
    case 'trained_active': {
      const act = _ph.emailActivity || [];
      if (!act.length) return { disp: ':', sub: 'needs email matching (run posthog_add_emails.sql)' };
      const em = {}; act.forEach(r => { if (r.email) em[r.email.toLowerCase()] = r; });
      const skip = ['Contact Register', 'Expression of Interest'];
      const cohort = _pd_people.filter(p => {
        if (skip.includes(p['Person - Customer Type'])) return false;
        const g = pdParseDate(p['Person - Date Access Granted']);
        return pdValidDate(g) && g >= qr.from && g <= qr.to && (g.getTime() + 30 * 86400000) <= now.getTime();
      });
      if (!cohort.length) return { disp: ':', sub: 'no trained users 30+ days old in ' + qr.label };
      const still = cohort.filter(p => {
        const r = em[(p['Person - Email'] || p['Email'] || '').toLowerCase()]; if (!r) return false;
        const g = pdParseDate(p['Person - Date Access Granted']);
        const ls = new Date(r.last_seen);
        return !isNaN(ls) && ls >= new Date(g.getTime() + 30 * 86400000);
      }).length;
      return { num: still / cohort.length * 100, disp: fmtPct(still / cohort.length * 100), sub: still + ' of ' + cohort.length + ' still active 30+ days after access · ' + qr.label };
    }
    case 'cf_utilisation': {
      const act = _ph.emailActivity || [];
      if (!act.length) return { disp: ':', sub: 'needs email matching (run posthog_add_emails.sql)' };
      const recent = new Set(act.filter(r => { const d = new Date(r.last_seen); return !isNaN(d) && (now - d) < 30 * 86400000; }).map(r => (r.email || '').toLowerCase()));
      const cf = _pd_people.filter(p => p['Person - Customer Type'] === 'Centrally Funded Licence');
      if (!cf.length) return { disp: ':', sub: 'no centrally-funded seats' };
      const used = cf.filter(p => recent.has((p['Person - Email'] || p['Email'] || '').toLowerCase())).length;
      return { num: used / cf.length * 100, disp: fmtPct(used / cf.length * 100), sub: used + ' of ' + cf.length + ' centrally-funded seats active in last 30d' };
    }
    case 'week4_retention': {
      const rows = (_ph.retention || []).filter(r => {
        const cw = new Date(r.cohort_week);
        return !isNaN(cw) && (cw.getTime() + 28 * 86400000) <= now.getTime() && Number(r.cohort_size) > 0;
      });
      if (!rows.length) return { disp: ':', sub: 'no mature usage cohorts yet' };
      const size = rows.reduce((s, r) => s + Number(r.cohort_size), 0);
      const kept4 = rows.reduce((s, r) => s + Number(r.retained_w4 || 0), 0);
      return { num: kept4 / size * 100, disp: fmtPct(kept4 / size * 100), sub: fmtNum(kept4) + ' of ' + fmtNum(size) + ' new users still active 4 weeks on · last ' + rows.length + ' cohorts' };
    }
    case 'pipeline_coverage': {
      const open = _pd_deals.filter(dl => dl['Deal - Status'] === 'Open' && !advDeal(dl));
      const pipeVal = open.reduce((s, dl) => s + val(dl), 0);
      const qTarget = TARGET_ARR / 4;
      return { num: pipeVal / qTarget, disp: (pipeVal / qTarget).toFixed(1) + '×', sub: fmtCur(pipeVal) + ' open pipeline vs ' + fmtCur(qTarget) + ' quarterly target · 3× is healthy' };
    }
  }
  return null;
}

function renderWorkstreams(el) {
  el = el || document.getElementById('main-content');

    if (num == null || target == null || !isFinite(target)) return 'grey';
    if (lowerBetter) return num <= target ? 'green' : num <= target * 1.3 ? 'amber' : 'red';
    return num >= target ? 'green' : num >= target * 0.7 ? 'amber' : 'red';

  function kpiRow(k) {
    const target = d['t|' + k.id];

    }
    let a = null;
    if (k.type === 'auto') a = wsAuto(k.auto, qr);
    if (a) {
      badge = '<span style="font-size:9px;font-weight:700;color:#1f6740;background:#e8f5ee;border-radius:4px;padding:1px 6px">LIVE</span>';

      num = rec ? rec.value : null;
      valueHTML = `<input type="number" step="any" value="${rec ? rec.value : ''}" placeholder=":"

    }

    const targetHTML = `<input type="number" step="any" value="${target != null ? target : ''}" placeholder="TBD"

      style="width:64px;padding:3px 6px;border:1px dashed var(--bd);border-radius:6px;font-size:11.5px;color:var(--tm);font-family:inherit;background:transparent">`;
    return { html: rowHTML(k, st, badge, valueHTML, targetHTML, sub), status: st };
  }

  function rowHTML(k, st, badge, valueHTML, targetHTML, sub) {
    if (k.proposed) badge += ' <span title="Suggested addition to the draft KPI set: not yet agreed" style="font-size:9px;font-weight:700;color:#185FA5;background:#e6f1fb;border-radius:4px;padding:1px 6px">PROPOSED</span>';

            </div>
          </div>
          <table style="width:100%;border-collapse:collapse;margin-top:6px">
            <thead><tr style="border-bottom:1.5px solid var(--bor)">
              <th></th><th style="text-align:left;padding:3px 6px;font-size:10px;color:var(--tl);text-transform:uppercase">KPI</th>
              <th style="text-align:left;padding:3px 6px;font-size:10px;color:var(--tl);text-transform:uppercase">${qr.label}</th>
              <th style="text-align:right;padding:3px 6px;font-size:10px;color:var(--tl);text-transform:uppercase">Target</th>
            </tr></thead>
            <tbody>${rows.map(r => r.html).join('')}</tbody>

      }).join('')}
    </div>`).join('');

  el.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">Land iQ Workstreams</div>
        <div class="section-sub">Key tasks & KPIs by workstream · working reference alongside the Power BI tracker</div>
      </div>
      <div class="range-toggle" style="align-items:center">
        ${quarters.map(k => `<button class="range-btn${k === q ? ' active' : ''}" onclick="setWsQuarter('${k}')">${wsQuarterRange(k).label}</button>`).join('')}
      </div>
    </div>

    ${(() => {
      // ── Shared top line: the numbers every workstream feeds ────────────────
      const now2 = new Date();
      const activeSeats = _pd_people.filter(p => {
        if (p['Person - Customer Type'] !== 'Paid Subscription') return false;
        const rem = pdParseDate(p['Person - Date Access Removed']);
        return !pdValidDate(rem) || rem > now2;
      }).length;
      const rev = wsAuto('license_revenue', qr);
      const usage = wsAuto('active_usage', qr);
      const qTarget = TARGET_ARR / 4;
      const tile = (label, valueHTML, subHTML, prog, progCol) => `<div class="box" style="margin-bottom:0;flex:1;min-width:220px">
        <div style="font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.5px;font-weight:600">${label}</div>
        <div style="font-size:30px;font-weight:700;color:var(--navy);line-height:1.15;margin:3px 0">${valueHTML}</div>
        ${prog != null ? `<div style="height:7px;border-radius:4px;background:var(--bg2);overflow:hidden;margin:5px 0 4px"><div style="height:100%;border-radius:4px;background:${progCol};width:${Math.min(100, Math.round(prog))}%"></div></div>` : ''}
        <div style="font-size:11px;color:var(--tl)">${subHTML}</div>

      const seatsPct = activeSeats / TARGET_USERS * 100;
      const revPct = rev && rev.num != null ? rev.num / qTarget * 100 : null;
      return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px">
        ${tile('Active paying seats', fmtNum(activeSeats) + `<span style="font-size:15px;color:var(--tl);font-weight:500"> / ${TARGET_USERS}</span>`,
          Math.round(seatsPct) + '% of target · shared goal of every workstream', seatsPct, seatsPct >= 80 ? '#2a7a4b' : seatsPct >= 50 ? '#2e8bc0' : '#c25a00')}
        ${tile('License revenue · ' + qr.label, rev ? rev.disp : ':',
          revPct != null ? Math.round(revPct) + '% of the ' + fmtCur(qTarget) + ' quarterly pace toward $2.4M' : 'vs ' + fmtCur(qTarget) + ' quarterly pace', revPct, revPct != null && revPct >= 80 ? '#2a7a4b' : '#c25a00')}
        ${tile('Paid seats actively using Land iQ', usage && usage.num != null ? fmtPct(usage.num) : ':',
          usage && usage.num != null ? usage.sub : 'switches on with email matching: value delivered, not just sold', usage && usage.num != null ? usage.num : null, '#2e8bc0')}

    })()}

    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tl);margin-bottom:4px;align-items:center">

function loadTeamTargets() {
  try { return { won: 5, revenue: 50000, winrate: 50, ...JSON.parse(localStorage.getItem('liq_team_targets') || '{}') }; }
  catch { return { won: 5, revenue: 50000, winrate: 50 }; }
}
window.saveTeamTarget = (k, v) => { const t = loadTeamTargets(); t[k] = parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0; localStorage.setItem('liq_team_targets', JSON.stringify(t)); renderTeam(); };
window.setTeamGran    = g => { activeSub.team_gran = g; activeSub.team_period = null; renderTeam(); };
window.setTeamPeriod  = p => { activeSub.team_period = p; renderTeam(); };
window.setTeamMetric  = m => { activeSub.team_metric = m; renderTeam(); };

function teamPeriodKey(d, gran) {
  return gran === 'quarter'
    ? d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1)
    : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function teamPeriodLabel(key, gran) {
  if (gran === 'quarter') { const [y, q] = key.split('-Q'); return 'Q' + q + ' ' + y; }
  const [y, m] = key.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
}
function teamRecentPeriods(gran, count) {
  const now = new Date(); const out = [];
  if (gran === 'quarter') {
    let y = now.getFullYear(), q = Math.floor(now.getMonth() / 3) + 1;
    for (let i = 0; i < count; i++) { out.unshift(y + '-Q' + q); q--; if (q < 1) { q = 4; y--; } }
  } else {
    for (let i = count - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push(teamPeriodKey(d, 'month')); }
  }
  return out;
}
function teamInPeriod(dateStr, period, gran) {
  const d = pdParseDate(dateStr); return pdValidDate(d) && teamPeriodKey(d, gran) === period;
}

function renderTeam(el) {
  el = el || document.getElementById('main-content');
  const gran = activeSub.team_gran || 'month';
  const periods = teamRecentPeriods(gran, 6);

// Sanity-check imported rows; returns a list of human-readable warnings (#8)
function pdValidateImport(rows, kind) {
  const warns = [];
  const now = new Date(); now.setHours(23,59,59,999);
  if (kind === 'deals') {
    const wonZero = rows.filter(r => (r['Deal - Status']||'').toLowerCase()==='won' && !(parseFloat(r['Deal - Value'])>0)).length;
    const negVal  = rows.filter(r => parseFloat(r['Deal - Value']) < 0).length;
    const future  = rows.filter(r => { const d=pdParseDate(r['Deal - Won time']); return pdValidDate(d) && d>now; }).length;
    const noPipe  = rows.filter(r => !(r['Deal - Pipeline']||'').trim()).length;
    if (wonZero) warns.push(`${wonZero} won deal(s) have no dollar value`);
    if (negVal)  warns.push(`${negVal} deal(s) have a negative value`);
    if (future)  warns.push(`${future} deal(s) have a "won" date in the future`);
    if (noPipe)  warns.push(`${noPipe} deal(s) have no pipeline set`);
  } else {
    const futureG = rows.filter(r => { const d=pdParseDate(r['Person - Date Access Granted']); return pdValidDate(d) && d>now; }).length;
    const badRange = rows.filter(r => { const g=pdParseDate(r['Person - Date Access Granted']), x=pdParseDate(r['Person - Date Access Removed']); return pdValidDate(g)&&pdValidDate(x)&&x<g; }).length;
    const noType  = rows.filter(r => !(r['Person - Customer Type']||r['Customer Type']||'').trim()).length;
    if (futureG)  warns.push(`${futureG} person(s) have an access-granted date in the future`);
    if (badRange) warns.push(`${badRange} person(s) have access removed before it was granted`);
    if (noType)   warns.push(`${noType} person(s) have no customer type`);
  }
  return warns;
}

// ── BULLETPROOF UPLOAD PIPELINE ──────────────────────────────────────────────
// Only the columns the dashboard uses are stored (a raw Pipedrive export has
// 100+ columns of noise: trimming cuts payloads ~85% and avoids size limits).
const PD_KEEP = {
  deals: ['Deal - ID','Deal - Title','Deal - Value','Deal - Currency of Value','Deal - Organisation','Deal - Contact person',
    'Deal - Person','Deal - Owner','Deal - Stage','Deal - Pipeline','Deal - Status','Deal - Deal created','Deal - Won time',
    'Deal - Lost time','Deal - Lost reason','Deal - Deal closed on','Deal - Expected close date','Deal - Next activity date',
    'Deal - Last activity date','Deal - Last stage change','Deal - Total activities','Deal - Source channel','Deal - Source origin',
    'Deal - Label','Deal - Category','Deal - Weighted value','Deal - Probability','Deal - Product quantity','Deal - Product name',
    'Deal - Product amount','Deal - Onboarding Flow','Deal - Payment Due','Deal - Payment Requested','Deal - Payment Received',
    'Deal - Team Role','Deal - Current Solutions','Deal - Product Feedback'],
  people: ['Person - ID','Person - Name','Person - First name','Person - Last name','Person - Owner','Person - Customer Type',
    'Person - Previous Customer Type','Person - Date Access Granted','Person - Date Access Removed','Person - Organisation',
    'Person - Email','Person - Email - Work','Person - Email - Home','Person - Email - Other','Person - Trial License Number',
    'Person - Last activity date','Organisation - Name','Organisation - Organisation Group','Organisation - Organisation Subgroup',
    'Organisation - Organisation Size','Organisation - Location of Work','Organisation - Licence Pool','Organisation - Network',
    'Organisation - Issued Licenses','Organisation - People','Organisation - Won deals','Organisation - Last activity date'],
};

// Trim to kept columns and strip characters Postgres JSON rejects.
function pdCleanRows(rows, kind) {
  const keep = new Set(PD_KEEP[kind]);
  const clean = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  return rows.map(r => {
    const o = {};
    for (const k of Object.keys(r)) {
      if (!keep.has(k)) continue;
      const v = r[k];
      if (v != null && v !== '') o[k] = typeof v === 'string' ? clean(v) : v;
    }
    return o;
  }).filter(o => Object.keys(o).length > 0);
}

// Delete-all + batched insert with retry, row-level fallback, and a final
// verified count from the database. Never fails silently.
async function pdUploadRows(table, rows, noun) {
  const del = await sb.from(table).delete().gte('imported_at', '1970-01-01T00:00:00Z');
  if (del.error) { toast('✗ Could not clear old ' + noun + ': ' + del.error.message + ': nothing changed.', 10000); return null; }
  let stored = 0, failed = 0, firstErr = null;
  const batchSize = 100;
  for (let i = 0; i < rows.length; i += batchSize) {
    const batch = rows.slice(i, i + batchSize).map(r => ({ raw: r }));
    let { error } = await sb.from(table).insert(batch);
    if (error) ({ error } = await sb.from(table).insert(batch));   // retry once
    if (!error) { stored += batch.length; continue; }
    // batch keeps failing: insert row by row so one bad row can't sink 100
    for (const one of batch) {
      const r1 = await sb.from(table).insert([one]);
      if (r1.error) { failed++; if (!firstErr) firstErr = r1.error.message; }
      else stored++;
    }
  }
  // Verify what the database actually holds now
  const { count } = await sb.from(table).select('*', { count: 'exact', head: true });
  const dbCount = count ?? stored;
  if (dbCount === rows.length) {
    toast(`✓ All ${rows.length.toLocaleString()} ${noun} stored: database count verified.`, 6000);
  } else {
    toast(`⚠ Parsed ${rows.length.toLocaleString()} ${noun} but the database holds ${dbCount.toLocaleString()}. ${failed ? failed + ' row(s) rejected: first error: ' + firstErr : 'Try re-importing.'}`, 12000);
  }
  return dbCount;
}

  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = pdCleanRows(results.data, 'deals');
      if (!rows.length) { toast('✗ No usable rows found: check this is a Pipedrive Deals export.', 8000); return; }
      const warns = pdValidateImport(rows, 'deals');
      if (warns.length) toast('⚠ Data check: ' + warns.join(' · '), 7000);
      const missReq = pdFieldReport(pdNormaliseDeals(rows), 'deals').filter(f => f.req && f.status === 'missing');
      if (missReq.length) toast('⚠ Missing required column(s): ' + missReq.map(f => f.label).join(', ') + ': re-export with these fields or some metrics will be blank.', 9000);
      toast('Uploading ' + rows.length + ' deals…');
      const dbCount = await pdUploadRows('liq_pipedrive_deals', rows, 'deals');
      if (dbCount == null) return;
      _pd_deals = pdNormaliseDeals(rows);
      _pd_deals_imported_at = new Date().toISOString();
      renderPipedrive();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

async function handlePeopleImport(input) {
  const file = input.files[0];
  if (!file) return;
  toast('Parsing people CSV…');
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = pdCleanRows(results.data, 'people');
      if (!rows.length) { toast('✗ No usable rows found: check this is a Pipedrive People export.', 8000); return; }
      const warns = pdValidateImport(rows, 'people');
      if (warns.length) toast('⚠ Data check: ' + warns.join(' · '), 7000);
      const missReqP = pdFieldReport(pdNormalisePeople(rows), 'people').filter(f => f.req && f.status === 'missing');
      if (missReqP.length) toast('⚠ Missing required column(s): ' + missReqP.map(f => f.label).join(', ') + ': re-export with these fields or subscriber/churn metrics will be blank.', 9000);
      toast('Uploading ' + rows.length + ' people…');
      const dbCount = await pdUploadRows('liq_pipedrive_people', rows, 'people');
      if (dbCount == null) return;
      _pd_people = pdNormalisePeople(rows);
      _pd_people_imported_at = new Date().toISOString();

  });
}

// ── PIPEDRIVE: SALES CHARTS ─────────────────────────────────────────────────
// ── PIPEDRIVE: REVENUE & ARR ─────────────────────────────────────────────────
function renderPdRevenue(sc) {
  const range    = pdGetRange();
  const rangeMonths = pdRangeMonths(range);
  const today    = new Date();
  const MRR_TARGET = TARGET_ARR / 12;

  // All won deals: pipeline-toggle aware
  const wonDeals = (_pdSalesPipeline
    ? _pd_deals.filter(d => d['Deal - Pipeline'] === _pdSalesPipeline)
    : _pd_deals
  ).filter(d => d['Deal - Status'] === 'Won');

  // ── BOOKED ARR ───────────────────────────────────────────────────────────────
  // Sum of all-time won deal values = total contracted revenue
  const totalBooked  = wonDeals.reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0);

  // ── ACTIVE GROSS REVENUE (real sum of contract values for still-active customers) ─
  const activePaid   = _pd_people.filter(p => {
    if (p['Person - Customer Type'] !== 'Paid Subscription') return false;
    const rem = p['Person - Date Access Removed'];
    if (!rem) return true;
    const d = pdParseDate(rem); return pdValidDate(d) && d > today;
  });
  const avgDealVal   = wonDeals.length ? totalBooked / wonDeals.length : 0;

  // Real gross: add up the actual won-deal value of every organisation that still
  // has at least one active paying person. Linked by organisation name (normalised).
  const normOrg = s => (s || '').trim().toLowerCase();
  const activeOrgSet = new Set(activePaid.map(p => normOrg(p['Person - Organisation'])).filter(Boolean));
  // Resolve a deal's organisation (fall back to its person's org if the deal org is blank)
  const personOrgByName = {};
  _pd_people.forEach(p => { const n = normOrg(p['Person - Name']); if (n) personOrgByName[n] = normOrg(p['Person - Organisation']); });
  const dealOrg = d => normOrg(d['Deal - Organisation']) || personOrgByName[normOrg(d['Deal - Person'])] || '';
  // Count each active org's contract value once (use its largest won deal to avoid
  // double-counting multiple seats/people booked under separate line items).
  const wonByOrg = {};
  wonDeals.forEach(d => {
    const o = dealOrg(d); if (!o || !activeOrgSet.has(o)) return;
    const v = parseFloat(d['Deal - Value']) || 0;
    wonByOrg[o] = Math.max(wonByOrg[o] || 0, v);
  });
  const realActiveGross = Object.values(wonByOrg).reduce((s, v) => s + v, 0);
  const matchedActiveOrgs = Object.keys(wonByOrg).length;
  const estActiveARR = realActiveGross > 0 ? realActiveGross : null;
  const estActiveMRR = estActiveARR ? estActiveARR / 12 : null;

  // ── NEW ARR BY MONTH ──────────────────────────────────────────────────────────
  const newARRByMonth = {};
  const newDealsCountByMonth = {};
  wonDeals.forEach(d => {
    const dt = pdParseDate(d['Deal - Won time']);
    if (!pdValidDate(dt)) return;
    const k = monthKey(dt.toISOString());
    newARRByMonth[k]        = (newARRByMonth[k] || 0) + (parseFloat(d['Deal - Value']) || 0);
    newDealsCountByMonth[k] = (newDealsCountByMonth[k] || 0) + 1;
  });

  // ── CUMULATIVE ARR ────────────────────────────────────────────────────────────
  // Running sum across all months (sorted), using all-time won deals
  const allMonthsSorted = Object.keys(newARRByMonth).sort();
  let cumulative = 0;
  const cumulARR = {};
  allMonthsSorted.forEach(m => { cumulative += newARRByMonth[m]; cumulARR[m] = cumulative; });

  // ── MOM GROWTH (range-filtered months) ───────────────────────────────────────
  const mrrVals  = rangeMonths.map(m => newARRByMonth[m] ? newARRByMonth[m] / 12 : 0);
  const lastMRR  = mrrVals.filter(v => v > 0).slice(-1)[0] || 0;
  const prevMRR  = mrrVals.filter(v => v > 0).slice(-2)[0] || 0;
  const mrrMoM   = prevMRR ? pct(lastMRR - prevMRR, prevMRR) : null;

  // ── ACV & DEAL SIZES ─────────────────────────────────────────────────────────
  const rangeWon = wonDeals.filter(d => pdInRange(d['Deal - Won time'], range));
  const rangeARR = rangeWon.reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0);
  const rangeACV = rangeWon.length ? rangeARR / rangeWon.length : null;

  // ── ARR BANDS (deal size distribution) ───────────────────────────────────────
  const BANDS = [
    { lbl: '<$1k',     lo: 0,    hi: 1000 },
    { lbl: '$1–5k',    lo: 1000, hi: 5000 },
    { lbl: '$5–20k',   lo: 5000, hi: 20000 },
    { lbl: '$20–50k',  lo: 20000,hi: 50000 },
    { lbl: '$50k+',    lo: 50000,hi: Infinity },
  ];
  const bandCounts = BANDS.map(b => rangeWon.filter(d => {
    const v = parseFloat(d['Deal - Value']) || 0;
    return v >= b.lo && v < b.hi;
  }).length);
  const bandARR = BANDS.map(b => rangeWon.filter(d => {
    const v = parseFloat(d['Deal - Value']) || 0;
    return v >= b.lo && v < b.hi;
  }).reduce((s, d) => s + (parseFloat(d['Deal - Value']) || 0), 0));

  // ── TOP REVENUE ORGS ─────────────────────────────────────────────────────────
  const orgRevenue = {};
  rangeWon.forEach(d => {
    const personName = d['Deal - Person'] || '';
    const person = _pd_people.find(p => (p['Person - Name'] || p['Name'] || '') === personName);
    const org = (person && person['Person - Organisation']) || d['Deal - Organisation'] || d['Organisation'] || 'Unknown';
    orgRevenue[org] = (orgRevenue[org] || 0) + (parseFloat(d['Deal - Value']) || 0);
  });
  const topOrgs = Object.entries(orgRevenue).filter(([k]) => k !== 'Unknown').sort((a, b) => b[1] - a[1]).slice(0, 12);

  // ── ARR GAP ───────────────────────────────────────────────────────────────────
  const arrGap      = TARGET_ARR - totalBooked;
  const arrGapPct   = pct(totalBooked, TARGET_ARR);
  const mrrGap      = MRR_TARGET - (newARRByMonth[rangeMonths[rangeMonths.length-1]] || 0) / 12;

  sc.innerHTML = `
    ${!wonDeals.length ? '<div class="callout warn"><div class="callout-label">No data</div><div class="callout-text">Import your Pipedrive deals CSV first.</div></div>' : ''}

    <div class="cards" style="margin-bottom:18px">
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Total contracted revenue (all time)${infoBtn('Total contracted revenue','<span class="src-tag">Pipedrive · Won Deals</span><br>Sum of <b>Deal Value</b> across all won deals, ever. Total revenue ever signed: not adjusted for customers who later left.<br><div class="calc-row">SUM(Deal Value) where Status = "Won"</div>')}</div>
        <div class="card-value" style="cursor:help" title="Exact: ${fmtDollar(totalBooked)}  (sum of ${wonDeals.length} won deals)">${fmtCur(totalBooked)}</div>
        <div class="card-sub">vs $${(TARGET_ARR/1e6).toFixed(1)}M target · ${fmtPct(arrGapPct)} there · hover for exact $</div>
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Active customer revenue (gross)${infoBtn('Active customer revenue (gross)','<span class="src-tag">Pipedrive · People + Deals</span><br>Real sum of the actual contract value of every organisation that still has at least one active paying person. Linked by organisation name; counts each org\'s largest won deal once to avoid double-counting seats.<br><div class="calc-row">SUM(largest won Deal Value per still-active organisation)</div>This is gross signed revenue from current customers: not adjusted for partial-year or discounts.')}</div>
        ${estActiveARR != null
          ? `<div class="card-value" style="cursor:help" title="Exact: ${fmtDollar(estActiveARR)}">${fmtCur(estActiveARR)}</div><div class="card-sub">${matchedActiveOrgs} active orgs matched to a deal</div>`
          : `<div class="card-nodata">import people CSV</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Active revenue per month${infoBtn('Active revenue per month','<span class="src-tag">Pipedrive · People + Deals</span><br>Active customer revenue (gross) ÷ 12. Assumes yearly contracts.<br><div class="calc-row">Active customer revenue ÷ 12</div>')}</div>
        ${estActiveMRR != null
          ? `<div class="card-value">${fmtCur(Math.round(estActiveMRR))}</div><div class="card-sub">target ${fmtCur(MRR_TARGET)}/mo</div>`
          : `<div class="card-nodata">import people CSV</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Avg contract value${infoBtn('Average Contract Value','<span class="src-tag">Pipedrive · Won Deals</span><br>Mean Deal Value across won deals in the selected date range.<br><div class="calc-row">SUM(Deal Value) ÷ COUNT(Won deals) in range</div>')}</div>
        ${rangeACV != null
          ? `<div class="card-value">${fmtCur(Math.round(rangeACV))}</div><div class="card-sub">${rangeWon.length} deals · ${range.label}</div>`
          : `<div class="card-nodata">no data</div>`}
      </div>
      <div class="card">
        <div class="card-label" style="display:flex;align-items:center;gap:0">Gap to $2.4M target${infoBtn('Gap to $2.4M target','<span class="src-tag">Calculated</span><br>Difference between the $2.4M yearly revenue target and total contracted revenue. How much more needs to be signed to hit the annual goal.<br><div class="calc-row">$2.4M − total contracted revenue</div>')}</div>
        <div class="card-value" style="cursor:help;color:${arrGap > 0 ? 'var(--re)' : 'var(--gr)'}" title="Exact: ${fmtDollar(Math.abs(arrGap))}">${arrGap > 0 ? '−' : '+'}${fmtCur(Math.abs(arrGap))}</div>
        <div class="card-sub">${arrGap > 0 ? 'still needed' : 'target exceeded'}</div>
      </div>
    </div>

    <div class="box">
      <div class="box-title">Cumulative contracted revenue: all time</div>
      ${allMonthsSorted.length ? `<div class="chart-wrap" style="height:260px"><canvas id="pd-arr-cumul"></canvas></div>` : '<div class="no-data">No won deal data.</div>'}
    </div>

    <div class="box">
      <div class="box-title">Contracted revenue by period ${infoBtn('Contracted revenue by period',
        '<span class="src-tag">Pipedrive · Won Deals</span><br>The same won-deal values as the total above, grouped by when each deal was won. Hover any figure for the exact dollar amount.<br><div class="calc-row">SUM(Deal Value) grouped by year / quarter / month of Won time</div>')}</div>
      ${(() => {
        const byY = {}, byQ = {}, byM = {}, cY = {}, cQ = {}, cM = {};
        wonDeals.forEach(dl => {
          const dt = pdParseDate(dl['Deal - Won time']); if (!pdValidDate(dt)) return;
          const v = parseFloat(dl['Deal - Value']) || 0;
          const y = dt.getFullYear(), qk = y + '-Q' + (Math.floor(dt.getMonth() / 3) + 1), mk = monthKey(dt.toISOString());
          byY[y] = (byY[y] || 0) + v; cY[y] = (cY[y] || 0) + 1;
          byQ[qk] = (byQ[qk] || 0) + v; cQ[qk] = (cQ[qk] || 0) + 1;
          byM[mk] = (byM[mk] || 0) + v; cM[mk] = (cM[mk] || 0) + 1;
        });
        if (!Object.keys(byY).length) return '<div class="no-data">No won deal data.</div>';
        const tbl = (title, entries, lblFn) => `<div style="flex:1;min-width:180px">
          <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;margin-bottom:6px">${title}</div>
          <table style="width:100%;border-collapse:collapse;font-size:12.5px">
            ${entries.map(([k, v]) => `<tr style="border-bottom:1px solid var(--bg2)">
              <td style="padding:5px 6px;color:var(--tm)">${lblFn(k)}</td>
              <td style="padding:5px 6px;text-align:right;font-weight:700;color:var(--navy);cursor:help" title="Exact: ${fmtDollar(v)} · ${(title==='By year'?cY:title==='By quarter'?cQ:cM)[k]} deals">${fmtCur(v)}</td>
            </tr>`).join('')}
          </table></div>`;
        const qLbl = k => { const [y, qn] = k.split('-Q'); return 'Q' + qn + ' ' + y; };
        const mLbl = k => monthLabel(k);
        return `<div style="display:flex;gap:22px;flex-wrap:wrap">
          ${tbl('By year', Object.entries(byY).sort((a,b)=>b[0]-a[0]), k => k)}
          ${tbl('By quarter', Object.entries(byQ).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6), qLbl)}
          ${tbl('By month', Object.entries(byM).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12), mLbl)}
        </div>`;
      })()}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">New revenue by month: ${range.label}</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-arr-month"></canvas></div>
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue per month: ${range.label}</div>
        <div class="chart-wrap" style="height:240px"><canvas id="pd-mrr-month"></canvas></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Deal size distribution: ${range.label}</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-arr-bands"></canvas></div>
      </div>
      <div class="box" style="margin-bottom:0">
        <div class="box-title">Revenue by deal size</div>
        <div class="chart-wrap" style="height:220px"><canvas id="pd-arr-band-rev"></canvas></div>
      </div>
    </div>

    ${topOrgs.length ? `<div class="box">
      <div class="box-title">Top organisations by contracted revenue: ${range.label}</div>
      <div class="chart-wrap" style="height:${Math.max(240, topOrgs.length * 30)}px"><canvas id="pd-arr-orgs"></canvas></div>
    </div>` : ''}

    <div class="box">
      <div class="box-title">Revenue progress to $2.4M target</div>
      <div style="margin:16px 0 8px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px">
          <span style="font-weight:600;color:var(--navy)">${fmtCur(totalBooked)}</span>
          <span style="color:var(--tl)">target: $2.4M</span>
        </div>
        <div style="height:16px;border-radius:8px;background:var(--bg2);overflow:hidden">
          <div style="height:100%;border-radius:8px;background:${arrGapPct>=100?'var(--gr)':arrGapPct>=60?'var(--acc)':'#c25a00'};width:${Math.min(arrGapPct,100)}%;transition:width .4s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--tl)">
          <span>${fmtPct(arrGapPct)} of target</span>
          <span>${arrGap > 0 ? fmtCur(arrGap) + ' remaining' : 'Target hit!'}</span>
        </div>
      </div>
      <div style="font-size:12px;color:var(--tm);margin-top:8px">
        At current avg deal value of <strong>${fmtCur(Math.round(avgDealVal))}</strong>, you need
        <strong>${avgDealVal > 0 ? Math.ceil(arrGap / avgDealVal) : ':'}</strong> more won deals to hit $2.4M.
      </div>
    </div>

    <div class="box">
      <div class="box-title">Growth health ${infoBtn('Growth health',
        `<p>Compares the last 12 months to the 12 months before that, for both new signed revenue and number of deals won.</p>
        <p><b>Note:</b> a full business-health score would also include a profit/efficiency measure (such as the "Rule of 40"). That needs cost data, which isn\'t in the dashboard: so this shows the growth side only.</p>
        <span class="src-tag">Pipedrive · Won Deals</span>`)}</div>
      ${(() => {
        const mk = (back) => { const d = new Date(today.getFullYear(), today.getMonth() - back, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
        const last12 = Array.from({length:12}, (_,i) => mk(i));
        const prev12 = Array.from({length:12}, (_,i) => mk(i+12));
        const sum = (months, map) => months.reduce((s,m) => s + (map[m]||0), 0);
        const revNow = sum(last12, newARRByMonth), revPrev = sum(prev12, newARRByMonth);
        const dealNow = sum(last12, newDealsCountByMonth), dealPrev = sum(prev12, newDealsCountByMonth);
        const g = (n,p) => p > 0 ? Math.round((n-p)/p*100) : null;
        const revG = g(revNow, revPrev), dealG = g(dealNow, dealPrev);
        const tile = (label, now, prev, gr, money) => {
          const col = gr == null ? 'var(--tl)' : gr >= 0 ? '#2a7a4b' : '#e05252';
          return `<div style="background:var(--bg2);border-radius:8px;padding:12px 14px">
            <div style="font-size:12px;color:var(--tl)">${label}</div>
            <div style="font-size:24px;font-weight:700;color:${col};margin:2px 0">${gr==null?':':(gr>=0?'+':'')+gr+'%'}</div>

        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${tile('New revenue growth (year on year)', revNow, revPrev, revG, true)}
          ${tile('Deals-won growth (year on year)', dealNow, dealPrev, dealG, false)}
        </div>`;
      })()}
    </div>`;

  // ── REVENUE FORECAST (open pipeline × win rate) ───────────────────────────
  // Append forecast section after progress bar
  (() => {

    const allWon2  = allSales.filter(d => d['Deal - Status'] === 'Won');
