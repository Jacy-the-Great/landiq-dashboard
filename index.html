<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land iQ Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root {
  --navy:#1a3c5e; --navy2:#24527f; --acc:#2e8bc0; --acc2:#e8f3f9;
  --sur:#f4f6f8; --wh:#fff; --tx:#1a2733; --tm:#4a5f70; --tl:#8a9fb0;
  --bd:#dde5ec; --gr:#2a7a4b; --gr2:#e8f5ee; --wa:#c25a00; --wa2:#fdf0e6;
  --re:#c0392b; --re2:#fdecea;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sur);color:var(--tx);font-size:14px;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

/* LOCK */
#lock{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:24px}
.lock-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px;width:340px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(10px)}
.lock-logo{color:#fff;font-size:22px;font-weight:700;text-align:center;letter-spacing:-.02em}.lock-logo span{color:var(--acc)}
.lock-sub{color:rgba(255,255,255,.4);font-size:12px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.lock-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;width:100%;font-family:inherit;outline:none}
.lock-input::placeholder{color:rgba(255,255,255,.3)}
.lock-input:focus{border-color:var(--acc)}
.lock-btn{background:var(--acc);color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.lock-btn:hover{background:var(--navy2)}
.lock-err{color:#ff6b6b;font-size:12px;text-align:center;min-height:18px}

/* LAYOUT */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.h-logo{color:#fff;font-weight:700;font-size:16px;letter-spacing:-.02em}.h-logo span{color:var(--acc)}
.h-tag{font-size:9px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:2px 7px;letter-spacing:.1em;font-family:'DM Mono',monospace}
.h-space{flex:1}
.h-actions{display:flex;gap:8px;align-items:center}
.h-link{font-size:12px;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;padding:4px 10px;border-radius:4px;font-family:inherit;text-decoration:none;transition:.15s}
.h-link:hover{color:#fff;background:rgba(255,255,255,.08)}

nav{background:var(--wh);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;overflow-x:auto;flex-shrink:0}
.nav-btn{padding:13px 16px 11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tl);font-weight:400;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;margin-bottom:-1px}
.nav-btn:hover{color:var(--navy)}
.nav-btn.active{color:var(--navy);font-weight:600;border-bottom-color:var(--acc)}

main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.card-label{font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.card-value{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.03em;line-height:1.1}
.card-nodata{font-size:13px;color:var(--tl)}
.card-change{font-size:11px;font-weight:600}
.card-change.up{color:var(--gr)}.card-change.dn{color:var(--re)}
.card-sub{font-size:11px;color:var(--tl)}

/* BOXES */
.box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.box-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.box-title a{font-size:11px;color:var(--acc);font-weight:400;text-decoration:none}
.box-title a:hover{text-decoration:underline}
.no-data{text-align:center;color:var(--tl);font-size:13px;padding:40px 0}

/* CALLOUT */
.callout{border-radius:8px;padding:12px 16px;margin-bottom:14px}
.callout.warn{background:var(--wa2);border:1px solid #e5b896}
.callout.info{background:var(--acc2);border:1px solid #b3d4e8}
.callout.good{background:var(--gr2);border:1px solid #a8d5b5}
.callout-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.callout.warn .callout-label{color:var(--wa)}
.callout.info .callout-label{color:var(--acc)}
.callout.good .callout-label{color:var(--gr)}
.callout-text{font-size:13px;color:var(--tm);line-height:1.5}

/* FORMS */
.form-section{margin-bottom:14px}
.add-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s}
.add-btn:hover{background:var(--navy2)}
.add-btn.sec{background:none;color:var(--navy);border:1px solid var(--bd)}
.add-btn.sec:hover{background:var(--sur)}
.form-box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-top:10px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:var(--tm);font-weight:500;letter-spacing:.02em}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--wh);outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,139,192,.1)}
textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-save{background:var(--acc);color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#2477a8}
.btn-cancel{background:none;border:1px solid var(--bd);color:var(--tm);border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.form-divider{font-size:12px;color:var(--tl);padding:8px 0;border-top:1px solid var(--bd);margin-bottom:8px}
.source-note{font-size:10px;color:var(--tl);margin-top:2px}
.input-group-label{font-size:12px;font-weight:600;color:var(--navy);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--bd)}

/* TABLE */
.tbl-wrap{background:var(--wh);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tbl-head{font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;padding:10px 16px;border-bottom:1px solid var(--bd);background:#fafafa;display:flex;justify-content:space-between;align-items:center}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--tl);font-weight:500;font-size:11px;border-bottom:1px solid var(--bd);background:#fafafa;white-space:nowrap}
td{padding:8px 12px;color:var(--tm);border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcfe}
.btn-del{background:none;border:none;color:var(--re);font-size:11px;cursor:pointer;font-family:inherit;padding:2px 6px}
.show-all-btn{font-size:12px;color:var(--acc);background:none;border:none;cursor:pointer;padding:8px 16px;font-family:inherit}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.badge-linkedin{background:#e1f3ff;color:#0a66c2}
.badge-youtube{background:#ffe1e1;color:#c0392b}
.badge-edm{background:#e8f5ee;color:#2a7a4b}
.badge-viva{background:#fff3e0;color:#c25a00}
.badge-blog{background:#f3e5f5;color:#7b1fa2}
.badge-speaking{background:#e0f2f1;color:#00796b}
.badge-webinar{background:#e8eaf6;color:#3949ab}

/* PIPELINE */
.pipeline{display:grid;gap:0;margin-bottom:14px}
.pipeline-stage{display:flex;align-items:center;gap:0;position:relative}
.stage-bar-wrap{flex:1;background:var(--wh);border:1px solid var(--bd);padding:12px 16px;position:relative;overflow:hidden}
.stage-bar-wrap:first-child{border-radius:8px 8px 0 0}
.stage-bar-wrap:last-child{border-radius:0 0 8px 8px}
.stage-bg{position:absolute;left:0;top:0;bottom:0;background:var(--acc2);transition:.5s}
.stage-content{position:relative;display:flex;align-items:center;gap:12px}
.stage-name{font-size:12px;font-weight:500;color:var(--navy);min-width:160px}
.stage-count{font-size:20px;font-weight:700;color:var(--navy);min-width:50px;font-family:'DM Mono',monospace}
.stage-conv{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:4px}
.stage-conv-arrow{font-size:10px;color:var(--tl)}
.stage-target{font-size:11px;color:var(--tl);margin-left:auto}

/* RANGE TOGGLE */
.range-toggle{display:flex;gap:4px;background:var(--sur);border-radius:6px;padding:3px}
.range-btn{background:none;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.range-btn.active{background:var(--wh);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* FUNNEL CONV TABLE */
.conv-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.conv-table th{text-align:left;padding:6px 10px;color:var(--tl);font-size:11px;font-weight:500;border-bottom:1px solid var(--bd)}
.conv-table td{padding:6px 10px;border-bottom:1px solid var(--bd)}
.conv-table tr:last-child td{border-bottom:none}
.conv-pct{font-family:'DM Mono',monospace;font-weight:600}
.conv-pct.good{color:var(--gr)}.conv-pct.mid{color:var(--wa)}.conv-pct.bad{color:var(--re)}

/* OPTI-MAX TABLE */
.om-table{width:100%;border-collapse:collapse;font-size:13px}
.om-table th{padding:9px 12px;font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.06em;background:#f5f7fa;border-bottom:2px solid var(--bd);text-align:left}
.om-table td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.om-table tr.om-stage-hdr td{background:#1a3c5e;color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.om-table tr:last-child td{border-bottom:none}
.om-input{padding:4px 7px;border:1.5px solid var(--acc);border-radius:5px;font-size:12px;font-family:'DM Mono',monospace;text-align:right;background:var(--wh);width:72px;color:var(--navy);font-weight:600}
.om-input:focus{outline:none;border-color:var(--navy)}
.om-input-wide{width:100px}
/* PIPEDRIVE FUNNEL VISUAL */
.pd-funnel-row{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:12px 0}
.pd-funnel-box{min-width:100px;background:#2e8bc0;color:#fff;border-radius:8px;padding:12px 8px;text-align:center;flex-shrink:0}
.pd-funnel-box.won-box{background:#2a7a4b}
.pd-funnel-count{font-size:22px;font-weight:700;line-height:1}
.pd-funnel-name{font-size:10px;opacity:.9;margin-top:4px;line-height:1.3}
.pd-funnel-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;min-width:48px;gap:2px}
.pd-funnel-pct{font-size:12px;font-weight:700}
.pd-funnel-chevron{color:var(--tl);font-size:18px;line-height:1}
/* OUTCOME ITEM */
.outcome-item{font-size:13px;color:var(--tm);padding:8px 12px;border-left:3px solid var(--acc);margin-bottom:8px;line-height:1.5;background:var(--acc2);border-radius:0 6px 6px 0}

/* FRESHNESS ROW */
.fresh-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.fresh-row:last-child{border-bottom:none}

/* TABS WITHIN TAB */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--sur);padding:4px;border-radius:8px;width:fit-content}
.sub-tab{background:none;border:none;padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.sub-tab.active{background:var(--wh);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideup .2s ease}
@keyframes slideup{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* CHART WRAP */
.chart-wrap{position:relative;width:100%}

/* SOURCE LINK */
.src-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--acc);text-decoration:none;padding:3px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--wh)}
.src-link:hover{background:var(--acc2)}

/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.section-sub{font-size:12px;color:var(--tl);margin-top:2px}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock" style="display:none">
  <div class="lock-card">
    <div class="lock-logo">Land <span>iQ</span> Performance</div>
    <div class="lock-sub">Internal · Restricted Access</div>

    <!-- Step 1: Email input -->
    <div id="lock-step-email">
      <input class="lock-input" type="email" id="lock-email" placeholder="Enter your email" autocomplete="email">
      <button class="lock-btn" id="lock-send-btn" onclick="sendMagicLink()">Send sign-in link</button>
    </div>

    <!-- Step 2: Waiting for click -->
    <div id="lock-step-sent" style="display:none;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">📬</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">Check your inbox</div>
      <div style="font-size:12px;color:#888;margin-bottom:16px">Click the sign-in link we sent to <span id="lock-sent-email" style="font-weight:500;color:#555"></span></div>
      <button onclick="backToEmail()" style="background:none;border:none;color:#999;font-size:12px;cursor:pointer">← Use a different email</button>
    </div>

    <!-- Session restore loader -->
    <div id="lock-step-loading" style="display:none;text-align:center;color:#999;font-size:13px;padding:16px 0">Checking session…</div>

    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="h-logo">Land <span>iQ</span> Performance</div>
    <div class="h-tag">INTERNAL</div>
    <div class="h-space"></div>
    <div id="db-status-pill" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tl);background:var(--sur);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;cursor:default" title="Database connection status">
      <span id="db-status-dot" style="width:7px;height:7px;border-radius:50%;background:#ccc;display:inline-block"></span>
      <span id="db-status-text">Connecting…</span>
    </div>
    <div class="h-actions">
      <span id="header-user" style="font-size:11px;color:var(--tl);margin-right:4px"></span>
      <button class="h-link" onclick="exportData()">⬇ Export</button>
      <button class="h-link" onclick="document.getElementById('import-file').click()">⬆ Import</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImportFile(this)">
      <button class="h-link" onclick="confirmClear()">Clear all</button>
      <button class="h-link" onclick="signOut()" style="color:#e05252">Sign out</button>
    </div>
  </header>

  <nav id="main-nav"></nav>
  <main id="main-content"></main>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────
// AUTH — Email OTP via Supabase Auth
// State machine: initialising → authenticated ↔ refreshing → unauthenticated
// ─────────────────────────────────────────
const TARGET_USERS = 600;
const TARGET_ARR = 2400000;

let _authState   = 'initialising'; // 'initialising'|'authenticated'|'unauthenticated'|'refreshing'
let _authSession = null;
let _authEmail   = null;
let _refreshTimer = null;
let _initInFlight = null; // deduplication: prevents concurrent initialiseDatabaseAuth calls

// ─────────────────────────────────────────
// SUPABASE CLIENT (must be defined before any sb.auth.* calls below)
// ─────────────────────────────────────────
const SUPABASE_URL = 'https://ysdonnjezvoyrrizadik.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZG9ubmplenZveXJyaXphZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODY4MzYsImV4cCI6MjA5MzI2MjgzNn0.9bJ2FPEqV6NEtrnS567HBbwx0zcyQfshfcqWVRvH7RQ';
// Auth config per Database Authentication protocol:
// - persistSession: false  (app manages sessions manually)
// - autoRefreshToken: false (we schedule refresh 5 min before expiry)
// - null storage (no cookies / localStorage leaking tokens)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession:     false,
    autoRefreshToken:   false,
    detectSessionInUrl: true,   // needed to capture the magic link token on redirect
    storage: { getItem: () => null, setItem: () => {}, removeItem: () => {} },
  }
});

function showLockErr(msg) { document.getElementById('lock-err').textContent = msg || ''; }

function backToEmail() {
  document.getElementById('lock-step-sent').style.display  = 'none';
  document.getElementById('lock-step-email').style.display = 'block';
  showLockErr('');
}

async function sendMagicLink() {
  const email = document.getElementById('lock-email').value.trim().toLowerCase();
  if (!email || !email.includes('@')) { showLockErr('Enter a valid email address.'); return; }
  const btn = document.getElementById('lock-send-btn');
  btn.disabled = true; btn.textContent = 'Sending…'; showLockErr('');
  try {
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        shouldCreateUser:  false,
        emailRedirectTo:   window.location.href.split('#')[0], // redirect back to this page
      }
    });
    if (error) throw error;
    _authEmail = email;
    document.getElementById('lock-step-email').style.display = 'none';
    document.getElementById('lock-step-sent').style.display  = 'block';
    document.getElementById('lock-sent-email').textContent   = email;
  } catch (e) {
    showLockErr(e.message?.includes('not found') || e.message?.includes('Invalid')
      ? 'This email isn\'t authorised. Ask your admin to add you.'
      : (e.message || 'Failed to send link. Try again.'));
  } finally {
    btn.disabled = false; btn.textContent = 'Send sign-in link';
  }
}

// Listen for Supabase auth events — fires when magic link is clicked and user lands back
sb.auth.onAuthStateChange(async (event, session) => {
  if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
    await initialiseDatabaseAuth(session);
  }
  if (event === 'SIGNED_OUT') {
    showLock();
  }
});

async function initialiseDatabaseAuth(session) {
  // Deduplication: if already in-flight, return same promise
  if (_initInFlight) return _initInFlight;
  _initInFlight = _doInitAuth(session);
  try { await _initInFlight; } finally { _initInFlight = null; }
}

async function _doInitAuth(session) {
  if (!session?.access_token) throw new Error('No session returned');
  await sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token });
  _authSession = session;
  _authState   = 'authenticated';
  // Persist in sessionStorage so reload within same tab skips re-auth
  try { localStorage.setItem('liq_session', JSON.stringify(session)); } catch {}
  scheduleTokenRefresh(session.expires_at);
  showApp();
}

function scheduleTokenRefresh(expiresAt) {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  // Refresh 5 minutes before token expiry (per protocol spec)
  const msUntilRefresh = (expiresAt * 1000) - Date.now() - (5 * 60 * 1000);
  _refreshTimer = setTimeout(doTokenRefresh, Math.max(0, msUntilRefresh));
}

async function doTokenRefresh() {
  _authState = 'refreshing';
  try {
    const { data, error } = await sb.auth.refreshSession();
    if (error) throw error;
    _authSession = data.session;
    _authState   = 'authenticated';
    try { sessionStorage.setItem('liq_session', JSON.stringify(data.session)); } catch {}
    scheduleTokenRefresh(data.session.expires_at);
  } catch (e) {
    console.warn('Token refresh failed:', e.message);
    _authState = 'unauthenticated';
    _authSession = null;
    localStorage.removeItem('liq_session');
    toast('Session expired — please sign in again.');
    showLock();
  }
}

function signOut() {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  _authSession = null;
  _authState   = 'unauthenticated';
  localStorage.removeItem('liq_session');
  sb.auth.signOut().catch(() => {});
  showLock();
}

function showApp() {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display  = 'flex';

function showLock() {
  document.getElementById('app').style.display  = 'none';
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('lock-step-loading').style.display = 'none';
  document.getElementById('lock-step-email').style.display   = 'block';

// Keyboard shortcut
document.getElementById('lock-email').addEventListener('keydown', e => { if (e.key === 'Enter') sendMagicLink(); });

// ── On page load: restore session or show lock ───────────────────
// onAuthStateChange handles magic link redirects (fires SIGNED_IN before
// this IIFE can check localStorage). We must not call showLock() if
// onAuthStateChange already authenticated the user.
(async () => {
  // Show loading briefly while we check
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('lock-step-email').style.display   = 'none';
  document.getElementById('lock-step-loading').style.display = 'block';

  // Give onAuthStateChange a tick to fire first (handles magic link URLs)
  await new Promise(r => setTimeout(r, 100));
  if (_authState === 'authenticated') return; // already handled by onAuthStateChange

  let restored = false;
  try {
    const stored = JSON.parse(localStorage.getItem('liq_session') || 'null');
    if (stored?.access_token && stored?.refresh_token) {
      const { data, error } = await sb.auth.setSession({
        access_token:  stored.access_token,
        refresh_token: stored.refresh_token
      });
      if (!error && data?.session) {
        // onAuthStateChange will fire SIGNED_IN and call initialiseDatabaseAuth
        restored = true;
        // Wait briefly for the event to process
        await new Promise(r => setTimeout(r, 200));
      }
    }
  } catch (e) {
    console.warn('Session restore failed:', e.message);
  }
  // Only show lock if auth hasn't succeeded
  if (_authState !== 'authenticated') showLock();
})();

const KEYS = { sales:'sales', trials:'trials', website:'website', website_daily:'website_daily', training:'training', content:'content', webinars:'webinars', linkedin_weekly:'linkedin_weekly', edm_2m:'edm_2m', weekly_tracker:'weekly_tracker', activity_giraffe:'activity_giraffe', activity_sdk:'activity_sdk', activity_labs:'activity_labs' };

// In-memory cache — loaded from Supabase on init, kept in sync on every save
const _cache = {};
let _pd_deals = [];
let _pd_people = [];
let _pd_deals_imported_at = null;
let _pd_people_imported_at = null;

// PostHog live data cache (populated by loadPostHogLive)
let _ph = {
  loaded: false,
  error: null,
  refreshedAt: null,
  summary: null,         // { total_users, total_events, first_event_date, last_event_date, avg_active_days }
  weekly: [],            // [{ week_start, active_users, login_users, new_users, total_events }]
  daily: [],             // [{ day, active_users, login_users, total_events }]
  dauMau: [],            // [{ day, dau, mau, dau_mau_pct }]
  features: [],          // [{ feature, total_events, active_users, latest_day }]
  newUsers: [],          // [{ week_start, new_users }]
  retention: [],         // [{ cohort_week, cohort_size, retained_w1..w8 }]
  segments: [],          // [{ segment, user_count }]
  atRisk: [],            // [{ distinct_id, first_seen, last_seen, active_days, total_events }]
  featureAdoption: [],   // [{ feature, users_who_tried, total_users, adoption_pct }]
  featureCompletion: [], // [{ feature, started, completed, completion_pct }]
  powerUsers: [],        // [{ distinct_id, first_seen, last_seen, active_days, total_events }]
};

async function fetchAllRows(table, columns) {
  const PAGE = 1000;
  let all = [], offset = 0, done = false;
  while (!done) {
    const { data, error } = await sb.from(table).select(columns).range(offset, offset + PAGE - 1);
    if (error) throw error;
    if (!data || data.length === 0) { done = true; break; }
    all = all.concat(data);
    if (data.length < PAGE) { done = true; } else { offset += PAGE; }
  }
  return all;
}

let _dbStatus = { ok: false, error: null, deals: 0, people: 0, dashboardRows: 0, checkedAt: null };

// ── Local storage backup helpers ─────────────────────────────────
// Every save() writes to localStorage as well as Supabase.
// On load, if Supabase returns empty for a key but localStorage has data,
// we restore from local and re-push to Supabase automatically.
const LS_PREFIX = 'liq_bk_';
function lsWrite(sbKey, arr) {
  try { localStorage.setItem(LS_PREFIX + sbKey, JSON.stringify(arr)); } catch(e) {}
}
function lsRead(sbKey) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + sbKey);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

async function loadAll() {
  try {
    const [mainRes, dealsRows, peopleRows] = await Promise.all([
      sb.from('dashboard_data').select('key, value'),
      fetchAllRows('liq_pipedrive_deals', 'raw, imported_at'),
      fetchAllRows('liq_pipedrive_people', 'raw, imported_at')
    ]);
    if (mainRes.error) throw mainRes.error;
    mainRes.data.forEach(row => {
      _cache[row.key] = row.value || [];
      lsWrite(row.key, row.value || []); // keep localStorage in sync
    });
    _pd_deals  = dealsRows.map(r => r.raw);
    _pd_people = peopleRows.map(r => r.raw);
    if (dealsRows.length)  _pd_deals_imported_at  = dealsRows[0].imported_at;
    if (peopleRows.length) _pd_people_imported_at = peopleRows[0].imported_at;

    // ── Auto-restore: if main table is missing keys, try Supabase backup table first ──
    const missingKeys = Object.values(KEYS).filter(k => !_cache[k] || _cache[k].length === 0);
    if (missingKeys.length > 0) {
      const { data: backupRows } = await sb.rpc('get_latest_backups');
      if (backupRows?.length) {
        let restored = 0;
        backupRows.forEach(row => {
          if (missingKeys.includes(row.key) && row.value?.length > 0) {
            _cache[row.key] = row.value;
            lsWrite(row.key, row.value);
            // Re-push to main dashboard_data table
            sb.from('dashboard_data')
              .upsert({ key: row.key, value: row.value, updated_at: new Date().toISOString() })
              .then(({ error }) => { if (error) console.warn('Restore push failed for', row.key, error); });
            restored++;
          }
        });
        if (restored > 0) toast(`⚡ Restored ${restored} data set${restored>1?'s':''} from Supabase backup`);
      }

      // ── Tertiary: localStorage fallback for anything still missing ──
      Object.keys(KEYS).forEach(k => {
        const sbKey = KEYS[k];
        if (!_cache[sbKey] || _cache[sbKey].length === 0) {
          const local = lsRead(sbKey);
          if (local?.length > 0) {
            _cache[sbKey] = local;
            // Push back to both main table and backup
            sb.from('dashboard_data')
              .upsert({ key: sbKey, value: local, updated_at: new Date().toISOString() })
              .then(() => {});
            sb.from('dashboard_backups')
              .insert({ key: sbKey, value: local })
              .then(() => {});
          }
        }
      });
    }

    const totalRows = Object.values(KEYS).filter(k => _cache[k]?.length > 0).length;
    _dbStatus = { ok: true, error: null, deals: dealsRows.length, people: peopleRows.length, dashboardRows: totalRows, checkedAt: new Date() };
  } catch (e) {
    console.error('Supabase load failed:', e);
    // Full fallback: localStorage only
    let restoredFromLocal = 0;
    Object.keys(KEYS).forEach(k => {
      const backup = lsRead(KEYS[k]);
      if (backup?.length > 0) { _cache[KEYS[k]] = backup; restoredFromLocal++; }
    });
    _dbStatus = { ok: false, error: e.message || String(e), deals: 0, people: 0, dashboardRows: restoredFromLocal, checkedAt: new Date() };
    if (e.message?.includes('timeout')) {
      toast('⚠️ Database timeout. Try refreshing in a moment.');
    } else {
      toast(`⚠️ DB offline — showing local backup (${restoredFromLocal} sets)`);
    }
  }
}

function load(key) { return _cache[KEYS[key]] || []; }

// ── PostHog live data loader ─────────────────────────────────────
async function loadPostHogLive(forceRefresh = false) {
  if (_ph.loaded && !forceRefresh) return;
  _ph.error = null;
  try {
    const [summaryRes, weeklyRes, dailyRes, dauMauRes, featuresRes, newUsersRes, retentionRes,
           segmentsRes, atRiskRes, adoptionRes, completionRes, powerRes] = await Promise.all([
      sb.rpc('ph_summary'),
      sb.rpc('ph_weekly_stats',        { weeks_back: 16 }),
      sb.rpc('ph_daily_active_users',  { days_back:  30 }),
      sb.rpc('ph_dau_mau',             { days_back:  30 }),
      sb.rpc('ph_feature_usage',       { days_back:  30 }),
      sb.rpc('ph_new_users',           { weeks_back: 16 }),
      sb.rpc('ph_retention_cohort',    { cohort_weeks_back: 12 }),
      sb.rpc('ph_user_segments'),
      sb.rpc('ph_at_risk_users',       { min_active_days: 3, days_threshold: 14 }),
      sb.rpc('ph_feature_adoption'),
      sb.rpc('ph_feature_completion'),
      sb.rpc('ph_power_users',         { user_limit: 25 }),
    ]);
    // Check for errors (SQL migration may not have run yet)
    const errs = [summaryRes, weeklyRes, dailyRes, dauMauRes, featuresRes, newUsersRes, retentionRes,
                  segmentsRes, atRiskRes, adoptionRes, completionRes, powerRes]
      .map(r => r.error).filter(Boolean);
    if (errs.length) throw new Error(errs[0].message);

    _ph.summary           = summaryRes.data?.[0]   || null;
    _ph.weekly            = weeklyRes.data          || [];
    _ph.daily             = dailyRes.data           || [];
    _ph.dauMau            = dauMauRes.data          || [];
    _ph.features          = featuresRes.data        || [];
    _ph.newUsers          = newUsersRes.data        || [];
    _ph.retention         = retentionRes.data       || [];
    _ph.segments          = segmentsRes.data        || [];
    _ph.atRisk            = atRiskRes.data          || [];
    _ph.featureAdoption   = adoptionRes.data        || [];
    _ph.featureCompletion = completionRes.data      || [];
    _ph.powerUsers        = powerRes.data           || [];
    _ph.loaded     = true;
    _ph.refreshedAt = new Date();
  } catch (e) {
    _ph.error = e.message || 'PostHog RPC failed';
    console.warn('PostHog live load failed:', e.message);
    // Not a fatal error — the tab still works with manual data
  }
}

async function refreshPostHog() {
  // Trigger materialized view refresh then reload
  const el = document.getElementById('ph-refresh-btn');
  if (el) { el.disabled = true; el.textContent = 'Refreshing…'; }
  try {
    await sb.rpc('ph_refresh_views');
    await loadPostHogLive(true);
    renderActivity();
    toast('PostHog data refreshed.');
  } catch (e) {
    toast('Refresh failed: ' + (e.message || e));
  } finally {
    if (el) { el.disabled = false; el.textContent = '↺ Refresh PostHog'; }
  }
}

function save(key, arr) {
  const sbKey = KEYS[key];
  _cache[sbKey] = arr;
  lsWrite(sbKey, arr); // 1. localStorage — instant, works offline

  // 2. Main table — upsert (overwrite latest)
  sb.from('dashboard_data')
    .upsert({ key: sbKey, value: arr, updated_at: new Date().toISOString() })
    .then(({ error }) => {
      if (error) {
        console.error('Supabase save failed:', error);
        toast('⚠️ Cloud save failed — data kept locally. ' + (error.message || error.code || ''));
        _dbStatus.ok = false; _dbStatus.error = error.message;
        updateDbStatusPill();
      }
    });

  // 3. Backup table — append (never overwrites, survives main table wipes)
  sb.from('dashboard_backups')
    .insert({ key: sbKey, value: arr })
    .then(({ error }) => {
      if (error) console.warn('Backup insert failed for', sbKey, error.message);
    });
}

function exportData() {
  const data = {};
  Object.keys(KEYS).forEach(k => data[k] = load(k));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landiq_dashboard_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Data exported successfully.');
}

function importBackup(json) {
  try {
    const data = JSON.parse(json);
    Object.keys(KEYS).forEach(k => { if (data[k]) save(k, data[k]); });
    toast('Backup imported successfully.');
    renderTab(activeTab);
  } catch { toast('Import failed: invalid JSON.'); }
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { importBackup(e.target.result); input.value = ''; };
  reader.readAsText(file);
}

function confirmClear() {
  if (confirm('Delete ALL dashboard data? This cannot be undone.')) {
    Object.keys(KEYS).forEach(k => save(k, []));
    toast('All data cleared.');
    renderTab(activeTab);
  }
}

const fmtDate = d => d ? new Date(d).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' }) : ':';
const fmtNum  = n => n != null ? Number(n).toLocaleString() : ':';
const fmtPct  = n => n != null ? Number(n).toFixed(1) + '%' : ':';
const fmtDollar = n => n != null ? '$' + Number(n).toLocaleString() : ':';
const pct = (a, b) => (a != null && b && b !== 0) ? (a / b * 100) : null;

function thisMonth(arr, dateKey = 'week') {
  const now = new Date();
  return arr.filter(r => {
    const d = new Date(r[dateKey]);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function monthKey(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  return new Date(y, m - 1).toLocaleString('default', { month: 'short', year: '2-digit' });
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function makeChart(id, config) {
  destroyChart(id);
  const canvas = document.getElementById(id);
  if (!canvas) return;
  charts[id] = new Chart(canvas, config);
}

function toast(msg, dur = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.style.display = 'none', dur);
}

function delRow(key, id, dateKey = 'week') {
  const label = dateKey === 'week' ? 'week of ' + fmtDate(id) : 'this entry';
  if (!confirm('Delete ' + label + '?')) return;
  save(key, load(key).filter(r => (r._id || r.week) !== id));
  toast('Entry deleted.');
  renderTab(activeTab);
}

// ─────────────────────────────────────────
// SUMMARY CARD BUILDER
// ─────────────────────────────────────────
function cardHTML(label, value, prev, type, sub) {
  let disp = value == null ? null : type === '$' ? fmtDollar(value) : type === '%' ? fmtPct(value) : fmtNum(value);
  let changeHTML = '';
  if (value != null && prev != null && prev !== 0) {
    const d = ((value - prev) / prev * 100).toFixed(1);
    const up = value >= prev;
    changeHTML = `<div class="card-change ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${d}%</div>`;
  }
  return `<div class="card">
    <div class="card-label">${label}</div>
    ${disp ? `<div class="card-value">${disp}</div>` : '<div class="card-nodata">no data</div>'}
    ${changeHTML}
    ${sub ? `<div class="card-sub">${sub}</div>` : ''}
  </div>`;
}

function cardsHTML(items) {
  return `<div class="cards">${items.map(i => cardHTML(...i)).join('')}</div>`;
}

// ─────────────────────────────────────────
// DATA TABLE BUILDER
// ─────────────────────────────────────────
function tableHTML(key, rows, cols, idField, showAllKey) {
  const limit = activeSub[showAllKey || key + '_all'] ? rows.length : 8;
  const visible = [...rows].reverse().slice(0, limit);
  if (!rows.length) return `<div class="box"><div class="no-data">No entries yet.</div></div>`;
  return `<div class="tbl-wrap">
    <div class="tbl-head">Recent entries
      ${rows.length > 8 ? `<button class="show-all-btn" onclick="toggleShowAll('${showAllKey || key + '_all'}')">${activeSub[showAllKey || key + '_all'] ? 'Show less' : 'Show all ' + rows.length}</button>` : ''}
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody>${visible.map(row => `<tr>${cols.map(c => `<td>${c.render ? c.render(row) : (row[c.key] != null ? row[c.key] : ':')}</td>`).join('')}
        <td><button class="btn-del" onclick="delRow('${key}','${row[idField] || row.week || row._id}','${idField}')"">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

  activeSub[key] = !activeSub[key];

function saveSales() {
  const week = document.getElementById('s-week').value;
  if (!week) { toast('Please select a week ending date.'); return; }

  const entry = { week };
  ['newDeals','won','wonVal','lost','lostVal','revenue','avgDealVal','websiteUsers','withTrial','noTrial','withDemo','noDemo'].forEach(f => {
    const v = document.getElementById('s-' + f)?.value;
    if (v !== '' && v != null) entry[f] = Number(v);
  });
  entry.winRate = entry.won != null && entry.lost != null ? pct(entry.won, entry.won + entry.lost) : (Number(document.getElementById('s-winRate')?.value) || null);

  DEAL_STAGES.forEach(s => {
    const v = document.getElementById('s-' + s.key)?.value;
    if (v !== '' && v != null) entry[s.key] = Number(v);
  });

  const sources = ['webinar','helpdesk_eoi','vendor_initiative','customer_initiated','emailed'];
  sources.forEach(s => {
    const v = document.getElementById('s-src_' + s)?.value;
    if (v !== '' && v != null) entry['src_' + s] = Number(v);
  });

  const arr = load('sales').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('sales', arr);
  toggleForm('sales-form');
  toast('Saved: week of ' + fmtDate(week));
  renderSales();
}

function importWebsiteCSV() {
  const raw = document.getElementById('web-csv').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
  const entries = {};
  lines.forEach(row => {
    const sep = row.includes('\t') ? '\t' : ',';
    const p = row.split(sep).map(x => x.trim());
    if (!p[0] || p[0].toLowerCase() === 'date') return;
    const dt = new Date(p[0]);
    if (isNaN(dt.getTime())) return;
    const we = new Date(dt);
    while (we.getDay() !== 0) we.setDate(we.getDate() + 1);
    const k = we.toISOString().split('T')[0];
    if (!entries[k]) entries[k] = { views: 0, users: 0, active: 0, sessions: 0 };
    entries[k].views    += parseInt(p[1]) || 0;
    entries[k].users    += parseInt(p[2]) || 0;
    entries[k].active   += parseInt(p[3]) || 0;
    entries[k].sessions += parseInt(p[4]) || 0;
  });
  const newRows = Object.entries(entries).map(([week, m]) => ({ week, ...m }));
  const merged = load('website');
  newRows.forEach(nr => {
    const idx = merged.findIndex(r => r.week === nr.week);
    if (idx >= 0) merged[idx] = { ...merged[idx], ...nr };
    else merged.push(nr);
  });
  save('website', merged.sort((a, b) => a.week > b.week ? 1 : -1));
  document.getElementById('web-csv').value = '';
  toggleForm('web-form');
  toast('Imported ' + newRows.length + ' weeks of website data.');
  renderWebsite();
}

function importWebsiteDailyCSV(input) {
  const file = input.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: (results) => {
      const rows = results.data;
      let imported = 0;
      const existing = load('website_daily');
      const map = Object.fromEntries(existing.map(r => [r.date, r]));
      rows.forEach(p => {
        // Skip header row
        if (!p[0] || p[0].toLowerCase().includes('date')) return;
        const dt = new Date(p[0]);
        if (isNaN(dt.getTime())) return;
        const date = dt.toISOString().split('T')[0];
        map[date] = {
          date,
          views:    parseInt(p[1]) || map[date]?.views    || null,
          users:    parseInt(p[2]) || map[date]?.users    || null,
          sessions: parseInt(p[3]) || map[date]?.sessions || null,
          cta:      parseInt(p[4]) || map[date]?.cta      || null,
          eoiform:  parseInt(p[5]) || map[date]?.eoiform  || null,
        };
        imported++;
      });
      const merged = Object.values(map).sort((a,b) => a.date > b.date ? 1 : -1);
      save('website_daily', merged);
      input.value = '';
      toast('Imported ' + imported + ' days of website data.');
      renderWebsite();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

        label: (r.cohort_week||'').slice(0,10),
        data: [
          100,
          r.cohort_size > 0 ? Math.round(r.retained_w1/r.cohort_size*100) : 0,
          r.cohort_size > 0 ? Math.round(r.retained_w2/r.cohort_size*100) : 0,
          r.cohort_size > 0 ? Math.round(r.retained_w4/r.cohort_size*100) : 0,
          r.cohort_size > 0 ? Math.round(r.retained_w8/r.cohort_size*100) : 0,
        ],
        borderColor: palette[i % palette.length],
        borderWidth: 2,
        fill: false,
        tension: .3,

        type:'line',
        data:{ labels:['Week 0','Week 1','Week 2','Week 4','Week 8'], datasets },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'DM Sans', size:10 }, boxWidth:10 } } },
          scales:{
            x:{ grid:{ display:false }, ticks:axStyle },
            y:{ grid:gridStyle, ticks:{ ...axStyle, callback: v => v+'%' }, beginAtZero:true, max:100 }
          }
        }
      });

  // ── INSIGHTS ─────────────────────────────────────────────────────────────
  } else if (sub === 'insights') {

    // Segment donut data
    const segMap = Object.fromEntries((_ph.segments||[]).map(s => [s.segment, Number(s.user_count)]));

    // Feature adoption table rows

        '<span style="color:' + (f.completion_pct >= 80 ? '#2a7a4b' : f.completion_pct >= 50 ? '#c25a00' : '#c0392b') + ';font-weight:600">' +
        f.completion_pct + '%</span></td>' +
      '</tr>'

    // At-risk users rows
    const atRiskRows = (_ph.atRisk||[]).slice(0,20).map(u =>

      '<td style="text-align:right">' + fmtNum(u.total_events) + '</td>' +
      '</tr>'

    // Power users rows
    const powerRows = (_ph.powerUsers||[]).map((u,i) =>
      '<tr>' +
      '<td style="color:var(--tl);font-size:11px">#' + (i+1) + '</td>' +
      '<td style="font-family:monospace;font-size:11px;color:var(--tm)">' + (u.distinct_id||'').slice(0,28) + '…</td>' +
      '<td style="text-align:right">' + fmtNum(u.total_events) + '</td>' +
      '<td style="text-align:right">' + fmtNum(u.active_days) + 'd</td>' +
      '<td style="text-align:right;color:var(--tl)">' + (u.last_seen||'').slice(0,10) + '</td>' +
      '</tr>'

    sc.innerHTML = `
      ${!hasData ? '<div class="callout warn"><div class="callout-text">Run the SQL migration and click Refresh PostHog to load Insights data.</div></div>' : ''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

        <div class="box">
          <div class="box-title">User health segments</div>
          ${segTotal > 0 ? `
            <div class="chart-wrap" style="height:200px"><canvas id="act-segments-chart"></canvas></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
              ${['New','Active','At-risk','Dormant'].map(s => `
                <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sur);border-radius:6px">
                  <span style="width:8px;height:8px;border-radius:50%;background:${segColours[s]};flex-shrink:0"></span>
                  <div>
                    <div style="font-size:13px;font-weight:600">${fmtNum(segMap[s]||0)}</div>
                    <div style="font-size:11px;color:var(--tl)">${s}</div>
                  </div>
                </div>`).join('')}
            </div>` : '<div class="no-data">No segment data yet.</div>'}
        </div>

        <div class="box">
          <div class="box-title">Feature completion rates
            <span style="font-size:10px;font-weight:400;color:var(--tl);margin-left:6px">started → completed</span>
          </div>
          ${completionRows ? `<div class="tbl-scroll"><table>
            <thead><tr><th>Feature</th><th style="text-align:right">Started</th><th style="text-align:right">Completed</th><th style="text-align:right">Rate</th></tr></thead>
            <tbody>${completionRows}</tbody>
          </table></div>` : '<div class="no-data">No completion data.</div>'}
        </div>
      </div>

      <div class="box">
        <div class="box-title">Feature adoption — % of all users who have tried each feature</div>
        ${adoptionRows ? `
          <div class="chart-wrap" style="height:220px;margin-bottom:16px"><canvas id="act-adoption-chart"></canvas></div>
          <div class="tbl-scroll"><table>
            <thead><tr><th>Feature</th><th style="text-align:right">Users</th><th style="text-align:right">Adoption</th></tr></thead>
            <tbody>${adoptionRows}</tbody>
          </table></div>` : '<div class="no-data">No adoption data.</div>'}
      </div>

      <div class="box">
        <div class="box-title">At-risk users
          <span style="font-size:10px;font-weight:400;color:var(--tl);margin-left:6px">previously active · not seen in 14+ days</span>
        </div>
        ${atRiskRows ? `<div class="tbl-scroll"><table>
          <thead><tr><th>User ID</th><th style="text-align:right">First seen</th><th style="text-align:right">Last seen</th><th style="text-align:right">Active days</th><th style="text-align:right">Events</th></tr></thead>
          <tbody>${atRiskRows}</tbody>
        </table></div>` : '<div class="no-data">No at-risk users — great sign!</div>'}
      </div>

      <div class="box">
        <div class="box-title">Power users — top 25 by activity</div>
        ${powerRows ? `<div class="tbl-scroll"><table>
          <thead><tr><th>#</th><th>User ID</th><th style="text-align:right">Events</th><th style="text-align:right">Active days</th><th style="text-align:right">Last seen</th></tr></thead>
          <tbody>${powerRows}</tbody>
        </table></div>` : '<div class="no-data">No data.</div>'}
      </div>
    `;

    // Segments donut chart
    if (segTotal > 0) {
      makeChart('act-segments-chart', {
        type: 'doughnut',
        data: {
          labels: ['New','Active','At-risk','Dormant'],
          datasets: [{ data: ['New','Active','At-risk','Dormant'].map(s=>segMap[s]||0),
            backgroundColor: ['#2e8bc0','#2a7a4b','#c25a00','#8a9fb0'], borderWidth: 2, borderColor: '#fff' }]
        },
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: ctx => ctx.label+': '+fmtNum(ctx.raw)+' users' } } },
          cutout: '60%'
        }
      });
    }

    // Feature adoption bar chart
    if (_ph.featureAdoption.length) {
      const top = _ph.featureAdoption.slice(0,12);
      makeChart('act-adoption-chart', {
        type:'bar',
        data:{
          labels: top.map(f => f.feature),
          datasets:[{ label:'Adoption %', data:top.map(f=>f.adoption_pct||0),
            backgroundColor:'rgba(46,139,192,.75)', borderRadius:4 }]

          plugins:{ legend:{ display:false } },

            y:{ grid:{ display:false }, ticks:{ ...axStyle, font:{ size:11 } } }
          }
        }
      });
    }
  }
}

function renderTraining(el) {
  el = el || document.getElementById('main-content');

  const sub = activeSub.training_sub || 'sessions';
  const tm = thisMonth(data, 'date');
  const trainedThisMonth = tm.reduce((s, r) => s + (r.attendees || 0), 0);

  const hist = { '2025-11':19,'2025-12':25,'2026-01':12,'2026-02':32,'2026-03':20,'2026-04':71,'2026-05':14,'2026-06':8 };

  const date = document.getElementById('wb-date').value;

  const numFields = ['regPageViews','registered','attended','cancelled','reactions'];
  const txtFields = ['title','avgTime'];

    ${tableHTML('content', data, [
      { key: 'date',    label: 'Date',    render: r => fmtDate(r.date) },
      { key: 'type',    label: 'Type',    render: r => `<span class="badge badge-${r.type.toLowerCase().replace(' ','-')}">${r.type}</span>` },
      { key: 'title',   label: 'Title',   render: r => r.title || ':' },
      { key: 'metric',  label: 'Primary', render: r => {
        if (r.type==='LinkedIn') return fmtNum(r.impressions) + ' imp';
        if (r.type==='YouTube') return fmtNum(r.ytviews) + ' views';
        if (r.type==='EDM') return fmtNum(r.opens) + ' opens';
        if (r.type==='Viva Engage') return fmtNum(r.vivaviews) + ' views';
        if (r.type==='Speaking') return fmtNum(r.leads) + ' leads';
        return ':';
      }},
      { key: 'outcome', label: 'Outcome', render: r => r.outcome ? r.outcome.substring(0,40)+'…' : ':' },
    ], '_id')}
  `;

  if (volData.length) {
    makeChart('content-vol', {
      type: 'bar',
      data: {
        labels: volData.map(([k]) => monthLabel(k)),
        datasets: types.map(t => ({
          label: t, stack: 'a',
          data: volData.map(([,v]) => v[t] || 0),
          backgroundColor: typeColors[t],
          borderRadius: 2,
        }))
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { family: 'DM Sans', size: 11 }, boxWidth: 10, padding: 10 } } },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: axStyle },
          y: { stacked: true, grid: gridStyle, ticks: axStyle }
        }
      }
    });
  }

  setContentSub(sub, false, data, outcomes);
}

        ` : '<div class="no-data">No webinars logged yet.</div>'}
      </div>
      <div class="form-section">
        <button class="add-btn" onclick="toggleForm('webinar-form')">+ Add webinar</button>
        <div id="webinar-form" style="display:none"><div class="form-box">
          <div class="form-grid">
            <div class="form-group">

          <tbody>${edms.map(e => {

              <td>${fmtNum(e.opens)}</td><td><span class="conv-pct ${or>30?'good':or>20?'mid':'bad'}">${fmtPct(or)}</span></td>
              <td>${fmtNum(e.edmclicks)}</td><td><span class="conv-pct ${cr>10?'good':cr>5?'mid':'bad'}">${fmtPct(cr)}</span></td>
              <td>${fmtNum(e.unsub)}</td></tr>`;

        </table>` : '<div class="no-data">No EDM campaigns logged yet. Add via the content form below and select "EDM" as type.</div>'}
      </div>
      <div class="box">
        <div class="box-title">2-Month Growth Email: automated onboarding sequence

        </div>
        ${growth2m.length ? `<table class="conv-table">
          <thead><tr><th>Cohort date</th><th>Sent to</th><th>Open rate</th><th>Click rate</th><th>Notes</th><th></th></tr></thead>
          <tbody>${[...growth2m].reverse().map(r => {
            const or = Number(r.openRate);
            const cr = Number(r.clickRate);
            return `<tr><td>${fmtDate(r.date)}</td><td>${fmtNum(r.sent)}</td>
              <td><span class="conv-pct ${or>30?'good':or>20?'mid':'bad'}">${fmtPct(or)}</span></td>
              <td><span class="conv-pct ${cr>10?'good':cr>5?'mid':'bad'}">${fmtPct(cr)}</span></td>
              <td style="color:var(--tl)">${r.notes||':'}</td>
              <td><button class="btn-del" onclick="delRow('edm_2m','${r._id}','_id')">Delete</button></td>

        <div style="margin-top:12px">

  } else if (sub === 'log') {
    sc.innerHTML = '';

  } else if (sub === 'website') {
    renderWebsite(sc);

  } else if (sub === 'correlation') {
    const allContent = data || load('content');
    const websiteData = load('website');
    const typeColors2 = { LinkedIn:'#0a66c2', YouTube:'#c0392b', EDM:'#2a7a4b', 'Viva Engage':'#c25a00', Webinar:'#3949ab', Blog:'#7b1fa2', Speaking:'#00796b' };
    // Build last 90 days daily x-axis
    const today90 = new Date(); today90.setHours(0,0,0,0);
    const days90 = Array.from({length:90},(_,i)=>{ const d=new Date(today90); d.setDate(d.getDate()-89+i); return d.toISOString().split('T')[0]; });
    // Map website weekly data: for each day find its week Sunday endpoint
    const weekMap90 = {};
    websiteData.forEach(w => { weekMap90[w.week] = w; });
    function getWeekSun(dateStr) {
      const d = new Date(dateStr); while(d.getDay()!==0) d.setDate(d.getDate()+1);
      return d.toISOString().split('T')[0];
    }
    const dailyUsers90 = days90.map(d => { const w = weekMap90[getWeekSun(d)]; return w ? (w.users||0)||null : null; });
    // Group content events by date
    const eventsByDay90 = {};
    allContent.forEach(c => { if(!c.date) return; if(!eventsByDay90[c.date]) eventsByDay90[c.date]=[]; eventsByDay90[c.date].push(c); });
    // Build stacked bar datasets per type
    const corrTypes = ['LinkedIn','YouTube','EDM','Viva Engage','Webinar','Blog','Speaking'];

      label: type,
      data: days90.map(d => (eventsByDay90[d]||[]).filter(c=>c.type===type).length || null),

      borderColor: typeColors2[type] || '#888',
      type: 'bar', stack: 'events',
      yAxisID: 'y2', barThickness: 8,
    })).filter(ds => ds.data.some(v=>v));
    const corrLegend = corrTypes.filter(t=>eventDatasets90.some(d=>d.label===t)).map(t=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${typeColors2[t]};display:inline-block"></span>${t}</span>`).join('');

      </div>
      <div id="corr-chart-wrap" class="chart-wrap" style="height:300px"></div>
    </div>`;
    if (websiteData.length || allContent.length) {
      document.getElementById('corr-chart-wrap').innerHTML = '<canvas id="corr-chart"></canvas>';

        type: 'line',
        data: {
          labels: dayLabels90,
          datasets: [
            { label:'Website users', data:dailyUsers90, borderColor:'#2e8bc0', backgroundColor:'rgba(46,139,192,.08)', borderWidth:2, fill:true, tension:.3, pointRadius:0, spanGaps:true, yAxisID:'y1', order:10 },

          ]

        options: { responsive:true, maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          plugins:{ legend:{display:false},
            tooltip:{ callbacks:{
              title: ctx=>{ const d=days90[ctx[0].dataIndex]; return fmtDate(d); },
              afterBody: ctx=>{ const d=days90[ctx[0].dataIndex]; const evs=(eventsByDay90[d]||[]); return evs.length ? ['','Content:'].concat(evs.map(c=>'• '+c.type+(c.title?' — '+c.title.slice(0,40):''))) : []; }
            }}
          },
          scales:{
            x:{ grid:{display:false}, ticks:{...axStyle, callback:(v,i)=>dayLabels90[i]||null, maxRotation:0} },
            y1:{ position:'left', grid:gridStyle, ticks:axStyle, beginAtZero:true, title:{display:true,text:'Users',...axStyle} },
            y2:{ position:'right', grid:{drawOnChartArea:false}, ticks:{...axStyle,stepSize:1}, beginAtZero:true, title:{display:true,text:'Events',...axStyle}, suggestedMax:4 }
          }
        }
      });
    } else {
      document.getElementById('corr-chart-wrap').innerHTML = '<div class="no-data">Add website data and content items to see the chart.</div>';
    }

  } else if (sub === 'tracker') {
    // Lucy's weekly tracker — metrics as rows, weeks as columns
    const TRACKER_SECTIONS = [
      { label: 'LinkedIn', key: 'linkedin', rows: [
        { key: 'jsImp',         label: 'JS Post Impressions',   fmt: 'num' },
        { key: 'jmImp',         label: 'JM Post Impressions',   fmt: 'num' },
        { key: 'lbImp',         label: 'LB Post Impressions',   fmt: 'num' },
      ]},
      { label: 'EDM', key: 'edm', rows: [
        { key: 'edmOpen',        label: 'Email Open Rate',       fmt: 'pct' },
        { key: 'edmCtr',         label: 'Click through Rate',    fmt: 'pct' },
      ]},
      { label: 'Webinar', key: 'webinar', rows: [
        { key: 'wbEmailSend',   label: 'Email Send',             fmt: 'num' },
        { key: 'wbEmailOpen',   label: 'Email Open Rate',        fmt: 'pct' },
        { key: 'wbEmailCtr',    label: 'Click through Rate',     fmt: 'pct' },
        { key: 'wbRegPage',     label: 'Event Reg. Page',        fmt: 'pct' },
        { key: 'wbReg',         label: 'Registrations',          fmt: 'num' },
      ]},
      { label: 'Website', key: 'website', rows: [
        { key: 'websiteVisits', label: 'Total Users (visits)',   fmt: 'num' },
        { key: 'purchaseEnq',   label: 'Purchase Enquiries',     fmt: 'num' },
        { key: 'eoiTickets',    label: 'EOI Tickets',            fmt: 'num' },
        { key: 'trialsStarted', label: 'Trials Started',         fmt: 'num' },
      ]},
    ];

    const tracker = load('weekly_tracker');
    // Sort ascending, take last 10 weeks
    const weeks = [...tracker].sort((a,b) => a.week > b.week ? 1 : -1).slice(-10);
    const colSpan = weeks.length + 1;

    const weekHeaders = weeks.map(r =>
      `<th style="text-align:center;min-width:76px;white-space:nowrap;font-weight:600">
        ${fmtDate(r.week)}
        <div style="margin-top:3px">
          <button onclick="delTrackerWeek('${r._id}')" style="background:none;border:none;color:#bbb;cursor:pointer;font-size:10px;padding:0 2px;line-height:1" title="Delete this week">✕</button>
        </div>
      </th>`
    ).join('');

    let bodyRows = '';

// Parse a date string from Lucy's CSV header (e.g. "6-Nov", "26-Mar", "1-Apr-25", ISO dates)
function parseTrackerDate(str) {
  if (!str || !str.trim()) return null;
  str = str.trim();
  // Try standard ISO / JS parse first
  let d = new Date(str);
  if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
    return d.toISOString().split('T')[0];
  }
  // Match "6-Nov", "26-Mar", "1 Apr", "6-Nov-25", "6-Nov-2025"
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m = str.match(/^(\d{1,2})[\s\-\/]([a-zA-Z]{3})(?:[\s\-\/](\d{2,4}))?$/);
  if (m) {
    const day = parseInt(m[1]);
    const mo  = months[m[2].toLowerCase()];
    if (mo === undefined) return null;
    let year = m[3]
      ? (m[3].length === 2 ? 2000 + parseInt(m[3]) : parseInt(m[3]))
      : new Date().getFullYear();
    // If result is more than 6 months in the future, assume previous year
    const candidate = new Date(year, mo, day);
    if (candidate - new Date() > 180 * 86400000) year--;
    return new Date(year, mo, day).toISOString().split('T')[0];
  }
  return null;
}

function importTrackerCSV(input) {
  const file = input.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: false, skipEmptyLines: true,
    complete: (results) => {
      const rows = results.data;
      if (rows.length < 2) { toast('CSV appears empty.'); return; }

      // Row 0 = header: [label col, date1, date2, ...]
      const headerRow = rows[0];
      const dateKeys = []; // ISO date string per column (null if unparseable)
      for (let c = 1; c < headerRow.length; c++) {
        dateKeys.push(parseTrackerDate(String(headerRow[c] || '').trim()));
      }

      // Section-aware field mapping
      const SECTION_MAP = {
        linkedin: {
          'js post impressions': 'jsImp',
          'jm post impressions': 'jmImp',
          'lb post impressions': 'lbImp',
        },
        edm: {
          'email open rate':     'edmOpen',
          'open rate':           'edmOpen',
          'click through rate':  'edmCtr',
          'click-through rate':  'edmCtr',
          'ctr':                 'edmCtr',
        },
        webinar: {
          'email send':              'wbEmailSend',
          'email sends':             'wbEmailSend',
          'email open rate':         'wbEmailOpen',
          'open rate':               'wbEmailOpen',
          'click through rate':      'wbEmailCtr',
          'click-through rate':      'wbEmailCtr',
          'ctr':                     'wbEmailCtr',
          'event registration page': 'wbRegPage',
          'registration page':       'wbRegPage',
          'registrations':           'wbReg',
        },
        website: {
          'total users (visits)':    'websiteVisits',
          'total users':             'websiteVisits',
          'website visits':          'websiteVisits',
          'users':                   'websiteVisits',
          'purchase enquiries':      'purchaseEnq',
          'purchase enquiry':        'purchaseEnq',
          'purchase':                'purchaseEnq',
          'eoi tickets':             'eoiTickets',
          'eoi ticket':              'eoiTickets',
          'eoi':                     'eoiTickets',
          'trials started':          'trialsStarted',
          'trial':                   'trialsStarted',
        },
      };

      // Detect section from a row label
      function detectSection(label) {
        const l = label.toLowerCase();
        if (l.includes('linkedin'))                           return 'linkedin';
        if (l.includes('edm') || l.includes('2m growth') || l.includes('email marketing')) return 'edm';
        if (l.includes('webinar'))                            return 'webinar';
        if (l.includes('website') || l.includes('landing page')) return 'website';
        return null;
      }

      // Accumulate values per week
      const dataMap = {}; // { isoDate: { fieldKey: value } }
      dateKeys.forEach(dk => { if (dk) dataMap[dk] = dataMap[dk] || {}; });

      let currentSection = null;

      for (let ri = 1; ri < rows.length; ri++) {
        const row = rows[ri];
        const label = String(row[0] || '').trim();
        if (!label) continue;

        // Check if this row is a section header
        const sec = detectSection(label);
        if (sec) { currentSection = sec; continue; }
        if (!currentSection) continue;

        // Look up the field key for this metric label
        // Try exact match first, then starts-with (handles suffixes like "(Consolidated)", "(visits)")
        const labelNorm = label.toLowerCase().replace(/\s+/g, ' ').trim();
        const secMap = SECTION_MAP[currentSection] || {};
        let fieldKey = secMap[labelNorm];
        if (!fieldKey) {
          // Longest key first so "email open rate" beats "open rate"
          const keys = Object.keys(secMap).sort((a, b) => b.length - a.length);
          for (const k of keys) {
            if (labelNorm.startsWith(k)) { fieldKey = secMap[k]; break; }
          }
        }
        if (!fieldKey) continue;

        // Read each column's value
        for (let c = 1; c < row.length; c++) {
          const dk = dateKeys[c - 1];
          if (!dk) continue;
          const raw = String(row[c] || '').trim().replace(/%/g, '').replace(/,/g, '');
          if (!raw || raw === '-' || raw === '—') continue;
          const num = parseFloat(raw);
          if (!isNaN(num)) dataMap[dk][fieldKey] = num;
        }
      }

      // Merge with existing tracker records
      const existing   = load('weekly_tracker');
      const existingMap = Object.fromEntries(existing.map(r => [r.week, r]));
      let count = 0;
      Object.entries(dataMap).forEach(([week, fields]) => {
        if (!Object.keys(fields).length) return;
        const prev = existingMap[week] || { _id: 'trk-' + Date.now() + '-' + (++count) };
        existingMap[week] = { ...prev, week, ...fields };
        count++;
      });

      const merged = Object.values(existingMap).sort((a,b) => a.week > b.week ? 1 : -1);
      save('weekly_tracker', merged);
      input.value = '';
      const weekCount = Object.values(dataMap).filter(f => Object.keys(f).length > 0).length;
      toast(`Imported ${weekCount} weeks from CSV.`);
      renderMarketing();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

const pdParseDate = s => (s && s.trim()) ? new Date(s) : null;
const pdValidDate = d => d && !isNaN(d.getTime());
const pd12Months = () => {
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return months;
};

// ── DATE RANGE HELPERS ───────────────────
function pdGetRange() {
  const r = activeSub.pd_range || 'all';
  const to = new Date();
  if (r === 'all') return { from: null, to, label: 'All time' };
  const from = new Date();
  if      (r === '1m')  { from.setMonth(from.getMonth() - 1); }
  else if (r === '3m')  { from.setMonth(from.getMonth() - 3); }
  else if (r === '6m')  { from.setMonth(from.getMonth() - 6); }
  else if (r === '12m') { from.setMonth(from.getMonth() - 12); }
  else if (r === 'ytd') { from.setMonth(0); from.setDate(1); from.setHours(0,0,0,0); }
  from.setHours(0,0,0,0);
  const labels = { '1m':'Last month','3m':'Last 3 months','6m':'Last 6 months','12m':'Last 12 months','ytd':'Year to date' };
  return { from, to, label: labels[r] };
}

function pdInRange(dateStr, range) {
  if (!dateStr) return false;
  const d = pdParseDate(dateStr);
  if (!pdValidDate(d)) return false;
  if (!range.from) return true;
  return d >= range.from && d <= range.to;
}

function pdRangeMonths(range) {
  const now = new Date();
  let from;
  if (!range.from) {
    // All time — compute from earliest deal or person date
    let earliest = now;
    _pd_deals.concat(_pd_people).forEach(r => {
      const dates = [r['Deal - Won time'], r['Deal - Deal created'], r['Person - Date Access Granted']].filter(Boolean);
      dates.forEach(s => { const d = pdParseDate(s); if (pdValidDate(d) && d < earliest) earliest = d; });
    });
    from = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  } else {
    from = new Date(range.from.getFullYear(), range.from.getMonth(), 1);
  }
  const months = [];
  const d = new Date(from);
  while (d <= now) {
    months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth() + 1);
  }
  return months;
}

function setPdRange(r) { activeSub.pd_range = r; renderPipedrive(); }

function pdRangeToggleHTML() {
  const cur = activeSub.pd_range || 'all';

            ? `<div style="font-size:12px;color:var(--gr);margin-bottom:12px">✓ ${_pd_people.length.toLocaleString()} people${importedStr}</div>`
            : `<div style="font-size:12px;color:var(--tl);margin-bottom:12px">No data yet</div>`}
          <label style="cursor:pointer">
            <span class="btn-save" style="display:inline-block">${_pd_people.length ? 'Re-import people' : 'Choose people CSV'}</span>
            <input type="file" accept=".csv" style="display:none" onchange="handlePeopleImport(this)">
          </label>
        </div>
      </div>
    </div>
    ${(_pd_deals.length || _pd_people.length)
      ? `<div class="callout good"><div class="callout-label">Data loaded</div><div class="callout-text">${_pd_deals.length.toLocaleString()} deals and ${_pd_people.length.toLocaleString()} people imported. Use the tabs above to explore charts.</div></div>`
      : `<div class="callout info"><div class="callout-label">Getting started</div><div class="callout-text">In Pipedrive: Deals → ··· → Export all deals as CSV. Repeat for People. Then upload both files above.</div></div>`}`;
}

async function handleDealsImport(input) {
  const file = input.files[0];
  if (!file) return;
  toast('Parsing deals CSV…');
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data;
      toast('Uploading ' + rows.length + ' deals…');
      await sb.from('liq_pipedrive_deals').delete().gte('imported_at', '1970-01-01T00:00:00Z');
      const batchSize = 100;
      for (let i = 0; i < rows.length; i += batchSize) {
        const { error } = await sb.from('liq_pipedrive_deals').insert(rows.slice(i, i + batchSize).map(r => ({ raw: r })));
        if (error) { toast('Upload error: ' + error.message); return; }
      }
      _pd_deals = rows;
      _pd_deals_imported_at = new Date().toISOString();
      toast('✓ Imported ' + rows.length + ' deals');
      renderPipedrive();
    },
    error: err => toast('CSV parse error: ' + err.message)
  });
}

async function handlePeopleImport(input) {
  const file = input.files[0];
  if (!file) return;
  toast('Parsing people CSV…');
  Papa.parse(file, {
    header: true, skipEmptyLines: true,

      await sb.from('liq_pipedrive_people').delete().gte('imported_at', '1970-01-01T00:00:00Z');
      const batchSize = 100;
      for (let i = 0; i < rows.length; i += batchSize) {
        const { error } = await sb.from('liq_pipedrive_people').insert(rows.slice(i, i + batchSize).map(r => ({ raw: r })));
        if (error) { toast('Upload error: ' + error.message); return; }
