<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land iQ Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy:#1a3c5e; --navy2:#24527f; --acc:#2e8bc0; --acc2:#e8f3f9;
  --sur:#f4f6f8; --wh:#fff; --tx:#1a2733; --tm:#4a5f70; --tl:#8a9fb0;
  --bd:#dde5ec; --gr:#2a7a4b; --gr2:#e8f5ee; --wa:#c25a00; --wa2:#fdf0e6;
  --re:#c0392b; --re2:#fdecea;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sur);color:var(--tx);font-size:14px;min-height:100vh}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

/* LOCK */
#lock{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:24px}
.lock-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px;width:340px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(10px)}
.lock-logo{color:#fff;font-size:22px;font-weight:700;text-align:center;letter-spacing:-.02em}.lock-logo span{color:var(--acc)}
.lock-sub{color:rgba(255,255,255,.4);font-size:12px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.lock-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;width:100%;font-family:inherit;outline:none}
.lock-input::placeholder{color:rgba(255,255,255,.3)}
.lock-input:focus{border-color:var(--acc)}
.lock-btn{background:var(--acc);color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.lock-btn:hover{background:var(--navy2)}
.lock-err{color:#ff6b6b;font-size:12px;text-align:center;min-height:18px}

/* LAYOUT */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--navy);height:52px;display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.h-logo{color:#fff;font-weight:700;font-size:16px;letter-spacing:-.02em}.h-logo span{color:var(--acc)}
.h-tag{font-size:9px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:2px 7px;letter-spacing:.1em;font-family:'DM Mono',monospace}
.h-space{flex:1}
.h-actions{display:flex;gap:8px;align-items:center}
.h-link{font-size:12px;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;padding:4px 10px;border-radius:4px;font-family:inherit;text-decoration:none;transition:.15s}
.h-link:hover{color:#fff;background:rgba(255,255,255,.08)}

nav{background:var(--wh);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;overflow-x:auto;flex-shrink:0}
.nav-btn{padding:13px 16px 11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tl);font-weight:400;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;margin-bottom:-1px}
.nav-btn:hover{color:var(--navy)}
.nav-btn.active{color:var(--navy);font-weight:600;border-bottom-color:var(--acc)}

main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.card-label{font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.card-value{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.03em;line-height:1.1}
.card-nodata{font-size:13px;color:var(--tl)}
.card-change{font-size:11px;font-weight:600}
.card-change.up{color:var(--gr)}.card-change.dn{color:var(--re)}
.card-sub{font-size:11px;color:var(--tl)}

/* BOXES */
.box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.box-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.box-title a{font-size:11px;color:var(--acc);font-weight:400;text-decoration:none}
.box-title a:hover{text-decoration:underline}
.no-data{text-align:center;color:var(--tl);font-size:13px;padding:40px 0}

/* CALLOUT */
.callout{border-radius:8px;padding:12px 16px;margin-bottom:14px}
.callout.warn{background:var(--wa2);border:1px solid #e5b896}
.callout.info{background:var(--acc2);border:1px solid #b3d4e8}
.callout.good{background:var(--gr2);border:1px solid #a8d5b5}
.callout-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.callout.warn .callout-label{color:var(--wa)}
.callout.info .callout-label{color:var(--acc)}
.callout.good .callout-label{color:var(--gr)}
.callout-text{font-size:13px;color:var(--tm);line-height:1.5}

/* FORMS */
.form-section{margin-bottom:14px}
.add-btn{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s}
.add-btn:hover{background:var(--navy2)}
.add-btn.sec{background:none;color:var(--navy);border:1px solid var(--bd)}
.add-btn.sec:hover{background:var(--sur)}
.form-box{background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-top:10px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:var(--tm);font-weight:500;letter-spacing:.02em}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--wh);outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,139,192,.1)}
textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-save{background:var(--acc);color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#2477a8}
.btn-cancel{background:none;border:1px solid var(--bd);color:var(--tm);border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.form-divider{font-size:12px;color:var(--tl);padding:8px 0;border-top:1px solid var(--bd);margin-bottom:8px}
.source-note{font-size:10px;color:var(--tl);margin-top:2px}
.input-group-label{font-size:12px;font-weight:600;color:var(--navy);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--bd)}

/* TABLE */
.tbl-wrap{background:var(--wh);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tbl-head{font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.07em;padding:10px 16px;border-bottom:1px solid var(--bd);background:#fafafa;display:flex;justify-content:space-between;align-items:center}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--tl);font-weight:500;font-size:11px;border-bottom:1px solid var(--bd);background:#fafafa;white-space:nowrap}
td{padding:8px 12px;color:var(--tm);border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcfe}
.btn-del{background:none;border:none;color:var(--re);font-size:11px;cursor:pointer;font-family:inherit;padding:2px 6px}
.show-all-btn{font-size:12px;color:var(--acc);background:none;border:none;cursor:pointer;padding:8px 16px;font-family:inherit}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.badge-linkedin{background:#e1f3ff;color:#0a66c2}
.badge-youtube{background:#ffe1e1;color:#c0392b}
.badge-edm{background:#e8f5ee;color:#2a7a4b}
.badge-viva{background:#fff3e0;color:#c25a00}
.badge-blog{background:#f3e5f5;color:#7b1fa2}
.badge-speaking{background:#e0f2f1;color:#00796b}
.badge-webinar{background:#e8eaf6;color:#3949ab}

/* PIPELINE */
.pipeline{display:grid;gap:0;margin-bottom:14px}
.pipeline-stage{display:flex;align-items:center;gap:0;position:relative}
.stage-bar-wrap{flex:1;background:var(--wh);border:1px solid var(--bd);padding:12px 16px;position:relative;overflow:hidden}
.stage-bar-wrap:first-child{border-radius:8px 8px 0 0}
.stage-bar-wrap:last-child{border-radius:0 0 8px 8px}
.stage-bg{position:absolute;left:0;top:0;bottom:0;background:var(--acc2);transition:.5s}
.stage-content{position:relative;display:flex;align-items:center;gap:12px}
.stage-name{font-size:12px;font-weight:500;color:var(--navy);min-width:160px}
.stage-count{font-size:20px;font-weight:700;color:var(--navy);min-width:50px;font-family:'DM Mono',monospace}
.stage-conv{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:4px}
.stage-conv-arrow{font-size:10px;color:var(--tl)}
.stage-target{font-size:11px;color:var(--tl);margin-left:auto}

/* RANGE TOGGLE */
.range-toggle{display:flex;gap:4px;background:var(--sur);border-radius:6px;padding:3px}
.range-btn{background:none;border:none;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.range-btn.active{background:var(--wh);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* FUNNEL CONV TABLE */
.conv-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.conv-table th{text-align:left;padding:6px 10px;color:var(--tl);font-size:11px;font-weight:500;border-bottom:1px solid var(--bd)}
.conv-table td{padding:6px 10px;border-bottom:1px solid var(--bd)}
.conv-table tr:last-child td{border-bottom:none}
.conv-pct{font-family:'DM Mono',monospace;font-weight:600}
.conv-pct.good{color:var(--gr)}.conv-pct.mid{color:var(--wa)}.conv-pct.bad{color:var(--re)}

/* OUTCOME ITEM */
.outcome-item{font-size:13px;color:var(--tm);padding:8px 12px;border-left:3px solid var(--acc);margin-bottom:8px;line-height:1.5;background:var(--acc2);border-radius:0 6px 6px 0}

/* FRESHNESS ROW */
.fresh-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.fresh-row:last-child{border-bottom:none}

/* TABS WITHIN TAB */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--sur);padding:4px;border-radius:8px;width:fit-content}
.sub-tab{background:none;border:none;padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--tl);font-weight:500}
.sub-tab.active{background:var(--wh);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideup .2s ease}
@keyframes slideup{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* CHART WRAP */
.chart-wrap{position:relative;width:100%}

/* SOURCE LINK */
.src-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--acc);text-decoration:none;padding:3px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--wh)}
.src-link:hover{background:var(--acc2)}

/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.section-sub{font-size:12px;color:var(--tl);margin-top:2px}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">Land <span>iQ</span> Performance</div>
    <div class="lock-sub">Internal · Restricted Access</div>
    <input class="lock-input" type="password" id="lock-pass" placeholder="Enter password" autocomplete="off">
    <button class="lock-btn" onclick="tryLogin()">Enter dashboard</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="h-logo">Land <span>iQ</span> Performance</div>
    <div class="h-tag">INTERNAL</div>
    <div class="h-space"></div>
    <div class="h-actions">
      <button class="h-link" onclick="exportData()">⬇ Export</button>
      <button class="h-link" onclick="document.getElementById('import-file').click()">⬆ Import</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImportFile(this)">
      <button class="h-link" onclick="confirmClear()">Clear all</button>
    </div>
  </header>

  <nav id="main-nav"></nav>
  <main id="main-content"></main>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────
const PASS = 'LiQ#Perf@2026';
const TARGET_USERS = 600;
const TARGET_ARR = 2400000;

function tryLogin() {
  const v = document.getElementById('lock-pass').value;
  if (v === PASS) {
    sessionStorage.setItem('liq_auth', '1');
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    init();
  } else {
    document.getElementById('lock-err').textContent = 'Incorrect password.';
    document.getElementById('lock-pass').value = '';
  }
}

document.getElementById('lock-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

if (sessionStorage.getItem('liq_auth') === '1') {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

// ─────────────────────────────────────────
// DATA LAYER (Supabase)
// ─────────────────────────────────────────
const SUPABASE_URL = 'https://ysdonnjezvoyrrizadik.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZG9ubmplenZveXJyaXphZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2ODY4MzYsImV4cCI6MjA5MzI2MjgzNn0.9bJ2FPEqV6NEtrnS567HBbwx0zcyQfshfcqWVRvH7RQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KEYS = { sales:'sales', trials:'trials', website:'website', training:'training', content:'content', webinars:'webinars', linkedin_weekly:'linkedin_weekly', edm_2m:'edm_2m', weekly_tracker:'weekly_tracker' };

// In-memory cache — loaded from Supabase on init, kept in sync on every save
const _cache = {};

async function loadAll() {
  try {
    const { data, error } = await sb.from('dashboard_data').select('key, value');
    if (error) throw error;
    data.forEach(row => { _cache[row.key] = row.value || []; });
  } catch (e) {
    console.error('Supabase load failed:', e);
    toast('Could not connect to database. Check your connection.');
  }
}

function load(key) { return _cache[KEYS[key]] || []; }

function save(key, arr) {
  _cache[KEYS[key]] = arr;
  sb.from('dashboard_data')
    .upsert({ key: KEYS[key], value: arr, updated_at: new Date().toISOString() })
    .then(({ error }) => { if (error) console.error('Supabase save failed:', error); });
}

function exportData() {
  const data = {};
  Object.keys(KEYS).forEach(k => data[k] = load(k));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landiq_dashboard_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Data exported successfully.');
}

function importBackup(json) {
  try {
    const data = JSON.parse(json);
    Object.keys(KEYS).forEach(k => { if (data[k]) save(k, data[k]); });
    toast('Backup imported successfully.');
    renderTab(activeTab);
  } catch { toast('Import failed: invalid JSON.'); }
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { importBackup(e.target.result); input.value = ''; };
  reader.readAsText(file);
}

function confirmClear() {
  if (confirm('Delete ALL dashboard data? This cannot be undone.')) {
    Object.keys(KEYS).forEach(k => save(k, []));
    toast('All data cleared.');
    renderTab(activeTab);
  }
}

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' }) : ':';
const fmtNum  = n => n != null ? Number(n).toLocaleString() : ':';
const fmtPct  = n => n != null ? Number(n).toFixed(1) + '%' : ':';
const fmtDollar = n => n != null ? '$' + Number(n).toLocaleString() : ':';
const pct = (a, b) => (a != null && b && b !== 0) ? (a / b * 100) : null;

function thisMonth(arr, dateKey = 'week') {
  const now = new Date();
  return arr.filter(r => {
    const d = new Date(r[dateKey]);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function monthKey(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  return new Date(y, m - 1).toLocaleString('default', { month: 'short', year: '2-digit' });
}

let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function makeChart(id, config) {
  destroyChart(id);
  const canvas = document.getElementById(id);
  if (!canvas) return;
  charts[id] = new Chart(canvas, config);
}

const axStyle = { font: { family: 'DM Sans', size: 11 }, color: '#8a9fb0' };
const gridStyle = { color: '#f0f2f4' };

function toast(msg, dur = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.style.display = 'none', dur);
}

function delRow(key, id, dateKey = 'week') {
  const label = dateKey === 'week' ? 'week of ' + fmtDate(id) : 'this entry';
  if (!confirm('Delete ' + label + '?')) return;
  save(key, load(key).filter(r => (r._id || r.week) !== id));
  toast('Entry deleted.');
  renderTab(activeTab);
}

// ─────────────────────────────────────────
// TABS
// ─────────────────────────────────────────
const TABS = [
  { id: 'home',     label: 'Home' },
  { id: 'sales',    label: 'Sales Funnel' },
  { id: 'trials',   label: 'Trials Pipeline' },
  { id: 'website',  label: 'Website' },
  { id: 'training', label: 'Training' },
  { id: 'marketing', label: 'Marketing' },
];

let activeTab = 'home';
let activeSub = {};

function buildNav() {
  const nav = document.getElementById('main-nav');
  nav.innerHTML = TABS.map(t =>
    `<button class="nav-btn${t.id === activeTab ? ' active' : ''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(id) {
  activeTab = id;
  buildNav();
  renderTab(id);
}

function renderTab(id) {
  const mc = document.getElementById('main-content');
  destroyAllCharts();
  const renderers = { home: renderHome, sales: renderSales, trials: renderTrials, website: renderWebsite, training: renderTraining, marketing: renderMarketing };
  if (renderers[id]) renderers[id](mc);
}

function destroyAllCharts() {
  Object.keys(charts).forEach(id => { charts[id].destroy(); delete charts[id]; });
}

// ─────────────────────────────────────────
// SUMMARY CARD BUILDER
// ─────────────────────────────────────────
function cardHTML(label, value, prev, type, sub) {
  let disp = value == null ? null : type === '$' ? fmtDollar(value) : type === '%' ? fmtPct(value) : fmtNum(value);
  let changeHTML = '';
  if (value != null && prev != null && prev !== 0) {
    const d = ((value - prev) / prev * 100).toFixed(1);
    const up = value >= prev;
    changeHTML = `<div class="card-change ${up ? 'up' : 'dn'}">${up ? '▲' : '▼'} ${d}%</div>`;
  }
  return `<div class="card">
    <div class="card-label">${label}</div>
    ${disp ? `<div class="card-value">${disp}</div>` : '<div class="card-nodata">no data</div>'}
    ${changeHTML}
    ${sub ? `<div class="card-sub">${sub}</div>` : ''}
  </div>`;
}

function cardsHTML(items) {
  return `<div class="cards">${items.map(i => cardHTML(...i)).join('')}</div>`;
}

// ─────────────────────────────────────────
// DATA TABLE BUILDER
// ─────────────────────────────────────────
function tableHTML(key, rows, cols, idField, showAllKey) {
  const limit = activeSub[showAllKey || key + '_all'] ? rows.length : 8;
  const visible = [...rows].reverse().slice(0, limit);
  if (!rows.length) return `<div class="box"><div class="no-data">No entries yet.</div></div>`;
  return `<div class="tbl-wrap">
    <div class="tbl-head">Recent entries
      ${rows.length > 8 ? `<button class="show-all-btn" onclick="toggleShowAll('${showAllKey || key + '_all'}')">${activeSub[showAllKey || key + '_all'] ? 'Show less' : 'Show all ' + rows.length}</button>` : ''}
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody>${visible.map(row => `<tr>${cols.map(c => `<td>${c.render ? c.render(row) : (row[c.key] != null ? row[c.key] : ':')}</td>`).join('')}
        <td><button class="btn-del" onclick="delRow('${key}','${row[idField] || row.week || row._id}','${idField}')"">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function toggleShowAll(key) {
  activeSub[key] = !activeSub[key];
  renderTab(activeTab);
}

    { name: 'Sales Funnel',    last: sl,                   dk: 'week' },

function saveSales() {
  const week = document.getElementById('s-week').value;
  if (!week) { toast('Please select a week ending date.'); return; }

  const entry = { week };
  ['newDeals','won','wonVal','lost','lostVal','revenue','avgDealVal','websiteUsers','withTrial','noTrial','withDemo','noDemo'].forEach(f => {
    const v = document.getElementById('s-' + f)?.value;
    if (v !== '' && v != null) entry[f] = Number(v);
  });
  entry.winRate = entry.won != null && entry.lost != null ? pct(entry.won, entry.won + entry.lost) : (Number(document.getElementById('s-winRate')?.value) || null);

  DEAL_STAGES.forEach(s => {
    const v = document.getElementById('s-' + s.key)?.value;
    if (v !== '' && v != null) entry[s.key] = Number(v);
  });

  const sources = ['webinar','helpdesk_eoi','vendor_initiative','customer_initiated','emailed'];
  sources.forEach(s => {
    const v = document.getElementById('s-src_' + s)?.value;
    if (v !== '' && v != null) entry['src_' + s] = Number(v);
  });

  const arr = load('sales').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('sales', arr);
  toggleForm('sales-form');
  toast('Saved: week of ' + fmtDate(week));
  renderSales();
}

function importWebsiteCSV() {
  const raw = document.getElementById('web-csv').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
  const entries = {};
  lines.forEach(row => {
    const sep = row.includes('\t') ? '\t' : ',';
    const p = row.split(sep).map(x => x.trim());
    if (!p[0] || p[0].toLowerCase() === 'date') return;
    const dt = new Date(p[0]);
    if (isNaN(dt.getTime())) return;
    const we = new Date(dt);
    while (we.getDay() !== 0) we.setDate(we.getDate() + 1);
    const k = we.toISOString().split('T')[0];
    if (!entries[k]) entries[k] = { views: 0, users: 0, active: 0, sessions: 0 };
    entries[k].views    += parseInt(p[1]) || 0;
    entries[k].users    += parseInt(p[2]) || 0;
    entries[k].active   += parseInt(p[3]) || 0;
    entries[k].sessions += parseInt(p[4]) || 0;
  });
  const newRows = Object.entries(entries).map(([week, m]) => ({ week, ...m }));
  const merged = load('website');
  newRows.forEach(nr => {
    const idx = merged.findIndex(r => r.week === nr.week);
    if (idx >= 0) merged[idx] = { ...merged[idx], ...nr };
    else merged.push(nr);
  });
  save('website', merged.sort((a, b) => a.week > b.week ? 1 : -1));
  document.getElementById('web-csv').value = '';
  toggleForm('web-form');
  toast('Imported ' + newRows.length + ' weeks of website data.');
  renderWebsite();
}

  const week = document.getElementById('web-week').value;

  });
  const arr = load('website').filter(r => r.week !== week);

}

function saveLinkedIn() {
  const week = document.getElementById('li-week').value;
  if (!week) { toast('Select a week.'); return; }
  const entry = {
    week,
    jacy:  Number(document.getElementById('li-jacy').value)  || null,
    james: Number(document.getElementById('li-james').value) || null,
    lucy:  Number(document.getElementById('li-lucy').value)  || null,
    jacyTitle:  document.getElementById('li-jacy-title').value  || null,
    jamesTitle: document.getElementById('li-james-title').value || null,
    lucyTitle:  document.getElementById('li-lucy-title').value  || null,
  };
  const arr = load('linkedin_weekly').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('linkedin_weekly', arr);
  toggleForm('li-form');
  toast('LinkedIn week saved.');
  renderMarketing();
}

function delLinkedIn(week) {
  if (!confirm('Delete LinkedIn entry for ' + fmtDate(week) + '?')) return;
  save('linkedin_weekly', load('linkedin_weekly').filter(r => r.week !== week));
  toast('Deleted.');
  renderMarketing();
}

  const entry = {
    _id: 'edm2m-' + Date.now(), date,
    sent: Number(document.getElementById('edm2m-sent').value) || null,
    openRate: Number(document.getElementById('edm2m-open').value) || null,
    clickRate: Number(document.getElementById('edm2m-ctr').value) || null,
    notes: document.getElementById('edm2m-notes').value || null,
  };
  save('edm_2m', [...load('edm_2m'), entry]);
  toggleForm('edm2m-form');
  toast('2M growth email cohort saved.');
  renderMarketing();
}

function saveTrackerWeek() {
  const week = document.getElementById('tr2-week').value;
  if (!week) { toast('Select a week.'); return; }
  const fields = ['jsImp','jmImp','lbImp','edmOpen','edmCtr','wbEmailSend','wbEmailOpen','wbEmailCtr','wbRegPage','wbReg','purchaseEnq','eoiTickets','trialsStarted'];
  const entry = { _id: 'trk-' + Date.now(), week };
  fields.forEach(f => {
    const v = document.getElementById('tr2-' + f)?.value;
    if (v !== '' && v != null && v !== undefined) entry[f] = Number(v);
  });
  const arr = load('weekly_tracker').filter(r => r.week !== week);
  arr.push(entry);
  arr.sort((a, b) => a.week > b.week ? 1 : -1);
  save('weekly_tracker', arr);
  toggleForm('tracker-form');
  toast('Tracker week saved.');
  renderMarketing();
}

function updateContentFields() {
  const type = document.getElementById('c-type').value;
  ['linkedin','youtube','edm','viva','speaking'].forEach(t => {
    const el = document.getElementById('c-' + t + '-fields');
    if (el) el.style.display = 'none';
  });
  const map = { LinkedIn: 'linkedin', YouTube: 'youtube', EDM: 'edm', 'Viva Engage': 'viva', Speaking: 'speaking' };
  if (map[type]) {
    const el = document.getElementById('c-' + map[type] + '-fields');
    if (el) el.style.display = 'block';
  }
}

function saveContent() {
  const date = document.getElementById('c-date').value;
  const type = document.getElementById('c-type').value;
  if (!date || !type) { toast('Please select date and content type.'); return; }
  const entry = { _id: 'c' + Date.now(), date, type, title: document.getElementById('c-title').value };
  const numFields = ['impressions','reactions','comments','shares','clicks','ytviews','watchtime','subs','recipients','opens','edmclicks','unsub','vivaviews','vivareactions','audience','leads'];
  const txtFields = ['event','outcome','tags'];
  numFields.forEach(f => { const v = document.getElementById('c-' + f)?.value; if (v !== '' && v != null) entry[f] = Number(v); });
  txtFields.forEach(f => { const v = document.getElementById('c-' + f)?.value; if (v) entry[f] = v; });
  save('content', [...load('content'), entry]);
  toggleForm('content-form');
  toast('Content item saved.');
  renderMarketing();
}

// ─────────────────────────────────────────
// SHARED UI HELPERS
// ─────────────────────────────────────────
function toggleForm(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
async function init() {
  await loadAll();
  buildNav();
  renderTab('home');
}

if (sessionStorage.getItem('liq_auth') === '1') {
  window.addEventListener('DOMContentLoaded', init);
}
</script>
</body>
</html>
